reach:
  - invariant: "a failed stash never reaches reset --hard"
    enforced_on:
      - "SyncGitPin.moveTo and SyncGitHandler merge, both through GitOps.setAside (#436)"
    unenforced_on: []
    enumerated_by: "#436: stashAll made private so setAside is the only entry; other resetHard callers read and judged safe"
    note: "R1 fixed one of two paths; F1 was the second. The private method is what makes this list closed."
    skill_change: none
  - invariant: "every failed record write reaches a non-zero exit"
    enforced_on:
      - "sync --to, sync --lock, project resolve (#429)"
      - "home sync (#436)"
    unenforced_on: UNDECIDED
    enumerated_by: "not enumerated. R2 and F7 are the two paths two reviews happened to find."
    skill_change: none
  - invariant: "a CLI refusal reaches a non-zero exit and names a way out"
    enforced_on:
      - "sync, install, onboard, upgrade (#430, read in the second review)"
    unenforced_on: UNDECIDED
    enumerated_by: "exit reach enumerated by the second review; 'names a way out' was added for shared rows only (#435)"
    skill_change: none

