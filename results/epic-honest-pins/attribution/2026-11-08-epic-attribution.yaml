# Bug attribution -- epic honest-pins (#411), machine-readable rows.
#
# Schema: spec-double-2 references/bug_attribution.md (CATCH 4, REACH 5, BLIND 6,
# semantic bins 7c, conservation 7b). Prose reading is in the .md beside this file.
#
# WHERE THESE ROWS BELONG. `specs/deferred_findings.yaml` does not exist on main,
# so the rows live in the epic's results, as earlier epics' did. The deferred
# findings keep their full text in ../deferred/<ticket>.yaml; the rows below ADD
# channel, area, anchor and pin. Nothing in deferred/ was edited.
#
# `anchor` is a TLA+ action in specs/program_model, or UNMODELED/<bin>. An action
# is never stretched to cover a row. A roster bug whose anchor nobody worked out
# says UNDECIDED rather than guess.
#
# `channel: UNDECIDED` marks a row filed before this epic, or whose discovery was
# not recorded. Assigning a channel from somebody else's prose is the
# classification section 9 warns against.
#
# `origin` is the epic ticket that introduced an in-epic defect, as the reviewer
# or fixing agent traced it. `origin: UNTRACED` means nobody ran the trace.
#
# Prefix key for anchors: CPI = CliPinInternal, HI = HomeIntegrityInternal,
# GH = GitHistoryInternal.

