findings:
  - id: DEF-HP9-001
    found_by: HP-9 full run (run-graphs.py, sweep 20261107-213337), graph home-tripwire
    found_at_commit: b535623abf11
    severity: major
    maps_to: "HP-0 (#408) -- test_graph/sources/honest-pins/HonestPinsKit.java, added in 45128031; outside HP-9's conflict keys (test_graph: [])"
    regression: true
    summary: >
      home-tripwire is RED on the integrated epic tip and GREEN on main 3b92ed6e. Node
      sandbox.env.contract fails `every_file_that_resolves_the_cli_routes_through_the_helper`:
      unrouted=[honest-pins/HonestPinsKit.java]. HonestPinsKit calls SmEnv.cli()/SmEnv.apply()
      but carries no `//SOURCES ../lib/SmEnv.java` of its own -- it relies on each node file
      pulling SmEnv in -- and the tripwire walks every .java file's own //SOURCES closure, so
      the support file reads as a CLI spawn that bypasses the sandbox helper. The other seven
      home-tripwire nodes pass (continue-after-failure run 20261107-230753). This is a harness
      conformance defect, not a product regression: honest-pins itself runs sandboxed, because
      every node does reach SmEnv.
    reproduction: >
      run.py home-tripwire on b535623a (or feature/HP-9) -> sandbox.env.contract failed,
      "writers=[lib/SmEnv.java] unrouted=[honest-pins/HonestPinsKit.java]"; the same graph on
      3b92ed6e -> PASSED (sweep 20261107-225927).
    evidence:
      - results/epic-honest-pins/goals/full-run.sweep.json
      - results/epic-honest-pins/goals/home-tripwire-confirm.sweep.json
      - results/epic-honest-pins/goals/home-tripwire-continue.sweep.json
      - results/epic-honest-pins/goals/main-3b92ed6e-confirm.sweep.json
    suggested_fix: >
      Add `//SOURCES ../lib/SmEnv.java` (the path the node files already use) to
      HonestPinsKit.java's header, so the support file's own closure reaches the helper.
      One line, in HP-0's file; re-run home-tripwire and honest-pins.
    disposition: fixed
    disposition_note: >-
      HP-0 fixup (feature/HP-0-fixup): HonestPinsKit.java now carries its own
      //SOURCES ../lib/SmEnv.java; home-tripwire and honest-pins re-run green.

