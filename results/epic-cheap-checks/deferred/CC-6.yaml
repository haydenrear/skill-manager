  DEF-CC0-002: "Closed by measurement. 12 readings over 4 runs, 3.08-4.31 s except one 6.31 s (run 3, reading 1); medians 3.36, 3.48, 4.31, 3.13. The former 5 s / 8-9 s modes did not recur. Load average was 6-27, not a quiet machine."
  DEF-CC1-001: "Closed by CC-7. clean_files_read 0 in all four runs."
  DEF-CC1-002: "Closed. Owner confirmed in schedule_revision 2 that a gitignored file is not unit identity; EditDetection asserts it."
  DEF-CC3-001: "Closed by CC-7. As-cloned close-out medians 3.57, 3.48, 3.27, 4.30 s, RSS 232-237 MB."
  DEF-CC3-002: "Carried to the owner, unchanged. No clause depends on it; not measured here."
  DEF-CC5-001: "Carried to the owner, unchanged. Not re-run: reproducing it means cloning this worktree home to a new home by hand, outside this ticket's write scope. The home-clone graph passed, but it does not exercise the child-home record."
