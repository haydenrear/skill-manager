      so this is the ledger disagreeing with the home, not a deletion failure.
      `artifacts.lock.toml` is also created by the install and not removed by
      the uninstall, which is the whole of the byte-comparison difference
      (onlyAfter=[F artifacts.lock.toml 3745], onlyBefore=[]).
    mechanism: >
      Not an oversight -- a deliberate refusal doing more than intended. The
      uninstall prints, per projection:

        ! kept projection:default:claude:ad-transient-unit#SYMLINK/... -- no
          ledger row names an output for it, and this command deletes only
          what the ledger recorded -- run `skill-manager artifacts record`
          while the producer is still installed

      "Delete only what the ledger recorded" is the right safety rule. But a
      row the teardown declines to ACT on is also left in place as a row, and
      nothing later reaps it, so a refusal to delete a file becomes a permanent
      phantom in the census. It pruned the one orphan it could verify
      (provisioned-tree) and kept the five it could not.
    reproduction: >
      python skills/test_graph/scripts/run.py artifact-dag
        -> node uninstall.prunes.the.subgraph fails on
           the_census_names_nothing_the_removed_unit_owned=false and
           the_home_is_byte_comparable_to_before_the_install=false
      Report: test_graph/build/validation-reports/<runId>/
              node-logs/uninstall.prunes.the.subgraph.artifacts-list-after.log
    not_a_regression_from_this_session: >
      The graph and the teardown it exercises both landed 2026-08-16
      (4d8929ed, 468daf8f). This node has been run locally twice -- 2026-09-04
      and 2026-09-11 -- and failed identically both times, the first a week
      before any work in this session. Nothing in this session touched the
      artifacts subsystem; its commits are in sync, child-home and eval-harness
      code.
    why_deferred: >
      Outside the declared slice of the eval/harness work this session is
      doing, and the epic's deferment policy is batch/budget-5. It is also not
      data loss: the files are deleted correctly and only the census is wrong.
      But it is a correctness gap in this epic's OWN artifacts work rather than
      inherited from before it, so it wants a decision at the review rather
      than quiet acceptance.
    issue: https://github.com/haydenrear/skill-manager/issues/292
    candidate_owner: >
      skill-manager#292, on the artifacts/teardown line. The likely shape is
      that teardown reaps the ledger rows of a unit being uninstalled whether
      or not it could verify their outputs -- keeping the FILE when unsure is
      the safety property; keeping the ROW is what produces the phantom.
    status: open

  - id: DEF-OUN-016
    found_by: >
      the manual regression for this epic — `skill-manager sync` in the
      operator's project home, which exits 7 and names one blocker
    found_at: "2026-09-11"
    severity: non-blocking
    summary: >
      The operator's PROJECT home carries a test-fixture unit, `eval-skill`,
      whose origin is an ephemeral scratchpad path that no longer exists:
        file:///private/tmp/claude-501/<session>/scratchpad/upstream/eval-skill.git
      Its store holds an uncommitted one-line edit (`LOCAL_EDIT_EVAL_111`,
      under `MARKER_SKILL_V1`), so every `skill-manager sync` of this home
      stops with "extra local changes — sync would overwrite them" and exit 7,
      and `skt check` reports it as "unverifiable (remote unreachable)".
      The stop is CORRECT behaviour -- the command is refusing to destroy an
      edit it cannot re-fetch. What is wrong is that the unit is there at all.
    the_stop_is_the_feature: >
      Worth recording because it looks like a defect and is not: this is the
      "if it needs an ack, stop" behaviour working. 11 lines of output, one
      named blocker, a log path, and no loop.
    shape: >
      FULLY INSTALLED and internally consistent -- skills/eval-skill,
      installed/eval-skill.json, installed/eval-skill.projections.json,
      .materialization/skill/eval-skill.json, 2 rows in units.lock.toml, plus
      home.runtime.json, artifacts.lock.toml, audit.log and the skt-check cache.
      Nine places name it and they agree with each other.
    not_DEF_121: >
      This is NOT the shape DEF-121 (epic-home-integrity-sync) describes, and
      that matters because DEF-121's verified remedy is `rm -rf` of two paths.
      DEF-121's home had a store and a .materialization record and NO
      installed/ record -- nothing to keep in agreement, so a raw delete was
      right. Here the unit IS installed. Running DEF-121's remedy against THIS
      home would leave installed/, units.lock.toml, artifacts.lock.toml,
      home.runtime.json and the projections all naming a unit whose files are
      gone -- i.e. it would MANUFACTURE the damaged shape DEF-121 exists to
      clean up. The CLI verb is the correct remedy here, and the raw delete is
      the wrong one; in DEF-121 it is the other way round.
    evidence: results/epic-one-unit-one-name/evidence/eval-skill-residue-project-home.txt
    reproduction: >
      skill-manager sync            # in <repo>/.skill-manager -> exit 7
      skt check                     # -> unverifiable (remote unreachable): eval-skill
      git -C <home>/skills/eval-skill status --short   # -> M SKILL.md
    nothing_depends_on_it: >
      Checked before proposing removal. The eval suite's committed
      epic-provisions case.yaml still lists `../../units/eval-skill`, but
      rewrite-case.py REGENERATES that block from the units actually built, and
      the suite builds from the ROOT home, which has no eval-skill at all.
    why_deferred: >
      It is an action on the operator's real home that deletes an edit whose
      origin is gone, so it is the owner's call and not an agent's, even though
      the content is plainly a test marker.
    resolution: >
      Owner approved 2026-09-11; `skill-manager uninstall eval-skill --yes` run
      against the project home. Store removed, units.lock.toml rows 2 -> 0,
      installed record gone, all 3 projection symlinks gone, the other 8 units
      untouched, and `skill-manager sync` in that home now runs clean
      (8 merged, no blocker, no exit 7). Paths naming it: 9 -> 5.
    and_it_reproduced_334: >
      Exactly as predicted, on a real home rather than a fixture. The census
      did not move: 4 eval-skill artifacts before, 4 after, total 59 both
      times -- every row flipped from materialized/ledger-and-home to
      declared-only/ledger. `artifacts list` now reports 59 artifacts in a home
      holding 55. Note the uninstall warned about the three PROJECTIONS only,
      yet `unit-store:eval-skill` survives in the census with no warning at
      all, so #334 is not confined to the unverifiable-output path.
      `.materialization/skill/eval-skill.json` also survives, which is the
      same residue DEF-121 documents from the other direction.
      Posted as evidence on skill-manager#292.
