  - id: DEF-285
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      The ~3% clone cost the three-tier home model was adopted on is an
      implicit JDK side effect of clonefile(2) on APFS, with no fallback; the
      node that asserts it SKIPS where the JDK cannot reflink, which is the
      only platform CI runs. And pm/ is in PROVISIONABLE_ROOTS but NOT in
      SKIPPED_DIRS, so a clone copies it -- 203 MB of Mach-O arm64 here (node
      and uv), which cannot go into a Linux image.
    reproduction: >
      grep SKIPPED_DIRS in HomeCloner (pm absent); file <home>/pm/node/*/bin/node;
      read the skip branch of HomeCloneCostsFarLessThanACopy.
    why_deferred: not deferred -- scheduled as OUN-12, delivered to main
    candidate_owner: OUN-12 (#316)
    status: scheduled

  - id: DEF-OUN-005
    found_by: OUN-4 (scoping the deletion before making it)
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      OUN-4's declared slice cannot be executed as written. It lists the unit
      directory, the onboarding seed, the onboard graph's assertions,
      skill-project.toml prose and three skt doc mentions. It does not account
      for: (a) a whole registered test graph, `skill-dev-smoke`, with 9 source
      files and 7 nodes, which exists to drive the unit and cannot pass without
      it; (b) the ACCEPTED program model -- SkillManager.tla names
      "skill-dev-skill" in a set and defines SkillDevSkillWorkflows, with
      spec_manifest and two program-model tests following it; (c) onboarding
      seeds skill-dev-skill from github:haydenrear/skill-dev-skill, a SEPARATE
      repository, so "delete it from the repository" is ambiguous between the
      in-repo directory and the unit onboarding installs.
    reproduction: >
      grep -rl skill-dev --exclude-dir=.history . ; and
      grep -n skill-dev src/main/java/dev/skillmanager/lifecycle/BundledSkills.java
    why_deferred: >
      NOT deferred as unimportant -- stopped because a partial deletion leaves
      the worst possible state: unit gone, a registered graph red, and the
      accepted model describing a unit that does not exist. OUN-3's command
      confirms the premise (zero importers of skill-dev-skill in the only home
      that holds it), so the deletion is right; its cost is three times what
      the plan priced.
      NOTE FOR SCHEDULING: OUN-7 (rename skill-publisher-skill to skt) edits
      the SAME TLA set three waves later. Doing the model edit once, there,
      rather than twice is probably the cheaper order -- which would make OUN-4
      depend on OUN-7 instead of preceding it.
    candidate_owner: owner decision on scope; then OUN-4 re-planned
    status: open

  - id: DEF-OUN-006
    found_by: OUN-2B (adding plugin-graph assertions for the OUN-1/OUN-2 change)
    found_at: "2026-09-05"
    severity: major
    summary: >
      The accepted program model's InstallUnit enumerates exactly three
      outcomes -- EffectHalt("ALREADY_INSTALLED"), EffectHalt("RESOLVE_FAILED")
      and Ok. OUN-2 adds a fourth the model does not have: a refusal when a
      plugin's CONTAINED skill name is already claimed. So SkillManager.tla now
      claims install has three outcomes and the product has four.
    reproduction: >
      Read InstallUnit in specs/program_model/SkillManager.tla against
      LiveInterpreter.rejectContainedNameCollision.
    why_deferred: >
      Not a tweak. The model does not describe plugins or containment AT ALL --
      `Units == {UnitA, UnitB}` is flat, and DocRepoA/HarnessA are separate
      constants with no plugin equivalent. Adding this halt means introducing a
      plugin constant, a containment relation, an MC.cfg constant, manifest
      entries, and probably generated case adapters and program-model tests.
      It also lands in the SAME FILE as two decisions already open with the
      owner (OUN-4's scope, and DEF-OUN-001's 72 undescribed modules), and a
      careless edit to that file put main in a red state on 2026-09-03.
      The behaviour IS covered meanwhile: six unit cases and a plugin-smoke
      node assert the refusal end to end. What is missing is the model saying
      so, not the product doing so.
    candidate_owner: bundle with the owner's decision on the program model
    status: open

  - id: DEF-OUN-007
    found_by: OUN-2B (reading the plugin graph before adding to it)
    found_at: "2026-09-05"
    severity: minor
    summary: >
      `plugin.contained.skill.not.addressable` asserts that `install
      hello-impl --registry` FAILS -- a contained skill has no independent
      identity as a REGISTRY unit. That is still true after OUN-1 and the node
      correctly stayed green. But its NAME now claims the thing OUN-1 made
      false, and the two senses of "addressable" are one word apart. Only the
      registry sense was ever covered, which is how a contained skill being
      unreachable by NAME survived from the day skt shipped unit-authoring.
    reproduction: read the node beside plugin.contained.skill.resolves.by.name
    why_deferred: >
      Addressed rather than deferred: the sibling node now covers the other
      sense and both are registered with a comment saying which is which.
      Renaming the original node would break its id, which other nodes depend
      on, so the ambiguity is documented instead of renamed.
    candidate_owner: OUN-2B (done)
    status: closed

