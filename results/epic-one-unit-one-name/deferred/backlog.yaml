  - id: DEF-OUN-017
    found_by: >
      the owner asking "and removed from onboarding already?" during the epic
      close review
    found_at: "2026-09-11"
    severity: major
    summary: >
      The migration RETIRES the standalone `skill-manager` and onboarding still
      BUNDLES it. UnitSupersession.TABLE carries
      Retirement("skill-manager", "skt", MOVED_INTO_CARRIER), so a migrated home
      drops the standalone. BundledSkills.GITHUB_COORDS still maps
      "skill-manager" -> "github:haydenrear/skill-manager-skill", so a freshly
      onboarded home installs it again. OUN-4 removed `skill-dev-skill` from
      that same map and left `skill-manager` in it.
    consequence: >
      A fresh onboard clones skill-manager-skill, installs the standalone, and
      the install path then immediately retires it against skt -- work done in
      order to be undone. It is also part of why the owner sees repeated clones
      of the bundled coordinates during a root sync.
    not_a_crash: >
      InstallUseCase adds RetireSupersededUnits to stage1Effects, BEFORE the
      collision gate, so the gate does not refuse the onboard. That ordering was
      deliberate and it holds. The defect is the wasted round trip and the
      contradiction between two tables that describe the same fact.
    reproduction: >
      grep -n 'skill-manager' src/main/java/dev/skillmanager/lifecycle/BundledSkills.java
      grep -n 'skill-manager' src/main/java/dev/skillmanager/lifecycle/UnitSupersession.java
    tried_and_reverted: >
      Removing the entry was attempted 2026-09-12 and REVERTED the same day,
      because it does not do what it looks like it does. The onboard seeds
      from the local install dir, whose tree carries `skill-manager-skill/`,
      so the unit arrives with or without the coordinate. What the coordinate
      does is convert that local source to its GIT provenance -- without it
      the unit is installed with LOCAL_DIR provenance and NO upstream, so
      `skt check` calls it unverifiable and `sync` has nothing to pull. The
      onboard graph caught it precisely: managerRemote=false with every other
      assertion green. A unit installed with no way to update it is worse than
      a unit installed and then retired.
      The BundledAndSupersededDisagreeTest written alongside it was removed
      with it: it encoded a rule the product cannot satisfy yet, and a test
      that forbids the only correct current state is not a guard.
    candidate_owner: >
      OUN-6's end state, which is a change to what onboarding SEEDS rather
      than to what provenance it records: stop seeding the standalone at all,
      so skt's contained copy is the only one and there is nothing to retire.
      Only then does removing the coordinate become correct -- and only then
      does the two-tables test become writable.
    status: open

  - id: DEF-OUN-018
    found_by: >
      building the GOAL-a-home-survives-being-copied-into-an-image harness,
      which the epic had declared and never measured
    found_at: "2026-09-12"
    severity: major
    summary: >
      OUN-10 and OUN-12 fixed the CODE and left the existing population
      unhealed, and nothing says so. Measured on the two real homes on this
      machine, copied the way an image build copies one:
        (a) no credential travels              MET
        (b) no bin/cli entry names the source  NOT MET -- 11 frozen shims
        (c) usable on another platform         NOT MET -- 6 unstamped pm trees
      The frozen shims are exactly the six OUN-10 named (computeq,
      helm-deploy, jinja2, monitoring, tla-spec-dev,
      tracing-observability-install), and PmPlatform's own javadoc says "every
      home provisioned before this change has no stamp".
    the_fix_is_write_time_only: >
      SkillScriptBackend rewrites a frozen shim only when a skill-script dep is
      REINSTALLED -- binStamps() compares mtimes and examines only the shims
      that install touched. A shim written before the fix and never reinstalled
      stays frozen forever. PmPlatform.stamp is likewise called from
      PackageManagerRuntime during provisioning, so an already-provisioned
      version directory is never stamped retroactively.
    a_remedy_exists_and_was_run: >
      `skill-manager sync <unit> --force-scripts` heals it. Verified on the
      project home: tracing-observability-install went from 1 line naming this
      home to 0, and the sync reported `cli: 16 already present, 1 installed`.
      It is per-unit, needs a flag most operators will not know to pass, and
      there is no equivalent for the pm stamps short of re-provisioning.
    why_it_matters_for_the_release: >
      The goal exists because a home is about to be baked into a container
      image. An image built from any home provisioned before these fixes
      carries shims that run the BUILD machine's home path and pm trees a
      foreign host will execute and get ENOEXEC from -- and both are invisible
      to `home verify` and `home repair`, whose rule asks "does this reach
      ANOTHER home", which an own-home absolute path does not.
    candidate_owner: >
      done in this epic, 2026-09-12. `home repair` grew two kinds --
      FROZEN_HOME_PATH_IN_SHIM and UNSTAMPED_PM_TREE -- both repairable, using
      the same ShimHomeContract.selfDerivingRewrite the installer applies and
      the same PmPlatform.stamp the provisioner writes, so neither is a second
      implementation of a rule that already has one.
    verified: >
      The project home went 5 findings -> 0: `repaired 5 of 5`, then `nothing
      is damaged in a way this command knows about (43 entries examined)`, and
      the goal harness re-read it as frozen: 0, unstamped: 0. The operator root
      home still reads 6 and 4 because this session may not write it by hand.
    and_it_found_one_more: >
      Repairing a FOREIGN_PATH_IN_SHIM used to leave a shim naming THIS home
      absolutely -- the repairer producing the next finding for itself to clean
      up on a second pass. The re-detect loop did handle it, so homes ended
      correct, but the repair count did not match the report and there was a
      window where the fixed home was still not copyable. Both halves now
      happen in one action. Caught by the equality assertion in
      DamagedHomeIsRepairableTest, which is exactly why it is written as an
      equality rather than a floor.
    status: resolved

