  - id: DEF-OUN-009
    found_by: OUN-12
    found_at: "2026-09-06"
    severity: minor
    summary: >
      There is no copy-on-write fallback on Linux, and after OUN-12 there is
      still none -- what changed is that the cost is now DECLARED and asserted
      rather than skipped. Restoring block sharing on a Linux filesystem that
      supports it (btrfs, XFS) needs FICLONE, which the JDK does not expose;
      shelling out to `cp --reflink` per file is a process per file, and per
      tree does not fit HomeCloner's filtered walk. On ext4 -- what GitHub
      runners use -- there is no reflink to ask for at all.
    reproduction: >
      run home.clone.costs.far.less.than.a.copy on Linux; declared=FULL_COPY
      and the measured cost is the full apparent size
    why_deferred: >
      OUN-12's objective was "make the copy work, and its cost KNOWN, where
      clonefile(2) does not exist". A known cost is delivered. A cheap one is a
      different piece of work with a native-call dependency, and it only pays
      off on the subset of Linux filesystems that reflink.
    candidate_owner: substrate-home-model
    status: open

  - id: DEF-OUN-010
    found_by: OUN-5 (checking DEF-OUN-008)
    found_at: "2026-09-06"
    severity: major
    summary: >
      Every installed unit is a git checkout -- skills/<unit>/.git exists on
      the real root home for skill-manager and skill-dev-skill alike. Any
      operation that deletes a unit tree therefore deletes a working copy, and
      a home is the only place a unit's history lives until `unit publish`
