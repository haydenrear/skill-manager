  - id: DEF-OUN-004
    found_by: OUN-1 (the addressability harness reporting a fix as absent)
    found_at: "2026-09-05"
    severity: major
    summary: >
      jbang keys its build cache on the hash of the ENTRY script.
      SkillManager.java rarely changes, so editing anything under
      src/main/java leaves the cached jar in place and `./skill-manager` keeps
      running the PREVIOUS build. RunTests.java is a different entry script,
      so unit tests rebuild and pass while any harness or manual check driving
      the wrapper measures the last build. Measured: OUN-1's resolver change
      passed every unit case while the harness still reported the defect.
    reproduction: >
      Edit any file under src/main/java, then run ./skill-manager <cmd>:
      the change is absent. `jbang --fresh SkillManager.java --version` once
      re-caches under the same key and every later wrapper invocation picks
      the new build up.
    why_deferred: >
      OUN-1 works around it in the one harness that drives the CLI (it
      compares source mtimes against the newest cached jar and rebuilds when
      stale). The general fix belongs in the wrapper -- ./skill-manager should
      not be able to run a build older than its own sources -- and that is a
      dev-loop change, not a resolver change.
    candidate_owner: outside this epic; the ./skill-manager wrapper
    status: worked_around
