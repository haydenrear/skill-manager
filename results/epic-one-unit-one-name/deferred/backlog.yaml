    reproduction: >
      ls -d "$SKILL_MANAGER_HOME"/skills/*/.git
    why_deferred: >
      NOT deferred for the migration -- UnitSupersession.blockedFrom refuses
      there now. Recorded because the general case is untouched: `remove` and
      `uninstall` delete a checkout with unpushed commits without asking, and
      home close-out is the only seam that currently guards it. Whether the
      ordinary remove path should carry the same guard is an owner decision
      with a real cost (it makes `remove` refuse on a dirty unit).
    candidate_owner: owner decision, then a ticket outside this epic
    status: filed
    issue: https://github.com/haydenrear/skill-manager/issues/327
    resolution: >
      Filed 2026-09-06 at the owner's instruction, with a REPRODUCTION rather
