  - id: DEF-OUN-013
    found_by: OUN-6 (moving skill-manager into skt and syncing a real home)
    found_at: "2026-09-06"
    severity: blocking
    summary: >
      A contained skill carries no upstream coordinate, so a manifest
      `skill_references` entry naming a repository cannot be satisfied by the
      contained copy. Measured: the OUN-5 migration retires the standalone
      skill-manager and, four lines later in the SAME sync,
      BuildResolveGraphFromUnmetReferences re-clones
      github:haydenrear/skill-manager-skill and reinstalls it, because
      git-epic-workflow references it by coordinate. Exit 0, both lines true,
      nothing reports the contradiction.
    reproduction: >
      clone a home holding standalone skill-manager and git-epic-workflow;
      sync an skt that contains a skill-manager contained skill;
      grep the output for "retired skill-manager" and "installed skill-manager"
    why_deferred: >
      NOT deferred -- it BLOCKS OUN-6, and OUN-6's own test_constraint says so:
      "if an import needs editing, the addressing is wrong and OUN-1 is
      incomplete; that is the signal, and it must fail rather than be papered
      over." Recorded here because the fix is an amendment ticket the owner has
      to schedule, not something OUN-6 may absorb.
      The fix is one field: a contained skill records the repository it came
      from, and a coordinate reference resolves against it. That is the SAME
      field the multi-plugin vendoring design needs (two plugins carrying one
      nested skill, propagating changes between copies), which is why it is
      worth doing properly rather than working around.
    candidate_owner: an amendment ticket ordered before OUN-6
    status: open

  - id: DEF-OUN-014
    found_by: OUN-6 (verifying the move end to end)
    found_at: "2026-09-06"
    severity: minor
    severity_corrected: >
      Filed as `blocking`. It is not. The alarming half of what I measured --
      no copy of the skill anywhere -- was an artifact of MY OWN transitional
      state: the move sits on an unmerged branch, so the carrier that landed
      was `main`, which does not carry the skill yet. Once the branch merges,
      that sequence is benign. The standalone being gone from skills/ is the
      GOAL, not the defect, and I conflated "retired from skills/" with
      "absent everywhere".
    summary: >
      On the SYNC path the retirement checks its precondition and a later
      effect in the same operation invalidates it. RetireSupersededUnits runs
      before BuildResolveGraphFromUnmetReferences and CommitUnitsToStore. It
      asks "does the carrier contain this skill" -- true, of the carrier as it
      stands at that moment -- retires the standalone, and then the commit
      writes a DIFFERENT copy of the carrier over it. If that copy does not
      carry the skill, the home ends with NO copy at all. Exit 0.
    reproduction: >
      clone a home holding standalone skill-manager; sync skt from a local dir
      whose tree carries a contained skill-manager, while the coordinate
      github:haydenrear/skt resolves to a remote main that does not carry it
      yet. Measured 2026-09-06: skills/skill-manager gone,
      plugins/skt/skills/ = {skt, unit-authoring}, installed/skill-manager.json
      gone, exit 0.
    why_deferred: >
      The residual is a narrow check-then-act weakness, worth a comment and a
      cheap post-condition rather than a ticket: it needs a carrier that is
      AHEAD locally and BEHIND remotely in the same operation, which is a
      developer's machine mid-rollout. Not data loss either -- the guard still
      refuses a checkout with unpublished work, so what is removed is
      recoverable by reinstall.
      The fix is an ordering split that is more correct than what I wrote: the
      INSTALL path must retire BEFORE the collision gate, because the gate is
      what it exists to satisfy; the SYNC path has no gate and must retire
      AFTER CommitUnitsToStore, once the carrier is definitively in place.
      Check-then-act across effects is the class; the carrier is the thing
      checked and a later effect is what replaces it.
    candidate_owner: a comment and a post-condition on the OUN-5 line
    status: open

