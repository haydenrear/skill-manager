    found_at: "2026-09-11"
    severity: non-blocking
    summary: >
      The operator's PROJECT home carries a test-fixture unit, `eval-skill`,
      whose origin is an ephemeral scratchpad path that no longer exists:
        file:///private/tmp/claude-501/<session>/scratchpad/upstream/eval-skill.git
      Its store holds an uncommitted one-line edit (`LOCAL_EDIT_EVAL_111`,
      under `MARKER_SKILL_V1`), so every `skill-manager sync` of this home
      stops with "extra local changes — sync would overwrite them" and exit 7,
