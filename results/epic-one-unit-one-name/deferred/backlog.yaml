  - id: DEF-282
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      A cloned home carries auth.token verbatim -- mode 0600, keys
      access_token/refresh_token/expires_at. OBSERVED, not inferred: a clone of
      a home holding a planted real-shaped token had the token. So any image
      built by copying a home ships a working refresh token for the operator's
      registry account, with no build-time signal. skill-manager #281 filed
      this as an unverified inference; it is verified.
    reproduction: >
      skill-manager home clone --from A --to B, where A holds an auth.token;
      then ls -l B/auth.token.
    why_deferred: not deferred -- scheduled as OUN-9, delivered to main
    candidate_owner: OUN-9 (#281)
    status: scheduled

