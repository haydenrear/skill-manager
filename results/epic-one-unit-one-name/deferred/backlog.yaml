  - id: DEF-285
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      The ~3% clone cost the three-tier home model was adopted on is an
      implicit JDK side effect of clonefile(2) on APFS, with no fallback; the
      node that asserts it SKIPS where the JDK cannot reflink, which is the
