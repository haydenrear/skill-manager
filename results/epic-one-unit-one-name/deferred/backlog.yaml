findings:
  - id: DEF-OUN-001
    found_by: OUN-0 (running the assignment's declared spec_unit validation)
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      The 2026-09-05 close-out of child-home-materialization-workflow (main,
      e07e577) promoted the DESIRED workflow model onto specs/program_model
      wholesale, replacing the accepted baseline's spec_manifest.yaml with the
      workflow's working manifest. The accepted manifest carried `catalogs`,
      `invariants`, `state_fields`, `actions`, `state_variables` and
      `promotion_invariants`; the promoted one has `state_fields: []`,
      `actions: []`, no catalogs section, and package `desired_program_cases`
      instead of `skillmanager_program_cases`. One accepted-model contract
      test has been red on main ever since.
    reproduction: >
      git worktree add --detach /tmp/rev e07e577 && cd /tmp/rev &&
      uv run --with pytest pytest specs/program_model/tests -q
        -> 1 failed, 10 passed
           test_program_model_accepts_bounded_cli_disclosure_case_surface
           (CliCommandCatalog is defined in SkillManager.tla but bound in
           neither MC.cfg nor spec_manifest.yaml)
      git checkout e07e577~1 && uv run --with pytest pytest specs/program_model/tests -q
        -> 11 passed
    why_deferred: >
      Outside OUN-0's slice by a wide margin -- this is main's accepted spec
      baseline, not this epic's measurement -- and the remedy is an owner
      decision, not a repair: restoring specs/program_model from e07e577~1
      keeps the accepted baseline but discards whatever the desired model
      legitimately added, while merging the two is a spec-authoring task.
      git-epic-workflow's own precondition ("specs/program_model is a complete
      accepted baseline") is not currently satisfied, which is why this is
      logged blocking rather than major.
    candidate_owner: owner decision, then a main-branch fix outside this epic
    status: partially_repaired
    repair: >
      OUN-0 restored specs/program_model/spec_manifest.yaml to the accepted
      manifest from e07e577~1 (11 passed), because e07e577 changed exactly one
      file in the baseline besides its 72 additions, and SkillManager.tla and
      MC.cfg were not among them -- the baseline was left describing its own
      spec with a manifest written for a different one. The 72 promoted
      modules stay.
    residual: >
      Those 72 modules now have no entries in the accepted manifest, and the
      promotion should probably have MERGED the two manifests rather than
      replacing one with the other. Both are spec-authoring decisions for the
      owner. Also: this repair currently lives only on the epic branch --
      main is still red until it is carried there.

  - id: DEF-OUN-002
    found_by: OUN-0 (the one-name-one-copy walker)
    found_at: "2026-09-05"
    severity: major
    summary: >
      Every home carrying skt already claims the name `skt` twice -- the plugin
      at plugins/skt and a contained skill at plugins/skt/skills/skt. 21 homes
      on this machine. It is latent only because contained skills are
      unaddressable, so OUN-1 turns all 21 live, and an OUN-2 gate written
      without a rule for it would refuse the skt plugin everywhere, including
      during its own migration.
    reproduction: >
      python3 scripts/measure_goal_one_name_one_copy.py | jq '.latent[0]'
    why_deferred: >
      NOT deferred as work -- it is an input OUN-1 and OUN-2 must design
      against, and it was not visible when the plan was written. Recorded here
      so the wave review triages it explicitly rather than each ticket agent
      rediscovering it.
    candidate_owner: OUN-1 (the addressing rule), then OUN-2 (the gate)
    status: open

  # The meta-harness effort's DEF-282..285, verified here 2026-09-05 and
  # SCHEDULED rather than deferred (OUN-9..OUN-12, schedule_revision 2). Kept
  # in the backlog under their original ids so the two ledgers can be joined.
  - id: DEF-282
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      A cloned home carries auth.token verbatim -- mode 0600, keys
      access_token/refresh_token/expires_at. OBSERVED, not inferred: a clone of
      a home holding a planted real-shaped token had the token. So any image
      built by copying a home ships a working refresh token for the operator's
      registry account, with no build-time signal. skill-manager #281 filed
      this as an unverified inference; it is verified.
    reproduction: >
      skill-manager home clone --from A --to B, where A holds an auth.token;
      then ls -l B/auth.token.
    why_deferred: not deferred -- scheduled as OUN-9, delivered to main
    candidate_owner: OUN-9 (#281)
    status: scheduled

  - id: DEF-283
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: major
    summary: >
      bin/cli wrappers bake this home's absolute path (tla-spec-dev among
      them). `home repair` reports 0 findings because its rule is "does this
      reach ANOTHER home", which an own-home absolute path does not -- the home
      is internally consistent and non-portable at once. SkillScriptBackend
      detects it and WARNS, reasoned in-source as not breaking already-shipped
      units. Image builds green, dies at first use.
    reproduction: >
      grep -l "$HOME" <home>/bin/cli/* ; then `home repair --json` on the same
      home reports no findings.
    why_deferred: not deferred -- scheduled as OUN-10, delivered to main
    candidate_owner: OUN-10 (#315)
    status: scheduled

  - id: DEF-284
    found_by: meta-harness effort; partially verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: major
    summary: >
      Three tiers, three gateway states: root owned=true, worktree
      owned=false, project home with no gateway.properties at all, two of them
      naming one port. The DIVERGENCE is confirmed; which state is wrong is
      not, because no written rule says what a copy should believe.
    reproduction: cat <each tier>/gateway.properties
    why_deferred: not deferred -- scheduled as OUN-11, delivered to main
    candidate_owner: OUN-11 (#317)
    status: scheduled

  - id: DEF-285
    found_by: meta-harness effort; verified by this epic 2026-09-05
    found_at: "2026-09-05"
    severity: blocking
    summary: >
      The ~3% clone cost the three-tier home model was adopted on is an
      implicit JDK side effect of clonefile(2) on APFS, with no fallback; the
      node that asserts it SKIPS where the JDK cannot reflink, which is the
      only platform CI runs. And pm/ is in PROVISIONABLE_ROOTS but NOT in
      SKIPPED_DIRS, so a clone copies it -- 203 MB of Mach-O arm64 here (node
      and uv), which cannot go into a Linux image.
    reproduction: >
      grep SKIPPED_DIRS in HomeCloner (pm absent); file <home>/pm/node/*/bin/node;
      read the skip branch of HomeCloneCostsFarLessThanACopy.
    why_deferred: not deferred -- scheduled as OUN-12, delivered to main
    candidate_owner: OUN-12 (#316)
    status: scheduled

