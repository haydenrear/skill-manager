reach:
  - invariant: "a ref counts as local work only when it is not a published branch or a remote-tracking ref"
    enforced_on:
      - "ChildHomeMaterializer.historyContainedIn (gitSourceIsBehind, gitDestIsBehind, gitHistoryMerge)"
      - "ChildHomeMaterializer.gitHistoryMovedOn (checkoutIsModified, gitCopyIsUntouched)"
      - "skt check._local_state (HEAD only)"
    unenforced_on:
      - "ChildHomeMaterializer.gitTwinsDifferOnlyInBookkeeping (still asks for identical ref listings; it writes nothing, so it can only fail to settle)"
      - "ChildHomeMaterializer.reportedDifferences (reports '.git (history)' whenever the listings differ)"
      - "External.tla GitAgree / GitStateUnmoved (sets of refs, no publication)"
    enumerated_by: "grep for refListing, gitHistoryDigest, historyContainedIn and gitHistoryMovedOn callers in src/main; 7 call sites, 5 covered"
  - invariant: "no reconcile replaces a git checkout that is ahead of its source"
    enforced_on:
      - "gitDestIsBehind (HEAD ancestry)"
      - "Disposal.disposable (destinationAheadOf), which reconcile, copyUnit and linkUnit all read"
      - "HomeCloseOut.remedyFor (never prints a sync for UPDATED/CONFLICTED/HELD_BACK when ahead)"
    unenforced_on: UNDECIDED
    enumerated_by: "not enumerated beyond ChildHomeMaterializer and HomeCloseOut: other writers of a unit directory (install, sync from a remote, project resolve's fetch) replace trees by their own rules and were not read"

blind:
