findings:
  - id: DEF-OHV-001
    found_by: kickoff baseline
    found_at_commit: 71c51464
    severity: major
    maps_to: OHV-4 (#341); detection gap for OHV-2 (#339)
    related: [DEF-OUN-018, DEF-283, DEF-HBR-001]
    summary: >
      Three root-home bin/cli shims (computeq, helm-deploy, monitoring) open with
      "# Rewritten by skill-manager: resolve the home this shim is standing in"
      and then exec an ABSOLUTE root path,
      /Users/hayde/.skill-manager/cache/skill-script-deploy-helm-<tool>/venv/bin/<tool>.
      The rewrite re-anchored the header and missed the skill-script venv exec line.
    reproduction: >
      head -6 ~/.skill-manager/bin/cli/computeq  -> line 6 holds the literal home.
      skill-manager home repair --home ~/.skill-manager --json -> rc 0, 0 findings, 78 examined.
      python3 scripts/measure_goal_a_home_survives_being_copied.py ~/.skill-manager
      -> property (b) not met, offenders computeq/helm-deploy/monitoring.
    evidence: [results/epic-one-home-one-verdict/baseline/2026-09-13-v0.27.2/copied-home-root.json]
    impact: >
      GOAL-a-home-survives-being-copied-into-an-image (one-unit-one-name), MET at
      2026-09-12, reads NOT MET on 0.27.2. A home copied into an image executes the
      source host's venv path.
    mechanism: >
      HomeRepair reports FROZEN_HOME_PATH_IN_SHIM only when
      ShimHomeContract.selfDerivingRewrite(store, shim) still returns a rewrite
      (HomeRepair.java:971). The root shims are HALF-rewritten: the export line reads
      ${SKILL_MANAGER_SHIM_HOME}, and the exec line is still literal. The rewriter has
      nothing left to offer, so the detector exempts the shim. The same shim with no
      rewrite at all IS reported (meta-orchestrator: FROZEN_HOME_PATH_IN_SHIM on
      bin/cli/computeq, helm-deploy, monitoring). The detector's rule is "can I rewrite
      this", not "does this name the home", and the repair path produces the shape it
      then skips.
    why_not_a_duplicate: >
      DEF-HBR-001 is skill-dev-skill's install.sh generator, now retired. DEF-OUN-018
      was the missing detector, which has been added. This is that detector exempting
      a shim the rewriter left half-done.
    suggested_fix: detect on content (any literal home spelling in an exec/export line), independent of whether a rewrite is available; make the rewrite cover exec lines
    disposition: ticketed
    disposition_ticket: OHV-4
    disposition_evidence: "#365 merged 42486f86; root home re-anchored 2026-09-14 (goals/GOAL-no-own-home-path/2026-09-14-root-fix/)"

