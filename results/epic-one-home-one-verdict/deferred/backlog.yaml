  - id: DEF-OHV-006
    found_by: kickoff (previous epic's worktree sweep)
    found_at_commit: 71c51464
    severity: major
    maps_to: "adjacent: skt plugin (skill-publisher-skill), not this epic"
    summary: >
      `skt ticket sweep` cannot prove merged work in a repository that squash-merges.
      Without --target or --epic it prints "would remove" for all 14 worktrees and
      skips containment ("containment was not checked"). With --target origin/main,
      13 of 14 are BLOCKED for "commits not contained", although every PR is merged:
      the seven main-based PRs are commit-contained, and the six epic-based ones
      reached main through #335's squash, with a 0-file tree diff. The default path
      is narrower than its name, and the explicit path cannot recognise the merge
      style this repository uses.
    reproduction: >
      skt ticket list --target origin/main  -> 13 BLOCKED;
      skt ticket sweep  -> 14 would remove, note "containment was not checked";
      gh pr view <n> --json mergeCommit + git merge-base --is-ancestor -> all merged into their base
    evidence: [results/epic-one-home-one-verdict/attribution/2026-09-13-kickoff-baseline.md]
    suggested_fix: accept PR-merged (gh) or tree-equivalence as containment; make the no-target default refuse rather than skip
    disposition: carried
    disposition_issues: ["https://github.com/haydenrear/skt/issues/47"]
    disposition_decided: "owner, 2026-09-14, finalization: file grouped issues"

