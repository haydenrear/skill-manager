  - id: DEF-OHV-009
    found_by: schedule_revision 2 amendment
    found_at_commit: c3310fc5
    severity: minor
    maps_to: "adjacent: git-epic-workflow skill (scripts/validate_epic_plan.py), not this epic"
    summary: >
      The plan validator cannot retire one contributor to a goal that other tickets
      still serve. Retiring a ticket requires `affected_goals` to copy every goal it
      relates to, with a disposition (accepted_missed, accepted_unmeasured or
      carried). Any disposition then errors "retirement disposition conflicts with
      active tickets" while another undelivered ticket serves that goal
      (validate_epic_plan.py:1074-1084). A GUARD contributor that the owner drops
      therefore cannot be retired without disposing the whole goal. This epic
      re-scoped OHV-7 instead of retiring it.
    reproduction: >
      In specs/epics/one-home-one-verdict/ticket_plan.yaml at c3310fc5, set OHV-7
      status: retired with a retirement block whose affected_goals carries
      GOAL-ci-green-fresh-runner (any disposition), then run
      validate_epic_plan.py -> error naming active tickets [OHV-3, OHV-5, OHV-8].
    suggested_fix: allow a per-ticket goal disposition "withdrawn_contribution" for guard/enabling links, which leaves the goal active
    disposition: carried
    disposition_issues: ["https://github.com/haydenrear/git-epic-workflow/issues/19"]
    disposition_decided: "owner, 2026-09-14, finalization: file grouped issues"

  - id: DEF-OHV-010
    found_by: wave 1 (disk exhaustion that stopped OHV-3's local verification)
    found_at_commit: 8bd883f3
    severity: major
    maps_to: "adjacent: unit test suite hygiene (RunTests.java and the store/artifacts tests) — not a ticket in this epic"
    summary: >
      The unit suite leaves its temp homes behind. In one day, the macOS user temp dir
      (getconf DARWIN_USER_TEMP_DIR) filled with about 35,000 top-level fixture dirs and
      41 GiB. The largest prefixes were skill-handler-test (5,155), doc-consumer (2,010),
      artifacts-home (2,010), sm-lazy-home-decoy (1,071), matrix-empty-path (595) and
      json-contract (542). Free disk fell to 1.5 GiB mid-run. jbang then could not write
      classes, and OHV-3's artifact-dag and RunTests results were invalid ("No space left
      on device"). Five parallel ticket worktrees each running `jbang RunTests.java`
      several times turn a slow leak into an outage.
    reproduction: >
      T=$(getconf DARWIN_USER_TEMP_DIR); before=$(ls "$T" | wc -l); jbang RunTests.java;
      after=$(ls "$T" | wc -l) -> after - before is in the thousands, and du grows by GiBs.
      Owner-approved cleanup 2026-09-13: deleted 20,508 entries older than 3h; free space
      went from 58 to 102 GiB.
    suggested_fix: create test homes under one per-run root that the runner deletes on exit (or @TempDir-style cleanup per test); fail the suite if it leaves more than N entries in the temp dir
    disposition: carried
    disposition_issues: ["https://github.com/haydenrear/skill-manager/issues/372"]
    disposition_decided: "owner, 2026-09-14, finalization: file grouped issues"

