reach:
  - invariant: "home verify fails iff home repair counts a finding (HVI.VerifyFailsOnEveryCountedRepairFinding / VerifyPassesWhenRepairCountsNothing)"
    enforced_on: ["home verify (HomeCommand.VerifyCmd)"]
    unenforced_on:
      - "artifacts list's projection `agreement` column -- DEF-OHV-002 was first read as verify vs artifacts list, and artifacts list is not composed with HomeRepair"
      - "home drift and skt check (name their build; do not compose repair)"
      - "HomeFixpointLaw's reported set, which parses verify's human-readable text (wave-1 review hot spot)"
    enumerated_by: "the five verdict commands GOAL-verdict-names-its-build lists; read which call HomeRepair.detect (only verify and repair)"

  - invariant: "no install writes through a bin/cli link into another home (HVI.AnOwnEntryWriteStaysInItsHome, AWriteThroughADetachedLinkIsRefused)"
    enforced_on: ["SkillScriptBackend (detach/restore/stat)", "PipBackend (same guard)", "NpmBackend, BrewBackend, TarBackend (delete-then-place)", "LauncherShims (unlink then write)"]
    unenforced_on:
      - "a script that writes another home's file by path when no link was detached (HomeVerdictsInternal_finding_outrightpath.cfg)"
      - "a script that creates a NEW bin/cli name linking out of the home (only detached names are checked; wave-5 review)"
      - "writes outside bin/cli: skills/, plugins/, cache/, venvs/, agent dirs"
      - "a same-size, same-mtime, same-file-key rewrite of a detached target (wave-5 suspicion, untested)"
      - "two concurrent installs in one home (detach/restore not locked)"
    enumerated_by: "OHV-9's bin/cli writer table (every writer of bin/cli); directories other than bin/cli were NOT enumerated -> UNDECIDED beyond the list above"

  - invariant: "a shim spells no own-home path, and one that does is reported (HVI.AShimSpellingItsOwnHomeIsReported, ARepairedShimNamesNoHome)"
    enforced_on: ["bin/cli and bin/mcp (HomeCloner.SHIM_DIR_NAMES)", "skill-script writer (reportFrozenShims)"]
    unenforced_on:
      - "venv-internal shebangs (declared out of scope)"
      - "non-shell text files: reported, not rewritable"
      - "a spelling only in a # comment (declared contract), including a heredoc body line starting with # (wave-3 suspicion)"
      - "a #!/bin/sh or #!/bin/dash shim: the rewrite's preamble uses ${BASH_SOURCE[0]:-$0}, which dash rejects ('Bad substitution', measured here)"
    enumerated_by: "SHIM_DIR_NAMES read; other generated surfaces (bin/launch, harness instances) not enumerated -> UNDECIDED"

  - invariant: "a prune stays pruned; removals reap only rows they prove gone (HVI.PruneStaysPruned, RowsProvenAbsentAtRemovalAreReaped, ALinkStillOnDiskKeepsItsRow)"
    enforced_on: ["ArtifactPrune.apply (whole-home prune)", "RemoveUseCase (uninstall and retirement)"]
    unenforced_on:
      - "projection rows whose link dangled at removal and was later removed by home repair --fix (HomeVerdictsInternal_finding_prunedresidue.cfg)"
      - "pre-OHV-3 rows (DEF-OHV-131)"
      - "PATH-served declared shims (DEF-OHV-130)"
    enumerated_by: "the removal paths that call PruneOrphanArtifacts (uninstall, retirement) plus artifacts prune; sync-time supersession not read -> UNDECIDED"

  - invariant: "one marketplace identity per home (HVI.ASyncRegistersUnderItsOwnIdentity, AfterRepairAndSyncNothingForeignIsEnabled)"
    enforced_on: [".claude/plugins/known_marketplaces.json", ".claude/settings.json", ".codex/config.toml (home root's structural agent dirs)"]
    unenforced_on: ["settings.local.json", "installed_plugins.json and plugins/cache", "CLAUDE_CONFIG_DIR / CODEX_HOME redirects", "harness-instance agent dirs", "Gemini", "other checkouts' configs"]
    enumerated_by: "OHV-6 README 'Deliberately not read' list"

