      contract a ticket deliberately changed.
    attribution: >
      NOT CAUSED BY HIS-12, and measured rather than argued:

        - HIS-12's diff touches NOTHING under test_graph/ (`git diff
          origin/epic..HEAD --stat -- test_graph/` is empty).
        - The refusal text is added by 5ca2a75, HIS-9's, and HIS-12's diff to
          LauncherShims contains ZERO removed lines -- it is purely additive
          (PIN_PREFIX, pinnedCliIn, danglingPinIn) and changes no part of the
