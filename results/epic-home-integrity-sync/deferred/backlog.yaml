  - id: DEF-103
    found_by: epic agent, syncing the seven merged leaf PRs into the ROOT home at the owner's instruction
    found_at: "2026-08-24"
    severity: blocking
    escalated: true
    short_label: "one registered project's durability defect blocks EVERY unit sync into the root home"
    summary: >
      `skt sync <unit>` into the ROOT home FAILS FOR EVERY UNIT with
      PROJECT_SYNC_FAILED, naming a project that has nothing to do with the unit
      being synced. Six projects are registered in the root home; ONE of them
      (`meta-harness`) has three vendored symlinks spelled absolutely, and that
      one project's condition refuses all four units.
    detail: >
      MEASURED 2026-08-24 on the root home, four units, four identical failures:

        skt sync git-issue-workflow  -> PROJECT_SYNC_FAILED: meta-harness
        skt sync git-epic-workflow   -> PROJECT_SYNC_FAILED: meta-harness
        skt sync skill-manager       -> PROJECT_SYNC_FAILED: meta-harness
        skt sync skt                 -> PROJECT_SYNC_FAILED: meta-harness

      "> fix the named project sync failure, then re-run `skill-manager sync` --
      a project sync that succeeds clears this from every unit it claims."

      THE CHECK ITSELF IS CORRECT AND SHOULD NOT BE WEAKENED. Its own detail
      line states the reason: "absolute symlink into this project's own tree: it
      resolves today but does not survive a move, a clone, or a worktree." That
      is EXACTLY the durability principle HIS-19 (#246) shipped for the CLI pin
      -- a path that resolves at write time and not at read time. The epic agent
      first mis-read this as a cosmetic spelling check because the link and its
      expected target resolve to the identical path today; the `resolves:` line
      is equal on both sides and that equality is the trap, not the defect.

      THE DEFECT IS THE BLAST RADIUS. A durability warning about ONE project
      becomes a hard refusal of change management for EVERY unit in the tier
      above it, including units that neither name that project nor are named by
      it.
    consequence: >
      RELEASE-RELEVANT, and the reason it was found: the owner's instruction was
      "we need to be enforcing change management of the root skill manager from
      project home." That direction is currently unavailable on this machine.
      Any operator with six registered projects needs all six durability-clean
      before ANY unit reaches their root home, and the failure names a project
      they may not have touched in months.
    remedy_available: >
      `skill-manager project resolve --repair-vendored` on the offending
      project, which re-points the three links relatively. Legitimate, small and
      reversible -- but it is a write to an UNRELATED REPOSITORY, so the epic
      agent stopped and asked rather than running it.
    candidate_fix: >
      SUPERSEDED -- see `correction_2026_08_24` below. The fix proposed here was
      already shipped and already guarded.
    correction_2026_08_24: >
      THE EPIC AGENT'S FRAMING OF THIS FINDING WAS FALSE, and HIS-22 measured it
      false before writing any code.

      This entry said the refusal named "a project unrelated to the unit being
      synced". IT IS NOT UNRELATED. `meta-harness`'s own
      `.skill-manager/projects/meta-harness/project-lock.toml` CLAIMS ALL FOUR
      UNITS by name -- skill-manager, git-epic-workflow, git-issue-workflow, skt
      -- verified independently by the epic agent at merge. The refusal was
      already scoped by units. It refused all four because the project claims
      all four.

      Worse, the fix this entry prescribed -- "scope the refusal to the units the
      failing project actually claims" -- SHIPPED IN #144 and is guarded by
      `ProjectDependencyResolverTest`'s "project sync failures are recorded only
      on units claiming the failed project". HIS-22 built the acceptance node
      this entry's text demanded, reverted the whole fix, and THE NODE STAYED
      GREEN. An acceptance criterion written from this entry would have been
      vacuous -- mechanism C, in a ticket brief rather than a probe.

      WHAT IS ACTUALLY WRONG is the KIND of failure, not the units-per-project
      scope. A vendored-durability finding is a FORWARD-LOOKING warning -- "this
      resolves today but will not survive a move" -- and it produced a HARD
      REFUSAL of a sync that would have worked today. HIS-22's fix is a typed
      `ProjectVendoredDurabilityException` that yields a named skip carrying the
      `--repair-vendored` remedy, instead of stamping the unit as failed.

      The observed symptom in this entry is real and unchanged. The diagnosis
      was wrong. Kept in full rather than rewritten, because a ledger that hides
      where its author reasoned badly is worth less than one that shows it.
    also_observed: >
      `skill-manager sync --help` PRINTS the project failure banner. Help output
      should not run project checks.
    candidate_owner: HIS-6 to record; a follow-up ticket for the scoping fix
    status: open
    resolution_on_this_machine: >
      UNBLOCKED 2026-08-24 at the owner's instruction, and the finding stands.
      `project resolve --repair-vendored --skip-gateway` was run against
      meta-harness with all four home axes pinned to ITS home: 3 checked, 3
      repaired, 0 findings, exit 0. The three links are now relative, resolve to
      the identical paths, and `git status` is clean because they are gitignored.

      The four root-home syncs then succeeded immediately:
        skill-manager       7b02d14 -> 043a0d3
        skt                 6d49d7f -> 07e3531
        git-issue-workflow  9e1a913 -> 2abdd3f
        git-epic-workflow   726f133 -> 7a5bb33
      `skt check`: all current, 21 change-managed units, tier root.

      AND IT MOVED A GOAL ON THE REAL MACHINE, not in a sandbox:
      check-docs-coverage.py went 0 of 4 -> 4 OF 4 against the operator's actual
      root home. GOAL-mechanism-documented's baseline was 0 of 4.

      THE FINDING IS NOT CLOSED BY THIS. One project's durability defect still
      refuses every unit sync in the tier above it. The next operator with a
      stale project hits the same wall, and the failure will name a repository
      they have not touched in months.
    still_open_here: >
      The root home's pinned CLI predates the artifact graph -- `skt check`
      reports "artifacts not checked (unsupported): this home's skill-manager
      has no `artifacts` verb". That is the released 0.24.0 answering, and it
      resolves when this epic ships. HIS-6 must not read an artifact number from
      this home before then.

  - id: DEF-104
    found_by: epic agent, manual sweep (instrument C) during HIS-6 preparation
    found_at: "2026-08-24"
    severity: major
    escalated: true
    short_label: "`home verify` reports the operator's ROOT home clean while three of its shims execute code inside the PROJECT home"
    summary: >
      MEASURED on the operator's real root home, same home, same minute, two
      answers:

        home verify --home ~/.skill-manager   -> EXIT 0
            "every reference resolves, and NO PATH IN IT REACHES ANY OTHER
             Skill Manager home"
        home repair --home ~/.skill-manager   -> 5 FINDINGS, 71 entries examined
            FOREIGN_PATH_IN_SHIM bin/cli/tla-spec-dev
            FOREIGN_PATH_IN_SHIM bin/cli/monitoring   (x2)
            FOREIGN_PATH_IN_SHIM bin/cli/helm-deploy  (x2)

      `home repair` is RIGHT. Confirmed by reading the shim:

        $ grep exec ~/.skill-manager/bin/cli/tla-spec-dev
        exec python3 "/Users/hayde/IdeaProjects/skill-manager/.skill-manager/skills/spec-double-compiler/scripts/tla_spec_dev.py" "$@"

      and the ROOT HOME HAS ITS OWN COPY of that script -- same size, older
      mtime (Aug 16 vs Aug 20). The shim is not a sanctioned inheritance; it is
      simply pointed at the wrong home. Three shims, five paths.
    why_this_is_not_just_DEF_070: >
      DEF-070 recorded that verify and repair "disagree about one home" as a
      deliberate cut, measured on a FIXTURE. This is the same disagreement on
      REAL, PRE-EXISTING DAMAGE in the tier the epic's own record says was
      damaged twice -- and the direction is the dangerous one: the command whose
      entire purpose is to detect cross-home reach reports CLEAN.
    localised: >
      The project home is CLEAN and the two readers AGREE there (verify: 5
      sanctioned parent-store shims; repair: nothing damaged, 16 entries). The
      disagreement is specific to the ROOT tier and to shim CONTENT. Plausible
      mechanism, not confirmed: verifyRoots' foreign-home question is framed
      against a home's SOURCE/parent, and the root home has no parent, so the
      branch that would catch this never runs. HIS-13's detector asks a
      different question -- "does any shim's content name a path inside another
      home" -- and does not depend on there being a parent.

      THAT MECHANISM WAS WRONG, and HIS-21 measured it wrong before building to
      it. On the pre-fix tree, two throwaway homes, A holding a wrapper execing
      into B:

        home verify --home A               -> exit 0
        home verify --home A --against C   -> exit 0    <- a SOURCE, still blind
        home repair --home A               -> 1 finding
        the same target as a SYMLINK       -> exit 1  FOREIGN_HOME

      So it is NOT about the tier and NOT about having a parent. THE QUESTION
      WAS ASKED ONLY OF SYMLINKS. A regular-file wrapper naming another home was
      invisible at EVERY tier, parent or no parent.

      This mattered: the mechanism as filed implies the fix "run the branch when
