  - id: DEF-101
    found_by: external review of PR #251 (attack D), HIS-20
    found_at: "2026-08-24"
    severity: major
    summary: >
      `skill-manager home close-out` cannot express "the destination can obtain
      this unit from its own manifest, at a published ref", so it blocks a
      teardown over units that are unmodified checkouts at published `main` SHAs
      which the destination's own `skill-project.toml` already declares. Nothing
      would be destroyed, and the gate must still refuse.
    detail: >
      Measured on HIS-20's own close-out, 2026-08-24:

        exit 1, safe: false, 2 blockers
          skill:skill-manager  status=new
            "not in the destination home; the source holds it and this home does not"
          plugin:skt           status=new  (same detail)
          remedy: home sync --from <worktree>/.skill-manager
                            --to <project>/.skill-manager

      Both units arrived in the worktree home from `skill-manager project
      resolve`, are unmodified checkouts at published `main` SHAs
      (`skill-manager-skill` 7b02d14, `skill-publisher-skill` 6d49d7f), and are
      BOTH DECLARED in the destination's own `skill-project.toml`. Discarding
      the worktree home would destroy nothing: the destination can reconstruct
      both with one `project resolve`, from the same refs, offline of this
      worktree entirely.

      THE GATE IS RIGHT PER ITS CONTRACT and the external review said so: it
      knows the destination lacks the unit, and it cannot know that "nothing of
      yours is in there". Refusing is the correct behaviour for the information
      it has. The defect is the missing distinction, not the refusal.

      It is also load-bearing in an unusual direction: the remedy the gate prints
      (`home sync` into the project home) is FORBIDDEN by every ticket brief in
      this epic. So the gate names a remedy the agent may not run, over units
      that did not need saving, and the only correct disposition is to report the
      verdict and leave it -- which is what HIS-20 did.
    why_deferred: >
      Split out of DEF-096 on review. DEF-096 is a PROVISIONING defect (the
      project home does not realize its manifest); this is a PRODUCT defect in
      `close-out`'s verdict vocabulary. Folding them lost the second one, and the
      second one outlives the first: resolving the project home clears THIS
      instance and leaves the missing distinction in place for every future
      worktree that installs anything its parent lacks.
    fix: >
      Give `close-out` a status between `new` and clean -- e.g.
      `reconstructible`: the unit is a clean checkout at a ref reachable from a
      remote the destination is configured for, AND the destination declares it
      in a manifest. Report it, do not block on it, and name `project resolve`
      rather than `home sync` as its remedy. Absent that, at minimum distinguish
      `new (modified here)` from `new (clean checkout at <sha>)` in the detail
      string, so a reader can tell the two apart without inspecting the store.
    consequence: >
      Any worktree that installs a unit its parent lacks -- which is what
      `project resolve` in a worktree does, and what DEF-096's remedy will make
      routine -- cannot close cleanly, and the printed remedy is one an epic
      ticket agent is forbidden to run. The gate's own doctrine is that a
      non-clean verdict must be read, not bypassed; this makes a class of
      non-clean verdicts uninformative.
    candidate_owner: whoever next opens `home close-out`
    evidence:
      - results/epic-home-integrity-sync/tickets/HIS-20/judged-read/README.md
    status: open

  - id: DEF-102
    found_by: HIS-20 (#247), scoring D-Q3 across all six judged reads
    found_at: "2026-08-24"
    severity: minor
    summary: >
      Three pages give three different answers to "may I edit a unit's store copy
      inside my home?", and the disagreement is why D-Q3 is the one question that
      scores PARTIAL at all three tiers BOTH BEFORE AND AFTER this ticket's fix.
    detail: >
      `skill-manager/references/projects.md`:
        "An agent that improves a unit does it *inside a home*."
      -- and `unit publish` "commits `<home>/skills/<name>/`", i.e. it publishes
      FROM the store copy.

      `skt/skills/unit-authoring/SKILL.md` (before HIS-20):
