  - id: DEF-046
    found_by: HIS-15 (#235)
    found_at: "2026-08-22"
    severity: minor
    summary: >
      The four `project` commands cannot be driven under test, because they
      resolve their project from the working directory and a JVM cannot change
      its own.
    detail: >
      `project register|remove|resolve|sync` walk UP FROM THE WORKING DIRECTORY
      to find `skill-project.toml`. A unit test in this repository therefore
      cannot make them operate on a fixture: they find THIS project. MEASURED
      while writing JsonContractTest -- `project resolve --json` returned a real
      report for skill-manager itself ("installed":3,"bindings":3) and wrote the
      worktree home's `.materialization`, from a test that believed it was
      sandboxed. The root and project homes were not touched, and the guard's
      sandbox assertion now covers the home; it cannot cover the CWD.
    the_general_lesson: >
      Bigger than the four commands, and the reason JsonContractTest's driver
      ASSERTS its sandbox instead of establishing one and trusting it:

        AN IN-PROCESS DRIVER CANNOT SANDBOX A COMMAND THAT RESOLVES FROM THE
        WORKING DIRECTORY.

      A JVM cannot change its own working directory, so every override
      mechanism this repository has -- AgentHomes' thread-locals, the
      HomeScaffold access latch, SKILL_MANAGER_HOME -- covers the HOME axis and
      none of them covers the CWD axis. A test that pins the first and believes
      it is sandboxed is wrong in exactly one direction, silently, and the
      command it drives writes real state. That is what happened here: the
      driver pinned five variables, asserted the default home resolved inside
      the temp dir, and `project resolve` still acted on this repository,
      because it never asked the home where the project was.

      So the assertion is not an apology for a near-miss. It is the only thing
      that can distinguish "sandboxed" from "sandboxed on the axis I thought
      of", and any future in-process driver in this repository needs the same
      check plus an explicit decision about the working directory.
    containment_verified: >
      Root home and project home untouched: no writes under ~/.skill-manager in
      the window, main checkout clean, its .skill-manager/.materialization last
      written 2026-08-14. Confirmed independently by the epic agent before the
      finding was relayed. The one write was the worktree's own home, which the
      ticket is entitled to.
    consequence: >
      Those four commands are guarded only on their parse-error path, which
      executes nothing. Their real execution paths have no --json coverage, and
      more generally nothing in the unit lane can test project behaviour
      end-to-end -- which is why it all lives in graphs.
    candidate_shapes: >
      (a) An explicit `--project-dir` on the family, which makes them testable
      and is also what an agent operating outside a checkout needs.
      (b) Drive them in a subprocess with cwd set; correct but costs a JVM
      start per case in the unit lane.
    why_deferred: >
      (a) is a CLI surface change well outside "--json always emits JSON", and
      it is the better fix, so doing (b) here would entrench the worse one.
    candidate_owner: HIS-6, or a follow-up on the project command family
    status: open

  - id: DEF-047
    found_by: epic agent, wave-5 close-out gate on wt-235-his-15
    found_at: "2026-08-22"
    severity: major
    summary: >
      DEF-046's blast radius was larger than reported. The `project` family
      resolving from the working directory did not merely write
      `.materialization` -- it RE-REALIZED the worktree home against this
      repository's project manifest, removing a unit and installing two.
    detail: >
      HIS-15 reported that driving the `project` family in-process made
      `project resolve --json` act on this repo and write the worktree home's
      `.materialization`. That was the visible half. The close-out gate found
      the rest:

        worktree home BEFORE (a clone of the project home): deploy-helm,
          spec-double-compiler, test-graph, tracing-observability
        worktree home AFTER:  skill-manager, spec-double-compiler, test-graph,
          tracing-observability

      `deploy-helm` is GONE from skills/ (its .projections.json record survives,
      orphaned). `skill-manager` (skill) and `skt` (plugin) were installed at
      2026-08-22 13:06:18 -- neither is in the project home. That is this
      repository's own project manifest being realized into a home that was
      never meant to hold it.

      NOT UNDER-REPORTED IN BAD FAITH: the agent saw the `.materialization`
      write, which is what its probe surfaced. Unit churn in `skills/` is not
      something a `--json` return value shows, and nothing asked. It took a
      close-out gate -- a different instrument, run later, for another reason --
      to see it.
    what_was_NOT_damaged: >
      Checked before concluding, not assumed:
        - the main checkout is clean (`git status --porcelain` empty)
        - the PROJECT home's .materialization was last written 2026-08-14, eight
          days earlier -- it was not re-realized
        - no writes under ~/.skill-manager in the window
        - the worktree's spec-double-compiler is at the SAME commit as the
          project home's (436c78c) with a clean tree, so the gate's
          "histories have diverged" is `.git` bookkeeping, not content
      So the escape was confined to one worktree home, and no authored work
      exists anywhere in it.
    the_lesson_that_generalises: >
      A close-out gate found damage that the ticket's own probes, its reviewer,
      and the epic agent's containment check all missed -- because all three
      asked "did it write where it should not?" and the gate asks "does this
      home hold something the tier above does not?". Those are different
      questions and only the second sees a unit that quietly went away.

      This is the epic's recurring shape once more, now in the instruments
      rather than the product: a probe narrower than the condition it is trusted
      to decide (DEF-012, DEF-015, DEF-032). The containment check I ran was
      correct and answered a narrower question than the one that mattered.
    disposition: >
      NO SYNC. The three blockers are `deploy-helm` removed-upstream,
      `skill-manager`/`skt` would-create, and `spec-double-compiler` conflicted
