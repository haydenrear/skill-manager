  - id: DEF-075
    # RENUMBERING AID: filed by HIS-13 as DEF-073 in its own worktree while the
    # epic agent was filing a DIFFERENT DEF-073 on the epic branch. Renumbered at
    # merge by the epic agent, who caused the collision. Contents unchanged.
    found_by: HIS-13, fixing blocker 1 of the PR #244 review
    found_at: "2026-08-23"
    severity: major
    short_label: "nothing on disk remembers that an entry point was once present, so 'pruned' and 'deferred' are the same state"
    summary: >
      HIS-9 measured a real incident: a sync's shim pruner DELETED five
      inherited entry points from a cloned home. HIS-13 set out to detect that
      residue and CANNOT, because no record in a home distinguishes "this entry
      point was here and was removed" from "this entry point was declared and
      never built". They are byte-identical states.
    detail: >
      The three records that could have carried it, and what each actually says:

        artifacts.lock.toml   DECLARES the artifact. A lazy clone carries rows
                              for artifacts it never built (Artifact.Origin.LEDGER
                              exists for exactly that), so a row is not evidence
                              the output was ever produced HERE.
        cli-lock.toml         records the INSTALL, keyed by package name; for an
                              INHERITED shim there was no install in this home.
        home.provenance.json  records which STORES this home descends from. Not
                              which entries it received from them.

      So the first version of this check used the only conjunction available --
      declared, absent, and the recorded parent still holds it -- and the review
      measured what that costs: a stock `home clone` reported as damaged, with
      the verdict depending on which binaries happened to exist in the
      operator's root store (eight artifacts declared-only, one finding, because
      root held that one binary; on another machine, five findings).
    what_shipped_instead: >
      The check now also requires `lazy_artifacts = false` -- production's own
      rule from HomeCloner.partitionDeclared, read in the accusing direction. A
      home that deferred nothing and is missing an entry point it declares is
      damaged; a home that deferred is not. That is correct and it is NARROW:
      `lazyArtifactsDefault` is "on for every home except the operator root", so
      the check is silent on exactly the homes HIS-9's incident happened in.
    consequence: >
      The HIS-9 prune residue on a lazy home is UNDETECTABLE by this command,
      and saying so is the point of this entry. It is not detectable by a
      cleverer conjunction either -- the information is not on disk. Anyone who
      later "improves" the check by dropping the policy condition will
      reintroduce a false positive on every clone this program makes.
    candidate_fix: >
      Record materialization at the moment it happens: when CliShimPruner
      removes an entry, or when a clone declines to carry one, write which. One
      line in the ledger turns an undecidable question into a lookup. That is a
      change to what the ledger MEANS, so it is not a HIS-13-shaped change.
    candidate_owner: HIS-6 to triage; HIS-9 owns the pruner
    related: [DEF-070]
    status: open

  - id: DEF-076
    # RENUMBERING AID: filed by HIS-13 as DEF-074; collided with the epic agent's
