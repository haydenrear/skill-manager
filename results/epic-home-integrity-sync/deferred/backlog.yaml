    why_deferred: >
      The remaining half is a doctrine decision about the intended workflow, not
      a wording fix, and it spans two units in two repositories. HIS-20 corrected
      the two demonstrably-wrong sides and is reporting the third rather than
      inventing the doctrine on the last implementation ticket of the epic.
    fix: >
      State once -- most naturally in `projects.md` beside `home sync` /
      `unit publish` -- the two legitimate cases (authoring belongs in the unit's
      own checkout; an edit made mid-ticket in a home is rescued, not authored)
