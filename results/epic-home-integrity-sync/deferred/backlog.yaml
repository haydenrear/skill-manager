      epic" and blamed it for HIS-14's skip and for `skt status`. The reviewer
      measured otherwise; I re-measured, same parser, three commits:

        ddca9be  2026-08-21 20:34   PARSES
        65942a3  2026-08-22 11:18   FAILS
        6ee45b1  2026-08-23 16:17   FAILS

      Kickoff was 2026-08-20. So the parser broke ON 2026-08-22, at a backlog
      hygiene commit, and waves 1 through 5 parsed fine. HIS-14's own document
      gives a DIFFERENT reason for its skip -- the only `tla-spec-dev` on PATH
      resolving through the ROOT home's CLI pin -- and `skt status` uses its own
