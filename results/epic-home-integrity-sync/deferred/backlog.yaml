  - id: DEF-029
    found_by: >
      HIS-12 (#161), by pasting its own printed remedy into a fresh shell and
      then looking at what it touched
    found_at: "2026-08-21"
    severity: blocking
    escalated: true
    summary: >
      `--home` binds ONE of a home's two axes. A remedy that carries it sends
      the UNITS to the named home and the AGENT PROJECTIONS to the operator's
      real ~/.claude, ~/.codex and ~/.gemini. Measured by causing it.
    detail: >
      MEASURED 2026-08-21, running HIS-12's own DEF-002 remedy exactly as an
      operator would -- SKILL_MANAGER_HOME unset, the root home's bin/cli first
      on PATH:

        $ <build> sync probe-unit --merge --home <scratch>/project/.skill-manager
          ✓ units.lock.toml: wrote 1 unit(s) -> <scratch>/project/.skill-manager/...
          ✓ agents: 1 unit(s) linked into claude, codex, gemini      <-- WHICH claude?

      The store half went where it was told. The agent half went to the
      operator's REAL agent homes:

        ~/.claude/skills/probe-unit  -> <scratch>/.../skills/probe-unit
        ~/.codex/skills/probe-unit   -> same
        ~/.gemini/skills/probe-unit  -> same

      and three real config files gained marketplace registrations naming the
      scratch directory:

        ~/.claude/settings.json                  (1 path entry)
        ~/.claude/plugins/known_marketplaces.json (marketplace `skill-manager-f3821b33`)
        ~/.codex/config.toml:281                 (1 source entry)

      The scratch directory was then deleted, so the symlinks became DANGLING
      and `probe-unit` began appearing as a loadable skill in an unrelated
      agent session. That is how it was noticed -- not by a check.

      THIS IS ISSUE #145 EXACTLY, and `HomeCommand.homeEnvPrefix`'s own javadoc
      states the rule that was broken: "SKILL_MANAGER_HOME says where the UNITS
      live. CLAUDE_CONFIG_DIR / CODEX_HOME / GEMINI_HOME say where the AGENT
      CONFIGS live, and they are a separate axis. A remedy that pins only the
      first resolves the agent half against the ambient environment."
    why_this_is_a_finding_about_HIS-12: >
      HIS-12's per-verb contract routes class-2 and class-3 remedies through
      `--home`, and `--home` pins only the first axis. So the ticket that exists
      to stop a remedy editing the wrong home ships remedies that edit the
      operator's real AGENT home. The `home verify` remedy is unaffected --
      `homeEnvPrefix` binds all four variables, which is why it was written that
      way -- so the epic already contains the correct shape; `--home` does not
      implement it.

      It is not a defect the per-verb contract INTRODUCED: a bare
      `sync <unit> --merge`, the pre-#161 spelling, had the same behaviour and
      no way to name any home at all. What the contract does is make the remedy
      look bound while binding half.
    candidate_fix: >
      Make `--home` mean the whole home. When `--home` is given and the agent
      roots are not otherwise set, derive them from it the way
      `HomeDescriptor.envFor` and `AgentHomes.homeRootFor` already do
      (`<root>/.claude`, `<root>/.codex`, `<root>/.gemini`). That is one
      derivation this repository already has two callers for, and it makes the
      flag's name true. It IS a behaviour change to `sync` and `project sync`,
      which is why HIS-12 did not make it unilaterally.

      The weaker alternative -- have remedies emit the four-variable `env`
      prefix instead of `--home` -- is rejected: the head token is the token
      every consumer of a printed remedy substitutes, which is what took
      home-sync red in #229's first shape.
    why_deferred: >
      `--home` was added by HIS-9 (#226) and independently by HIS-12; changing
      what it BINDS is a semantic change to a flag two tickets in this wave now
      depend on, and it is "changing what the operation does", which HIS-12's
      plan slice excludes. It needs an owner decision, not a drive-by.
    repaired: >
      FULLY REPAIRED 2026-08-21 -- read this entry as a MEASUREMENT, not as live
      damage.

      HIS-12 removed the three dangling skill symlinks it created
      (~/.claude, ~/.codex, ~/.gemini). It did NOT edit the three config files:
      writing an operator's real agent config is outside a ticket agent's remit,
      and the attempt was correctly refused by the permission system. The epic
      agent removed all three stale registrations with the owner's approval, and
      verified by diff that nothing else changed and that all four config files
      still parse.

      ONE CORRECTION TO THIS TICKET'S OWN RECORD, kept because the next agent
      will make the same mistake: the backups at scratchpad/his12-leak-backup/
      were described as "pre-change". They were not. They were byte-identical to
      the DAMAGED state, because they were taken after the leak was noticed
      rather than before the command that caused it -- so restoring them would
      have been a no-op. Snapshot before the experiment, not after the surprise.
    scheduled_as: >
      HIS-14 (#232), wave 5, promotion order 10, on the owner's instruction --
      "we need to make sure the homes are isolated properly and fixed in this
      epic". HIS-13 moved behind it. HIS-12 deliberately did NOT fix it:
      file-and-move-on was the right call and it stands.
    candidate_owner: HIS-14 (#232)
    status: triaged

  - id: DEF-030
    found_by: HIS-12 (#161), re-running ticket-lifecycle on the integrated tip
    found_at: "2026-08-21"
    severity: major
    summary: >
      HIS-9's home-mismatch refusal is met by a ticket-lifecycle probe written
      before it, so the node asks a question the product deliberately stopped
      answering. Red on the integrated tip, 11 of 13 nodes skipped behind it.
      Fixed here.
    detail: >
      MEASURED 2026-08-21 on the integrated tip (a20edcc), run 20260822-001812:

        ticket.lifecycle.provisioned  FAILED   (pins=false)
          each_worktree_home_has_a_pinned_cli_that_actually_runs   failed
          (every other assertion in the node passed)

        node-logs/...pin-probe-proj-TICKET-A.log:
          skill-manager: refusing to run against a home you did not name.
            you named:  .../ticket-lifecycle/ambient
            this shim would have edited: .../proj-TICKET-A/.skill-manager
            This entrypoint binds the home it lives in, so it cannot honour
            SKILL_MANAGER_HOME. Refusing rather than silently editing the
            other one.
            Say which one you mean:  --home <...>

      The probe runs `<home>/bin/cli/skill-manager home close-out --help` with
      SKILL_MANAGER_HOME set to `ambient` -- a DIFFERENT home from the one the
