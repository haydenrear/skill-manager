    candidate_owner: HIS-13
    status: open

  - id: DEF-048
    found_by: HIS-16 (#237)
    found_at: "2026-08-22"
    severity: major
    summary: >
      `HomeMembershipLaw` is a WITHIN-HOME consistency law, not a temporal one.
      A post-condition that runs once cannot hold a first-sight image of a home
      it never saw at the start, so "snapshot at first sight, re-read at the
      end" is implemented only around a SINGLE operation, by the direct node.
    detail: >
      HIS-16 was asked for a law that snapshots each discovered home's unit set
      at first sight, re-reads it at the end, and fails on an unexplained delta.
      What shipped reads the same membership through three readers of the home
      ITSELF -- production's unit snapshot, the `installed/` records, and
      `units.lock.toml` -- and requires one answer. A unit on disk that no
      record names is one nobody installed; a record naming a unit the home does
      not hold is one nobody removed. That IS the law's sentence, it is
      intrinsic so it cannot go stale, and it fires on DEF-047's actual residue
      (deploy-helm's orphaned .projections.json).

      MEASURED LIMIT, on home-integrity run 20260822-223059. The graph's own
      control reproduced the escape -- an unconfined `project resolve` reached a
      checkout from the working directory and swapped that checkout's child home
      from one unit to another -- and the law reported the resulting home CLEAN.
      It was: the resolve rewrote the records to match what it had done. So the
      law sees the RESIDUE form and not a clean re-realization.

      A post-condition node runs at one instant. There is no point in a generic
      graph at which "first sight" of every home is available -- homes appear at
      different times in different graphs, and wiring a census node early enough
      to matter is a per-graph decision that would go stale exactly like the key
      list HomeFixpointLaw's structural discovery exists to avoid.
    candidate_shapes: >
      (a) PRODUCTION writes a membership stamp into a home on every
      home-mutating command, and the law diffs the live set against the stamp.
      That makes "first sight" a property of the home rather than of the graph,
      and it is the only shape that survives structural discovery.
      (b) A `home.membership.census` node any graph MAY wire at its own
      meaningful point, with the law diffing when a census exists. Cheap, but it
      is a list that goes stale silently -- the failure mode being closed.
      (c) home.runtime.json's persisted snapshot, which already exists. See
      DEF-049: nothing establishes how often a legitimate flow leaves it stale.
    why_deferred: >
      (a) is a production change to every write path and is well outside "add a
      law beside HomeFixpointLaw". Doing (b) here would entrench the shape the
      law's own design rejects.
    candidate_owner: HIS-6, or a follow-up on the membership law
    status: open

