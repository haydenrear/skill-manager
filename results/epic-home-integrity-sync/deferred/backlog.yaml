  - id: DEF-077
    found_by: HIS-8 (#224), attempting its own declared change-management path
    found_at: "2026-08-23"
    severity: major
    summary: >
      `skt publish` and `skill-manager unit publish` cannot publish a unit that
      is not installed in the ticket's own home -- and for HIS-8 that was ALL
      FOUR of the units it was assigned to change. The declared route for the
      one ticket whose subject IS change management was unavailable to it.
    detail: >
      HIS-8's assignment says its edits "reach their units through `skt publish`
      (home sync one tier up, then unit publish)". Measured in the ticket
      worktree home, which was cloned from the project home:

        skt publish skt
          -> exit 12
             "error: home sync into <project>/.skill-manager failed (exit 12)"
             "fix: no unit named 'skt' in this home or its parent"

        skill-manager unit publish skt --dry-run --ticket 224-his-8
          -> exit 1
             "skt: not a git checkout at <wt-home>/skills/skt -- reinstall the
              unit from a git source, or materialize it into the child home with
              --checkout, to publish from it"

      The cause is not a bug in publish. It is that the project home holds four
      skills and NO plugins, so a worktree cloned from it holds neither `skt`
      (a plugin) nor `skill-manager` / `git-issue-workflow` / `git-epic-workflow`.
      A home can only publish what it installed.

      SECOND HALF, AND IT IS THE SHARPER ONE. `skt publish`'s worktree-tier
      parent resolution targets the MAIN WORKING TREE's home -- i.e. the PROJECT
      home. HIS-8's brief forbids a ticket agent from writing the project home
      ("Do not sync into the project home or the root home. The epic agent owns
      that reconciliation"). So even had the units been installed, following the
      documented path would have violated the epic's containment rule. The
      documented route and the containment rule are in direct conflict for every
      ticket in this epic, and nothing warns about it.
    what_was_done_instead: >
      The four leaf repos were cloned, edited, committed and pushed as feature
      branches with PRs, mirroring `unit publish`'s own conventions exactly --
      branch `skill/<ticket>-<unit>`, PR title `skill(<unit>): <ticket>`, base
      `main`, no force push, no `--direct`. The resulting commits and PRs are
      indistinguishable from what the tool would have produced; the SHAs are in
      the ticket evidence.
    consequence: >
      An agent that follows the documented change-management path in a ticket
      worktree gets exit 12 or exit 1 with a remedy it cannot act on
      (`--checkout` materialization it was not told about), and the fallback it
      reaches for by itself is unlikely to match `unit publish`'s branch and PR
      conventions. This is HIS-20's (#247) subject matter measured in advance:
      the process is NOT discoverable from the docs for a ticket whose units the
      home does not carry.
    candidate_owner: HIS-20 (#247), which measures whether an agent can derive
      this process from the docs; the containment conflict may belong to the
      epic owner instead
    status: open
    evidence:
      - results/epic-home-integrity-sync/probes/his-8/publish-path-attempt.out

  - id: DEF-078
    found_by: HIS-8 (#224)
    found_at: "2026-08-23"
    severity: major
    summary: >
      The FIRST `skt publish --check` in a cold home reports a clean unit as
      edited, with state `unknown`, and that command is the leftovers gate
      `skt ticket close` consults.
    detail: >
      Measured in the HIS-8 worktree home, four consecutive runs, nothing
      changed between them:

        run 1 (cold): "edited: spec-double-compiler (unknown) at <home>/skills/spec-double-compiler"   exit 10
        run 2:        "skt publish --check: no edited units in this home"                              exit 0
        run 3:        same                                                                             exit 0
        run 4:        same                                                                             exit 0

      `git -C <home>/skills/spec-double-compiler status --short` is empty and
      the branch is `main` with no divergence. The unit was never touched.

      The cause is almost certainly the shared 15s `NETWORK_BUDGET_SECONDS` in
      `publish.edited_units`, exhausted on a cold run before every unit's probe
      finishes. The POLICY is right and documented -- "A probe the budget cut
      short leaves the unit reported, not dropped ... at a gate whose job is to
      refuse while unpublished work exists, an evidence gap must never read as
      'nothing here'." Failing safe is correct.
    the_defect_is_the_rendering_not_the_policy: >
      The safe direction is reported in the SAME SHAPE as a real edit. `edited:
      <unit> (unknown)` is one word away from `edited: <unit> (dirty)`, and
      nothing on the line says "I ran out of budget and did not find out". An
      agent -- or the close gate quoting it -- cannot tell an evidence gap from
      unpublished work, and the natural response to a spurious one is to publish
      a unit that has nothing to publish.
    fix: >
      Render the cut-short case distinctly: name it as a probe that did not
      finish, say so on the line, and tell the reader to re-run. The state token
      already exists (`unknown`); only the presentation treats it as an edit.
    consequence: >
      Warm caches hide it, so it fires on exactly the runs where nobody has run
      anything yet -- the first close of a fresh worktree.
    candidate_owner: HIS-20 (#247) or a skt ticket
    status: open

  - id: DEF-079
    found_by: HIS-8 (#224), measuring the remedy its own documentation recommends
    found_at: "2026-08-23"
    severity: major
    summary: >
      `skill-manager build` cannot provision a `pip:` CLI dependency whose
      binary already exists on the ambient PATH outside the home. The producer
      runs, writes nothing, and the home still has no entry point.
    detail: >
      Measured in the HIS-8 worktree home:

        $ skill-manager build 'cli-shim:pip/pytest' --yes
          no-op       cli-shim:pip/pytest
              now: stale -- its output bin/cli/pytest is not there
        ✗ the producer ran and this home still does not hold the artifact -- it
          reported the dependency already satisfied from outside this home and
          wrote nothing. This is not a repair.
          1 of the selected artifact(s) are still stale
        exit 1

        $ command -v pytest
        /Library/Frameworks/Python.framework/Versions/3.10/bin/pytest

      `--force` does not change it. The contrasting case works: the same command
      for `cli-shim:pip/jinja2-cli[yaml]`, whose binary is NOT on the ambient
      PATH, built cleanly, provisioned `venvs/jinja2-cli`, took the home's stale
      count 13 -> 11, and exited 0.
    why_this_matters_beyond_one_tool: >
      This is a HOME-ISOLATION defect wearing a build failure's clothes, and it
      is this epic's exact subject. A home's whole claim is that what it holds
      does not depend on the operator's machine; here the operator's global
      Python install decides whether a home can own its own pytest. The
      diagnosis is EXCELLENT -- the tool says precisely what happened and
      refuses to claim success -- so the report is not the problem. The
      behaviour is.
    consequence: >
      The remedy every cold shim prints, and the one HIS-8's new documentation
      recommends, silently does not work for an unknown subset of `pip:` deps
      determined by the ambient environment. Two agents on two machines get
      different answers from the same command.
    documented_rather_than_hidden: >
      HIS-8's page states this limit explicitly with the measured output, rather
      than presenting `build <id>` as unconditionally effective.
    candidate_owner: artifact-DAG / a skill-manager ticket
    status: open
    evidence:
      - results/epic-home-integrity-sync/probes/his-8/build-one-artifact.out
      - results/epic-home-integrity-sync/probes/his-8/build-pytest-fail.out

  - id: DEF-080
    found_by: HIS-8 (#224)
    found_at: "2026-08-23"
    severity: minor
    summary: >
      `tla-spec-dev close ticket` accepts only {accepted, closed, complete,
      completed, done} as a plan status, and this epic's word for a landed
      ticket is `delivered` -- so every epic ticket's close must either lie or
      pass `--allow-open` and be recorded as weakened.
    detail: >
      `spec_evolution.py`: `TICKET_CLOSED_STATUSES = {"accepted", "closed",
      "complete", "completed", "done"}`. 15 tickets in this plan carry
      `status: delivered`. A ticket agent stops at PR OPEN (rule 7), so at the
      moment `close ticket` runs, the PR is unmerged and:

        planned    -> refused (correct)
        delivered  -> refused, though it is the plan's own word for "landed"
        closed     -> accepted, and false

      HIS-8 took `--allow-open`, which is the flag whose stated purpose is
      exactly this and which is recorded, never refused. The close is therefore
      the modeled state `CloseTicketWeakened` rather than `CloseTicket`.
    consequence: >
      Every epic ticket that runs this step will be recorded as a weakened close
      for a reason unrelated to its evidence, which dilutes the one signal
      `weakening_flags_record` exists to preserve. HIS-6 should not read
      `weakened: true` on HIS-8 as a comment on HIS-8's evidence.
    filed_upstream: https://github.com/haydenrear/tla-spec-dev/issues/288
    also_recorded_in: specs/results/skill_feedback.md SF-002
    candidate_owner: HIS-6 (interpretation) / tla-spec-dev (fix)
    status: open
    evidence:
      - results/epic-home-integrity-sync/probes/his-8/tla-spec-dev-close.out

