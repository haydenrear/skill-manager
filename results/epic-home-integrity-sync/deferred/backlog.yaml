    found_by: HIS-13, by running `home repair` against its own worktree home
    found_at: "2026-08-23"
    severity: major
    short_label: "AgentProjectionFollowsHomeTest writes a dangling projection into an explicitly-set CODEX_HOME / GEMINI_HOME"
    summary: >
      `AgentProjectionFollowsHomeTest` -- the #145 regression test, whose subject
      is that an operation on one home must not write another home's agent
      directories -- leaves a DANGLING skill projection in whatever `CODEX_HOME`
      and `GEMINI_HOME` name, pointing into a temp home the run then deletes.
      Nothing cleans it up and nothing fails.
    detail: >
      FOUND BY THE COMMAND THIS TICKET SHIPS, unprompted, on its own worktree
      home:

        MISANCHORED_AGENT_LINK .codex/skills/one-forty-five
          -> resolves into the store at /private/var/.../sm-145-<n>/operator/.skill-manager
        MISANCHORED_AGENT_LINK .gemini/skills/one-forty-five   -> same

      REPRODUCED DETERMINISTICALLY: with all five home variables pinned at a
      scratch directory, running that test alone left

        <scratch>/.codex/skills/one-forty-five  -> <temp>/operator/.skill-manager/skills/...
        <scratch>/.gemini/skills/one-forty-five -> <temp>/operator/.skill-manager/skills/...

      and the temp `operator` home is removed when the run ends, so what remains
      is a dangling link in a directory every agent session loads skills from.
    the_scope_correction_i_had_to_make_before_filing: >
      MY FIRST DRAFT OF THIS ENTRY SAID "with those unset -- the normal
      developer environment -- that is the operator's real ~/.codex/skills". I
      then measured it instead of asserting it: a full `jbang RunTests.java`
      with CODEX_HOME, GEMINI_HOME, CLAUDE_HOME, CLAUDE_CONFIG_DIR and
      SKILL_MANAGER_HOME all UNSET wrote NOTHING into ~/.codex or ~/.gemini --
      no `one-forty-five` link, and no link into any temp directory anywhere
      under the operator's three agent dirs. So the unset case is NOT affected,
      and the clause is withdrawn before it was ever shipped.

      Recorded because the correction is the point. DEF-069 was filed at
      `blocking` on exactly this kind of one-observation generalisation and had
      to be withdrawn by a reviewer. This is the same reflex, caught by the
      author this time, and the check that caught it took ninety seconds.
    what_is_actually_true_and_why_it_still_matters: >
      The leak follows an EXPLICITLY SET `CODEX_HOME` / `GEMINI_HOME`. That is
