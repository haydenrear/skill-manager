      mutated build produced 60 findings naming
      ~/.claude/skills/*, ~/.codex/skills/* and ~/.gemini/skills/* -- the
      OPERATOR'S REAL GLOBAL LINKS, read by a command pointed at a temp
      directory. The probe's own byte-snapshot then read the contents of all
