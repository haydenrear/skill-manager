  - id: DEF-003
    found_by: wave-1 close-out, sweeping this epic's branches
    found_at: "2026-08-20"
    severity: major
    summary: >
      Two worktrees from OTHER tickets have had their directories deleted while
      their branches still carry unmerged commits -- and a deleted worktree
      directory takes its gitignored Skill Manager home with it.
    detail: >
      `git worktree list` reports both as prunable, meaning the checkout is
      gone and only the admin record remains:

        wt-115-direct-git-reference-resolution  feature/115-...  1 commit ahead of origin/main
        wt-SMVENV-001                           feature/SMVENV-001  5 commits ahead of origin/main

      The commits survive on the branches, so no git work is lost. What does not
      survive is each worktree's <root>/.skill-manager -- gitignored, carried by
      no branch, and reachable only through `home sync` or `unit publish`. If
      either home held an edited skill that was never sent up a tier, it is gone
      and nothing recorded that it existed.

      This is precisely the hazard git-epic-workflow rule 14 states: "git
      worktree remove deletes a gitignored home without asking and succeeds just
      as quietly whether it held a week of skill edits or nothing."
    why_deferred: >
      NOT THIS EPIC'S WORKTREES. epic/home-integrity-sync created none -- wave 1
      was worked on branches in the main checkout, recorded as an override in
      results/epic-home-integrity-sync/reviews/wave-1.md. Rule 14 scopes the
      sweep to worktrees the epic created, and pruning another ticket's admin
      record is a decision for whoever owns #115 and SMVENV-001 (#108, closed).
      Recorded rather than acted on.
    recommendation: >
      For the owner: decide whether feature/115-... and feature/SMVENV-001
      should be merged, retired, or pruned, and whether anything was lost with
      their homes. `git worktree prune` clears the stale records once that is
      answered -- it does not recover the homes, and nothing can.
    candidate_owner: unassigned
    status: open
    update_2026_08_20: >
      The stale worktree ADMIN RECORDS were cleared by `git worktree prune`
      during the wave-2 close-out. That removes bookkeeping only: the
      directories were already gone before this epic began, and both branches
      survive intact -- feature/115-direct-git-reference-resolution at 1 commit
      ahead of main, feature/SMVENV-001 at 5. No git work was lost by the
      prune, and none was recovered by it either.

      Note the prune was WIDER than the instruction that prompted it, which was
      to close worktrees for MERGED tickets: `git worktree prune` takes no
      filter and clears every stale record at once, and neither of these two
      branches is merged. Recorded because the finding is unchanged -- each of
      those worktrees took its gitignored Skill Manager home with it when its
      directory was deleted, and whether anything was lost with them is still a
      question for whoever owns #115 and SMVENV-001.

  - id: DEF-004
    found_by: wave 2, attempting to provision HIS-4's declared worktree
    found_at: "2026-08-20"
    severity: blocking
    escalated: true
    summary: >
      A cloned home cannot be made usable: `build` reports its CLI shims built
      without writing them, and `home clone` refuses the home for holding the
      foreign paths that were therefore never replaced.
    first_diagnosis_was_wrong: >
      Filed as "verify and clone disagree about a sanctioned shim", corrected by
      the owner's sanity check. That asymmetry is CORRECT behaviour -- the
      project home is a registered child of root so its parent-store shims are
      sanctioned, and a fresh clone is nobody's child yet so they are not.
      Root-pointing shims are BY DESIGN. The defect is one layer down: the
      rebuild that should replace them is a no-op that reports success, because
      CliPresence decides provision by "will this run from this home" and a
      symlink into another home runs. See #223 for the measurement.
    detail: >
      The project home's bin/cli holds ABSOLUTE SYMLINKS into the root home for
      five CLIs -- computeq, helm-deploy, monitoring, tla-spec-dev, tlc2 -- each
      pointing at /Users/hayde/.skill-manager/bin/cli/<name>.

      The two readers say opposite things about them:

        home verify : "every reference resolves, and no path reaches any other
                       Skill Manager home EXCEPT THE 5 SANCTIONED PARENT-STORE
                       SHIMS above" -- the home passes, clean.

        home clone  : "clone verification FAILED -- 5 path(s) reach outside this
                       copy", FOREIGN_HOME on each of the same five, and
                       "home clone failed; <wt>/.skill-manager is not usable".

      One home, two verdicts, on the same five paths. This is the CHM-15 shape
      the epic keeps meeting -- two readings of one rule -- and it is the mirror
      of integration-repository ARTI-29 (#132, "the clone tells the operator
      verify will refuse; verify says everything is fine"): here verify says
      fine and the clone refuses.
    impact: >
      BLOCKING for the epic's own machinery. git-issue-workflow's
      bootstrap-home.sh fails, so `wt new` / `skt ticket new` cannot produce a
      usable ticket home from this project home. Every ticket in this repository
      that follows the documented worktree front door hits this.

      It also retro-justifies wave 1's guardrail override for a reason that
      review did not have: the worktree route was not merely skipped for
      convenience, it would have FAILED. That is recorded in
      reviews/wave-1.md as an efficiency decision and should be read alongside
      this entry.
    remedy_tried: >
      `home shims` regenerates launchers only (4 written) and does not repoint
      the five bin/cli symlinks. The home remains un-clonable afterwards.
    why_deferred: >
      Blocking and OUT OF HIS-4's declared slice. HIS-4 owns the four-link
      scaffold-tree/stranded-baseline chain; this is a shim-provenance defect in
      a different mechanism. Under deferment_policy blocking: escalate, it goes
      to the owner as a decision rather than being absorbed into HIS-4, which is
      how a ticket about one bug becomes a ticket about three.
    options_for_the_owner:
      - Give it its own ticket in this epic (HIS-7), since it blocks the epic's machinery and is squarely home-integrity.
      - Fix it out-of-band by re-provisioning the five CLIs into the project home so the home is self-contained, then retry the worktree.
      - Accept branch-based tickets for the rest of the epic and carry this to a successor, recording that the worktree machinery stays unexercised.
    candidate_owner: HIS-7
    status: triaged
    resolution: >
      Scheduled as HIS-7 (#223) in schedule revision 2, wave 2, promotion order
      4. HIS-4 now depends on it and moved to wave 3; HIS-5 and HIS-6 shifted
      with it. Every open assignment was re-rendered and re-validated against
      the amended plan. The finding stays open as a defect until #223 lands --
      `triaged` means the owner decided, not that the bug is gone.

  - id: DEF-005
    found_by: wave-2 close-out, probing a clone of the project home
    found_at: "2026-08-21"
    severity: minor
    summary: >
      Every clone of this project home exits 11 from its first sync, after doing
      all of its work, because a unit in the home declares skill-imports naming
      units the home does not hold.
    detail: >
      Measured 2026-08-21 on epic tip 23e35c7. `sync --yes` in a fresh clone
      completes agents, tools and CLI provisioning, prints
      `✓ cli: 6 already present, 7 installed`, and THEN:

        markdown skill-import violations (2) — fix these references:
        ✗   - spec-double-compiler (skill): SKILL.md
        ✗     skill-imports[0] references missing unit `skill-manager`
        ✗   - spec-double-compiler (skill): SKILL.md
        ✗     skill-imports[1] references missing unit `skt`

      exit 11. The project home holds 4 units; neither `skill-manager` nor `skt`
      is one of them.
    reproduction: >
      skill-manager home clone --to <scratch>; SKILL_MANAGER_HOME=<scratch>
      skill-manager sync --yes; echo $?
    why_deferred: >
      It is HOME CONTENT, not a product defect: the unit legitimately declares an
      import the home has not installed. But it means every ticket worktree this
      epic creates ends its first sync non-zero, which a bootstrap script may
      read as failure. Two candidate answers -- install the named units into the
      project home, or make the violation non-fatal when the missing unit is not
      required to load -- and choosing between them is not inside any declared
      HIS slice.
    candidate_owner: unassigned
    status: open

  - id: DEF-006
    found_by: wave-3 dispatch, provisioning HIS-10's declared worktree
    found_at: "2026-08-21"
    severity: major
    escalated: true
    summary: >
      DEF-004 was never only a sanction defect. bootstrap-home.sh runs the ROOT
      home's pinned CLI -- Homebrew 0.23.0, which predates this epic and the
      artifact-DAG epic before it -- so the worktree front door has been
      refusing clones that the current build accepts.
    detail: >
      MEASURED 2026-08-21 at epic tip 58692cf. Same script, same source home,
      same destination worktree. The ONLY variable is which build runs it:

        cli: /Users/hayde/.skill-manager/bin/cli/skill-manager   (Homebrew 0.23.0)
          -> "clone verification FAILED -- 5 path(s) reach outside this copy"
          -> FOREIGN_HOME x5, exit 1,
             "home clone failed; <wt>/.skill-manager is not usable"

        SKILL_MANAGER_CLI=<repo>/skill-manager                   (epic build)
          -> exit 0, in 38s: "verified: 4 skill(s) servable",
             launch shim written, home usable

      bootstrap-home.sh PRINTS the CLI it chose (`cli: ...`) and it is the root
      home's, not the home being bootstrapped and not the build under test.
    why_this_matters_beyond_one_worktree: >
      It reframes DEF-004 and both prior waves. Waves 1 and 2 skipped worktrees;
      wave 2's review recorded the reason as the sanction disagreement. That was
      only half of it. The front door was ALSO running a build from before the
      fixes, so a fix landing on the epic branch could never reach the machinery
