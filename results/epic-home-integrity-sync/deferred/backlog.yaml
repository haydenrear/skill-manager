# Deferred findings — epic/home-integrity-sync
#
# APPEND ONLY. A ticket agent that meets a failure case outside its declared
# slice adds an entry here and moves on. It does not widen the ticket to fix
# it, and it does not chase a goal metric by expanding scope.
#
# Policy: mode batch, blocking escalate, budget 5 findings per ticket.
# The epic agent triages this file with the owner at each wave review.
#
# Schema per entry:
#   id, found_by, found_at, severity (blocking|major|minor), summary,
#   reproduction, why_deferred, candidate_owner, status (open|triaged|closed)

version: 1
findings:
  - id: DEF-001
    found_by: epic kickoff (rule 11 currency check)
    found_at: "2026-08-20"
    severity: major
    summary: >
      The project home cannot be brought fully current before the epic starts,
      because the two units that refuse to sync refuse for exactly the reason
      HIS-4 exists to fix.
    detail: >
      `deploy-helm` and `spec-double-compiler` both report "extra local changes
      (working tree edits, or commits ahead of the installed baseline) -- sync
      would overwrite them" and stay stale. The "local changes" are the
      dereferenced in-unit symlink trees (test_graph/build-logic, sdk,
      standard-nodes) that CHM-5 correctly materializes as real directories.
      Outside those paths the trees are content-identical to the root store.

      This is the second face of the same defect. The first face was the
      MERGE_CONFLICT deadlock, cleared by hand at kickoff (see
      baseline/README.md). Clearing the deadlock did not make the units
      syncable, because the deref divergence is still read as an edit.
    reproduction: >
      SKILL_MANAGER_HOME=<repo>/.skill-manager ./skill-manager sync deploy-helm
    why_deferred: >
      The remedy the tool prints is `sync --merge`, which re-runs the merge
      that produced the deadlock in the first place. Running it to satisfy a
      currency check would re-break the operator's project home to make a
      preflight look green. HIS-4 (#216) owns the mechanism; this is its
      subject, not a separate defect.
    accepted_risk: >
      Ticket worktree homes cloned from this project home inherit two units
      one commit behind their source. Both are content-identical outside the
      dereferenced paths, and neither is a unit any HIS ticket edits, so the
      inherited staleness does not affect this epic's work. Re-check after
      HIS-4 lands.
    candidate_owner: HIS-4
    status: closed
    resolution: >
      Released 2026-08-20. `git reset` alone was NOT enough -- both units still
      refused with "extra local changes" because the installed baseline was
      stranded behind a merge a previous sync had already committed. Releasing
      them took removing the gitignored scaffold trees (making the working tree
      clean) and then `sync --merge`, which merged with no stash, no pop and no
      conflict. Both tiers now report `skt check: all current`. The product was
      not changed; HIS-4 (#216) owns the mechanism and has been rescoped to the
      full four-link chain.

  - id: DEF-002
    found_by: epic kickoff
    found_at: "2026-08-20"
    severity: minor
    summary: >
      A sync's printed remedy names the ROOT home's pinned CLI even when the
      sync ran against the project home.
    detail: >
      `SKILL_MANAGER_HOME=<repo>/.skill-manager ./skill-manager sync deploy-helm`
      prints `re-run with: /Users/hayde/.skill-manager/bin/cli/skill-manager
      sync deploy-helm --merge`. Following that remedy verbatim operates on the
      ROOT home, not the project home the operator was working in. A project
      home with no pinned CLI of its own also refuses `skt sync` outright:
      "this project-tier home has no pinned CLI -- regenerate it with
      `skill-manager home shims`, or run the sync from the tier above".
    why_deferred: >
      Same family as #142 (a refusal remedy naming a bare `skill-manager`) but
      a distinct surface, and outside every declared HIS slice. It is a remedy
      that silently changes which home you are editing, which is worth its own
      ticket rather than a drive-by fix.
    candidate_owner: HIS-12
    status: triaged
    resolution: >
      Owned in schedule revision 4. DEF-002 is the same defect as #161
      (HomeDescriptor.resolveCli falls through to a raw PATH walk and the printed
      remedy reads as authoritative) landing on the operator: a sync run against
      the PROJECT home prints a remedy naming the ROOT home's pinned CLI.
      Scheduled as HIS-12 (#161), wave 4, promotion order 8, together with #187.
      `triaged` means the owner decided, not that the bug is gone.

  - id: DEF-003
    found_by: wave-1 close-out, sweeping this epic's branches
    found_at: "2026-08-20"
    severity: major
    summary: >
      Two worktrees from OTHER tickets have had their directories deleted while
      their branches still carry unmerged commits -- and a deleted worktree
      directory takes its gitignored Skill Manager home with it.
    detail: >
      `git worktree list` reports both as prunable, meaning the checkout is
      gone and only the admin record remains:

        wt-115-direct-git-reference-resolution  feature/115-...  1 commit ahead of origin/main
        wt-SMVENV-001                           feature/SMVENV-001  5 commits ahead of origin/main

      The commits survive on the branches, so no git work is lost. What does not
      survive is each worktree's <root>/.skill-manager -- gitignored, carried by
      no branch, and reachable only through `home sync` or `unit publish`. If
      either home held an edited skill that was never sent up a tier, it is gone
      and nothing recorded that it existed.

      This is precisely the hazard git-epic-workflow rule 14 states: "git
      worktree remove deletes a gitignored home without asking and succeeds just
      as quietly whether it held a week of skill edits or nothing."
    why_deferred: >
      NOT THIS EPIC'S WORKTREES. epic/home-integrity-sync created none -- wave 1
      was worked on branches in the main checkout, recorded as an override in
      results/epic-home-integrity-sync/reviews/wave-1.md. Rule 14 scopes the
      sweep to worktrees the epic created, and pruning another ticket's admin
      record is a decision for whoever owns #115 and SMVENV-001 (#108, closed).
      Recorded rather than acted on.
    recommendation: >
      For the owner: decide whether feature/115-... and feature/SMVENV-001
      should be merged, retired, or pruned, and whether anything was lost with
      their homes. `git worktree prune` clears the stale records once that is
      answered -- it does not recover the homes, and nothing can.
    candidate_owner: unassigned
    status: open
    update_2026_08_20: >
      The stale worktree ADMIN RECORDS were cleared by `git worktree prune`
      during the wave-2 close-out. That removes bookkeeping only: the
      directories were already gone before this epic began, and both branches
      survive intact -- feature/115-direct-git-reference-resolution at 1 commit
      ahead of main, feature/SMVENV-001 at 5. No git work was lost by the
      prune, and none was recovered by it either.

      Note the prune was WIDER than the instruction that prompted it, which was
      to close worktrees for MERGED tickets: `git worktree prune` takes no
      filter and clears every stale record at once, and neither of these two
      branches is merged. Recorded because the finding is unchanged -- each of
      those worktrees took its gitignored Skill Manager home with it when its
      directory was deleted, and whether anything was lost with them is still a
      question for whoever owns #115 and SMVENV-001.

  - id: DEF-004
    found_by: wave 2, attempting to provision HIS-4's declared worktree
    found_at: "2026-08-20"
    severity: blocking
    escalated: true
    summary: >
      A cloned home cannot be made usable: `build` reports its CLI shims built
      without writing them, and `home clone` refuses the home for holding the
      foreign paths that were therefore never replaced.
    first_diagnosis_was_wrong: >
      Filed as "verify and clone disagree about a sanctioned shim", corrected by
      the owner's sanity check. That asymmetry is CORRECT behaviour -- the
      project home is a registered child of root so its parent-store shims are
      sanctioned, and a fresh clone is nobody's child yet so they are not.
      Root-pointing shims are BY DESIGN. The defect is one layer down: the
      rebuild that should replace them is a no-op that reports success, because
      CliPresence decides provision by "will this run from this home" and a
      symlink into another home runs. See #223 for the measurement.
    detail: >
      The project home's bin/cli holds ABSOLUTE SYMLINKS into the root home for
      five CLIs -- computeq, helm-deploy, monitoring, tla-spec-dev, tlc2 -- each
      pointing at /Users/hayde/.skill-manager/bin/cli/<name>.

      The two readers say opposite things about them:

        home verify : "every reference resolves, and no path reaches any other
                       Skill Manager home EXCEPT THE 5 SANCTIONED PARENT-STORE
                       SHIMS above" -- the home passes, clean.

        home clone  : "clone verification FAILED -- 5 path(s) reach outside this
                       copy", FOREIGN_HOME on each of the same five, and
                       "home clone failed; <wt>/.skill-manager is not usable".

      One home, two verdicts, on the same five paths. This is the CHM-15 shape
      the epic keeps meeting -- two readings of one rule -- and it is the mirror
      of integration-repository ARTI-29 (#132, "the clone tells the operator
      verify will refuse; verify says everything is fine"): here verify says
      fine and the clone refuses.
    impact: >
      BLOCKING for the epic's own machinery. git-issue-workflow's
      bootstrap-home.sh fails, so `wt new` / `skt ticket new` cannot produce a
      usable ticket home from this project home. Every ticket in this repository
      that follows the documented worktree front door hits this.

      It also retro-justifies wave 1's guardrail override for a reason that
      review did not have: the worktree route was not merely skipped for
      convenience, it would have FAILED. That is recorded in
      reviews/wave-1.md as an efficiency decision and should be read alongside
      this entry.
    remedy_tried: >
      `home shims` regenerates launchers only (4 written) and does not repoint
      the five bin/cli symlinks. The home remains un-clonable afterwards.
    why_deferred: >
      Blocking and OUT OF HIS-4's declared slice. HIS-4 owns the four-link
      scaffold-tree/stranded-baseline chain; this is a shim-provenance defect in
      a different mechanism. Under deferment_policy blocking: escalate, it goes
      to the owner as a decision rather than being absorbed into HIS-4, which is
      how a ticket about one bug becomes a ticket about three.
    options_for_the_owner:
      - Give it its own ticket in this epic (HIS-7), since it blocks the epic's machinery and is squarely home-integrity.
      - Fix it out-of-band by re-provisioning the five CLIs into the project home so the home is self-contained, then retry the worktree.
      - Accept branch-based tickets for the rest of the epic and carry this to a successor, recording that the worktree machinery stays unexercised.
    candidate_owner: HIS-7
    status: triaged
    resolution: >
      Scheduled as HIS-7 (#223) in schedule revision 2, wave 2, promotion order
      4. HIS-4 now depends on it and moved to wave 3; HIS-5 and HIS-6 shifted
      with it. Every open assignment was re-rendered and re-validated against
      the amended plan. The finding stays open as a defect until #223 lands --
      `triaged` means the owner decided, not that the bug is gone.

  - id: DEF-005
    found_by: wave-2 close-out, probing a clone of the project home
    found_at: "2026-08-21"
    severity: minor
    summary: >
      Every clone of this project home exits 11 from its first sync, after doing
      all of its work, because a unit in the home declares skill-imports naming
      units the home does not hold.
    detail: >
      Measured 2026-08-21 on epic tip 23e35c7. `sync --yes` in a fresh clone
      completes agents, tools and CLI provisioning, prints
      `✓ cli: 6 already present, 7 installed`, and THEN:

        markdown skill-import violations (2) — fix these references:
        ✗   - spec-double-compiler (skill): SKILL.md
        ✗     skill-imports[0] references missing unit `skill-manager`
        ✗   - spec-double-compiler (skill): SKILL.md
        ✗     skill-imports[1] references missing unit `skt`

      exit 11. The project home holds 4 units; neither `skill-manager` nor `skt`
      is one of them.
    reproduction: >
      skill-manager home clone --to <scratch>; SKILL_MANAGER_HOME=<scratch>
      skill-manager sync --yes; echo $?
    why_deferred: >
      It is HOME CONTENT, not a product defect: the unit legitimately declares an
      import the home has not installed. But it means every ticket worktree this
      epic creates ends its first sync non-zero, which a bootstrap script may
      read as failure. Two candidate answers -- install the named units into the
      project home, or make the violation non-fatal when the missing unit is not
      required to load -- and choosing between them is not inside any declared
      HIS slice.
    candidate_owner: unassigned
    status: open

  - id: DEF-006
    found_by: wave-3 dispatch, provisioning HIS-10's declared worktree
    found_at: "2026-08-21"
    severity: major
    escalated: true
    summary: >
      DEF-004 was never only a sanction defect. bootstrap-home.sh runs the ROOT
      home's pinned CLI -- Homebrew 0.23.0, which predates this epic and the
      artifact-DAG epic before it -- so the worktree front door has been
      refusing clones that the current build accepts.
    detail: >
      MEASURED 2026-08-21 at epic tip 58692cf. Same script, same source home,
      same destination worktree. The ONLY variable is which build runs it:

        cli: /Users/hayde/.skill-manager/bin/cli/skill-manager   (Homebrew 0.23.0)
          -> "clone verification FAILED -- 5 path(s) reach outside this copy"
          -> FOREIGN_HOME x5, exit 1,
             "home clone failed; <wt>/.skill-manager is not usable"

        SKILL_MANAGER_CLI=<repo>/skill-manager                   (epic build)
          -> exit 0, in 38s: "verified: 4 skill(s) servable",
             launch shim written, home usable

      bootstrap-home.sh PRINTS the CLI it chose (`cli: ...`) and it is the root
      home's, not the home being bootstrapped and not the build under test.
    why_this_matters_beyond_one_worktree: >
      It reframes DEF-004 and both prior waves. Waves 1 and 2 skipped worktrees;
      wave 2's review recorded the reason as the sanction disagreement. That was
      only half of it. The front door was ALSO running a build from before the
      fixes, so a fix landing on the epic branch could never reach the machinery
      that provisions the tickets that test it.

      It is a fifth reader for GOAL-one-home-one-answer, and the most dangerous
      kind: not a different rule, a different BUILD OF THE SAME RULE.
    reproduction: >
      git worktree add ../wt-x -b feature/x epic/home-integrity-sync
      ~/.skill-manager/skills/git-issue-workflow/scripts/bootstrap-home.sh --root ../wt-x   # fails
      SKILL_MANAGER_CLI=<repo>/skill-manager  <same command>                                # succeeds
    evidence:
      - results/epic-home-integrity-sync/probes/his-10/bootstrap-with-root-pinned-0.23.0.out
      - results/epic-home-integrity-sync/probes/his-10/bootstrap-with-epic-build.out
    why_deferred: >
      It spans two owners and neither slice covers it whole. HIS-9 (#226) names
      "bootstrap-home.sh and skt resolve their CLI from the root home" as its
      instance (3) but scopes that to a REPORT, because the script lives in
      git-issue-workflow. HIS-12 (#161) owns resolveCli's unversioned PATH
      fallback, which is the same shape one layer down. Neither owns "the front
      door runs a stale build", and widening either mid-wave is how a ticket
      about one bug becomes a ticket about three.
    workaround_in_use: >
      HIS-10's worktree was bootstrapped with SKILL_MANAGER_CLI pointed at the
      epic build. That works and is what every ticket in this epic should do
      until this is owned. It is a workaround: it makes the tool under test
      bootstrap its own test environment, which is exactly the circularity the
      root home's pin exists to avoid.
    options_for_the_owner:
      - Re-run the failed v0.24.0 release so the root home can be upgraded, which closes the version gap without a code change. Blocked on the release workflow, which publishes.
      - Widen HIS-9 to own instance (3) for real, including the git-issue-workflow change, and reach it through HIS-8's publish path.
      - Accept the SKILL_MANAGER_CLI workaround for the rest of the epic and record it in HIS-8's documentation as the supported way to bootstrap against an unreleased build.
    candidate_owner: unassigned
    status: open
    update_2026_08_21_release_rerun: >
      THE RELEASE WAS RE-RUN AND THE GAP NARROWED BUT DID NOT CLOSE. On the
      owner's instruction the v0.24.0 Release workflow was re-run with every
      Actions cache cleared (52 caches, 5.1 GiB). It succeeded: the tarball
      (19,722,385 bytes) and its sha256 are attached to v0.24.0, the homebrew
      tap was bumped, and `brew upgrade` took the root home from 0.23.0 to
      0.24.0.

      MEASURED AFTERWARDS, same probe as the original finding, throwaway
      worktree, NO SKILL_MANAGER_CLI:

        bootstrap-home.sh --root <wt>  ->  exit 1
        "clone verification FAILED -- 5 path(s) reach outside this copy"
        FOREIGN_HOME x5, "home clone failed; ... is not usable"

      STILL REFUSED, and it should be: 0.24.0 is cut from `main`, which predates
      BOTH this epic and epic/artifact-dag before it. HIS-10's provenance fix
      lives on epic/home-integrity-sync and reaches no released build until this
      epic merges to main and releases.

      So the version gap this finding named is now 0.24.0-vs-epic rather than
      0.23.0-vs-epic. The remedy is unchanged: every ticket in this epic
      bootstraps its worktree with SKILL_MANAGER_CLI pointed at the epic build,
      and that is a workaround, recorded as one. The finding stays OPEN.

  - id: DEF-007
    found_by: HIS-10, answering HIS-7 review finding MED-6 by measurement
    found_at: "2026-08-21"
    severity: blocking
    escalated: true
    summary: >
      `sync` in one home DELETES another home's toolchain when this home's
      `bin/cli` is itself a symlink at that other home's `bin/cli`. The gate
      sees the shape and refuses it; the REPAIR follows the link and prunes
      through it.
    detail: >
      MEASURED 2026-08-21 on the HIS-10 branch, two hand-built homes, no clone
      involved. `homeB/bin/cli -> homeA/bin/cli`, homeA holding two executables:

        home verify homeB   -> FOREIGN_HOME bin/cli  (the gate SEES it)
        CliShimPruner.prune(homeB)
                            -> "pruned bin/cli/alpha ... not this home's parent store"
                               "pruned bin/cli/beta  ... not this home's parent store"
        homeA/bin/cli       -> 2 entries BEFORE, 0 entries AFTER

      The cause is that `CliShimPruner.prune` opens `store.cliBinDir()` with
      `Files.isDirectory` + `Files.list`, both of which FOLLOW the link, and then
      deletes each entry it decides is foreign -- correctly deciding, in the
      wrong home. Every entry it lists is in the other home by construction, so
      it empties that directory. `home verify`'s walk does not follow it
      (`Files.walkFileTree` without FOLLOW_LINKS), which is why the two readers
      disagree here in the one direction that destroys bytes.

      MED-7 from the same review is ANSWERED AND IS NOT A DEFECT, recorded here
      so it is not re-opened: the isolation walk covers the WHOLE home, not
      `bin/cli`. The same probe planted `bin/launch/claude` and `bin/mcp/srv`
      links into homeA and verify reported `FOREIGN_HOME bin/launch/claude` and
      `FOREIGN_HOME bin/mcp/srv` alongside. `HomeCloner.SHIM_DIRS` scopes which
      foreign links may be EXCUSED as sanctioned mirrors, not which are scanned.
    reproduction: >
      Two homes with installed/ + skills/; make homeB/bin/cli a symlink at
      homeA/bin/cli; call CliShimPruner.prune(new SkillStore(homeB)) -- or run
      `sync` in homeB, which calls it. See
      results/epic-home-integrity-sync/probes/his-10/med-6-med-7-measured.out
    evidence:
      - results/epic-home-integrity-sync/probes/his-10/med-6-med-7-measured.out
    why_deferred: >
      This is WRITE CONFINEMENT -- "no home operation writes outside the home
      SKILL_MANAGER_HOME names" -- which is HIS-9 (#226)'s declared slice, not
      HIS-10's. HIS-10 owns provenance, path spelling and the pruner's SANCTION
      decision; it does not own where the pruner is allowed to point. Fixing it
      here would mean adding a confinement guard to a delete path in a ticket
      whose acceptance says nothing about deletion, and the guard belongs in one
      place for every writer, not bolted onto this one.

      Escalated rather than merely filed because it is destructive and because
      this epic has already damaged the operator's root home twice. Nothing
      creates this shape today -- `ChildHomeMaterializer.mirrorExistingShim`
      mirrors ENTRIES, never the directory -- so it is reachable by hand or by a
      restored backup rather than by the product's own path. That is why it is
      recorded as blocking-severity rather than stopping HIS-10.
    candidate_owner: HIS-9
    status: open
    also_reported_by: >
      #228 review, MED-9 second half, and it WIDENS this entry rather than
      repeating it. Before HIS-10 a clone's inherited link was pruned on the
      first sync, so it never survived long enough to reach the rebuild path.
      It now survives every sync -- which is the point of the ticket -- and
      therefore reaches InstallerRegistry.takeOwnershipOfShim, which performs
      the SAME follow-the-link delete in a different method. So the confinement
      guard this entry asks for has a second call site, and HIS-10 made that
      call site reachable. Whoever fixes DEF-007 must cover both.

  - id: DEF-008
    found_by: HIS-10, writing the #206 path-spelling fixture
    found_at: "2026-08-21"
    severity: minor
    summary: >
      After HIS-10, a home is checked under the spelling the caller named AND
      that spelling resolved. A home CREATED through one alias and VERIFIED
      through a DIFFERENT one is still partly unchecked, because a symlink
      cannot be inverted.
    detail: >
      `HomeCloner.destReferences` finds candidate paths BY searching for the
      home root as a string, so it can only use spellings it can derive. HIS-10
      derives two -- the caller's and `toRealPath` of it -- which closes the
      measured case (#206: a home reached through a symlink while its generated
      wrappers hold the resolved spelling). It cannot close the mirror image:
      standing at `<s>/realdir/home` there is nothing that says `<s>/link/home`
      names the same directory, so a wrapper holding the LINKED spelling is
      invisible.

      ASSERTED, not assumed: `HomeVerifyPathSpellingTest`'s
      "THE STATED LIMIT" case pins the current behaviour, and says in its comment
      that it should become an equality assertion if the limit is ever closed.
    reproduction: >
      See HomeVerifyPathSpellingTest -- build <s>/realdir/home with a wrapper
      naming <s>/link/home/venvs/nope/bin/probe, then verify --home
      <s>/realdir/home. Reports clean.
    why_deferred: >
      Closing it needs the home to RECORD the spelling it was created at -- a
      new durable fact, in the same family as HIS-10's provenance record but not
      the one this ticket's acceptance names. Small blast radius: a clone
      re-anchors generated files to the destination spelling it was GIVEN, so
      the created-at and verified-at spellings agree for every home this product
      makes; the gap needs someone to address a home by a second alias.
    candidate_owner: unassigned
    status: open

  - id: DEF-009
    found_by: adversarial review of PR #228 (HIS-10), findings MED-3/4/5/8 and LOW-12/13
    found_at: "2026-08-21"
    severity: major
    summary: >
      The descent record HIS-10 added is durable state in front of a DELETE
      path, and it is neither written atomically, nor read as a file that must
      live inside the home, nor covered directly by any test.
    detail: >
      Six findings on one mechanism, filed together because they share an owner
      and a fix location (HomeProvenance, and HomeCloner's exemption branch).

      MED-3, silent fail-open in front of a delete. HomeProvenance.read swallows
      every IOException and RuntimeException and returns null. Null means "no
      record", which after HIS-10's re-derivation change means "sanction
      nothing", which means CliShimPruner DELETES the inherited shim. So a
      truncated or half-written record does not refuse loudly -- it re-provisions
      a toolchain silently, which is the ~90s regression this ticket exists to
      stop, reappearing as a corruption mode. Compounding it, `write()` is a
      plain mapper.writeValue: no temp file, no ATOMIC_MOVE, so a crash mid-write
      leaves exactly the half-record that reads as absent. Every other durable
      record this epic touches (ChildHomeRegistry, ArtifactLedger) should be
      checked for the same, and the fix is one shared writer, not six.

      MED-4, the exemption's accounting compares parsed strings against raw
      bytes. HomeCloner's provenance branch counts occurrences of the source
      needle in the file's TEXT and then accounts for them using the PARSED
      clonedFrom/parentStores values. A path containing a character JSON escapes
      -- a quote, a backslash, a control byte -- appears escaped in the text and
      unescaped in the parsed value, so the counts differ and the branch fails
      closed (a leak is reported). That direction is safe. The unsafe direction
      is the mirror: two DIFFERENT strings whose escaped forms coincide would
      over-account. Neither was measured. The accounting should compare the
      re-serialized field values against the raw bytes, or the raw JSON tokens.

      MED-5, `read` follows a symlink. `Files.isRegularFile` follows links, so
      `<home>/home.provenance.json -> /elsewhere/record.json` is accepted and a
      home's descent can be stored outside the home. Lower risk after
      re-derivation (the chain still has to hold), but it is the same
      leaf-only-symlink shape as DEF-007 and should be closed with NOFOLLOW.

      MED-8, PARTLY CLOSED IN HIS-10 -- what remains is narrower than filed.
      The half that mattered is done: the leak EXEMPTION
      (`mentionsOnlyRecordedDescent` + `isProvenanceRecord`) is the branch that
      turns a hard finding into no finding, the epic owner refused to let it be
      deferred, and `ProvenanceRecordExemptionTest` now pins it from four
      directions with three separate disables (vacuity rows E, F, G) proving
      each case reddens. What is STILL uncovered directly is
      `HomeCloner.rootSpellings` and `insideHomeText`: both are exercised only
      through `home verify`, which is behavioural coverage rather than a unit
      test, and `insideHomeText` -- the cold-shim token substitution -- has no
      assertion at all over its multi-spelling, longest-first replacement.

      LOW-12, no size cap on the record read (every other whole-file read in
      HomeCloner caps at WHOLE_FILE_LIMIT), and `HomeCloner.unsanctionedForeignHome`
      builds a fresh cache map per call, so the pruner re-derives the chain once
      per shim instead of once per foreign home.

      LOW-13, `--strict` does not escalate the exemption. Every other tolerated
      class (CONTENT_REFERENCE, DIAGNOSTIC_TEXT) becomes a failure under
      --strict; the provenance exemption is silent at every strictness. Decide
      deliberately and write down which.
    reproduction: >
