      Vacuity-ledger row 8 (HIS-14, mechanism B) is exactly this filename:
      "neither 'frozen' fixture was frozen -- both wrote `policy.toml`; the file
      is `home.policy.toml`." That was caught in a FIXTURE. This is the same
      confusion on the OPERATOR'S REAL ROOT HOME, and nothing caught it because
      `home policy` prints `live` whether the policy is absent or merely unread.
    the_product_is_honest_but_not_helpful: >
      It does print "(absent -- live by default)". It does NOT say "there is a
      `policy.toml` in this directory and you probably meant that one." A
      one-line hint would have closed this the first time anybody ran the verb.
    correction_2026_08_24: >
      THE PREMISE OF THIS ENTRY IS FALSE. HIS-21 measured it false and the epic
      agent confirmed it independently:

        $ SKILL_MANAGER_HOME=~/.skill-manager skill-manager policy show
        policy file:          /Users/hayde/.skill-manager/policy.toml
        allowed_backends:     [brew, npm, tar, pip, skill-script]
        require_hash:         false
        allow_init_scripts:   true

      THE PRODUCT READS `policy.toml`. The operator's settings are IN EFFECT.
      There is no unread security policy and no home silently running on
      defaults. The entry said otherwise and the epic agent reported it to the
      owner as a security finding. That was wrong.

      WHAT IS ACTUALLY TRUE, and it is a real but much milder defect: there are
      TWO live policy files with confusingly similar names, read by TWO
      different verbs, and NEITHER NAMES THE OTHER.
        policy.toml       the INSTALL / SECURITY policy   -> `policy show`
        home.policy.toml  the LIVE / FROZEN home policy   -> `home policy`
      `home policy` reports "(absent -- live by default)" about
      home.policy.toml, which is correct, and says nothing about the
