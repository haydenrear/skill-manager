  - id: DEF-035
    found_by: HIS-11, on itself, mid-ticket
    found_at: "2026-08-22"
    severity: minor
    summary: >
      Mutation testing with `git checkout -- <path>` destroys uncommitted work.
      An agent reverting a deliberate mutation wiped every edit it had made to
      the same file, because the fix was not committed yet.
    detail: >
      The vacuity discipline this epic runs on is: disable the fix, run the
      assertion, confirm it reddens, re-enable. The natural way to "re-enable"
      is `git checkout -- <file>` -- and that restores the file to HEAD, not to
      the pre-mutation state. If the fix is still uncommitted, HEAD does not
      contain it, and the revert silently deletes the ticket's work along with
      the mutation.

      HIS-11 hit this on `Executor.java`, reapplied the edits, verified green,
      and committed BEFORE running any further mutations. Nothing was lost.
    why_it_matters: >
      Nine assertions in this epic have been caught passing against broken code,
      so mutation testing is not optional here -- every ticket does it, several
      times, and the loop that makes it safe is not written down anywhere. The
      hazard grows with the discipline.
    the_rule: >
      COMMIT THE FIX BEFORE MUTATING IT. Then a mutation is a dirty working tree
      over a good commit, `git checkout --` restores exactly the fix, and the
      worst case is losing the mutation -- which is the thing you wanted to
      throw away. Alternatives that also work: copy the file aside first, or
      mutate a scratch copy of `src/` rather than the tree under test. What does
      NOT work is reverting to HEAD while HEAD predates your work.
    candidate_owner: HIS-8
    status: triaged
    disposition: >
      Not product work. Routed to HIS-8 (#224), which owns the documentation an
      agent reads before working in this repository -- the vacuity loop belongs
      there next to the discipline it protects.
    recurred_after_filing: >
      IT HAPPENED AGAIN, TO THE SAME AGENT, HOURS AFTER THIS ENTRY WAS WRITTEN.
      HIS-11 lost its whole `Executor` change to `git checkout --` a second time
      while mutation-testing the drain fix. Both times it reapplied and
      re-verified before pushing and nothing was lost.

      That recurrence is the argument. A backlog entry is not a guard: the agent
      that FILED this hazard walked into it again the same day, because the
      revert is the natural gesture and the entry is not in front of you at the
      moment you reach for it. HIS-8 should treat this as documentation that has
      to sit where the loop is performed, not as a note in a list -- and the
      stronger fix is mechanical: mutate a scratch copy of `src/`, or refuse to
      mutate a file whose working-tree state differs from HEAD.

      A separate agent (HIS-14) independently avoided it by mutating file
      backups rather than reverting, and said so unprompted -- so the technique
      that works is already in use and simply undocumented.
    the_loop_that_worked_third_time: >
      Added by HIS-11, which is the only agent to have hit this twice, so that
      the fix is a procedure rather than a warning.

      TWO changes, and BOTH are needed -- either alone still loses work:

        1. The harness snapshots the file's CONTENT before mutating and writes
           that content back in a `finally`. Never `git checkout -- <path>`.
           This is the load-bearing one, because it removes the appeal to HEAD
           entirely: the restore target is the exact bytes the mutation was
           applied to, whatever their commit state.
        2. Commit the fix before the first mutation anyway. This is the belt to
           (1)'s braces: it makes HEAD a correct restore target too, so a
           harness someone writes in a hurry, an interrupted run, or a `git
           checkout` typed by hand all still land somewhere safe.

      A ~15-line Python driver is enough:

        saved = {}
        for path, old, new in edits:
            s = (root/path).read_text()
            saved.setdefault(path, s)
            assert s.count(old) == 1        # a mutation that matches 0 or 2
            (root/path).write_text(s.replace(old, new))   # sites is a bug
        try:
            run the suite
        finally:
            for path, content in saved.items():
                (root/path).write_text(content)

      The `assert s.count(old) == 1` earns its place separately: a mutation
      string that matches nothing produces a GREEN run that looks like a passing
      vacuity check and is actually no check at all -- the same false negative
      the discipline exists to prevent, arriving through the tooling instead of
      through the assertion.

      Why (1) matters more than the rule above it: "commit first" is advice you
      have to remember at the moment you are thinking about something else,
      which is exactly when this ticket forgot it -- twice, hours apart, having
      filed the entry in between. A restore that cannot consult HEAD cannot be
      wrong about HEAD.

  - id: DEF-041
    found_by: HIS-11 (#186), from the adversarial review of #233
    found_at: "2026-08-22"
    severity: major
    summary: >
      The home lock's hold time is unbounded and its patience is fixed at 120s,
      so a slow-but-healthy peer makes the next command REFUSE rather than queue.
    detail: >
      `Executor` now takes `HomeLock` around the whole program, and the program
      includes `RunInstallPlan`, which runs arbitrary skill-script installers.
      `HomeLock.DEFAULT_TIMEOUT` is 120 seconds and nothing scales it to the work
      being done. An agent installing `deploy-helm` into the project home --
      three venvs, roughly 530 MB each -- holds the lock for far longer than
      that, so a peer's `home close-out` -> `home sync` refuses.

      Worktree close-out contending with the project home is the EXACT scenario
      HomeLock was written for, so this is not a hypothetical pairing.
    renumbered: >
      Filed as DEF-035 by HIS-11 and re-issued as DEF-041 on rebase: the epic
      branch had already allocated DEF-035 to the mutation-testing hazard, which
      was pushed and referenced from a commit message first. Two different
      findings, one id, and the one with a reference outside this file keeps it.
    why_this_is_its_own_entry_and_not_part_of_DEF_034: >
      DEF-034 is about the refusal's exit code and about nobody having watched
      the real edge. This is a different claim: that the DURATION MISMATCH makes
      the refusal fire on healthy runs. Folding it in would lose it.
    the_uncomfortable_part: >
      Recorded because it is a consistency failure in this ticket's own
      reasoning, not just a defect. DEF-031 rejects its option (b) -- refuse the
      commit when the pre-image cannot be taken -- on the grounds that it
      "converts an install into a refusal on a condition the operator never
      asked about, which is the hold-back shape CLAUSE 3 exists to prevent".
      The lock does the same thing one layer up, and HIS-11 applied the standard
      to the escrow and not to the lock. The reviewer found that; the ticket did
      not.
    candidate_shapes: >
      (a) Scale the wait with what the holder is doing -- the holder knows, the
      waiter does not, so this needs the lock file to carry the holder's
      operation and a heartbeat.
      (b) Wait indefinitely while the holder is demonstrably ALIVE (pid liveness,
      as the wave's own graph-run.sh lock does), and refuse only when it is not.
      (c) Narrow what the lock covers so RunInstallPlan is outside it -- rejected
      on sight here: the commit and the plan run are the two halves of one
      install, and unlocking between them is the interleaving the lock exists to
      stop.
    why_deferred: >
      Choosing between those is a CLI-contract decision with a surface of its own
      (help text, the typed-exit-code table, an agent-parseable banner), and it
      needs the measurement DEF-034 asks for before the number can be argued.
      Out of "take the home lock for the resolve/install path".
    status: open
    candidate_owner: HIS-6, or whoever owns HomeLock after this epic

  - id: DEF-036
    found_by: HIS-14 (#232), while making `--home` and `homeEnvPrefix` one binding
    found_at: "2026-08-22"
    severity: major
    summary: >
      There is now ONE statement of "what home X means as an environment"
      (`AgentHomes.binding`) and a SECOND one beside it
      (`HomeDescriptor.envFor`). They agree today because both derive from
      `agentDirsUnder`, but they are two code paths that a future edit can
      separate -- the epic's signature defect, one step along.
    detail: >
      `AgentHomes.binding(store)` yields four variables: SKILL_MANAGER_HOME,
      CLAUDE_CONFIG_DIR, CODEX_HOME, GEMINI_HOME. It is what `--home` APPLIES
      and what `HomeCommand.homeEnvPrefix` RENDERS, which is what HIS-14 fixed.

      `HomeDescriptor.envFor(root, store)` yields FIVE: the same four plus
      CLAUDE_HOME, which is the parent spelling of CLAUDE_CONFIG_DIR. It is
      what a home's `home.runtime.json` publishes and what `exec`'s LaunchEnv
      hands a child process.

      The difference is deliberate and documented -- a descriptor is read by
      consumers that know only one of the two Claude names, while a binding is
      applied by code that knows the precedence -- but it is documented in two
      javadocs rather than enforced anywhere. Nothing fails if one gains a
      variable the other does not.
    reproduction: >
      Compare `AgentHomes.binding(store)` with
      `HomeDescriptor.envFor(AgentHomes.homeRootFor(store), store).asMap()`:
      identical for four keys, and the fifth is unasserted anywhere.
    why_deferred: >
      HIS-14's slice is `--home`, and folding the descriptor's env into the
      binding changes what every home's published `home.runtime.json` contains
      -- a wire-format change with `home clone`, `exec`, `bootstrap-home.sh`
      and the launcher shims downstream of it. That is a bigger blast radius
      than this ticket's acceptance needs, and it is exactly the kind of
      widening the deferment policy exists to stop.
    fix: >
      Make `envFor` derive its four shared entries FROM `binding` and add
      CLAUDE_HOME on top, so the descriptor is provably a superset of the
      binding rather than a parallel construction; assert that relation in a
      test rather than in prose.
    candidate_owner: HIS-13 or HIS-5 (the invariant half -- "one home, one env")
    status: open

  - id: DEF-037
    found_by: HIS-14 (#232), enumerating which verbs the new binding reaches
    found_at: "2026-08-22"
    severity: major
    summary: >
      `--home` now binds both axes on every verb that DECLARES it. Several
      home-mutating verbs still do not declare it -- `install`, `uninstall`,
      `bind`, `rebind`, `unbind`, `env run`, `harness instantiate` -- so the
      only way to point them at a home remains the ambient environment, and
      the only way to get that wrong remains silent.
    detail: >
      HIS-9 gave `sync` the flag and HIS-12 gave `project sync` the flag,
      each for a named reason (a refusal had to be able to recommend something
      runnable). Nobody has swept the rest. `install <path>` is the command
      that puts a unit into a home in the first place, and it can only be
      aimed with `env SKILL_MANAGER_HOME=... CLAUDE_CONFIG_DIR=... ...` -- the
      four-variable prefix an operator has to know about, which is precisely
      the knowledge `--home` exists to remove.

      Not a regression and not made worse by HIS-14: these verbs were always
      environment-only. What changes is that the CLI now has a working
      one-argument way to name a home, so continuing to make `install` take
      four variables is a gap rather than a limitation.
    reproduction: >
      `skill-manager install <dir> --home <X>`  ->  Unknown option: '--home'
    why_deferred: >
      Adding an option to seven more commands is additive and mechanical, but
      it is seven surfaces, seven refusal messages and seven help texts --
      outside a slice whose acceptance is about the flag's MEANING, not its
      spread. Doing it in HIS-14 would also make the diff impossible to review
      against the defect it exists for.
    fix: >
      Declare `--home` on every WRITES_HOME command in `CommandHomeAccess`, and
      turn `LazyHomeScaffoldTest`'s completeness scan into the enforcer: a
      command classified WRITES_HOME that declares no `--home` is a finding.
      The binding itself needs no change -- it already reads the flag wherever
      it appears in the parse.
    candidate_owner: HIS-13, or a follow-on ticket after the epic
    status: open

  - id: DEF-038
    found_by: HIS-14 (#232), auditing what a thread-local binding does and does not reach
    found_at: "2026-08-22"
    severity: major
    summary: >
      The binding is thread-local, and a child process inherits the JVM's REAL
      environment, not the binding. Two harness drivers pass the bound value
      down explicitly (`claude plugin …` passes CLAUDE_CONFIG_DIR, `codex …`
      passes CODEX_HOME) and that is the only reason `--home` confines them.
      Nothing enforces that the next driver does the same.
    detail: >
      `HarnessPluginCli.Claude.claudeEnv()` and `Codex.codexEnv()` each build a
      one-entry map from `AgentHomes`, which is override-aware, so the child
      lands in the bound home. Verified end to end: with the binding applied,
      the `ADDED claude (<decoy>/.claude.json)` line that DEF-029 measured no
      longer appears and the decoy's config files are byte-identical after.

      But that is a per-driver decision written down twice. A third agent
      driver, or a new subprocess anywhere in the codebase, gets the ambient
      environment by default -- and "by default it leaks" is the same failure
      shape `AgentHomes.userHome()`'s javadoc says this repository has already
      paid for three times.
    reproduction: >
      Add a `new ProcessBuilder(...)` that reads CLAUDE_CONFIG_DIR without
      putting it in `pb.environment()`, run it under `--home <X>`, and it reads
      the operator's. Nothing in the suite notices.
    why_deferred: >
      The guard wants to be a source scan of the same family as HIS-12's
      remedy-binding scan ("every ProcessBuilder that a bound invocation can
      reach exports the bound variables"), and getting its reachability
      analysis honest is a ticket of its own. HIS-14 covers the two drivers
      that exist, by measurement.
    fix: >
      A single `AgentHomes.exportTo(ProcessBuilder)` that writes the whole
      binding into a child's environment, plus a source scan that fails on a
      ProcessBuilder built anywhere under `agent/`, `project/` or `effects/`
      without it.
    candidate_owner: HIS-13, or the same ticket as DEF-037
    status: open

  - id: DEF-039
    found_by: HIS-14 (#232), deciding where the binding had to sit relative to tryReconcile
    found_at: "2026-08-22"
    severity: minor
    summary: >
      `SkillManagerCli.tryReconcile` projects the AMBIENT home's units into the
      AMBIENT agent directories on EVERY invocation, before the parsed command
      runs -- including invocations `CommandHomeAccess` classifies READ_ONLY.
      So `skill-manager list` writes agent symlinks.
    detail: >
      HIS-14 puts the `--home` binding AHEAD of this call, which fixes the case
      the ticket is about: a command that names a home now reconciles THAT home
      and touches no other. The case it does not address is a command that
      names no home, where the reconcile still happens on a read.

      `CommandHomeAccess`'s whole contract is "a READ_ONLY command produces
      output and no bytes", and its own javadoc records the measurement that
      made the classification real (12 directories created by `--version`).
      `tryReconcile` sits OUTSIDE that gate: `HomeScaffold.declare` governs
      `SkillStore.init()`, and the reconcile's symlink writes are not init.
    reproduction: >
      With an ambient home holding units whose agent links are missing, run
      `skill-manager list`. The links are recreated; exit 0; nothing said.
    why_deferred: >
      Narrowing it is a behaviour change on every read command in the CLI, and
      the epic's acceptance for HIS-14 is scoped to invocations that CARRY
      `--home`. Whether an unnamed read should reconcile at all is a question
      for whoever owns `CommandHomeAccess`'s row for `home`, which that file
      already records as a deliberate under-claim.
    fix: >
      Gate `tryReconcile` on `HomeScaffold.declared() == WRITES_HOME`, and
      measure the read-only sweep the way `7d87a06` measured the last one.
    closed_by: >
      HIS-14, in the review round of #234, because the review measured the
      general form doing real damage rather than the narrow one this entry
      described. `home verify --home <X>` and `home close-out --home <X>` were
      MUTATING X -- a legacy `sources/` record migrated and the directory
      deleted -- on a home declared FROZEN, and `close-out` documents itself as
      "Writes nothing; safe to run repeatedly" while `close-change.sh:441` runs
      it as the `wt close` gate.

      Both gates landed: `tryReconcile` now returns unless
      `HomeScaffold.declared()` is WRITES_HOME, and it honours the frozen
      policy that `ExecCommand.refreshHome` already honoured. `home verify` and
      `home close-out` are narrowed to READ_ONLY -- the step
      `CommandHomeAccess`'s own javadoc called "a separate, verifiable step" --
      for the two rows whose contracts say they write nothing and which declare
      no `--init`, so nothing legitimate loses the permission to scaffold.

      What is NOT closed, and is the reason this stays worth reading: the other
      eight `home` rows are still WRITES_HOME as a family, so `home describe`,
      `home policy`, `home shims`, `home drift` and `home refresh-plugins` all
      still reconcile before they run. Narrowing those needs the `--init` opt-in
      each of them declares to keep working, which is the design work this entry
      was filed for. Re-filed as the remainder rather than left open as a whole.
    candidate_owner: HIS-13, or the CommandHomeAccess follow-on it names
    status: closed

