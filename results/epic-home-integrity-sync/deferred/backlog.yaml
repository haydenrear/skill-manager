      NOTHING WAS WRITTEN, verified immediately: no path under ~/.skill-manager,
      ~/.claude, ~/.codex, ~/.gemini or the project home had an mtime inside the
      window, and every link still resolved into ~/.skill-manager/skills. The
      reason is incidental: every finding was UNREPAIRABLE ("this home does not
      hold skills/<unit>") because the temp fixture held none of those units, so
      the repair loop skipped all 60.

      THE POINT IS WHAT DID NOT SAVE IT. WriteConfinement was in force, and it
      would not have refused, because HomeRepair.ownedAxesOf builds its
      permitted roots from the SAME agentDirsOf call. The mutation moved the
      targets and the fence together. Had the fixture home held a unit of the
      same name, the mutated build would have repointed the operator's real
      global link and the gate would have agreed.
    the_generalisation: >
      This is not a HomeRepair bug -- production derives the axis structurally
      and there is an assertion (`the_agent_axis_comes_from_the_HOME_and_not_
      from_the_ENVIRONMENT`) that reddens under exactly this mutation. It is a
      statement about what the guard is worth: WriteConfinement is a defence
      against a caller that computes the wrong TARGET, and no defence at all
      against one that computes the wrong HOME. Every existing call site should
      be read with that question -- does anything independent of this operation
      decide its roots? -- and today, for the home axis, nothing does.
