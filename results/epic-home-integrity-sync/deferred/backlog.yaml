    missed_by: [A-graph-sweep]
    candidate_owner: HIS-6 to record; a follow-up ticket
    status: open

  - id: DEF-106
    found_by: epic agent, manual sweep (instrument C) during HIS-6 preparation
    found_at: "2026-08-24"
    severity: major
    short_label: "`home describe` prints a full descriptor for a home that has no descriptor, including gateway ownership it cannot know"
    summary: >
      The PROJECT home holds NO `home.runtime.json`, NO `home.policy.toml` and
      NO `gateway.properties`. A worktree home cloned FROM it holds all three.
      Yet:

        $ skill-manager home describe --home <project>
          policy:   live
          cli:      <project>/.skill-manager/bin/cli/skill-manager
          gateway:  http://127.0.0.1:51717 (owned)
          env:      ... all five variables ...

      Every field is SYNTHESISED. The `(owned)` is the sharpest: the root home's
      descriptor declares `"gateway": {"owned": true}` for the same URL, and one
      process is listening on 51717. Two homes cannot both own it, and the
      project home has no descriptor in which to claim anything.
    why_it_matters: >
      `home describe` is the verb an operator or agent runs to find out what a
      home IS. Reporting synthesised defaults in the same shape as recorded fact,
      with no marker distinguishing them, is a reader that cannot be trusted at
      the tier where this epic spent nineteen tickets. Compare `home policy`,
      which DOES mark its default: "(not declared -- default for this tier)".
      `home describe` should do the same.
    open_question_not_resolved_here: >
      Whether a project home is SUPPOSED to have a descriptor. If yes, this
      machine's project home is malformed and that is the finding. If no, then
      `home describe` is inventing one and THAT is the finding. Either way one
      of the two is wrong, and HIS-6 should decide which.
    caught_by_instrument: C-manual
    missed_by: [A-graph-sweep]
    candidate_owner: HIS-6 to decide; a follow-up ticket
    status: open

