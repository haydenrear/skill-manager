  - id: DEF-098
    found_by: HIS-20 (#247), AFTER downward-root judged read
    found_at: "2026-08-24"
    severity: major
    extends: DEF-084
    summary: >
      Two sibling pages in `git-issue-workflow` disagree, both citing
      measurements on the same host, about whether `skill-manager home clone` is
      copy-on-write at all. This is not DEF-084's question (is a `du` figure
      inflated?) -- it is the premise DEF-084 rests on.
    detail: >
      `references/skill-homes.md`:

        "The three-tier model ... is affordable because a clone is COPY-ON-WRITE,
         not a copy. `Files.copy` with `COPY_ATTRIBUTES` takes the JDK's
         `clonefile(2)` path on APFS ... Measured on this host by free-space
         delta on a dedicated volume: a `home clone` of a 189 MB home consumes
         7.22 MB -- 3.8%."

      `references/worktrees.md`, same unit:

        "Two thirds of it is `skill-manager home clone` ... and IT IS COPYING
         RATHER THAN CLONING: measured on the same 696 MB subtree of the same
         home, `cp -Rc` (APFS `clonefile`) takes 11.2 s and `cp -R` takes 26.0 s,
         and `home clone` runs at the second speed. Copy-on-write would take
         ~17 s per worktree off every `wt new` on this machine."

      `skt/skills/skt/SKILL.md` sides with the first ("These homes are cloned
      copy-on-write ... `du` ... over-reports by roughly 30x").

      The two use DIFFERENT INSTRUMENTS -- free-space delta versus wall clock --
      which may well be the resolution: a clone can be fast-path for most bytes
      and still walk the tree at copy speed. NOBODY SAYS SO, and a reader
      deciding "what does a worktree home cost?" gets 3.8% or 100% depending on
      which sibling page they open.

      NOT the same as the pair the AFTER upward-root read checked and cleared:
      3.8% in skill-homes.md versus 3.1% in worktree-lifecycle.md ARE explicitly
      cross-cited as different homes and are not in conflict. Naming the wrong
      pair here would make this row worthless, so the pair is named exactly.
    why_deferred: >
      Settling it needs one measurement neither page took: free-space delta AND
      wall clock on the same tree, with `home clone` and `cp -Rc` side by side.
      Both pages are pre-existing prose in a unit this ticket does not carry.
    fix: >
      DONE -- MEASURED TWICE, INDEPENDENTLY, AND SETTLED. See `resolution` below.
      `worktrees.md`'s sentence is corrected in git-issue-workflow-skill PR
      (HIS-20). `skill-homes.md` needs no change; its shape was right.
    resolution: >
      `skill-manager home clone` IS COPY-ON-WRITE. `worktrees.md`'s "it is
      copying rather than cloning" is FALSE. Measured by free-space delta on the
      same volume, with both a positive control for CoW and a positive control
      for a true copy, never with `du`.

      Reviewer of PR #251, on one home:

        cp -Rc (clonefile), control                  1.2 MB
        cp -R  (true copy), control                526.4 MB
        skill-manager home clone                    31.0 MB   <- 6.1%
        cp -R of exactly what home clone produced  511.3 MB

      HIS-20's independent replication, on a DIFFERENT home (503 MB, 30,576
      files, `cache/` empty so `home clone`'s cache-skip cannot account for it):

        skill-manager home clone                     22.2 MB   <- 4.4%
        cp -R of exactly what home clone produced   498.0 MB
        cp -Rc of exactly that tree, control         39.7 MB

      The `cp -R of exactly what home clone produced` arm is the one that
      matters: it copies the SAME bytes `home clone` wrote, so the cache-skip is
      factored out and the only remaining difference is the copy mechanism. Both
      runs put `home clone` at clonefile's magnitude and 17-22x below a true
      copy. Two homes, two operators, same conclusion.

      WHAT IS *NOT* FALSIFIED, and the correction must not overreach:
      `worktrees.md`'s TIMING measurement stands (`cp -Rc` 11.2 s, `cp -R`
      26.0 s, `home clone` at the second speed). What fails is the INFERENCE
      FROM TIME TO SPACE -- that running at `cp -R`'s wall clock means copying
      `cp -R`'s bytes. It does not: `home clone` walks 30k files, stats and
      rewrites descriptors and verifies the copy, and that work costs seconds
      without costing blocks. So "copy-on-write would take ~17 s per worktree
      off every `wt new`" is the false sentence, not the timings above it.

      CONSEQUENTLY: "a new worktree is nearly free" is JUSTIFIED FOR DISK and
      NOT for wall clock. DEF-084's standing assumption ("assume any home-size
      figure in these docs is a `du` figure and therefore inflated") survives --
      it depended on CoW being real, and CoW is real.

      HOW THE FIRST REPLICATION ATTEMPT FAILED, recorded because it is a
      vacuity-ledger shape: HIS-20's first probe passed `--home` to `home clone`,
      which takes `--from`. The arm exited 2, produced ZERO files, and still
      printed `C delta = -13.7 MB` -- a number that reads as "better than
      clonefile". It was caught only because the probe also counted files per
      arm. The two positive controls were green in that same run, so control
      health did not reveal it; only the per-arm output count did. An arm can be
      void while its controls are sound.
    consequence: >
      HIS-6 reports disk arithmetic for this epic. Settled: a home per ticket
      worktree costs roughly 4-6% of its parent in real blocks, and the
