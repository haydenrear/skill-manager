        HIS-14 tip, re-run,             run (g4 retry)       FAILED   (not a flake)
        EPIC TIP d40c39f, no HIS-14,    run 20260822-162522  FAILED   (same signature)

      Byte-identical signature in all three, always on ticket B:

        running:  <cli> home close-out --home <...>/proj-TICKET-B/.skill-manager
                  --into <...>/proj/.skill-manager --json
        could not parse the verdict: Expecting value: line 1 column 1 (char 0)
        FAILED    `home close-out` exited 1

        node ... failed: the gate printed no remedy for one of the tickets, so
        there is nothing to run concurrently; exits=4/4
        remediesA=[<cli> home sync --from ...proj-TICKET-A... --to ...proj...]
        remediesB=[]

      Exit 1 with EMPTY STDOUT can only come from an exception escaping
      `HomeCloseOut.inspect` that is neither `NotAHomeException` nor
      `FrozenHomeException` -- `CloseOutCmd` catches those two and prints JSON
      for the first, and every other path prints the verdict before returning.
      A generic exception reaches `handleExecutionException`, which returns 1
      and writes to stderr, so a `--json` consumer reading stdout gets nothing.

      The likely thrower is the home lock. `HomeCloseOut.inspect` is a DRY-RUN
      SYNC into the project home (`HomeSync.run(..., Options(true, true))`), and
      a dry run takes the destination's lock through
      `HomeLock.acquireWithoutCreating`, which throws
      `IOException("<op>: <root> is locked by another ... 120000ms")` on
      timeout. HIS-11 additionally put `HomeLock` around the WHOLE program in
      `Executor`, so a concurrent pass holds the project home's lock for longer
      than it used to. This is exactly the scenario HIS-11's own DEF-041
      describes -- "a slow-but-healthy peer makes the next command REFUSE rather
      than queue", and "worktree close-out contending with the project home is
      the EXACT scenario HomeLock was written for". DEF-043 may be the graph
      finding DEF-041 predicted; whoever owns DEF-041 should read them together.
      NOT CONFIRMED HERE: the exception's own message went to stderr and the
      node captures stdout, so the thrower is inferred from the shape rather
      than read. Confirming it is one line of node-log capture.
    attribution: >
      NOT CAUSED BY HIS-14, and measured rather than argued:

        - the same node fails identically on d40c39f with none of HIS-14's
          commits applied (run 20260822-162522);
        - HIS-14's diff touches NOTHING under `test_graph/` (`git diff
          origin/epic..HEAD --stat -- test_graph/` is empty);
        - HIS-14's diff touches none of `HomeCloseOut`, `HomeSync`, `HomeLock`
          or `Executor` (same command over those four files: empty);
        - the pre-rebase run of this graph on HIS-14's own tree passed 13/13
          (run 20260822-154837), including this node's fifteen assertions --
          so HIS-14's `home close-out` change (WRITES_HOME -> READ_ONLY) is
          present in a PASSING run of the same node.
    why_deferred: >
      HIS-14 is promotion order 10 with HIS-13, HIS-5, HIS-8 and HIS-6 after it,
      so unlike DEF-030 -- which HIS-12 fixed because it was LAST and could not
      hand a red core graph to anyone -- there is somewhere for this to go. The
      fix is in `Executor`/`HomeLock`/`HomeCloseOut`, which are HIS-11's surface
      and outside HIS-14's slice by every conflict key. Widening HIS-14 to carry
      it would put HIS-11's lock design in a diff about `--home`.
    fix: >
      Two halves, and the first is worth doing whoever takes it: `CloseOutCmd`
      should catch `IOException` and emit the same `--json` error shape it
      already emits for `NotAHomeException`, so a teardown script branching on
      the verdict gets a typed answer instead of an empty stdout. Then decide
      the lock question with DEF-041 -- scale the timeout to the work, or queue
      rather than refuse.
    candidate_owner: HIS-11's surface — HIS-13, or whoever takes DEF-041
    status: open

  - id: DEF-044
    found_by: HIS-15 (#235)
    found_at: "2026-08-22"
    severity: minor
    summary: >
      Three --json paths exit 0 having printed nothing, and whether that is
      right is a design question nobody has answered.
    detail: >
      `harness rm` with no matching binding, `harness instantiate
      --child-home-dir --dry-run`, and `home drift --record` / `--ack` all
      succeed and emit no document. A consumer that ran them with --json gets
      an empty stdout and has to infer "nothing happened" from an exit code.

      An {"error":…} envelope would be a LIE about them -- nothing failed --
      which is why HIS-15's generic net deliberately fires only on non-zero
      exits. The honest options are an empty-result document
      ({"removed":[],"exitCode":0}) or a documented "silence means no-op", and
      choosing between them is a contract decision, not a bug fix.
    what_is_NOT_deferred: >
      Their CURRENT behaviour, which is pinned. `JsonContractTest` asserts each
      of them prints exactly nothing today. A change that starts writing prose
      there fails the guard, and a change that starts writing a document fails
      it too and forces whoever makes it to move the case out of SILENT
      deliberately. The epic owner's instruction, and it is the right one: a
      deferred gap is an unasserted state, which is the shape this epic has
      been bitten by repeatedly. This is a known state with a test on it.
    candidate_owner: HIS-6, or whoever owns the CLI's machine-readable contract
    status: open

