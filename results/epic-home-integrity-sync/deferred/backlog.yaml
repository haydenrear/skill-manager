  - id: DEF-105
    found_by: epic agent, manual sweep (instrument C) during HIS-6 preparation
    found_at: "2026-08-24"
    severity: major
    escalated: true
    short_label: "the operator's root home carries a security policy the product does not read, because the filename changed"
    summary: >
      The root home holds `policy.toml`, dated 2026-05-22, headed "skill-manager
      policy -- guards against hostile skills", declaring `allowed_backends`,
      `require_hash = false`, and an `init_script` flag its own comment calls
      "very dangerous". THE PRODUCT DOES NOT READ IT. It reads
      `home.policy.toml`, and says so plainly:

        $ skill-manager home policy --home ~/.skill-manager
        policy: live
        lazy_artifacts: false  (not declared -- default for this tier)
        file:   /Users/hayde/.skill-manager/home.policy.toml  (absent -- live by default)

