      It is a fifth reader for GOAL-one-home-one-answer, and the most dangerous
      kind: not a different rule, a different BUILD OF THE SAME RULE.
    reproduction: >
      git worktree add ../wt-x -b feature/x epic/home-integrity-sync
      ~/.skill-manager/skills/git-issue-workflow/scripts/bootstrap-home.sh --root ../wt-x   # fails
      SKILL_MANAGER_CLI=<repo>/skill-manager  <same command>                                # succeeds
    evidence:
      - results/epic-home-integrity-sync/probes/his-10/bootstrap-with-root-pinned-0.23.0.out
      - results/epic-home-integrity-sync/probes/his-10/bootstrap-with-epic-build.out
    why_deferred: >
      It spans two owners and neither slice covers it whole. HIS-9 (#226) names
      "bootstrap-home.sh and skt resolve their CLI from the root home" as its
      instance (3) but scopes that to a REPORT, because the script lives in
      git-issue-workflow. HIS-12 (#161) owns resolveCli's unversioned PATH
      fallback, which is the same shape one layer down. Neither owns "the front
      door runs a stale build", and widening either mid-wave is how a ticket
      about one bug becomes a ticket about three.
    workaround_in_use: >
      HIS-10's worktree was bootstrapped with SKILL_MANAGER_CLI pointed at the
      epic build. That works and is what every ticket in this epic should do
