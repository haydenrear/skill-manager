  - id: DEF-051
    found_by: HIS-16 (#237)
    found_at: "2026-08-22"
    severity: minor
    status_note_2026_08_23: >
      SUPERSEDED IN PART, and the framing was wrong. This entry deferred only
      the false-NEGATIVE direction. Review of #241 (H3) found the false
      POSITIVE, which was live on every platform this epic runs on: /tmp and
      java.io.tmpdir are both symlinks, ProjectRoot reads user.dir physically,
      so a confinement declared as /tmp/x refused a working directory of
      /private/tmp/x -- two spellings of one directory, each asserted to be
      outside the other, at a 100% refusal rate. Fixed by
      Confinement.canonicalize, which resolves the deepest EXISTING ancestor
      and re-appends the rest. That also closes the false negative for any
      component that already exists. What remains open is only a link created
      AFTER the check, which no in-JVM check can see.
    summary: >
      Confinement is a check over path SPELLINGS. `Confinement` deliberately
      does not call `toRealPath()`, so a symlink pointing out of the root
      defeats it.
    detail: >
      A driver declares its confinement root BEFORE laying the home out, and
      `toRealPath` throws on a path that does not exist yet, so the check
      normalizes and takes `Path.startsWith` -- per-segment, so the
      /var vs /private/var substring trap the epic already paid for is not
      reintroduced (asserted in ConfinementTest). What it does not do is resolve
      links: a confinement root containing a symlink whose target is outside it
      reads as covered.

      Stated as a decision rather than left as an omission.
      GOAL-one-home-one-answer clause 2 owns spelling-invariance and HIS-17
      owns the spelling-pair fixtures; HIS-9 owns the effect boundary. This is
      the axis check neither performs.
    why_deferred: >
      The fix needs a "resolve as far as exists, then normalize the rest" helper
      that is spelling-invariant AND works on paths that are not there yet.
      That is HIS-17's subject, not a side change here.
    candidate_owner: HIS-17
    status: open

