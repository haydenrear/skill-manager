  - id: DEF-061
    found_by: review of PR #240 (HIS-18), reproduced by the HIS-18 agent
    found_at: "2026-08-22"
    severity: major
    summary: >
      `carryOverUnownedTrees` abandons the destination's copy of an unowned path
      when the staged tree already holds that path, and the swap then destroys
      it. Reached when upstream STOPS declaring a path generated and puts its
      own content there.
    detail: >
      The branch is `if (Files.exists(to, NOFOLLOW)) continue;`. HIS-4 wrote the
      carry-over as best-effort, and the collision case had no test in any suite
      and no report at all. The review of #240 named it; HIS-18 reproduced it:

        child home writes results/notes.md under a `results/` rule
        upstream removes the rule and commits its own results/notes.md
        refresh -> upstream's copy stands, the child's is gone

      The unit is NOT held back on the way there, because the child's copy was
      excluded from the destination digest by the OLD rules, so `destUntouched`
      is true and the tree reads as pristine.
    what_was_done: >
      HIS-18 made the branch WARN, naming the path and the reason, so the loss is
      reported rather than silent, and pinned it with a unit case
      (ScaffoldedTreeIsNotContentTest, "when upstream stops declaring a path
      generated, the child's copy of it is not lost silently").
    why_deferred: >
      Preserving the bytes means escrowing them, and `MaterializationEscrow` is
      HIS-4's surface with its own rollback semantics on the sync path. Wiring a
      second escrow into the resolve path from a digest ticket is how one rule
      gets two implementations, which is this epic's recurring defect.
    candidate_owner: HIS-13
    status: open

