  - id: DEF-011
    found_by: wave-3 close-out, running `run.py --all` on the merged tip
    found_at: "2026-08-21"
    severity: major
    escalated: true
    summary: >
      The epic's ONLY pre-merge graph signal is a single ordered chain that has
      never completed. A teardown node in the FIRST graph raced its own kill and
      lost, twice in a row, and took the other 23 graphs with it.
    detail: >
      TWO FINDINGS, one instrument.

      (1) THE RACE, and it is a real defect in ServersDown.killByPidFile:

            h.destroy();                                  // SIGTERM
            try { h.onExit().get(5, SECONDS); }           // wait
            catch (Exception e) { h.destroyForcibly(); }  // SIGKILL
            return !h.isAlive();                          // sampled IMMEDIATELY

          `destroyForcibly` is a REQUEST, not a reaping. Nothing waits after it,
          so `isAlive()` is read while SIGKILL is still in flight and the node
          reports a failure to stop a process that did stop.

          MEASURED: `smoke` failed at servers.down / registry_down on runs
          20260821-164405 and 20260821-170159 -- the same node, the same
          assertion, both times, so not a flake. The registry JVM was
          registry.up's recorded pid 70183 on port 52348 (a random port; an
          early theory about a fixed port 5000 colliding with macOS
          ControlCenter is WRONG and is recorded here so it is not re-derived).
          Afterwards `ps -p 70183` was empty and no SkillRegistryApp survived:
          the process DID die, and the assertion still said it had not.

          Reproducibility is environmental in the honest sense -- a JVM under
          SIGTERM on a loaded machine needs more than five seconds, and this
          machine was loaded (16-minute smoke runs, 95% disk). It is not
          environment-CAUSED; the budget was simply too small and the forcible
          path did not wait at all.

      (2) THE ORDERING, which is what turns (1) from an annoyance into a
          coverage hole. Gradle stops the sweep at the first failing task and
          `smoke` is the first graph, so ONE lost race meant 1 graph of 24
          executed and 23 never ran. CLAUDE.md is explicit that graphs do not
          run on push or PR -- "run them locally, that is now the only pre-merge
          graph signal" -- so the only signal there is has a single point of
          failure at position one.

          Stated plainly: `run.py --all` has NOT completed once in this epic.
          Waves 1, 2 and 3 each validated against a hand-picked subset and
          reported that honestly as a subset. The reason it stayed a subset was
          not judgement.
    fixed_here: >
      (1) IS FIXED, by the epic agent, because it is the epic's own instrument
      rather than the product: ServersDown now waits for the reap after
      SIGKILL, the graceful budget is a JVM shutdown budget (20s) rather than a
      guess, and the node timeout was raised with it so the wait cannot merely
      move the failure one level out. The old shape and the measurement are
      recorded in the method's javadoc so the next author does not restore it.

      PROVED BY THE ONLY CONTROL THAT MATTERS HERE: `smoke` went RED, RED, then
      GREEN (BUILD SUCCESSFUL in 16m 47s) with the fix as the only variable, on
      the same machine and the same graph. Two failures before, one pass after.
    still_open: >
      (2) IS NOT FIXED and is the finding that matters. A sweep whose graphs are
      strictly ordered cannot tell you "23 passed, 1 failed"; it tells you
      "stopped at 1", which reads identically to "1 ran". Options the owner may
      want to weigh: --continue on the Gradle invocation so every graph runs and
      the wrapper reports a tally; running the graph set as independent
      invocations; or accepting the chain and requiring the tally artifact
      (graphs_executed, which CI already produces) to be read locally too.
    why_deferred: >
      (2) is a change to the test harness's execution model and to what
      GOAL-validation-floor's metric (a) counts. It is not inside any declared
      HIS slice, and picking between the options above is an owner decision
      about what a local sweep is FOR.
    owner_decision_2026_08_21: >
      At the wave-3 gate the owner set the policy: "--all takes forever. We'll
      do it once at the end with the goal/evals/scorecard." That is recorded as
      the root `validation_policy` block and makes the per-wave subset the
      POLICY rather than a shortfall against one.

      IT ALSO RAISES THIS FINDING'S SEVERITY RATHER THAN RETIRING IT. Running
      the sweep once, at the end, is the right economy and is exactly when a
      chain that stops at its first failure costs the most: there is no earlier
      complete run to fall back on, and a terminal scorecard that dies on graph
      1 is no scorecard, at the moment the epic most needs one. So (2) moves
      from "worth doing" to a PREREQUISITE for HIS-6, and the owner is now
      HIS-6 rather than unassigned.
    evidence:
      - results/epic-home-integrity-sync/probes/wave-3/smoke-failed-twice.txt
    candidate_owner: HIS-6
    status: triaged

  - id: DEF-012
    found_by: wave-3 close-out, upgrading the root home after the v0.24.0 release re-run
    found_at: "2026-08-21"
    severity: major
    escalated: true
    summary: >
      A home's pinned CLI is an absolute VERSIONED path into the Homebrew
      Cellar, so upgrading the very build it pins leaves the home pointing at a
      directory Homebrew has deleted -- and `home verify` calls that home clean.
    detail: >
      MEASURED 2026-08-21, immediately after `brew upgrade skill-manager`
      0.23.0 -> 0.24.0:

        ~/.skill-manager/bin/cli/skill-manager, line 117:
          cli="${SKILL_MANAGER_CLI:-/opt/homebrew/Cellar/skill-manager/0.23.0/libexec/bin/skill-manager}"

        ls /opt/homebrew/Cellar/skill-manager/  ->  0.24.0     (0.23.0 is GONE)
        test -x .../0.23.0/libexec/bin/skill-manager  ->  false

      So the root home's own front door was dangling. And the instrument did
      not notice:

        home verify --home ~/.skill-manager  ->  exit 0
        "every reference in /Users/hayde/.skill-manager resolves, and no path in
         it reaches any other Skill Manager home"

      WHY IT IS BLIND: missingReferencesIn only considers references that fall
      UNDER the home root (underProvisionableRoot). A Cellar path is outside the
      home, so the one reference deciding WHICH BUILD THIS HOME RUNS is not
      checked at all. That scope is defensible for leak detection and indefensible
      for "is this home healthy".
    repaired: >
      `SKILL_MANAGER_HOME=~/.skill-manager skill-manager home shims` rewrote the
      pin to 0.24.0 and the shim runs again. The pre-repair shim was backed up
      first. This is a REPAIR, not a fix: the next `brew upgrade` re-breaks it,
      silently, and nothing will say so.
    why_this_is_two_tickets: >
      HIS-12 (#161) owns the resolution half -- a pin that names one absolute
      build, with no version check, is the same defect as resolveCli's
      unversioned PATH fallback. A pin SHOULD survive an upgrade of the thing it
      pins, or refuse loudly.

      HIS-13 (#159) owns the detection half, and this is the sharpest example
      the epic has produced: `home verify` returning exit 0 on a home whose own
      CLI is gone is precisely "no command can tell a damaged home from a
      healthy one". HIS-13's detection must cover references that leave the
      home, not only those inside it.
    candidate_owner: HIS-12 (resolution) and HIS-13 (detection)
    status: open
    resolution_half_progress: >
      HIS-12 took the BOUNDED part, 2026-08-21, commit 2c9a68f: a remedy no
      longer names a front door that cannot open. LauncherShims.pinnedCliIn
      reads the pin back through the line shape ensure_cli_pin already parses,
      and HomeDescriptor.locateCli skips a home entrypoint whose pinned build is
      gone, carrying which build went missing into the remedy caveat. Worth
      naming: the shim FILE stays executable in that state, which is exactly why
      every reader testing `-x` on it -- resolveCli included -- called the home
      healthy.

      It did NOT take the "a pin should survive an upgrade" half -- how a pin is
      WRITTEN. That is DEF-027, and it is a design change to LauncherShims,
      outside HIS-12's conflict keys and argued against at length in that
      class's javadoc (#61). This entry stays OPEN for HIS-13's detection half,
      which HIS-12 did not touch.

  # HIS-12's findings are 025, 027, 028 — allocated by the epic owner
  # 2026-08-21 to clear collisions: 020 was HIS-9's and 021 is the epic
  # branch's own. The mapping is the owner's, id for id (020->025, 022->027,
  # 023->028); 026 is deliberately unused rather than silently reassigned,
  # because the owner's message allocated it to an entry HIS-12 never had.
  - id: DEF-025
    found_by: HIS-12 (#161, #187), implementing the typed refusal for project sync
    found_at: "2026-08-21"
    severity: minor
    summary: >
      `project sync --rebuild` still tears the realization down BEFORE the
      staged closure is validated. Nothing is lost -- the snapshot puts it back
      -- but the ordering is a rollback where it could be a refusal.
    detail: >
      #187's second claim was that a refused `--rebuild` leaves the home
      emptier than before. VERIFIED AS ALREADY HEALED and now held in place by
      assertions: ProjectSyncUseCase.rebuild captures a
      ProjectRealizationSnapshot before ProjectRemoveUseCase.removeRealization
      and restoreAndRethrows, so a refused rebuild leaves the home
      byte-identical (see probes/his-12/187-before-after.txt).

      What remains is the ORDERING the issue asked for: validate the staged
      closure BEFORE removeRealization, so a doomed rebuild never tears
      anything down at all. Rolling back is strictly weaker than not doing it
      -- a rollback depends on a whole-tree snapshot being complete and
      restorable, and it leaves an empty <store>/tmp scratch directory behind.

      WHY IT IS NOT A DRIVE-BY: the exception can only be raised from
      ProjectDependencyResolver.installMissing, which is reached from
      resolve(), which is what runs AFTER the teardown. Hoisting the check
      means splitting the resolver's staging/install phase from its realize
      phase, or staging the closure twice (which double-downloads). Either is a
      change to what `project sync --rebuild` DOES.
    why_deferred: >
      The HIS-12 plan entry's slice says in terms: "NOT IN SCOPE: changing what
      any of those operations DO." The ticket's four acceptance assertions are
      about the refusal's TYPE and its remedy's TARGET, and all four are met.
      Widening to the resolver's phase structure would be scope the epic did
      not schedule, in the file with the largest blast radius in the project
      surface.
    scope_if_taken: >
      ProjectDependencyResolver.installMissing + ProjectSyncUseCase.rebuild.
      One new assertion: a refused --rebuild removes NOTHING (bindingsRemoved
      == 0, clearedPaths empty, no <store>/tmp scratch dir created), which
      today's rollback cannot satisfy.
    candidate_owner: unassigned
    status: open

  - id: DEF-026
    found_by: HIS-12 (#161), building the per-verb binding guard against HIS-4's branch
    found_at: "2026-08-21"
    severity: major
    summary: >
      HIS-4's three new merge-conflict remedies are CLASS 3 (`sync`) and carry no
      `--home`, so once HIS-4 merges they name a build correctly and a home not
      at all. HIS-12's guard will go red on them, deliberately, and the fix is
      one token per line.
    detail: >
      HIS-4 (#216) routed its new merge-conflict remedies through
      `HomeDescriptor.cliInvocation` rather than emitting a bare token. That is
      right, and it closed a HIS-12 review finding by itself -- the head token is
      now a resolved build, and after HIS-12 it can no longer be a FOREIGN home's
      entrypoint, which was DEF-002's mechanism.

      What it does not do is bind the home. The three lines, verbatim from
      origin/feature/216-his-4 at 39fc823:

        + ", then `" + cli + " sync " + name + "`";
        + " (`git status`), then `" + cli + " sync " + name + "`; or merge by hand "
        + "command retires it; `" + cli + " sync " + name + "` does so now";

      `sync` is a class-3 verb under the per-verb contract (#161): it names no
      home of its own, so a remedy built on it inherits whatever
      SKILL_MANAGER_HOME the reader's shell carries -- unset, the operator's ROOT
      home. That is the same instruction-edits-the-wrong-home defect as DEF-002,
      on a surface that did not exist when DEF-002 was filed.
    why_it_is_filed_and_not_fixed: >
      The lines are on an unmerged branch this ticket cannot edit, and HIS-4
      promotes before HIS-12. Filing it is also not the only mitigation: HIS-12
      ships a source-scan guard that FAILS on exactly these three lines, so the
      defect cannot merge silently. Verified against the pattern, all three
      match, and the class-1 negative (`home sync --from/--to`) is skipped.
    fix: >
      Append ` --home <the home the command operated on>` to each of the three,
      the same way ConsoleProgramRenderer's sync remedy does:
      `spelling.binary() + " sync " + name + " " + spelling.homeArg()`.
      `sync --home` exists (added by HIS-9, and independently by HIS-12).
    expected_signal: >
      After HIS-4 merges and before this is fixed, HomeDescriptorCliRemedyTest's
      "every printed remedy that names a class-2/3 verb also names its home"
      fails and names the three lines. That is the guard working, not a
      regression in HIS-12.
    candidate_owner: HIS-4 (the lines) — or whoever resolves the wave-4 merge
    status: closed
    resolution: >
      FIXED 2026-08-21 by HIS-12, which is "whoever resolves the wave-4 merge":
      HIS-4 merged, HIS-12 is last in promotion order, and the guard turned the
      three lines into a BUILD FAILURE on the integrated tip -- so they could
      not be left for later without leaving the epic red.

      The guard fired exactly as this entry predicted:

        [FAIL] every printed remedy that names a class-2/3 verb also names its
        home: expected <[]> but was <[ReportUseCase.java: + cli + " sync " +
        name + "`", ReportUseCase.java: + cli + " sync " + name + "`…]>

      `ReportUseCase.mergeConflictRemedy` now builds ONE `syncRemedy` string
      carrying `--home`, used at all three sites, rather than three
      concatenations that have to remember. Nothing else about the remedies
      changed, and HIS-4's spelling of the CLI -- the part that closed DEF-002
      on this surface -- is untouched.

  - id: DEF-027
    found_by: HIS-12 (#161), taking the bounded half of DEF-012
    found_at: "2026-08-21"
    severity: major
    summary: >
      A home's pin is still WRITTEN as an absolute versioned Cellar path, so
      the next `brew upgrade` re-breaks every home that pins a Homebrew build.
      HIS-12 stopped remedies from NAMING a dangling pin; it did not stop pins
      from dangling.
    detail: >
      DEF-012 measured the breakage; its resolution half asked that "a pin
      SHOULD survive an upgrade of the thing it pins, or refuse loudly."

      WHAT HIS-12 TOOK (bounded, and shipped in 2c9a68f): the "refuse loudly"
      half at the REMEDY surface. LauncherShims.pinnedCliIn reads the pin back
      through the line shape ensure_cli_pin already parses, and
      HomeDescriptor.locateCli now SKIPS a home entrypoint whose pinned build
      is gone, carrying which build went missing into the remedy's caveat. A
      remedy no longer names a front door that cannot open. Note the shim
      itself was ALWAYS executable in that state, which is why every reader
      testing `-x` on it -- including resolveCli -- called the home healthy.

      WHAT IT DID NOT TAKE: the "survive an upgrade" half. `home shims` pins
      RunningCli.locate()'s answer verbatim, and for a Homebrew install that is
      /opt/homebrew/Cellar/skill-manager/<version>/libexec/bin/skill-manager.
      Pinning /opt/homebrew/bin/skill-manager instead -- the symlink Homebrew
      re-points on upgrade -- would survive, at the cost of the property
      LauncherShims exists to hold: "this home runs the build it was
      provisioned with", not "whatever is installed under this name now". That
      is a real design decision with a real tradeoff and it belongs to whoever
      owns LauncherShims, which is not in HIS-12's conflict keys.
    why_deferred: >
      Changing how a pin is written changes what `home shims` DOES for every
      home on every machine, and the argument for the current behaviour is
      written out at length in LauncherShims' class javadoc (issue #61). It
      should be decided against that argument, not around it.
    relation_to_def_012: >
      DEF-012 remains open for its detection half (HIS-13): `home verify`
      returning exit 0 on a home whose own CLI is gone, because
      missingReferencesIn only considers references UNDER the home root. HIS-12
      changes nothing there. DEF-027 is the third piece: the writing half.
    candidate_owner: unassigned (LauncherShims / release packaging)
    status: open

