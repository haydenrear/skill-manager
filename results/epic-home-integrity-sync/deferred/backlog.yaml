    candidate_owner: HIS-13
    related: [DEF-012]
    status: open

  - id: DEF-016
    filed_by_ticket: HIS-4
    short_label: "HIS-4: `project sync` and `publish` are a third and fourth reader of the dirty question"
    found_by: adversarial review of #231 (MED-6), confirmed by HIS-4
    found_at: "2026-08-21"
    severity: major
    summary: >
      HIS-4 made the two sync handlers in `effects` agree about what "local
      work" means. There are TWO MORE readers outside that package, one of which
      operates on exactly the tier HIS-4 is about, and HIS-4's own guard cannot
      see either of them.
    detail: >
      MEASURED 2026-08-21 on this branch.

      (3) `UnitTrunkPull:187` -- the `project sync` path:

            if (GitOps.hasWorktreeChanges(repo) && !opts.merge()) { ... HELD_BACK }

          and `pullTarget(unit, childStore, materializer)` returns THE CHILD
          HOME'S OWN CHECKOUT for CHECKOUT-mode units. So a materialized child
          copy -- the exact subject of this ticket -- is held back on every
          `project sync`, forever, with the message "local changes in <repo>;
          re-run with --merge to three-way merge them". That is HIS-4's defect,
          untouched, on the command a project agent actually runs.

      (4) `UnitPublisher:169`:

            boolean dirty = GitOps.hasWorktreeChanges(repo);

          read as "there is local work to commit". From a child home the
          dereferenced store link IS that "local work", so publish would COMMIT
          THE MATERIALIZATION ARTIFACT UPSTREAM -- a deletion of the tracked
          symlink, pushed to the unit's own repository, from a home that only
          ever dereferenced it locally.

      Two further callers read the same predicate legitimately and are NOT part
      of this finding -- `ProjectLibResolver:152` and
      `ChildHomeMaterializer:537` ask "has this working tree changed at all",
      which is a real and different question from "is there work here a sync
      would destroy".
    why_the_guard_does_not_catch_it: >
      SyncPathsAgreeAboutDirtyTest is scoped to
      src/main/java/dev/skillmanager/effects. Its first javadoc claimed it
      "fails on the FOURTH handler nobody has written"; review measured that as
      wrong twice over, because the third and fourth already exist and live
      outside the scanned package. The javadoc has been corrected to say what
      the scan cannot see, and a fourth case now asserts the ledger of
      out-of-scope callers, so this finding cannot silently drift.
    why_deferred: >
      `project sync` and `publish` are different surfaces with their own
      semantics -- publish in particular needs a decision about what SHOULD
      happen when a child home publishes a unit it has dereferenced, and the
      answer is plausibly "refuse and say why" rather than "ignore the path".
      That is a design question, not a mechanical application of HIS-4's
      predicate, and widening this ticket to make it would be the third time
      this epic turned one bug into three.
    candidate_owner: unassigned
    status: open
    evidence:
      - src/test/java/dev/skillmanager/source/SyncPathsAgreeAboutDirtyTest.java
  - id: DEF-017
    found_by: HIS-9, placing the write-confinement guard
    found_at: "2026-08-21"
    severity: major
    summary: >
      There is no filesystem choke point to hang confinement on. 173 direct
      `java.nio.file.Files` mutation call sites bypass `Fs`, and `Fs` cannot be
      made the choke point without breaking the server build.
    detail: >
      HIS-9's slice says "every filesystem write that claims to be into this
      home passes through one place". There is no such place, and the obvious
      candidate cannot become one.

      MEASURED on this branch:

        grep -rn "Files\.(write|createDirect|copy|move|delete|createSymbolicLink
                 |newOutputStream|createFile)" src/main/java | wc -l   ->  173

        top packages: bindings 33, effects 27 (26 of them in LiveInterpreter
        alone), project 24, shared/util 15, cli/installer 15, store 14

      `dev.skillmanager.shared.util.Fs` covers recursive delete (50 call sites),
      recursive copy (19), ensureDir (89) and chmod (13) -- and carries NO
      write, NO move and NO createSymbolicLink at all. So the shims, the lock
      files and the projections, which is where the mutation actually is, do not
      go through it.

      AND IT CANNOT SIMPLY BE WIDENED. `SkillManagerServer.java` compiles
      `shared/util/Fs.java` STANDALONE (`//SOURCES` lines 11-13, alongside
      Archives and BundleMetadata only). `shared/` imports nothing from
      `dev.skillmanager` today -- verified, zero hits. Adding a
      `dev.skillmanager.store.WriteConfinement` import to Fs would break the
      server build, so the guard cannot live behind Fs without either moving Fs
      or moving the guard into `shared/`.
    what_his_9_did_instead: >
      Enforced at the sites where the measured damage happened --
      CliShimPruner.prune, InstallerRegistry.takeOwnershipOfShim, and the
      producer boundary in InstallerRegistry.installOne -- and said so, in
      WriteConfinement's javadoc and in the goal contribution, rather than
      implying general coverage.

      CORRECTED AFTER REVIEW: an earlier version of this entry also named
      "the effect boundary in LiveInterpreter.execute" as an enforcement site.
      It was not one. It DECLARED a scope that every enforcement site already
      re-derived for itself, a vacuity check measured that removing it reddened
      nothing, and it has since been deleted rather than left as
      enforcing-looking API. That is the SECOND time this ticket wrote that
      claim down (the first was in WriteConfinement's own javadoc, corrected in
      its own commit), which is worth more than the claim: "declares" and
      "enforces" read alike six weeks later, and only a caller count tells them
      apart.

      ALSO CORRECTED: this entry must not be read as saying Fs.deleteRecursive
      is unsafe. It is not. It deletes a symlink LEAF without following it
      (Files.isSymbolicLink -> Files.delete), so the prune's recursive delete
      does the right thing; the DEF-007 defect was in the DIRECTORY the entries
      were listed from, not in the deletion of each entry. Fs is named here only
      because it is not a choke point, not because it is wrong.
    why_deferred: >
      Routing 173 call sites through a facade is a mechanical change with a very
      wide blast radius across bindings, projections and the project surface --
      every one of which writes outside the home legitimately, so each site needs
      its roots DECIDED, not just rewritten. That is a ticket, not a drive-by,
      and doing it inside HIS-9 would have buried the four real fixes in it.
    recommendation: >
      For the owner: decide whether the follow-up is (a) a `HomeFs` facade in
      `store/` that the home-writing paths adopt incrementally, or (b) moving
      `WriteConfinement` into `shared/util` so `Fs` itself can consult it. (b) is
      one commit and gives 171 delete/copy/mkdir sites coverage immediately; it
      costs putting home-shaped policy in the package that is deliberately
      dependency-free and shared with the server.
    candidate_owner: unassigned
    status: open

