tickets:
- id: HIS-1
  title: copyUnit holds back a tree it can see is identical, because it asks the record instead of the
    source
  phase: HIS
  status: delivered
  epic: home-integrity-sync
  github_issue: 214
  wave: 1
  depends_on: []
  blocks:
  - HIS-4
  - HIS-5
  - HIS-6
  promotion_order: 1
  promotion_predecessor: null
  conflict_keys:
    production:
    - ChildHomeMaterializer.copyUnit
    - ChildHomeMaterializer.Disposal
    tla: []
    adapters: []
    test_graph:
    - home-integrity/ForeignRecordDoesNotHoldBackAnIdenticalTree
    workflow_data: []
  objective: 'MEASURED on the operator''s real homes: 16 of 18 per-unit materialization records name a
    `source` that is not the root store, and all 18 are pristine by their own digest. Every one is held
    back on every sync, printing a five-line paragraph about work that "may exist nowhere else" -- over
    trees nobody has touched. Six of the 16 name a path that no longer exists at all: two deleted ticket
    worktrees, and one /private/tmp scratchpad from a past evaluation session.

    The root home is INSTALLED into and carries no per-unit record, so `sourceHeldTheseBytes` is unavailable;
    the destination''s own record names a worktree rather than this store, so `recordIsAboutThisSource`
    is false; `disposable()` is therefore false and copyUnit() refuses.

    '
  root_cause: "NOT the one issue #214 proposes. #214 asks for a \"root owns these bytes\" re-baselining\
    \ path, which invents provenance -- exactly the move `sourceHeldTheseBytes`'s own javadoc argues against,\
    \ at length, as the thing that would persist and be read as licence by the next reconcile in either\
    \ direction.\nThe actual defect is a divergence between two paths this file already declares must\
    \ agree. `reconcile()` -- the `home sync` path -- answers three questions from evidence on disk BEFORE\
    \ it consults any record:\n\n  ChildHomeMaterializer.java:1164  src.digest().equals(dst.digest())\n\
    \  ChildHomeMaterializer.java:1168  gitTwinsDifferOnlyInBookkeeping(source, dest)\n  ChildHomeMaterializer.java:1174\
    \  gitSourceIsBehind(source, dest)\n\n`copyUnit()` -- the `project resolve` / root-sync path -- has\
    \ NONE of them. It computes currentDigest at :2173 and hands it straight to disposal(). `gitTwinsDifferOnlyInBookkeeping`\
    \ has exactly one caller in the codebase, at :1168.\nSo the comment at :2181 -- \"`home sync` and\
    \ `project resolve` read the same value or they eventually disagree about the units that matter, which\
    \ is what CHM-15 was\" -- is false again, in the opposite direction. home sync says UNCHANGED where\
    \ copyUnit says HELD_BACK.\n"
  slice: 'Give the baseline rule its THIRD showing, the one that needs no record at all: the source is
    standing on exactly these bytes RIGHT NOW. Where that holds, refreshing is a byte-identical no-op,
    so nothing can be destroyed -- whatever either record says, and whether or not the recorded source
    still exists. Route copyUnit through the same three answers reconcile() already gives, from one shared
    function, so the next divergence is a compile error rather than a paragraph.

    Do NOT write a baseline into the record-less destination. Nothing is written by this showing; it is
    a question asked and answered from evidence already on disk, once, per pass.

    '
  acceptance:
    assertions:
    - A unit byte-identical to the live source outside .git reconciles silently, whatever its record names.
    - A unit whose content genuinely differs is still held back, with the message unchanged.
    - copyUnit and reconcile answer the disposability question through ONE function, not two.
    - No record is written by the new showing.
  goals:
  - goal: GOAL-no-spurious-holdback
    contribution: direct
    expected_effect: 16 of 18 held back -> 0, with the divergent-fixture clause still refusing
    local_signal: python skills/test_graph/scripts/run.py home-integrity
  - goal: GOAL-sync-quiet
    contribution: enabling
    expected_effect: none on its own -- removes 16 five-line paragraphs, which is most of the non-diff
      noise HIS-2 then bounds
    local_signal: 'N/A: enabling'
- id: HIS-2
  title: DriftReport.render() prints every changed path, and re-prints it on every pass
  phase: HIS
  status: delivered
  epic: home-integrity-sync
  github_issue: 212
  wave: 1
  depends_on: []
  blocks:
  - HIS-3
  - HIS-5
  - HIS-6
  promotion_order: 2
  promotion_predecessor: HIS-1
  conflict_keys:
    production:
    - DriftReport.render
    - ProjectSyncUseCase.sync
    - ExecCommand.launchGate
    - HomeCommand.drift
    tla: []
    adapters: []
    test_graph:
    - home-integrity/DriftReportIsBounded
    workflow_data: []
  objective: 'MEASURED: the root home''s pending drift record is 87,054 bytes over 7 units. DriftReport.render()
    emits one line per changed file -- 889 lines, ~87,208 characters, ~21,800 tokens -- and re-emits them
    on every `project sync`, every `exec` launch gate, and every `home drift`. One unit, spec-double-compiler,
    is 776 of the 889.

    The per-unit SHA-256 the report wants already exists as HomeDigest.UnitDigest.digest(); DriftReport
    keeps the file lists and throws the digest away.

    '
  slice: 'Collapse the default surface to at most one line per changed unit -- unit, kind, change, short
    digest, changed-file COUNT -- plus one total line. Keep the full per-file list reachable and unchanged
    behind --json and the detail surface. This is a default, not a deletion: an operator who wants the
    paths must still be able to get exactly the paths they get today.

    '
  note: 'spec-double-compiler''s 776 "removed files" are the dereferenced in-unit symlink trees being
    read as deletions -- HIS-4''s subject. Do not fix that here. Bound the report; let HIS-4 remove the
    cause. If bounding it makes the 776 invisible before HIS-4 lands, say so in the PR, because a number
    that disappears from view is not a number that got smaller.

    '
  acceptance:
    assertions:
    - The committed baseline fixture renders in at most 10 lines.
    - Character count over that fixture falls by at least 99%.
    - --json output over the same fixture is byte-identical to today's.
  goals:
  - goal: GOAL-sync-quiet
    contribution: direct
    expected_effect: 889 lines / 87,208 chars -> <=10 lines, >=99% char reduction, over the committed
      fixture
    local_signal: python skills/test_graph/scripts/run.py home-integrity
- id: HIS-3
  title: the drift gate re-fires instead of settling -- the safety is right, the re-emission is not
  phase: HIS
  status: delivered
  epic: home-integrity-sync
  github_issue: 213
  wave: 2
  depends_on:
  - HIS-2
  blocks:
  - HIS-5
  - HIS-6
  promotion_order: 3
  promotion_predecessor: HIS-2
  conflict_keys:
    production:
    - DriftGate.record
    - DriftGate.recordSince
    - ExecCommand.launchGate
    - ProjectSyncUseCase.sync
    tla:
    - HomeIntegrityInternal.AcknowledgeCurrentDigest
    adapters: []
    test_graph:
    - home-integrity/AckIsStable
    workflow_data: []
  objective: 'A sync records drift; the next sync or launch finds the pending gate and re-warns or refuses
    with exit 8; nothing retires the record except an explicit `home drift --ack`. DriftGate.record()
    returns the EXISTING pending gate even when the incoming report is empty (DriftGate.java:86), so a
    pass that changed nothing still hands its caller an unacknowledged gate.

    '
  why_the_intent_is_load_bearing: 'This is deliberate and the rationale is written down at DriftGate.java:39-49:
    a gate that cleared when the digest was refreshed would let the SECOND recompute report "nothing to
    acknowledge" while the change from the FIRST sync was still unread. That was reproduced as a false
    pass -- prune_did_not_destroy_the_agent_edit failed while child_home_holds_only_claimed_or_held_back_units
    passed vacuously.

    So the ticket is NOT "clear the gate on refresh". Do not weaken the safety to make the noise stop.

    '
  slice: 'Separate FIRST surfacing from SUBSEQUENT surfacing of the same unacknowledged gate. First is
    the full (now bounded, per HIS-2) report. Second and later, with no new change between them, is one
    line: the count still unread and the ack command. A genuinely new change re-opens the full report
    and still gates the next launch.

    '
  design_decision_to_make_before_coding: 'THERE IS NO FIELD TODAY THAT DISTINGUISHES THE TWO. home.drift.json
    carries detectedAt, operation, acknowledged, acknowledgedAt and the report; nothing records that a
    pass has SHOWN this gate. So "second surfacing" is not observable yet, and the ticket must choose
    how it becomes observable. Two routes, and they are not equivalent:

    (a) A PERSISTED MARKER on the gate -- surfacedAt / surfacedCount. Works across processes, which is
    the case that actually bites: `exec` refuses, the operator runs `home drift`, then `exec` again, and
    those are three processes. It is a schema change to home.drift.json, so it needs a schema version
    and a decision about what an old record without the field means (proposal: absent == not yet surfaced,
    which degrades to today''s behaviour rather than to silence). It also touches ack/re-pend, which AckIsNotStaleOnArrival
    constrains -- a marker that survives an ack would let a re-pended gate open collapsed.

    (b) A CALL-SITE DISTINCTION -- the caller decides, from whether the incoming report added anything,
    whether this is a re-read. Writes no new state and cannot get stale, but it is per-process: it collapses
    nothing across the exec -> drift -> exec sequence above, which is the sequence the complaint is about.

    Write the choice and its reason into the ticket before any code. Recording it here because a decision
    made silently inside an implementation is the one nobody can review, and this one changes a persisted
    schema.

    '
  merge_interaction: 'DriftGate.record() MERGES a new report into the pending one and rewrites the gate
    (DriftGate.java:87-95), so "a genuinely new change" and "the same gate again" are the same record,
    differing only in content. Whichever route above is taken must define change against the UNION, not
    against the record''s existence. The two failure modes to test for, both plausible: a gate that stays
    collapsed across a real new change (the safety this ticket must not break), and one that never collapses
    at all (the drag it exists to remove).

    '
  acceptance:
    assertions:
    - Second and later surfacing of one unacknowledged gate is a single line.
    - A new unseen change still gates a launch and still exits 8.
    - The regression DriftGate.java:39-49 cites is still caught.
  goals:
  - goal: GOAL-gate-settles
    contribution: direct
    expected_effect: full report every pass -> full once, one line thereafter; exit-8-on-new-change unchanged
    local_signal: python skills/test_graph/scripts/run.py home-integrity
  - goal: GOAL-sync-quiet
    contribution: guard
    expected_effect: must not reintroduce per-file output on any surface
    local_signal: python skills/test_graph/scripts/run.py home-integrity
