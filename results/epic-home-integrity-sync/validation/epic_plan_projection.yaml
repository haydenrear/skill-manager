    This is not a tidiness ticket. It is the direct cause of two wrong root-cause diagnoses in this epic''s
    own wave 2, and the next agent will make the third.

    '
  slice: "State the contract ONCE, in skt, as a references page -- skt is the session-start front door\
    \ and the one unit every agent is told to read. It must answer, in the agent's order of need:\n\n\
    \  - what a derived artifact is, and that `artifacts list` names them;\n  - what a clone INHERITS\
    \ (the parent's artifacts, on PATH, usable) and\n    what it DECLARES rather than builds -- and why\
    \ building unchanged\n    artifacts is waste;\n  - when to rebuild: after YOU change the unit, not\
    \ on arrival;\n  - the exact command, `skill-manager build <artifact-id>`, and how to\n    read `artifacts\
    \ stale`.\n\nThen skill-manager, git-issue-workflow and git-epic-workflow LINK to it. They must not\
    \ restate it: a copy is covered by nothing and will drift, which is the rule this epic already applies\
    \ to judged rubrics.\n"
  change_management: 'Four separate repositories. Edits go through the home and reach their units by `skt
    publish` (home sync one tier up, then unit publish), not by this epic''s branch -- the epic''s own
    PR carries nothing from a gitignored home. Sequence leaf-to-parent per CLAUDE.md, and record each
    published unit''s commit in the ticket evidence so the terminal evaluation can re-read exactly what
    was published.

    '
  acceptance:
    assertions:
    - The contract is stated once, in skt, and the other three link rather than restate.
    - A fresh agent given only the docs answers what an artifact is, what a clone inherits versus declares,
      and when to rebuild.
    - The page states the LAZY contract explicitly, including why an eager rebuild is waste -- both wrong
      answers this epic produced are named and closed off.
    - Each touched unit is published and its commit recorded.
  goals:
  - goal: GOAL-mechanism-documented
    contribution: direct
    expected_effect: '0 md files documenting the contract -> stated once and linked from the four units
      that instruct agents about homes; judged read answers all three questions

      '
    local_signal: uv run .github/scripts/check-docs-coverage.py
- id: HIS-9
  title: nothing refuses a write outside the home SKILL_MANAGER_HOME names -- the class behind repeated
    root-home damage
  phase: HIS
  status: planned
  epic: home-integrity-sync
  github_issue: 226
  added_in_schedule_revision: 4
  wave: 4
  depends_on:
  - HIS-7
  blocks:
  - HIS-11
  - HIS-13
  - HIS-5
  - HIS-6
  - HIS-8
  promotion_order: 7
  promotion_predecessor: HIS-4
  conflict_keys:
    production:
    - LiveInterpreter.writeGuard
    - SkillEffect
    - InstallerRegistry.installOne
    tla: []
    adapters: []
    test_graph:
    - home-integrity/ParentHomeSurvivesAChildBuild
    workflow_data: []
  found_by: 'HIS-7, twice, on the operator''s real root home -- and the second time while measuring the
    first. A producer in a cloned home wrote through an inherited symlink into ~/.skill-manager/bin/cli/computeq
    and tlc2. tlc2 survived because its shim is BIN_DIR-relative; computeq was rewritten with scratchpad
    paths and had to be repaired by hand.

    '
  root_cause: "HIS-7 FIXED ONE INSTANCE. THIS IS THE CLASS.\n`rebuildCliArtifact` now takes ownership\
    \ of the one shim it is about to write, so that path is closed. Nothing generalises it. A producer\
    \ is an arbitrary script handed $SKILL_MANAGER_BIN_DIR and $SKILL_MANAGER_HOME; it may write anywhere\
    \ the process can write, and no layer between the effect and the filesystem asks whether the destination\
    \ is inside the home the command was given. Every new producer, every new effect and every new output\
    \ root is a fresh chance to be wrong, and root is the tier with no tests, so it is where being wrong\
    \ is discovered last.\nThree known instances, all live:\n  (1) a producer following an inherited symlink\
    \ out of the home -- fixed\n      for cli-shim rebuilds only;\n  (2) a home's PINNED bin/cli/skill-manager\
    \ rebinding SKILL_MANAGER_HOME to\n      its own home, so `SKILL_MANAGER_HOME=<x> <y>/bin/cli/skill-manager`\n\
    \      edits y, not x (this is why scratch homes must be driven with the raw\n      build);\n  (3)\
    \ bootstrap-home.sh and skt resolving their CLI from the ROOT home, so\n      a worktree bootstrap\
    \ runs a root-pinned binary.\n"
  slice: 'A write-confinement guard at the effect boundary: an effect declares the roots it may write
    under, and a write outside every declared root is REFUSED with the offending path and the home it
    escaped, not logged. Producers run with the guard in force. Instance (2) is in scope -- the pinned
    shim must honour an explicitly-set SKILL_MANAGER_HOME or refuse and say which home it would have edited.
    Instance (3) is a REPORT, not a fix: those live in git-issue-workflow and skt, and reaching them is
    HIS-8''s publish path. NOT IN SCOPE: repairing a home already damaged -- that is HIS-13.

    '
  acceptance:
    assertions:
    - A producer that writes outside the home is refused, and the refusal names the path and the home.
    - The refusal is proved by a fixture that PASSES when the guard is removed -- vacuity checked, in
      writing.
    - '`SKILL_MANAGER_HOME=<x> <y>/bin/cli/skill-manager home describe` reports x or refuses; it never
      silently reports y.'
    - A legitimate write into a sanctioned parent store (an inherited toolchain a child is allowed to
      read) is not broken by the guard.
    - The root tier is covered, not just project and worktree.
  goals:
  - goal: GOAL-no-destructive-recovery
    contribution: direct
