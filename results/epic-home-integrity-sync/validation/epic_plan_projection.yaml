- id: HIS-10
  title: a clone records no durable descent, so three readers give three answers and its first sync discards
    the inherited toolchain
  phase: HIS
  status: next
  epic: home-integrity-sync
  github_issue: 227
  also_closes:
  - 206
  added_in_schedule_revision: 4
  wave: 3
  depends_on:
  - HIS-7
  blocks:
  - HIS-13
  - HIS-4
  - HIS-5
  - HIS-6
  - HIS-8
  promotion_order: 5
  promotion_predecessor: HIS-7
  conflict_keys:
    production:
    - HomeCloner.sanctionedParentShim
    - HomeCloner.verifyRoots
    - ChildHomeLink.isChildOf
    - CliShimPruner
    - CliArtifact.usableInHome
    tla: []
    adapters: []
    test_graph:
    - home-integrity/EveryShimResolves
    workflow_data: []
  found_by: 'HIS-7''s adversarial review (findings HIGH-3, MED-4, MED-6, MED-7), then MEASURED end to
    end on 2026-08-21 against epic tip 23e35c7. Evidence in results/epic-home-integrity-sync/probes/his-10/.

    '
  root_cause: "A CLONE IS A GRANDCHILD THAT RECORDS NOTHING ABOUT ITS DESCENT.\nThe project home is a\
    \ REGISTERED CHILD of root: root holds child-homes/<id>/child-home.json, so ChildHomeLink.isChildOf\
    \ can answer yes and the five bin/cli symlinks into root are sanctioned parent-store shims. A worktree\
    \ home is a COPY of the project home. Nothing in the copy records that it descends from a home whose\
    \ parent is root. So every reader that needs \"is this foreign path sanctioned\" has to guess, and\
    \ they guess differently:\n\n  home clone            clean -- \"no path in it reaches another home\"\
    \n  home verify           exit 1 -- 5x FOREIGN_HOME\n  home verify --against exit 0 -- \"5 sanctioned\
    \ parent-store shim(s)\"\n  sync                  PRUNES all five, \"not this home's parent store\"\
    ,\n                        then spends ~90s re-provisioning five toolchains\n\nFour readers, three\
    \ answers, one home, same five paths. The only thing that makes the sanction visible is an operator\
    \ typing --against, which is a flag, not a fact.\nTHE SYNC BEHAVIOUR IS THE EXPENSIVE ONE and it contradicts\
    \ the contract the owner stated for HIS-7: \"we clone, then we say, here are the artifacts for these\
    \ skills on the path for you, and here is how you rebuild them if you make a change. Why would we\
    \ build them without the agent changing?\" Today every worktree rebuilds five toolchains nobody touched,\
    \ on its first sync, silently.\nSECOND HALF, #206: the verdict is not even spelling-invariant. HomeCloner.verifyRoots\
    \ resolves the destination root (`realOrSame(dstRoot)` at :1635) for the symlink branch but hands\
    \ the UNRESOLVED spelling to the provisioned-file branch (`missingReferencesIn(file, dstRoot)` at\
    \ :1691), and destReferences (:1428) does a raw `text.indexOf(dstRoot.toString())`. On any machine\
    \ where the home is reached through a symlink -- /var -> /private/var, a symlinked $HOME or checkout,\
    \ which is every macOS temp path -- that branch reports clean WITHOUT HAVING CHECKED. HomeFixpointLaw\
    \ is the post-condition of 22 graphs, so the assertion is currently blind there. CliArtifact.usableInHome\
    \ does the same string walk.\n"
  slice: '(1) PROVENANCE. A clone records its descent durably -- what it was cloned from, and what that
    home''s parent store is -- so the sanction is a fact in the copy rather than a flag on the command
    line. Every reader answers from that one record. (2) SPELLING. Resolve the home root ONCE and hand
    the same spelling to every branch, in HomeCloner.verifyRoots and CliArtifact.usableInHome. (3) THE
    PRUNER. CliShimPruner stops deleting an inherited shim that the provenance record sanctions. The clone
    keeps it on PATH and DECLARES it, per the lazy contract. NOT IN SCOPE: the write-confinement guard
    (HIS-9), and repairing homes already pruned (HIS-13).

    '
  acceptance:
    assertions:
    - All four readers give the SAME verdict on one cloned home, with no --against flag.
    - A clone's first sync leaves its inherited parent-store shims in place, and provisions nothing that
      was already provided.
    - The reader-agreement assertion FAILS when the provenance record is removed -- vacuity checked, in
      writing.
    - A home reached through a symlinked path verifies identically to the same home reached through its
      real path, and that assertion fails when the resolution is removed.
    - 'A copy of an UNSANCTIONED home is still unsanctioned: cloning is not a laundering step. The existing
      HomeCloner guard for this must still pass.'
    - '`--against` no longer decides the answer; it may still explain it.'
  goals:
  - goal: GOAL-one-home-one-answer
    contribution: direct
    expected_effect: four readers, three answers -> four readers, one answer, and spelling-invariant
    local_signal: python skills/test_graph/scripts/run.py home-integrity
  - goal: GOAL-home-invariants
    contribution: direct
    expected_effect: an invariant that a home's sanction set is a function of its recorded descent, not
      of the command line
    local_signal: jbang RunTests.java
- id: HIS-11
  title: compensation for CommitUnitsToStore is delete-only, so a failed install destroys the bytes it
    overwrote
  phase: HIS
  status: planned
  epic: home-integrity-sync
  github_issue: 186
  added_in_schedule_revision: 4
  wave: 5
  depends_on:
  - HIS-9
  blocks:
  - HIS-5
  - HIS-6
  - HIS-8
  promotion_order: 9
  promotion_predecessor: HIS-12
  conflict_keys:
    production:
    - Executor.preStateCompensations
    - HomeLock
    tla: []
    adapters: []
    test_graph: []
    workflow_data: []
  found_by: revision-4 sweep of open issues against the owner's all-home-bugs instruction
  root_cause: 'Executor.java:307 -- `case SkillEffect.CommitUnitsToStore e -> List.of();` An EMPTY pre-state
    compensation, in an exhaustive switch, for the one effect that overwrites bytes already in the home.
    The commit deletes the destination and copies the new tree in; the walk-back then deletes what it
    finds and restores nothing, because nothing was captured. A publish or resolve that fails partway
    into a NON-EMPTY home therefore leaves that unit absent rather than as it was. The severity scales
    with the tier: root is the home with the most installed units and the least test coverage.

    Second half, from the same issue: no HomeLock on the resolve/install path, so two concurrent resolves
    interleave staging and commit. That is squarely per-home isolation and belongs with the first half
    rather than after it.

    '
  slice: 'Capture the pre-image before the destructive commit and restore it on walk-back; take the home
    lock for the resolve/install path. NOT IN SCOPE: any other effect''s compensation, and the compensation
    FRAMEWORK''s shape.

    '
  acceptance:
    assertions:
    - A resolve that fails after CommitUnitsToStore leaves every previously installed unit byte-identical
      to what it was.
    - That assertion FAILS when the move-aside is removed -- vacuity checked, in writing.
    - Two concurrent resolves into one home do not interleave; the second waits or refuses, and says which.
    - The pre-image is cleaned up on success, so the guard does not grow the home without bound.
  goals:
  - goal: GOAL-no-destructive-recovery
    contribution: direct
    expected_effect: 0 pre-existing unit bytes survive a failed install -> all of them survive
    local_signal: jbang RunTests.java
- id: HIS-12
  title: a refusal names a home you were not in and a build that cannot run the remedy, and project sync
    loses the typed refusal entirely
  phase: HIS
  status: planned
  epic: home-integrity-sync
  github_issue: 161
  also_closes:
  - 187
  added_in_schedule_revision: 4
  wave: 4
  depends_on:
  - HIS-7
  blocks:
  - HIS-5
  - HIS-6
  - HIS-8
  promotion_order: 8
  promotion_predecessor: HIS-9
  conflict_keys:
    production:
    - HomeDescriptor.resolveCli
    - HomeDescriptor.cliSpelling
    - ProjectCommand.SyncCmd
    tla: []
    adapters: []
    test_graph: []
    workflow_data: []
  found_by: '#161 and #187 from the revision-4 sweep, joined to DEF-002 from this epic''s own kickoff
    -- three faces of one surface, the refusal a home operation prints.

    '
  root_cause: 'A REMEDY IS AN INSTRUCTION, AND THESE ONES EDIT A DIFFERENT HOME THAN THE ONE YOU WERE
    IN.

    HomeDescriptor.resolveCli (:379-395) falls through to `onPath( "skill-manager")` with no version check,
    so the printed remedy names an absolute path to whatever build PATH happened to find -- often an older
    release that cannot run the remedy it is being named in. Step 2 of that same precedence (the current
    process) is DEAD in every shipped launcher, because the process basename is jbang or java, so the
    javadoc''s stated precedence is false as well.

    DEF-002 is the same defect landing on the operator: a sync run against the PROJECT home prints `re-run
    with: /Users/hayde/.skill-manager/bin/cli/skill-manager sync <unit> --merge`. Following that verbatim
    edits the ROOT home.

    #187 is the same surface losing its type: ProjectCommand.ResolveCmd catches ProjectImportViolationException
    (:166) and renders it; SyncCmd does not, so the identical failure arrives as an untyped IOException
    with a generic exit.

    '
  slice: 'Make the refusal name the home it is about and a build that can run it: mark the PATH-fallback
    case rather than presenting it as authoritative, correct the javadoc''s precedence, spell the remedy
    against the home the command was given, and give SyncCmd the typed catch ResolveCmd already has. NOT
    IN SCOPE: changing what any of those operations DO.

    '
  acceptance:
    assertions:
    - A remedy printed by a command run against home X names X, never another home.
    - A remedy resolved by the PATH fallback says so, rather than reading as authoritative.
    - '`project sync` renders a ProjectImportViolationException with the same typed output and exit code
      as `project resolve`.'
    - The javadoc's stated precedence matches what the code does, proved by a test that walks it.
  goals:
  - goal: GOAL-one-home-one-answer
    contribution: direct
    expected_effect: 'the remedy surface joins the readers that agree: a printed command names the home
      the operator was in

      '
    local_signal: jbang RunTests.java
- id: HIS-13
  title: no command can tell a damaged home from a healthy one, so homes already damaged stay damaged
  phase: HIS
  status: planned
  epic: home-integrity-sync
  github_issue: 159
  added_in_schedule_revision: 4
  wave: 5
  depends_on:
  - HIS-9
  - HIS-10
  blocks:
  - HIS-5
  - HIS-6
  - HIS-8
  promotion_order: 10
  promotion_predecessor: HIS-11
  conflict_keys:
    production:
    - HomeCommand.repair
    - HomeCloner.verifyRoots
    tla: []
    adapters: []
    test_graph:
    - home-integrity/EveryShimResolves
    workflow_data: []
  found_by: '#159 from the revision-4 sweep, and confirmed against this epic''s own history: the operator''s
    root home was damaged TWICE during HIS-7 and both times the damage was found by an agent noticing
    an odd path in a file, not by any command.

    '
  root_cause: 'EVERY OTHER TICKET IN THIS EPIC PREVENTS. NOTHING REPAIRS.

    HIS-9 stops the next out-of-home write; HIS-10 stops the next clone from pruning its toolchain; neither
    helps a home that already took the damage. HomeCommand ships clone, verify, describe, policy, shims,
    drift, sync, close-out and refresh-plugins -- and nothing that repairs. 0.20.0 (#159) repointed and
    deleted other homes'' agent skill links; the causes are fixed and the damage is not. `home verify`
    finds SOME of it (a link that does not resolve) and none of the rest (a shim rewritten with another
    home''s absolute paths, which resolves fine and is simply wrong).

    '
  slice: 'Detection then repair: name what is damaged in a home -- mis-anchored agent skill links, shims
    whose content points into another home, entry points pruned that the provenance record says were inherited
    -- and repair it idempotently. The repair must be able to run against the ROOT home, since that is
    the tier that keeps taking the damage. NOT IN SCOPE: preventing the damage (HIS-9, HIS-10), and any
    repair that cannot be verified by re-running detection.

    '
  acceptance:
    assertions:
    - A home damaged in each of the three known ways is reported as damaged, one line per finding, naming
      the repair.
    - Repair makes detection clean, and running it twice changes nothing the second time.
    - A merely STALE home is NOT reported as damaged -- GOAL-no-spurious-holdback's fixture must not regress.
    - Detection covers the root tier, and there is a test that runs it there.
  goals:
  - goal: GOAL-no-destructive-recovery
    contribution: direct
    expected_effect: no detection and no repair -> one command names the damage and one repairs it, idempotently
    local_signal: python skills/test_graph/scripts/run.py home-integrity
  - goal: GOAL-one-home-one-answer
    contribution: guard
    expected_effect: detection must use the same reader HIS-10 makes canonical, not a fourth one
    local_signal: jbang RunTests.java
