    '
  objective: 'MEASURED across every installed unit: `skill-manager build` appears in 0 markdown files,
    cold shim / ColdArtifact in 0, declared-only in 1. skt''s SKILL.md -- the session-start front door
    an agent is told to read FIRST -- mentions artifacts once, inside a code comment, and the skill ships
