      on bin/cli/{helm-deploy x2, monitoring x2, tla-spec-dev}. The root home is
      NOT repaired; that is the owner's call.
    round_2_result: >
      GREEN. `home-integrity` 18/18 (run 20260824-200955), `home-sync` 19/19
      (run 20260824-200253), `jbang RunTests.java` ALL PASSED.
    review_of_pr_256: >
      MAJOR-1: THE FIRST FIX WAS INCOMPLETE AND ITS OWN SENTENCE OVERSTATED.
      "one extraction rule, one verdict, one scope" was two of three -- the
      scope was declared twice (`HomeRepair` "bin/cli", `HomeCloner` "bin/cli/")
      and the two ENUMERATED differently: a directory stream follows a symlinked
      `bin/cli`, walkFileTree does not. Reproduced on the FIXED tree: verify
      exit 0, repair exit 1, FOREIGN_PATH_IN_SHIM bin/cli/wrapper -- DEF-104's
      shape one LINK down. Fixed by moving the enumeration to
      `HomeCloner.scanShimDirs`, which both readers now call;
      `HomeRepair.collectRegularFiles` and `shimDirLinkedOutOfHome` deleted
