    continue;`).
  what_it_found_instead: >
    Defects in the REPORT, which no instrument in this ledger looks at: an
    operator remedy that had never been run (BLOCKER), wrong clause arithmetic
    asserted in four places, a mis-attributed instrument table in the document
    whose only value is attribution, two grades a conjunction did not support,
    two backlog entries reported resolved and left `blocking/open`, and an
    unfiled defect sitting inside HIS-6's own published evidence.
  the_argument_for_a_fifth_column: >
    A, B and C all read the SYSTEM. Nothing in this ledger reads the REPORT --
    and a terminal evaluation is almost entirely report. Round 3's own numbers
    were sound and its prose was not, which is the strongest argument this epic
    produced for review being an instrument rather than a formality.
  it_also_strengthened_the_ticket_twice: >
    (1) It supplied a better reason than the rule for refusing to fix DEF-115:
    `home verify`'s remedy for the symlink shape is `sync --force-scripts`, not
    `repair --fix`, so teaching repair to read links WITHOUT threading the
    sanction path would flip exit 0 -> exit 1 on every clone that legitimately
    links into a parent store -- trading one wrong answer for a louder one. And
    a fix would have been graded by the only test comparing the readers on a
    symlink, which HIS-6 wrote in the same session: self-certification.
    (2) It named the asymmetry HIS-6 had not noticed -- refusing to touch the
    subject for the finding that would move a grade to PASS, while rewriting a
    core graph's assertions and citing the rewritten graph as a witness for a
    goal that stayed green. The citation is withdrawn.

instruments:
  A-graph-sweep:
    command: python skills/test_graph/scripts/sweep.py --scope full
    kind: automated
    scope: 26 registered graphs
    blind_to: anything nobody wrote a node for
  B-issue-agents:
    command: one agent per GitHub issue, validating its own worktree
    kind: agent
    scope: the four promotion paths, progressive disclosure at three tiers
    blind_to: conditions that need a second session or a real upgrade
  C-manual:
    command: skt / skill-manager driven by hand across tiers
    kind: exploratory
    scope: sequences, not cases
    blind_to: anything the operator does not think to try

