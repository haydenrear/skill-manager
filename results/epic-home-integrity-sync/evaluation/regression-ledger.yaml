    fixed_in: HIS-21 (#253)
    the_open_question_answered: >
      #253 asks whether a project home is SUPPOSED to have a
      `home.runtime.json`. IT IS NOT, and this is decidable from the code rather
      than from taste: `LaunchEnv.of` reads one when present and otherwise
      DERIVES the same block from the home's layout, and only `home clone` and
      `describe --write` ever persist one. So the project home is not
      malformed -- `describe` computing a descriptor is the command working as
      designed, and printing the computed answer in the same shape as a recorded
      one is not.
    fixed_how: >
      `HomeCommand.renderHuman` marks provenance per field. A home with no
      `home.runtime.json` gets a `descriptor:` line saying every field below is
      DERIVED; `policy` is marked declared / "not declared -- default; no
      home.policy.toml here"; `cli` carries its `CliSource` in words, because a
      PINNED_ENV answer is a fact about the CALLER'S SHELL and read as a fact
      about the home; and the gateway line NO LONGER SAYS `(owned)` for a home
      with no gateway.properties -- it says the endpoint is the default and this
      home claims no ownership of it.
    deliberately_not_changed: >
      (a) `--json`. It emits the descriptor itself, the thing `--write`
      persists and bootstrap-home.sh consumes; marking a field "not recorded"
      inside the file whose existence makes fields recorded is a contradiction.
      (b) `GatewayConfig.owned()` still defaults to true -- changing the
      RESOLUTION default changes what `gateway up`/`gateway down` do in every
      undeclared home, which this ticket has no measurement for. The claim is
      "two homes never both REPORT one gateway as owned", and it says report.
    regression_check: >
      `HomeReportsMarkWhatTheyInventTest`, three cases: the DERIVED banner, the
      two-homes gateway case (a home that DID persist gateway.properties must
      still report `(owned -- declared in gateway.properties)`, so the fix
      cannot be "stop saying owned"), and the CLI provenance line.
    red_observed: >
      Probe V5: remove the descriptor-provenance line -> FAILURES: 1, only the
      DERIVED case. Probe V6: restore `owned ? "owned" : ...` -> FAILURES: 1,
      only the gateway case.
    round_2_result: >
      GREEN. `jbang RunTests.java` ALL PASSED; `home-integrity` 18/18.
    known_divergence_not_closed: >
      `home describe` HUMAN says "no gateway.properties here -- this is the
      default endpoint, and this home claims no ownership of it"; `home describe
      --json` says `"owned": true` for the same home in the same run. One
      command, one home, two answers -- GOAL-one-home-one-answer's own shape,
      inside the fix for it.

      LEFT OPEN DELIBERATELY and recorded rather than argued away. The JSON is
      the document `--write` persists and bootstrap-home.sh consumes; widening
      the human marking into it would change a persisted interop schema, and
      changing `GatewayConfig.owned()`'s default would change what `gateway up`
      and `gateway down` do in every undeclared home, which this ticket has no
      measurement for. Latent today: no in-repo consumer reads that field to
      decide anything. HIS-6 owns the goal and should decide it.
    test_name_corrected: >
      The shipped case was named "two homes never both report one gateway as
      OWNED", which the code does not hold -- two homes that each PERSIST
      gateway.owned=true for one port both print `(owned -- declared in
      gateway.properties)` and always did. The BODY was always correct (declared
      versus defaulted). Renamed to "a home that declared no gateway does not
      report the default as OWNED". Review of PR #256, minor 3.

