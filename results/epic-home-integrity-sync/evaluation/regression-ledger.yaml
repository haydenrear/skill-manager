carried_findings_his22:
  - defect: DEF-096
    caught_by: C-manual
    caught_at: "2026-08-24"
    one_line: >
      The project home never realized its own manifest. skill-project.toml
      declares [plugins.skt] and [skills.skill-manager]; the home held neither
      and projects/ was empty. Every worktree in this epic is a clone of it.
    why_A_missed_it: >
      No graph asserted anything about a home against the manifest sitting
      beside it. `home verify` answers "is this home internally consistent" and
      `home clone` answers "did the copy come across", and a home can pass both
      while being short every unit it declares.
    fixed_in: >
      HIS-22 (#254). New reader
      src/main/java/dev/skillmanager/project/ProjectManifestRealization.java --
      compares the manifest beside a home against what the home holds, using the
      resolver's OWN name resolution (ProjectDependencyResolver.installedUnitName,
      widened from private to package-private so there is one answer rather than
      two). Wired into `home clone`: human mode warns with the denominator, the
      missing units, their declared sources and the remedy; --json gains a
      "manifestShortfall" object INSIDE the existing document, so stdout is still
      exactly one JSON document (#235's purity rule).
      NOT a gate: it reports, it never refuses, and it installs nothing.
    regression_check: >
      UNIT: src/test/java/dev/skillmanager/project/ProjectManifestRealizationTest.java
      -- CASE 1 the reader, CASE 2 the surface (`home clone`, human and --json,
      driven through picocli), CASE 3 THE GUARD: a realized home and a home with
      no manifest both report NOTHING, so the diagnostic cannot become
      unconditional noise.
      GRAPH: the DEF-096 arm of home.cloned.into.project (checkout-home and
      home-clone), 3 assertions, one of them a POSITIVE CONTROL -- a clone of a
      home with no manifest beside it must NOT print the notice.
    round_2_result: >
      GREEN. checkout-home PASS (run 20260824-200314); the three new assertions
      passed, positive control included. Vacuity: probe V5 (silence the clone
      report) reddens CASE 2; probe V6 (never compute the shortfall) reddens
      CASE 1 AND CASE 2 from one mutation, which is the evidence that the two
      surfaces read one mechanism.
    status: fixed-pending-review

  - defect: DEF-101
    caught_by: C-manual
    caught_at: "2026-08-24"
    one_line: >
      close-out cannot express "the destination can obtain this from its own
      manifest at a published ref", so it blocks on units that are unmodified
      checkouts the destination itself declares.
    why_A_missed_it: >
      Every close-out node in this epic drives worktree -> project with units the
      project home already had or the worktree authored. None of them puts a
      DECLARED-but-absent unit on the worktree side, because until DEF-096 nobody
      knew a project home could be short of its own manifest.
    fixed_in: >
      HIS-22 (#254). HomeCloseOut gains a SelfObtainable record and a narrow
      predicate: status NEW, the destination's own manifest declares the unit,
      the worktree has a materialization record for it, and the worktree copy is
      not locally modified. Reported in the verdict and in --json under
      "selfObtainable", never silent. Verdict gains a sixth component with a
      5-arg convenience constructor so existing call sites still read.
    regression_check: >
      UNIT: src/test/java/dev/skillmanager/store/HomeCloseOutSelfObtainableTest.java
      -- CASE 1 the fix; CASE 2 an UNDECLARED new unit still blocks; CASE 3 a
      DECLARED but locally-edited unit still blocks; CASE 4 a destination with no
      manifest exempts nothing. Three guards to one fix, because the cheapest way
      to pass CASE 1 is to stop blocking on NEW, which deletes the gate.
    round_2_result: >
      GREEN. 4/4 in the unit suite, inside 1408 passed / 0 failed. Vacuity: probe
      V4 makes selfObtainable return null unconditionally -- CASE 1 red, CASES
      2-4 green, which is what makes it a scoped exemption rather than a removed
      gate.
      GAP CLOSED AT REVIEW: the graph-layer coverage this row used to record as
      missing now exists -- `home.sync.close.out.self.obtainable`, 7 assertions,
      run 20260824-210901 PASSED. It was not optional. The reviewer of PR #255
      found MAJOR 1 (now DEF-113) precisely because four in-process unit cases
      cannot observe a second reader they never invoke: the gate printed
      `"safe":true` in the same document where the CLI printed NO_GIT_REMOTE.
      The node's arm 3 is that comparison, with a positive control.
