  - id: REG-004
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: DEF-104
    severity: major
    one_line: >
      `home verify` reports the operator's ROOT home clean while three of its
      shims execute code inside the PROJECT home. `home repair` catches all
      five paths. Same home, same minute, two answers.
    how_it_surfaced: >
      Running HIS-13's detector by hand against the REAL root home -- something
      no graph does and no ticket did outside its own fixtures. verify exit 0
      and "no path in it reaches any other Skill Manager home"; repair, five
      findings over 71 entries. Confirmed by reading the shim and finding the
      root home holds its OWN copy of the script the shim skips.
    why_A_missed_it: >
      Every fixture in every graph gives the home under test a PARENT. The root
      home has none, and the plausible mechanism is that verifyRoots frames its
      foreign-home question against a home's source, so the branch never runs.
      No node plants a foreign path in a shim's CONTENT in a parentless home.
    why_it_matters_more_than_the_count: >
      This is the epic's founding defect -- one home reaching into another --
      alive in the operator's root home right now, with the command built to
      detect it reporting clean. It is also the tier this epic's own record says
      was damaged twice.
    missed_by: [A-graph-sweep]
    owed_check: >
      A node that plants a foreign path in shim CONTENT in a home with NO
      PARENT and asserts verify and repair return the same verdict.
    status: open
    fixed_in: HIS-21 (#253)
    fixed_how: >
      `HomeCloner.verifyRoots` now asks the foreign-home question of a shim
      file's CONTENT as well as of symlink targets, through a new
      `HomeCloner.foreignPathsInShimContent` that `home repair` also calls --
      one extraction rule (`HomeRepair.absolutePathTokens`) and one verdict
      (`HomeCloner.unsanctionedForeignHome`) for both readers, because two
      spellings of the question is what DEF-104 WAS. Scope is the two shim
      directories, matching `home repair` exactly, so the verdicts cannot differ
      by scope either. New leak kind `FOREIGN_PATH_IN_SHIM`, never tolerable,
      and `home verify`'s remedy line now names `home repair --fix` for it --
      `sync --force-scripts` reaches CliShimPruner, which prunes LINKS and walks
      past a wrapper.
    THE_MECHANISM_WAS_NOT_WHAT_THIS_ROW_SAYS: >
      `why_A_missed_it` above says "the plausible mechanism is that verifyRoots
      frames its foreign-home question against a home's source, so the branch
      never runs" for a parentless home. MEASURED FALSE on the pre-fix tree, two
      throwaway homes, A holding a wrapper that execs a path inside B:

        home verify --home A               -> exit 0
        home verify --home A --against C   -> exit 0    <- a source, still blind
        home repair --home A               -> 1 finding
        A's shim as a SYMLINK instead:
        home verify --home A               -> exit 1  FOREIGN_HOME

      The blindness was about the SURFACE, not the tier and not `--against`: the
      question was asked only of symlinks, and for a regular file the walk
      searched for the source needle and nothing else. A wrapper naming a THIRD
      home was invisible at EVERY tier. The root home was simply where the
      wrappers happened to be mis-pointed.

      This matters for the fix, not only for the record: the mechanism as filed
      implies "run the branch when srcRoot == null", which changes nothing --
      that branch is the symlink branch and it already ran. A ticket that
      implemented the stated mechanism would have shipped green tests and the
      defect.
    regression_check: >
      TWO, at two levels. (1) `DamagedHomeIsRepairableTest` gains
      "DEF-104: verify and repair return the SAME verdict on a wrapper shim",
      which compares the SUBJECT SETS the two readers name and additionally
      asserts the `--against` case, plus "the SANCTION survives the widening"
      over a grandchild clone with its descent record deleted as the control.
      (2) The `home-integrity` node `home.integrity.damaged.home.is.repairable`
      gains three real-CLI invocations -- verify before, verify on the UNDAMAGED
      copy, verify after -- and the assertions
      DEF104_home_verify_names_the_same_wrapper_home_repair_does,
      DEF104_home_verify_is_clean_once_home_repair_is,
      DEF104_control_home_verify_is_silent_about_the_undamaged_copy.
    red_observed: >
      Probe V1 (unit): remove the `foreignPathsInShimContent` loop.
      FAILURES: 2, the first reading "verify said []; repair said
      [bin/cli/wrapper]" -- the disagreement itself.
      Probe V9 (graph): the same mutation, node re-run:
      "`home repair` names FOREIGN_PATH_IN_SHIM bin/cli/his13-wrapper and
      `home verify` exits 0 without it".
    measured_on_the_real_root_home: >
      READ-ONLY, no repair run. `home verify --home ~/.skill-manager` now exits
