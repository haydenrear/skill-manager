      two failing assertions require the CLI to STRAND the unit's repository in a
      merge conflict -- the condition GOAL-symlink-merge-settles exists to remove,
      and whose baseline is two units in the operator's project home permanently
      stuck in MERGE_CONFLICT. The CLI now rolls the merge back and prints a
      remedy: "nothing was changed -- the merge was rolled back, so the store is
      exactly where it was".

      So a CORE graph was asserting, since whichever ticket changed the behaviour,
      that the product still had the defect the epic was closing. Nothing noticed
      because `run.py --all` had never completed a sweep. THIS IS THE SECOND-BEST
      ARGUMENT IN THE EPIC FOR RUNNING THE FULL SWEEP, after DEF-107 -- and it is
      a different argument: DEF-107 was a latent-red detector, this is a latent-red
      SPECIFICATION. A sweep catches assertions that have gone out of date with the
      product, which no amount of running the graphs you happen to have touched can.
    fixed_in: >
      HIS-6 (#218), as a HARNESS fix -- the one repair this ticket is permitted and
      required to make. test_graph/sources/git-latest-source-tracking/GlsConflict.java
      now asserts the current contract. The two assertions that were always right
      are unchanged; the two that encoded the stranding are inverted, and each is
      paired with a control, because "no markers" is exactly what a fixture that
      never conflicted also reports:
        precondition_both_sides_diverged   -- blind to what the CLI did
        DEF108_store_holds_no_conflict_markers
        DEF108_store_bytes_unchanged_by_the_refused_merge
        DEF108_working_tree_has_no_unmerged_path
        DEF108_remedy_names_the_store_directory
      THIS CHANGES graphs_passed, and HIS-6 reports the as-measured number and the
      post-fix number as two separate numbers rather than one.
    status: closed

