# Regression ledger — WHICH INSTRUMENT CAUGHT WHAT, and which missed it.
#
# The epic's goals measure whether the PRODUCT got better. This file measures
# whether the VALIDATION did, and it is the only place that can answer the
# owner's question: "solid judgment on how well our architecture and validation
# did."
#
# The measurement only works if provenance is recorded AT THE MOMENT OF THE
# CATCH. A finding written up afterwards always looks like it could have been
# caught by anything. So every entry names its instrument when it is filed, and
# `missed_by` is completed only once every instrument has had its turn at the
# same tip.
#
# THREE INSTRUMENTS, deliberately different in kind:
#
#   A  graph-sweep   `skills/test_graph/scripts/sweep.py --scope full`
#                    26 registered graphs, one at a time, per-graph resumption.
#                    Automated, repeatable, and blind to anything nobody wrote
#                    a node for.
#
#   B  issue-agents  Small agents, one GitHub issue each, each validating ITS
#                    OWN worktree (owner's instruction, 2026-08-24). Not
#                    whole-epic agents. Sees what a real ticket agent sees.
#
#   C  manual        The epic agent driving `skt` and `skill-manager` by hand
#                    across the tiers and the four promotion paths. Sees
#                    sequences nobody scripted.
#
# A finding caught by C and missed by A is an argument for a new node.
# A finding caught by B and missed by A and C is an argument that the product
# only breaks under a real workload.
# A finding caught by A alone is the automation earning its keep.
#
# PHASE 5 OF HIS-6 TURNS THIS INTO WORK: every row whose `caught_by` is not A
# owes a test assertion, and a model update where it is a property rather than
# a case. A found bug without a check is a bug that returns.

version: 1

instruments:
  A-graph-sweep:
    command: python skills/test_graph/scripts/sweep.py --scope full
    kind: automated
    scope: 26 registered graphs
    blind_to: anything nobody wrote a node for
  B-issue-agents:
    command: one agent per GitHub issue, validating its own worktree
    kind: agent
    scope: the four promotion paths, progressive disclosure at three tiers
    blind_to: conditions that need a second session or a real upgrade
  C-manual:
    command: skt / skill-manager driven by hand across tiers
    kind: exploratory
    scope: sequences, not cases
    blind_to: anything the operator does not think to try

findings:
  - id: REG-001
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: DEF-103
    one_line: >
      One registered project's durability defect refuses EVERY unit sync into
      the root home, naming a project unrelated to the unit being synced.
    how_it_surfaced: >
      Not by looking for it. The owner authorised merging seven leaf PRs and
      syncing them into the root home; all four syncs failed identically with
      PROJECT_SYNC_FAILED naming `meta-harness`, a repository this epic never
      touched.
    why_A_missed_it: >
      NO GRAPH EXERCISES project -> root. Every close-out node in this epic runs
      worktree -> project. The promotion direction the owner asked to enforce
      had never been executed by any instrument until it was run by hand.
    missed_by: [A-graph-sweep]
    owed_check: >
      A node that registers two projects, breaks the durability of ONE, and
      asserts that a unit sync naming NEITHER still succeeds -- or fails with a
      refusal scoped to the project that owns it.
    status: open

  - id: REG-002
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: null
    one_line: >
      `skill-manager sync --help` prints the project-failure banner. Help output
      runs project checks.
    how_it_surfaced: reading `sync --help` to look for a scoping flag
    why_A_missed_it: no graph asserts anything about `--help` output
    missed_by: [A-graph-sweep]
    owed_check: "a node asserting that `--help` for any verb is pure text: no project scan, no home mutation, no non-zero exit"
    status: open

  - id: REG-003
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: null
    one_line: >
      SELF-INFLICTED, in the evaluation's own instrument. `sweep.py` classified
      every node that was not `passed` as FAILED, lumping `skipped` in with it.
    how_it_surfaced: >
      The driver's own negative control. On artifact-dag it reported THREE
      failing nodes where there is ONE: `uninstall.prunes.the.subgraph` failed,
      and `home.fixpoint.law` / `home.membership.law` are downstream with
      spawnExitCode -1 and zero assertions. It would have reported this epic's
      two cross-cutting laws as broken when they simply never ran.
    why_A_missed_it: >
      A was the subject, not the instrument. Recorded because the epic's honest
      count of "instruments that could not fail" is now nine, and this one sat
      inside the evaluation itself.
    missed_by: []
    owed_check: >
      Fixed at source before the sweep ran; failed and skipped are separate and
      both controls still fire. Vacuity ledger row owed.
    status: closed

  - id: REG-004
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: DEF-104
    severity: major
    one_line: >
      `home verify` reports the operator's ROOT home clean while three of its
      shims execute code inside the PROJECT home. `home repair` catches all
      five paths. Same home, same minute, two answers.
    how_it_surfaced: >
      Running HIS-13's detector by hand against the REAL root home -- something
      no graph does and no ticket did outside its own fixtures. verify exit 0
      and "no path in it reaches any other Skill Manager home"; repair, five
      findings over 71 entries. Confirmed by reading the shim and finding the
      root home holds its OWN copy of the script the shim skips.
    why_A_missed_it: >
      Every fixture in every graph gives the home under test a PARENT. The root
      home has none, and the plausible mechanism is that verifyRoots frames its
      foreign-home question against a home's source, so the branch never runs.
      No node plants a foreign path in a shim's CONTENT in a parentless home.
    why_it_matters_more_than_the_count: >
      This is the epic's founding defect -- one home reaching into another --
      alive in the operator's root home right now, with the command built to
      detect it reporting clean. It is also the tier this epic's own record says
      was damaged twice.
    missed_by: [A-graph-sweep]
    owed_check: >
      A node that plants a foreign path in shim CONTENT in a home with NO
      PARENT and asserts verify and repair return the same verdict.
    status: open

  - id: REG-005
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: DEF-105
    severity: major
    one_line: >
      The operator's root home carries a hand-written security policy the
      product does not read, because the filename changed from `policy.toml` to
      `home.policy.toml`. The home runs on defaults.
    how_it_surfaced: >
      Listing descriptor files across all three tiers side by side and noticing
      the root had `policy.toml` where the worktree had `home.policy.toml`.
      `skill-manager home policy` then said it outright: "file:
      .../home.policy.toml (absent -- live by default)".
    why_A_missed_it: >
      No graph plants the LEGACY filename. Vacuity-ledger row 8 caught this
      exact confusion in a FIXTURE during HIS-14 and the lesson was applied to
      the fixture, not to the product's diagnostics. `home policy` prints `live`
      whether the policy is absent or merely unread, so nothing distinguishes
      them.
    missed_by: [A-graph-sweep]
    owed_check: >
      `home policy` warns when a legacy `policy.toml` sits beside an absent
      `home.policy.toml`; plus a node that plants the old filename and asserts
      the verb says so rather than silently defaulting.
    status: open

  - id: REG-006
    caught_by: C-manual
    caught_at: "2026-08-24"
    defect: DEF-106
    severity: major
    one_line: >
      `home describe` prints a full descriptor for the project home, which has
      no descriptor files at all -- including a gateway marked `(owned)` that
      the root home's descriptor also claims.
    how_it_surfaced: >
      Following up the gateway line from `home describe` on both tiers: both
      printed "(owned)" for one URL with one listener. The root home records
      `"owned": true`; the project home has no home.runtime.json to record
      anything.
    why_A_missed_it: >
      No node asserts that a verb's output distinguishes RECORDED fact from
      SYNTHESISED default. `home policy` does mark its defaults -- "(not
      declared -- default for this tier)" -- so the convention exists and
      `home describe` simply does not follow it.
    missed_by: [A-graph-sweep]
    owed_check: >
      A node asserting `home describe` marks synthesised fields, and that two
      homes never both report one gateway as owned.
    status: open

