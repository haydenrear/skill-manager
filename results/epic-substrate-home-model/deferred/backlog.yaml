version: 1
findings:
  - id: DEF-SUB0-001
    found_by: SUB-0 survey, surface 9 (the drift digest)
    found_at: "2026-08-29"
    severity: minor
    summary: >
      `home sync` records no drift, and no DriftGate path takes the home lock.
    detail: >
      `DriftGate.recordSince` is invoked from exactly two sites --
      `project/ProjectSyncUseCase.java:156` ("project sync") and
      `commands/HomeCommand.java:1191` ("home drift --record"). `store/HomeSync.java`
      contains no `DriftGate` reference at all, so a `home sync` that replaces unit
      content leaves the launch-time drift gate untouched: an agent following a skill
      that `home sync` just rewrote is not told. Separately, every DriftGate write is
      a plain `Fs.ensureDir` + `writeValue` (`store/DriftGate.java:114-115,158-159,221-222`)
      with no `HomeLock`, so two processes -- or two containers sharing a volume --
      can interleave writes to `home.drift.json`.
    reproduction: >
      Read-only. `grep -n DriftGate src/main/java/dev/skillmanager/store/HomeSync.java`
      returns nothing; `grep -rn "DriftGate.recordSince" src/main/java` returns the two
      sites above.
    why_deferred: >
      Not a machine-local assumption. It is a coverage gap in the drift instrument
      that predates this epic and would be the same defect on one machine. SUB-0's
      slice is reading and recording; fixing it is a production change.
    candidate_owner: epic owner -- likely a separate issue, not a substrate-home-model ticket
    status: open

  - id: DEF-SUB0-002
    found_by: SUB-0 survey, surface 8 (credentials)
    found_at: "2026-08-29"
    severity: major
    summary: >
      `gateway-data/` is copied by every home clone and may hold plaintext MCP
      secrets; could not be determined from this codebase.
    detail: >
      `mcp/GatewayRuntime.java:38` puts `gateway-data/` at the store root. It is in
      `HomeCloner.PROVISIONED_ROOTS` (`store/HomeCloner.java:248`) but NOT in
      `SKIPPED_DIRS` (`:131-132`), so a clone copies it. It holds `dynamic-servers.json`,
      and MCP server records carry `env` maps whose fields may be declared
      `secret = true` (`model/McpDependency.java:216`, `model/SkillParser.java:272`,
      `mcp/InstallResult.java:37`). `mcp/McpRegistrationLock.java:72-75` states that a
      plaintext secret never enters the registration DIGEST, which implies plaintext
      secrets exist somewhere in the payload.
      Whether they land on disk cannot be decided from `src/main/java`: the file is
      written by the Python gateway under `VMG_DATA_DIR`.
    reproduction: >
      Not reproduced. Would need a home with a secret-carrying MCP dep installed, then
      `cat <home>/gateway-data/dynamic-servers.json`. Not run: it would require writing
      to a real home or provisioning a gateway, both outside SUB-0's slice.
    why_deferred: >
      Sits beside the `auth.token` question (#281) but is a different file written by a
      different codebase. SUB-0 settled the token by demonstration; this one needs the
      gateway's own source, which is not in scope for a reading ticket.
    candidate_owner: whoever takes #281's decision -- same session, adjacent question
    status: open

  - id: DEF-SUB0-003
    found_by: SUB-0 survey, surface 7 (agent projections)
    found_at: "2026-08-29"
    severity: major
    summary: >
      The named-profile agent layout (`<profileRoot>/agents/{claude,codex,gemini}`) is
      not covered by `AgentHomes.agentDirsUnder`, so a clone may not re-root it.
    detail: >
      `project/ProjectChildHomeScaffolder.java:305-307` places agent dirs under
      `agents/` for a project with an active profile. `agent/AgentHomes.java:288-292`
      (`agentDirsUnder`) knows only the sibling spelling `.claude` / `.codex` /
      `.gemini`, and `AgentHomes.java:268-270` flags the profile layout as an exception
      such callers must handle themselves. `HomeCloner.remapPath` re-roots exactly
      `agentDirsUnder` (`store/HomeCloner.java:2845-2851`) and otherwise falls through
      to `return path` (`:2853`). A profile-layout ledger row would then meet
      `insideNewHome` (`:1191-1192`), which accepts anything under
      `homeRootFor(dstRoot)` -- and `agents/` sits under the PROFILE root, not the home
      root. I could not determine whether the row is re-rooted, kept unrewritten, or
      dropped as foreign.
    reproduction: >
      Not reproduced. Would need a project with an active profile, a resolve, and a
      clone of the resulting home -- a multi-step fixture beyond a reading ticket.
    why_deferred: >
      This is the "I could not tell" case the ticket asks to be written down rather
      than guessed. Answering it means running the profile path, which is SUB-1's
      demonstration slice, not SUB-0's.
    candidate_owner: SUB-1 (propagation-path fixtures) or SUB-4 if it turns out to be a gap
    status: open

  - id: DEF-SUB0-004
    found_by: SUB-0 survey, cross-cutting (not one of the nine surfaces)
    found_at: "2026-08-29"
    severity: major
    summary: >
      A cloned home carries the source home's loopback gateway URL, which means
      nothing in another container.
    detail: >
      Measured on a scratch clone: the copy's `gateway.properties` and
      `home.runtime.json` both hold `gateway.url = http://127.0.0.1:51717` with
      `owned = false` -- i.e. the clone is pointed at the SOURCE home's gateway
      process on the host loopback. `home clone` reports this deliberately
      ("the source home owns it; pass --own-gateway to claim it instead"), so on one
      machine it is correct behaviour. In a container, `127.0.0.1` is the container's
      own loopback: the clone attaches to nothing, or -- worse -- to an unrelated
      process that happens to hold that port.
    reproduction: >
      See the survey's "Reproducing the two demonstrations" section; the credentials
      fixture prints `home.runtime.json`, which carries the URL. Fully reproducible in
      a scratch directory with no real home involved.
    why_deferred: >
      The goal's harness fixes the denominator at nine named surfaces and the MCP
      gateway is not one of them. Recording it inside a surface row would inflate the
      denominator; recording it nowhere would lose it.
    candidate_owner: SUB-2 (what the tiers mean in a container) -- the gateway is part of
      the answer to "what is a root home when no durable machine owns one"
    status: open

  - id: DEF-SUB0-005
    found_by: SUB-0 survey, cross-cutting (surfaces 3 and 6)
    found_at: "2026-08-29"
    severity: major
    summary: >
      A home records no platform key, and re-provisioning from `cli-lock.toml` across
      a platform change has never been demonstrated.
    detail: >
      `util/Platform.currentKey()` is `os-arch` (`util/Platform.java:28-30`) and
      nothing in a home records which platform provisioned it. The repair path for a
      relocated home is `sync --force-scripts` re-provisioning from `cli-lock.toml`,
      which is platform-agnostic in shape -- no field holds an absolute path
      (`lock/CliLock.java:70-80`, `lock/CliInstallRecorder.java:121-127`) -- but every
      backend is platform-keyed: `cli/installer/BrewBackend.java:29-34`,
      `TarBackend.java:241-253`, `SkillScriptBackend.java:393-402`,
      `pm/PackageManager.java:53-56` (throws on Windows). `TarBackend.java:136-141`
      states that two homes on different architectures deliberately do not agree about
      fingerprints. So a macOS-authored home moved into a Linux container is expected
      to re-provision, and whether it CAN has not been shown either way.
    reproduction: >
      Not reproduced -- it needs a second platform, which SUB-0 does not have and
      SUB-5's k3d work might.
    why_deferred: >
      Straddles two of the nine surfaces without being a defect in either. The survey
      dispositions both rows on evidence that does not depend on this answer; this is
      the follow-on measurement, and it is SUB-1's kind of work.
    candidate_owner: SUB-1 (demonstration) with SUB-5's k3d environment if it exists
    status: open

  - id: DEF-SUB3-001
    found_by: SUB-3 survey, section 2b / GAP-4 (Claude Code harness)
    found_at: "2026-08-29"
    severity: major
    summary: >
      skill-manager registers a home's plugin marketplace at USER scope by absolute
      host path, and has no reader and no de-registration path for those rows.
    detail: >
      `project/HarnessPluginCli.java:288-291` runs
      `claude plugin marketplace add <marketplaceRoot> --scope user` and `:453-457`
      runs `claude plugin install <name>@<mkt> --scope user`. The destination config
      directory is resolved ambiently -- `claudeEnv()` at `:337-338` is
      `CLAUDE_CONFIG_DIR = AgentHomes.claude().configDir()`, which falls back through
      `agentHomeRoot()` (`agent/AgentHomes.java:254-262`) to `$HOME` whenever
      `SKILL_MANAGER_HOME` is unset.
      MEASURED on the operator's machine: `~/.claude/plugins/known_marketplaces.json`
      holds EIGHT skill-manager marketplaces, each an absolute host path to a
      different project home's `plugin-marketplace/` (root home, commit-diff-context-parent,
      tla-spec-dev, skill-manager-integration-repository, acp-cdc-ai-python,
      skill-manager, meta-harness). `installed_plugins.json` keys project-scope installs
      by absolute `projectPath`, several of which are deleted `/private/var/folders/.../skt-eval-*`
      temp directories.
      `grep -rn "known_marketplaces" src/main/java` returns NOTHING: skill-manager writes
      this file through the harness CLI and can neither read nor prune it. The Codex
      side is worse -- `HarnessPluginCli.java:463-466` returns
      `"[codex: uninstall via /plugins UI]"`, a documented no-op.
      By SUB-0's boundary rule (`store/HomePaths.java:13-19`) this is a set of absolute
      paths NAMING HOMES that lives outside every home: `home clone`'s isolation oracle
      cannot report it, `HomeCloner.remapPath` cannot re-root it, `home verify` does not
      look at it. In a container all eight are dangling.
    reproduction: >
      Read-only:
      `python3 -c 'import json;d=json.load(open("~/.claude/plugins/known_marketplaces.json".replace("~",__import__("os").path.expanduser("~"))));[print(k,"->",v["installLocation"]) for k,v in d.items()]'`
      The causal link to `HarnessPluginCli` is strongly-supported INFERENCE, not
      measurement: reproducing a registration writes a real home, which SUB-3's rules forbid.
    why_deferred: >
      SUB-3's slice is reading and recording per harness. Adding a reader, a pruner, or
      a home-scoped registration policy is a production change, and the DECISION
      (should a project home's marketplace ever be registered at user scope?) is the
      owner's. It is also adjacent to #263's "agent login state is not modelled" axis
      rather than to any of the nine surfaces.
    candidate_owner: SUB-4 if it is a gap to close; otherwise a standalone issue beside #263
    status: open

  - id: DEF-SUB3-002
    found_by: SUB-3 survey, section 3 (Codex) -- gap X1
    found_at: "2026-08-29"
    severity: major
    summary: >
      The launch-time unredirected-home refusal exists for Claude only; `exec -- codex`
      and `exec -- gemini` have no equivalent guard.
    detail: >
      `commands/ExecCommand.java:139` calls `launch.requireClaudeRedirected()` and
      nothing else, and `launch/LaunchEnv.java:400-417` declares exactly one such
      guard. So `bin/launch/codex` and `bin/launch/gemini` -- generated from the same
      template for the same three agents (`launch/LauncherShims.java:113`, `:274-310`)
      -- launch with no refusal when `CODEX_HOME` or `GEMINI_HOME` resolve outside the
      home root. The asymmetry is in the launch gate, not in the model:
      `sandbox/Confinement.java:158-160` treats all three as confinement axes, and
      `store/HomeDescriptor.java:102-124` publishes all three in the descriptor's env
      block.
      This matters more in a container than on a host: `LaunchEnv.of` falls back to
      `HomeDescriptor.envFor` only when the home has no descriptor (`:156-166`), so a
      home whose descriptor was written on another machine and not re-derived can carry
      stale agent-home values, and only the Claude one would be caught.
      Also recorded here: the fixed 3-element `AGENTS` list at `LauncherShims.java:113`
      means the `harness` unit kind -- which declares no launch, env, or config-dir
      field at all (`model/HarnessParser.java:62-88,113-135`) -- can never contribute a
      fourth launcher.
    reproduction: >
      Read-only:
      `grep -n "requireClaudeRedirected\|requireCodex\|requireGemini" src/main/java/dev/skillmanager/launch/LaunchEnv.java src/main/java/dev/skillmanager/commands/ExecCommand.java`
      -- one guard, one call site, Claude only.
    why_deferred: >
      A production change to a security-relevant refusal path, in a ticket whose rules
      are reading and recording only. It is also not obviously a container question:
      the same asymmetry is present on one machine, which is why it belongs on the
      backlog rather than inside a machine-local-assumption row.
    candidate_owner: SUB-4 if the containerized tier needs it; otherwise a standalone issue
    status: open

  - id: DEF-SUB3-003
    found_by: SUB-3 survey, incidental (while reading the skt ticket lifecycle)
    found_at: "2026-08-29"
    severity: minor
    summary: >
      The vendored `skt` source in this repo and the `skt` installed in the operator's
      root home disagree about whether `skt ticket list|sweep` exists, and the LOWER
      version number is the one that has them.
    detail: >
      In this repo at `cd9b1db`, `skill-publisher-skill/src/skt/cli.py:67` declares
      `ticket.add_argument("verb", nargs="?", choices=["new", "close", "info"])` and
      `grep -rn sweep skill-publisher-skill/src/` returns nothing -- while
      `skill-publisher-skill/skills/skt/SKILL.md` documents `skt ticket list` and
      `skt ticket sweep` in its frontmatter description, in its cheat-sheet at `:18-19`,
      and in a whole section at `:101-137` (exit codes, `--epic <slug>`, `--yes`).
      The repo copy's last commit is `55bde20 chore: vendored skt 0.3.0 ...`.
      The INSTALLED copy in the operator's root home is version 0.2.0 with origin
      `https://github.com/haydenrear/skill-publisher-skill.git` -- and its
      `plugins/skt/src/skt/cli.py:77` DOES accept `["new","close","info","list","sweep"]`,
      with `ticket.py:245 FLEET_VERBS = ("list", "sweep")`.
      So the vendored 0.3.0 in the repo lacks verbs that the installed 0.2.0 has. Which
      copy is authoritative could not be determined from either side.
    reproduction: >
      Read-only:
      `grep -n 'choices=\["new"' skill-publisher-skill/src/skt/cli.py` (repo) vs
      `grep -n 'choices=\["new"' ~/.skill-manager/plugins/skt/src/skt/cli.py` (installed),
      and `python3 -c 'import json;print(json.load(open("'"$HOME"'/.skill-manager/installed/skt.json"))["version"])'`.
    why_deferred: >
      Entirely outside SUB-3's slice -- it is neither a harness requirement nor a
      machine-local assumption. Recorded because it is exactly the "which copy travels"
      question the epic's premise turns on (`skt publish` goes to the unit repo,
      `home sync` walks a local parent path), and because a container image built from
      either source would carry a different `skt` surface.
    candidate_owner: epic owner -- a skt/skill-publisher-skill housekeeping issue, not a
      substrate-home-model ticket
    status: open
