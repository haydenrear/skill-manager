    - Found and fixed CHM-12, the same rule broken through its WRITE side rather than its read side. writeCopyRecord wrote the SOURCE's entire tree as the destination's new entryDigests, paths the reconciliation had DECLINED to write included; a later reconcile in the opposite direction read that claim as a shared baseline and overwrote the work. Reproduced end to end over four homes (root, project, two ticket worktrees) with every command reporting clean=true. Fixed by ChildHomeMaterializer.sharedAfterMerge, which claims a path only where BOTH homes can be shown to have stood on the byte and omits everything else. The baseline rule gained a fourth decision, "what a reconciliation writes down".
    - Found and fixed CHM-15, the same rule broken by a DIFFERENT WRITER. `home sync --merge` from a ticket worktree leaves the project home holding a tree that is pristine by its own materialization record -- the merge rewrote that record -- while being a wholesale copy of no store on earth. ChildHomeMaterializer.reconcile asked all three clauses of the baseline rule; copyUnit (the downward materialization `project resolve` / `project sync` run) and isLocallyModified (the predicate a prune, a teardown and a close-out consult) asked only the first. Reproduced end to end against the real CLI: resolve, clone, edit, merge back, close-out clears, rm -rf the worktree, resolve again -- the ticket's bytes then existed in no home, and the command that deleted them reported MATERIALIZED, "copied from the parent store". Fixed by making the whole conjunction ONE value, ChildHomeMaterializer.Disposal, which is now the only reading of the rule anywhere in the class. linkUnit was brought under it too: linkPath deletes a real directory to put a symlink where it stood.
    - Extended External with ChildRefreshProvenance and the RefreshProjectChildHomeFromStore action, which is what made CHM-15 expressible at all. The unit slice already forbade destroying an agent's edit and always had -- its LocallyModified is content-based, so in a two-token world it is stronger than the record-based predicate the code actually runs. The gap was an ABSTRACTION gap: the model could not distinguish "the destination still holds what its record says" from "the destination holds what the source gave it", because nothing in the unit slice wrote a record. Modelling `project resolve` as a tier-slice action puts both writers on one home, and the violated invariant is the existing AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough rather than a new one -- naming a second invariant for the second writer would have been the same mistake the code made. All 23 pre-existing expected-violation configs still produce a counterexample for the same invariant; all 11 pre-existing terminating must-pass configs still pass; External_regression_childrefresh.cfg is the 24th. State counts in the sync-slice configs changed with the new action and are re-recorded below.
    - Found and fixed CHM-16, the same requirement in the OTHER half of a home. `<home>/.claude|.codex|.gemini/skills/<name>` is where a human writes skills by hand, and three writers destroyed content there with no report: the three projectors' apply, their remove, and BindingBackfill -- which adopted any existing path at a projection target into the projection ledger, after which the ledger-driven LiveInterpreter.reverseProjection deleted it on the next uninstall believing it was removing its own symlink. Reproduced end to end: `install` over a hand-written skill deleted it; after guarding only the projectors, `uninstall` still deleted it through the ledger door. Fixed with ProjectionOwnership, one predicate shared by all three doors. Deliberately NOT a materialization record: a projection is a pure function of the store, so entitlement is decidable from the two paths alone (a symlink, or a tree the source still holds), and a provenance file for it would be machinery nobody needs. Two mechanisms because the available evidence differs; one rule because the requirement does not.
    - Added ISSUE-166's bounded claimant-refresh slice. Internal models automatic refresh as reconciliation from the already-selected parent revision; External requires one coherent revision across checkout, installed provenance, units lock, registration, and child realization. Desired A/A behavior is TLC-green and the pre-fix A/B trunk-pull actions produce named counterexamples at depth 2.
    - Separated the record-WRITE decision from base selection in the model, which is what made CHM-12 expressible at all. External gains RecordWritePolicy (SHARED_ONLY / SOURCE_TREE / MERGED_TREE), the NoBaseline value a partial entryDigests map needs, the source-record FALLBACK the code has always had and the model did not, and one new invariant (ARecordClaimsNoBaselineTheDestinationNeverStoodOn) with its expected-violation config. All 22 pre-existing expected-violation configs still produce a counterexample for the same invariant, and all 11 pre-existing terminating must-pass configs still pass.
    - Made the RECORD-LESS DESTINATION representable, which is what #43 turned on. Init handed every tier a clone-time baseline -- the state `home clone` leaves behind -- so the one destination an operator actually has was unrepresentable: a root home is INSTALLED into, never materialized into, and carries no record at all. The ROOT tier now starts record-less, External gains RecordlessDestinationPolicy (SOURCE_WITNESSED / NEVER_DISPOSABLE / ALWAYS_DISPOSABLE), and DestMovedAt gained the `# NoBaseline` guard the record-write rule already had, because a record that claims nothing cannot have been moved away from. The fixed behaviour is the baseline rule met by different evidence: where the destination's record cannot say whether its bytes are disposable, the SOURCE's own record can, and it is READ rather than a baseline being written into the destination -- adopting one would assert a shared history that may never have happened. All 24 pre-existing expected-violation configs still produce a counterexample for the same invariant; all 11 pre-existing terminating must-pass configs still pass; External_regression_blindadoption.cfg is the 25th. State counts in the sync-slice configs changed and are re-recorded below.
    - NOT modelled, and recorded rather than left silent. Issue #41 (build output inside a unit is not unit content) is a claim about WHICH BYTES a reconciliation owns, and sync_body is a total function over SyncPaths in which every path is content by construction; expressing it needs a second, disjoint path class and multiplies the axis this slice was already decomposed to control, for a property decided by one predicate over path NAMES (dev.skillmanager.shared.util.Rederivable). Issue #42 (--dry-run created the home lock in the destination) is a claim about a filesystem side effect of acquiring a lock, and this model has neither a filesystem nor a lock. Both are covered end to end instead -- home.sync.built.in.unit RUNS a script and asserts about whatever it leaves behind, and home.sync.permutations measures a dry run over a whole home with an EMPTY allow-list.
