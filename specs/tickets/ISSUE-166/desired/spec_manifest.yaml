      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 2347 / 233 / 8."
      axis: "SyncTiers = {root, project, worktree}, SyncPaths = {p1}"
      evidence: ../results/chm-home-sync-tlc.txt
    desired_sync_merge:
      command: bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/External.tla specs/desired_program_model/External_sync_merge.cfg
      expect: no invariant violations
      status: passed
      states_generated: 7532
      distinct_states: 1682
      depth: 14
      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 1248 / 325 / 14."
      axis: "SyncTiers = {project, worktree}, SyncPaths = {p1, p2}"
      evidence: ../results/chm-home-sync-tlc.txt
    carried_forward_monolith:
      command: bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/SkillManager.tla specs/desired_program_model/MC_program_promotion.cfg
      expect: no invariant violations
      status: did_not_complete
      measured:
        wall_time_seconds: ">3000, stopped manually"
        states_generated_at_stop: 79225632
        distinct_states_at_stop: 3032979
        depth_at_stop: 14
        queue_at_stop: 836363
        violations_found: none up to the point it was stopped
      note: >
        Unchanged from the accepted baseline; the failure to finish is a
        property of the monolith, not of anything authored in this workflow. It
        is 25x+ over the 120s tlc_seconds budget and still had 836,363 states
        queued when stopped. It also passed the last figures recorded anywhere
        in the repository (60,920,609 generated / 2,337,504 distinct / depth 23,
        from .history/project-and-child-home-workflow) without terminating, so
        that record is stale -- the monolith has grown since. Nobody currently
        has a completed whole-model TLC number for it. Primary input for
        ticket_plan.yaml phase MIG.
      evidence: ../results/chm-monolith-tlc.txt
  # ------------------------------------------------------------------------
  # THE DECOMPOSITION, recorded because it was a discovery and not a tidy-up.
  decomposition:
    slice: three-tier reconciliation (External SyncSpec)
    what_happened: >
      The slice was first authored as ONE spec at full width -- three home
      tiers, two paths, and a per-write log carrying the destination home and
      three booleans. It did not finish: 574,209 distinct states at the 120s
      tlc_seconds budget with 223,650 still queued, 11x over
      budgets.max_distinct_states 50000 and still climbing.
    what_was_not_done: >
      The timeout was not raised. A model that needs more than the budget is
      telling you it is checking something it does not need to check.
    step_1:
      change: >
        The write log became <<path, reason>> pairs instead of one tuple per
        write carrying the destination and three booleans. Every invariant that
        reads it reads the same information; the destination component was
        never read by anything. The reporting variable sync_pass went with it,
        along with the reporting invariant it carried, which was the weakest
        thing in the set -- EveryDivergenceFromARecordIsAnEditMadeInThatHome
        makes the same negative-result point more sharply and costs nothing.
      result: 456,874 distinct at the budget. Not enough.
    step_2:
      change: >
        The slice was split along its two independent axes, expressed as
        CONSTANTS so a config picks one and pins the other -- SyncTiers and
        SyncPaths. Three tiers is what the provenance, merge-base and close-out
        properties need: every one of them turns on a destination whose content
        came from a home that is NOT the one now pushing, which two homes
        cannot express. Two paths is what the merge algebra needs: the
        difference between "each side moved a different file" and "both moved
        the same file", and the only shape in which a reconciliation can write
        SOME of a unit. No invariant relates a tier question to a path
        question, so checking them together was multiplying two state spaces to
        check nothing new.
      result: 180 and 283 distinct states, under a second each.
    cost: >
      A property needing three tiers AND two files at once cannot be stated.
      None of the four does. The one candidate -- "a reconciliation from a
      third home partially writes a unit" -- is the composition of two
      properties that are each checked on their own axis, and it is recorded
      here rather than left implicit for the same reason the unit/home split
      records its own gap.
    evidence: ../results/chm-home-sync-tlc.txt

  regression_configs:
    purpose: >
      Expected-violation configs. Each models a real behavior skill-manager has,
      had, or would have under a plausible alternative, and each must produce a
      TLC counterexample. A clean run is a failure of the invariant, not a pass:
      it means the desired-state model stopped being able to see that
      regression. Twenty-one as of 2026-07-28 (CHM-12 added one).
    External_regression_overwrite.cfg:
      models: the pre-epic refresh policy that silently deleted an agent's edits
      expect_violation: AgentEditedChildUnitsAreNeverDestroyed
      status: violated_as_expected
      trace_depth: 4
    External_regression_symlink.cfg:
      models: the historical symlink child home, where child and parent were the same bytes
      expect_violation: ChildHomeWritesNeverReachTheParentStore
      status: violated_as_expected
      trace_depth: 3
    External_regression_rawdigest.cfg:
      models: a copy that recreates in-unit store links instead of dereferencing them
      expect_violation: UnmodifiedChildUnitsConvergeOnTheirSource
      status: violated_as_expected
      trace_depth: 3
    Internal_regression_overwrite.cfg:
      models: the same pre-epic refresh policy, at unit granularity
      expect_violation: AgentEditsSurviveMaterialization
      status: violated_as_expected
      trace_depth: 4
    Internal_regression_nonatomic.cfg:
      models: a materializer that removes the live child unit before writing the new tree
      expect_violation: InFlightMaterializationLeavesTheChildUnitIntact
      status: violated_as_expected
      trace_depth: 5
    # ---------------------------------------------------------- home level
    # Nine more, one per home-level invariant. Every invariant in
    # External_home.cfg and Internal_clone.cfg is the declared target of exactly
    # one config here; two configs carry a narrowed invariant list, noted in
    # their headers, so that an invariant violated at depth 2 does not mask the
    # behavioral consequence the config exists to show.
    External_regression_absstate.cfg:
      models: pre-epic absolute self-references, repaired by HomeCloner's substitution pass -- every clone comes out correct, but `mv` on a home breaks it
      expect_violation: AHomeIsAPureFunctionOfItsRoot
      status: violated_as_expected
      trace_depth: 2
      trace: RelocateHome
    External_regression_verbatimstate.cfg:
      models: "issue #20's headline finding -- 54 metadata files in a plain `cp -R` copy still name the ORIGINAL home"
      expect_violation: SourceHomeIsByteIdenticalToItsCloneTimeSelf
      status: violated_as_expected
      trace_depth: 3
      trace: CloneHomeIntoProject -> UnbindUnitThroughHome
      note: >
        The flagship home-level regression. The copy reads correctly; it goes
        wrong on the first WRITE, because `unbind` deletes the tree its ledger
        recorded as destPath and that path names the source. This is the defect
        reproduced end to end during review of #20 (encode() resolving the
        candidate's leaf, after which unbind deleted the installed unit from the
        store and left the agent symlink dangling). No report catches it: the
        clone truthfully reports 0 leaks, because the leak is in what a stored
        path MEANS, not in a path the scan can see.
      narrowed_invariants: >
        TypeOK + the target only. NoOwnedSurfaceNamesAnotherHome and
        AHomeIsAPureFunctionOfItsRoot are both violated at depth 2 under this
        policy and would mask the trace; each is the declared target of another
        config in this set.
    External_regression_abslink.cfg:
      models: the seven absolute in-unit symlinks #20 found, copied verbatim, so the copy holds a live channel into the home it came from
      expect_violation: WritesThroughOneHomeReachNoOtherHome
      status: violated_as_expected
      trace_depth: 3
      trace: CloneHomeIntoProject -> EditUnitThroughHome
      note: >
        No skill-manager code participates in this leak -- an ordinary editor
        write below the link lands in the other home -- which is why the fix is
        write-time relativization rather than a guard on a code path.
      narrowed_invariants: same reason as External_regression_verbatimstate.cfg
    External_regression_sharedtoolchain.cfg:
      models: the toolchain option considered and rejected on #20 -- clones share the source home's venvs/, tools/ and npm/
      expect_violation: NoOwnedSurfaceNamesAnotherHome
      status: violated_as_expected
      trace_depth: 2
      trace: CloneHomeIntoProject
    External_regression_silentshims.cfg:
      models: a clone that skips the toolchain roots and reports success anyway, handing over CLI shims whose exec target does not exist
      expect_violation: EveryHomeMissingItsToolchainsSaysSo
      status: violated_as_expected
      trace_depth: 2
      trace: CloneHomeIntoProject
    External_regression_nopm.cfg:
      models: skipping pm/ along with the other toolchain roots, leaving a clone that cannot rebuild what it is missing
      expect_violation: AHomeMissingItsToolchainsStillHasItsPackageManagers
      status: violated_as_expected
      trace_depth: 2
      trace: CloneHomeIntoProject
    External_regression_rewritecontent.cfg:
      models: re-anchoring authored unit content like any other path, corrupting append-only spec history and effect-provider evidence
      expect_violation: AuthoredContentIsNeverRewritten
      status: violated_as_expected
      trace_depth: 2
      trace: CloneHomeIntoProject
    Internal_regression_partialclone.cfg:
      models: a clone that leaves whatever it had copied when it failed, so the next attempt refuses the destination as non-empty
      expect_violation: NoUnfinishedDestinationSurvivesAFailedClone
      status: violated_as_expected
      trace_depth: 3
      trace: BeginCloneCopyTree -> AbortCloneAndDiscardPartial
    Internal_regression_unreanchored.cfg:
      models: a plain `cp -R` with no state re-anchoring pass at all -- the copy COMPLETES and reports success
      expect_violation: EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver
      status: violated_as_expected
      trace_depth: 6
      trace: BeginCloneCopyTree -> RelativizeInHomeLinks -> ReanchorProvisionedFiles -> CompleteClone -> PointEnvAtClone
      narrowed_invariants: >
        TypeOK + the target only. NoHandedOverHomeNamesAnotherHome is violated in
        the same state and would mask the gate; it is covered by the External
        leak configs.
    # ------------------------------------------------ three-tier sync level
    # Seven more, and two of them model CODE THAT IS IN THE TREE TODAY rather
    # than code that was removed. Every one is narrowed to TypeOK plus its
    # declared target, so a defect at depth 2 cannot mask the behavioral
    # consequence the config exists to show.
    External_regression_syncoverwrite.cfg:
      models: a reconciler that treats the destination home as disposable and copies the source over it
      expect_violation: AReconciliationOnlyWritesPathsTheDestinationDidNotMove
      status: violated_as_expected
      trace_depth: 3
      axis: merge
    External_regression_prefersource.cfg:
      models: '"the source is newer, so it wins" -- every path the source moved is taken, so a path both sides moved is resolved silently instead of reported'
      expect_violation: AReconciliationOnlyWritesPathsTheDestinationDidNotMove
      status: violated_as_expected
      trace_depth: 4
      axis: merge
    External_regression_partialconflict.cfg:
      models: a conflicted unit that helpfully writes the paths which DID merge
      expect_violation: AConflictedUnitIsNeverPartiallyWritten
      status: violated_as_expected
      trace_depth: 5
      axis: merge
      note: >
        This one destroys nothing -- every path it writes is one the destination
        had not moved -- so the loss invariants are satisfied at every step. It
        is the reason conflict atomicity is a separate invariant and not a
        corollary. See External_sync_guard_conflict.cfg.
    External_regression_wholetreegit.cfg:
      models: "THE CODE UNTIL #29 WAS FIXED. GitProvenance = \"WHOLE_TREE_DIGEST\": one digest over the whole unit tree, .git included. A copy of .git rewrites itself on every git command, so ChurnGitBookkeepingInHomeTier -- bytes nobody authored -- makes the home differ from its own record and the unit is reported locally modified forever. A false positive that never clears, so `home close-out` can never be satisfied and the worktree can never be torn down."
      expect_violation: GitBookkeepingIsNeverReportedAsWork
      status: violated_as_expected
      trace_depth: 2
      axis: git
    External_regression_headonlygit.cfg:
      models: "THE FIRST FIX FOR #29, WHICH WAS SHIPPED AND HAD TO BE REWORKED. GitProvenance = \"HEAD_ONLY\": the tree is split at .git correctly and then git is asked exactly one question, is HEAD the revision the record names. HEAD IS NOT A SUMMARY OF A REPOSITORY -- CommitOnSideRefInHomeTier moves no tip and no working-tree byte, so the unit reads as pristine, a wholesale copy replaces .git, and the commit is gone. Measured on real homes before it was modelled: cat-file -e exit 128 on a side-branch commit and an empty git stash list, from a pass reporting \"the destination held no local work\". A REGRESSION rather than a gap: before #29 the whole-tree digest never matched after ANY git command, so the false positive was accidentally protecting every object in the repository."
      expect_violation: CommittedWorkIsNeverDestroyed
      status: violated_as_expected
      trace_depth: 3
      axis: git
      note: >
        Its counterexample is CommitOnSideRefInHomeTier followed straight by
        TearDownWorktreeHome -- the gate cleared because HEAD never moved. Guarded
        by External_sync_guard_headonlygit.cfg, and the guard needed TWO
        invariants removed rather than one; see that entry.
    External_regression_skipgit.cfg:
      models: "THE OBVIOUS FIX FOR #29, WHICH IS A DATA-LOSS DEFECT. GitProvenance = \"SKIP_GIT\": .git is excluded from the comparison, so the false positive above disappears -- and a commit moves bytes ONLY inside .git, so after CommitInHomeTier the worktree is byte-identical to what the record describes, the home reads as pristine, a wholesale copy replaces its .git with the source's, and the teardown gate clears for the home whose object store held the only copy."
      expect_violation: CommittedWorkIsNeverDestroyed
      status: violated_as_expected
      trace_depth: 4
      axis: git
      note: >
        Its guard is External_sync_guard_skipgit.cfg. The two configs are the two
        halves of the pair the epic keeps needing: the same defect with and
        without the witness that can see it.
    External_regression_ungatedcloseout.cfg:
      models: the pre-epic teardown -- the worktree home goes when the worktree goes, with no close-out gate
      expect_violation: NoHomeIsTornDownWhileItHoldsUniqueWork
      status: violated_as_expected
      trace_depth: 3
      axis: tiers
    External_regression_nomergekind.cfg:
      models: skill-manager before commit 7468b4f, with no reconcileKind at all
      expect_violation: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      status: violated_as_expected
      trace_depth: 4
      axis: tiers
    External_regression_ffprovenance.cfg:
      models: "THE CODE UNTIL CHM-9 WAS FIXED. reconcileKind protects a merge result but not a fast-forward, so a project home holding a torn-down worktree's only copy of an edit is overwritten by the next sync from the root."
      expect_violation: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      status: violated_as_expected
      trace_depth: 4
      axis: tiers
      defect: CHM-9
      reproduced_against_production: true
    External_regression_mergebase.cfg:
      models: "THE CODE UNTIL CHM-10 WAS FIXED. ChildHomeMaterializer.mergeBase preferred the destination's record; after a merge that record was NEWER than the true common ancestor, so the next reconciliation read the source as the only side that moved."
      expect_violation: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      status: violated_as_expected
      trace_depth: 4
      axis: tiers
      defect: CHM-10
      reproduced_against_production: true
      note: >
        The model reaches it through three tiers because its one-token-per-home
        abstraction cannot express one home editing one path twice. The unit
        test reaches the SAME root cause in two homes with one repeated source
        change (HomeSyncMergeTest, "a second --merge keeps the work the first
        one kept (CHM-10)", which was the defect pin and is now the assertion of
        the fixed behaviour). Two routes, one mergeBase.
    External_regression_childrefresh.cfg:
      models: "THE CODE UNTIL CHM-15 WAS FIXED. ChildHomeMaterializer.copyUnit -- the downward materialization `project resolve` and `project sync` run -- read the destination's materialization record as `does the destination still hold what this record says was written there`, and nothing else. After `home sync --merge` from a ticket worktree, the answer is YES and the record is about the worktree."
      expect_violation: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      status: violated_as_expected
      trace: EditUnitInHomeTier -> ReconcileHomeTiers -> RefreshProjectChildHomeFromStore
      axis: "SyncTiers = {root, project, worktree}, SyncPaths = {p1}"
      defect: CHM-15
      reproduced_against_production: true
      states_generated: 228
      distinct_states: 51
      note: >
        The invariant is the one the whole epic turns on, not a new one, and
        that is the point: `project resolve` is a reconciliation and the parent
        store is a source. Two writers, one home, one rule -- naming a second
        invariant for the second writer would have reproduced in the model the
        exact mistake the code made, which was to read one rule in two places
        and get two answers.

        Modelled in the TIER slice rather than the unit slice deliberately. The
        unit slice's LocallyModified is content-based and therefore already
        forbids this; the code's is record-based and did not. The defect lives
        in the difference between those two, so it is only expressible where
        records are, which is here. The end-to-end witness is the graph node
        home.sync.project.seam, which runs the sequence through the real CLI
        with a real `rm -rf` in the middle.
    External_regression_blindadoption.cfg:
      models: "THE FIX #43 WAS NOT ALLOWED TO BE. A destination with no materialization record -- which is what a root home IS, because it is installed into rather than materialized into -- treated as disposable by definition. Adopting a baseline into it is the same policy written down rather than assumed, and has the same consequence."
      expect_violation: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      status: violated_as_expected
      trace_depth: 3
      trace: EditUnitInHomeTier -> ReconcileHomeTiers -> ReconcileHomeTiers
      axis: "SyncTiers = {root, project, worktree}, SyncPaths = {p1}"
      defect: "#43"
      reproduced_against_production: true
      states_generated: 20
      distinct_states: 8
      note: >
        The invariant is the epic's existing one, deliberately, and for the same
        reason CHM-15 did not get a new one: a wholesale copy into a record-less
        home is a reconciliation, and the rule about which bytes it may destroy
        does not change because the destination happens to carry no provenance.
        What changes is the EVIDENCE available -- the destination's record
        cannot answer, so the source's history has to. SOURCE_WITNESSED asks it;
        ALWAYS_DISPOSABLE does not ask anything, and TLC finds a third home's
        work being overwritten at depth 3.

        The third value of this axis, NEVER_DISPOSABLE, is the code as it was
        and it violates NOTHING. That is why the axis exists at all: a policy
        that is perfectly safe and reconciles nothing cannot be caught by a
        safety invariant, and the model could not previously even state the
        situation -- Init handed every tier a clone-time baseline, so the one
        destination an operator actually has was unrepresentable. Its
        end-to-end witness is the graph node home.sync.project.to.root, which
        asserts both halves through the real CLI: the fast-forward that now
        happens, and the hold-back that still must.
    External_regression_recordsourcetree.cfg:
      models: "THE CODE UNTIL CHM-12 WAS FIXED. writeCopyRecord recorded the SOURCE's entire tree as the destination's shared baseline, paths the reconciliation DECLINED to write included, so the destination's record claimed bytes the destination had never held and the next reconcile in the opposite direction overwrote the work."
      expect_violation: ARecordClaimsNoBaselineTheDestinationNeverStoodOn
      status: violated_as_expected
      trace_depth: 7
      trace: EditUnitInHomeTier -> ReconcileHomeTiers -> EditUnitInHomeTier -> ReconcileHomeTiers -> EditUnitInHomeTier -> ReconcileHomeTiers
      axis: "BOTH -- SyncTiers = {root, project, worktree} AND SyncPaths = {p1, p2}"
      defect: CHM-12
      reproduced_against_production: true
      states_generated: 3409
      distinct_states: 853
      re_measured: >
        2026-07-29, after #43 made the ROOT tier record-less in Init. Was
        14154 / 2815. The number went DOWN, which is worth stating: TLC checks
        invariants as it generates, so a counterexample found earlier in the
        search is fewer states, not a weaker witness. Depth 6 rather than 7 --
        the record-less root reaches the shape one reconciliation sooner.
      note: >
        The one config in this directory that needs both decomposition axes at
        once, and the cost validation.decomposition recorded in advance coming
        due. Three tiers is what makes the destination's record be about a home
        that is not the one now pushing, which is what selects the source-record
        FALLBACK; two paths is what lets a reconciliation DECLINE one path while
        writing another, which is the only situation in which the record-write
        policy has anything to decide. Measured: with either axis alone,
        RecordWritePolicy = "SOURCE_TREE" is behaviourally identical to
        "SHARED_ONLY" and this config would pass -- silently, which is the
        failure mode a regression config exists to prevent.

        It therefore does not run to exhaustion; the full 3x2 shape was measured
        at 364,454 distinct states and still climbing at 200s, 7x over
        budgets.max_distinct_states. It does not need to. A counterexample is a
        WITNESS: TLC checks invariants as it generates and finds this one at
        depth 7 in one second, 2,815 distinct states in. The must-pass twin of
        the same claim IS run to exhaustion, on each axis separately, in
        External_sync.cfg (3 tiers, 1 path) and External_sync_merge.cfg (2
        tiers, 2 paths), which both now carry the invariant.

  guard_configs:
    purpose: >
      Configs that must keep returning "No error has been found" WHILE MODELLING
      A DEFECT. Each one names an invariant that is witness-dependent and shows
      what is left when the witness is taken away: the entire reachable state
      space explored, nothing found, the work gone. They are the reason the four
      sync invariants are stated where they are, and a guard that starts failing
      means an invariant has been strengthened into something else and the
      record no longer says what it says.
    External_sync_guard_overwrite.cfg:
      policy: HomeSyncPolicy = "OVERWRITE_DESTINATION"
      guards: AReconciliationOnlyWritesPathsTheDestinationDidNotMove
      invariants_checked: [TypeOK, EveryDivergenceFromARecordIsAnEditMadeInThatHome]
      status: passed
      states_generated: 34601
      distinct_states: 7968
      depth: 16
      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 12681 / 3207 / 14."
      why: >
        A reconciliation that overwrites a destination rewrites that
        destination's record in the same step. Afterwards the home is perfectly
        coherent about content nobody chose, and there is nothing in the final
        state that differs from a correct run. This is tla-spec-dev issue #127
        at home-pair granularity, and in a sharper form: the invariant that goes
        vacuous here is not even a report, it is a filesystem-consistency check.
    External_sync_guard_teardown.cfg:
      policy: CloseOutGate = "DISCARD_UNCONDITIONALLY"
      guards: NoHomeIsTornDownWhileItHoldsUniqueWork
      invariants_checked: every sync invariant except the one that reads sync_gone
      status: passed
      states_generated: 74458
      distinct_states: 7708
      depth: 21
      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 2724 / 298 / 8."
      why: >
        The teardown writes nothing, moves nothing and reports nothing, so every
        write-log invariant is satisfied and every coherence check passes -- on
        a home that no longer exists to be incoherent. Only a snapshot taken
        before the directory was removed has anything left to compare against.
    External_sync_guard_conflict.cfg:
      policy: ConflictHandling = "WRITE_THE_CLEAN_PATHS"
      guards: AConflictedUnitIsNeverPartiallyWritten
      invariants_checked: every sync invariant except the one that reads the UnitWasConflicted reason
      status: passed
      states_generated: 11288
      distinct_states: 2556
      depth: 17
      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 2504 / 659 / 14."
      why: >
        A partial write takes only paths the destination had NOT moved, so it
        destroys no edit and the loss invariants hold at every step. Conflict
        atomicity is a claim about coherence, not about loss, and no
        loss-shaped invariant can stand in for it.
    External_sync_guard_skipgit.cfg:
      policy: GitProvenance = "SKIP_GIT"
      guards: CommittedWorkIsNeverDestroyed
      invariants_checked: every sync invariant except the one that reads the sync_committed witness
      status: passed
      states_generated: 11359
      distinct_states: 2188
      depth: 17
      measured: "2026-07-29, on the git axis (GitBackedUnits = TRUE, two tiers, one path)."
      why: >
        A reconciliation rewrites the destination's recorded head in the SAME step
        it replaces the .git that held the commit. Afterwards the home is
        perfectly self-consistent about a history that no longer exists:
        EveryDivergenceFromARecordIsAnEditMadeInThatHome holds because there is no
        divergence, ARecordClaimsNoBaselineTheDestinationNeverStoodOn holds
        because the entries are about worktree paths and those never moved, and
        the teardown gate is satisfied because close-out reports "unchanged". TLC
        explores the whole space and finds nothing. A coherent home is not an
        intact one -- the same result as External_sync_guard_overwrite.cfg one
        dimension across, and the reason sync_committed is written at the moment
        the commit is made rather than derived afterwards.
    External_sync_guard_headonlygit.cfg:
      policy: GitProvenance = "HEAD_ONLY"
      guards: CommittedWorkIsNeverDestroyed
      invariants_checked: every sync invariant except the witness-reading one AND GitBookkeepingIsNeverReportedAsWork
      status: passed
      states_generated: 80241
      distinct_states: 13876
      depth: 17
      measured: "2026-07-29, on the git axis (GitBackedUnits = TRUE, two tiers, one path)."
      second_removal_is_the_finding: >
        GitBookkeepingIsNeverReportedAsWork DOES fire on this arm, at depth 5, and
        for the WRONG proposition: on a trace where both homes hold the same
        objects but different tips, a HEAD-only GitAgree calls the unit changed.
        That is the HEAD-only reading OVER-reporting -- the mirror of the defect --
        and it says nothing about the commit that was destroyed. Leaving it in the
        list would let this config look like a caught defect and hide the fact that
        nothing here can see the loss, so it is removed and the removal is
        recorded. This is the only guard in the directory that needed two.
      why: >
        With both removed TLC explores the whole space and finds nothing, which is
        why the regression reached a commit and a review rather than a failing
        check. Nothing about the final state of a home that has lost a side branch
        is wrong: no path diverges from its record, no write was unentitled, the
        record's own git_head matches HEAD exactly BECAUSE HEAD never moved, and
        close-out reports "unchanged" truthfully about every question it asks. The
        repository is coherent; it is simply missing a commit.
    External_sync_guard_ffprovenance.cfg:
      policy: ReconcileProvenance = "MERGE_KIND_ONLY"   # today's code
      guards: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      invariants_checked: every sync invariant except the merge-base one
      status: passed
      states_generated: 480496
      distinct_states: 45542
      depth: 24
      re_measured: "2026-07-29, after #43 made the ROOT tier record-less in Init (a root home is installed into, never materialized into) and DestMovedAt gained the NoBaseline guard. Was 5927 / 584 / 10."
      why: >
        The finding, not just the guard. "The destination had not moved this
        path" is TRUE for every write CHM-9 makes -- the project home really had
        not moved anything, it was a pristine copy. What it was a pristine copy
        OF is the only thing that separates safe from destructive here, and no
        invariant about the destination alone can see it. That is why the second
        invariant exists and why it is stated over sync_history.

  reachability_configs:
    purpose: >
      Round-trip is not a safety property, so it cannot be stated as one. It is
      checked as its negation: a config whose counterexample IS the deliverable.
    External_sync_roundtrip.cfg:
      invariant: NoWorktreeEditEverReachesTheRootHome
      expect: counterexample
      status: violated_as_expected
      trace_depth: 3
      trace: EditUnitInHomeTier(worktree, p1) -> ReconcileHomeTiers(worktree, project) -> ReconcileHomeTiers(project, root)
      why: >
        Every other config in this directory checks that the mechanism does not
        destroy anything. A mechanism that moves nothing at all satisfies every
        one of them -- over-holding-back is safe and worthless -- and this is
        the only check here that would notice. If it ever stops producing a
        counterexample the return path has ceased to exist.

  # ------------------------------------------------------------------------
  # THE NEGATIVE RESULT, restated at home granularity and re-measured.
  #
  # An earlier ticket on this epic established that a REPORTING invariant cannot
  # catch silent destruction: under OVERWRITE_LOCAL_CHANGES with only
  # EveryPassReportsExactlyTheHeldBackUnits, TLC returns "No error has been
  # found", because after an overwrite the unit is no longer modified and both
  # sides of the equivalence go false together. It fails only against the
  # agent_edits witness. Every invariant added at home level was held to the
  # same standard, and this pair is the proof.
  negative_result:
    property: a self-consistent report is worthless as an invariant
    config: External_regression_rewritecontent_reportonly.cfg
    policy: CloneContentPolicy = "REWRITE"
    invariants_checked: [TypeOK, EveryToleratedContentReferenceIsReported]
    result: >
      "Model checking completed. No error has been found." 2966 states generated,
      706 distinct states found, 0 states left on queue, depth 12 -- the ENTIRE
      reachable state space, not a truncated search. After the rewrite there is
      no surviving content reference, so the antecedent of the reporting
      invariant goes false and the equivalence holds vacuously: the report is
      perfectly self-consistent about a record that has been silently destroyed.
    contrast:
      config: External_regression_rewritecontent.cfg
      invariants_checked: [TypeOK, ..., AuthoredContentIsNeverRewritten]
      result: >
        "Error: Invariant AuthoredContentIsNeverRewritten is violated." 2 states
        generated, depth 2, trace CloneHomeIntoProject. The only difference
        between the two runs is an invariant that reads the home_authored
        witness -- the record that those bytes WERE there.
    keep_both: >
      External_regression_rewritecontent_reportonly.cfg is the one config in this
      directory that must keep returning "No error has been found" while modeling
      a regression. If it ever starts producing a violation, the reporting
      invariant has been strengthened into something else and this record no
      longer says what it says.
    evidence: ../results/chm-home-isolation-tlc.txt
  # ------------------------------------------------------------------------
  # THE NEGATIVE RESULT, restated for home-to-home reconciliation, and in a
  # stronger form than the two before it.
  #
  # The unit-level version showed a REPORT cannot catch silent destruction. The
  # home-level version showed the same at home granularity. This one shows that
  # a FILESYSTEM CONSISTENCY CHECK cannot either -- which is worse, because a
  # consistency check feels like it is looking at the thing itself.
  negative_result_sync:
    property: a coherent home is not an intact one
    config: External_sync_guard_overwrite.cfg
    policy: HomeSyncPolicy = "OVERWRITE_DESTINATION"
    invariants_checked: [TypeOK, EveryDivergenceFromARecordIsAnEditMadeInThatHome]
    result: >
      "Model checking completed. No error has been found." 9545 states
      generated, 2357 distinct, 0 left on queue, depth 14 -- the entire
      reachable state space. Every reconciliation rewrites the destination's
      materialization record over the tree it just wrote, so after destroying an
      agent's work the destination agrees with its own record exactly, at every
      path, and nothing in the final state distinguishes it from a correct run.
    contrast:
      config: External_regression_syncoverwrite.cfg
      invariants_checked: [TypeOK, AReconciliationOnlyWritesPathsTheDestinationDidNotMove]
      result: >
        "Error: Invariant AReconciliationOnlyWritesPathsTheDestinationDidNotMove
        is violated." 14 states generated, depth 3. The only difference between
        the two runs is an invariant that reads the sync_unsound write log --
        the record that the write was not entitled to happen.
    second_finding: >
      A second, independent instance of the same lesson was found while writing
      this slice, and it is the more useful one because it caught a REAL defect
      rather than a modelled policy. Under today's ReconcileProvenance rule
      (External_sync_guard_ffprovenance.cfg), the write log's own
      "the destination had not moved this path" test is TRUE for every write the
      defect makes: the project home genuinely had not moved anything. A witness
      can be perfectly correct and still blind, and the fix was not a better
      witness of the same kind but a witness of a DIFFERENT question --
      sync_history, "did the source ever pass through this state" -- which is a
      fact about the other home entirely.
    keep_all_four: >
      External_regression_rewritecontent_reportonly.cfg,
      External_sync_guard_overwrite.cfg, External_sync_guard_teardown.cfg and
      External_sync_guard_conflict.cfg must all keep returning "No error has
      been found" while modelling a regression. Any of them starting to produce
      a violation means the invariants it checks have been strengthened into
      something else and these records no longer say what they say.
    evidence: ../results/chm-home-sync-tlc.txt

  complexity:
    external:
      command: tla-spec-dev --spec-root specs analyze complexity specs/desired_program_model/External.tla specs/desired_program_model/External.cfg --manifest specs/desired_program_model/spec_manifest.yaml --tlc-report specs/results/chm-external-tlc.txt
      bound: 108
      distinct_states: 250
      warnings: none
      evidence: ../results/chm-external-complexity.txt
    internal:
      command: tla-spec-dev --spec-root specs analyze complexity specs/desired_program_model/Internal.tla specs/desired_program_model/Internal.cfg --manifest specs/desired_program_model/spec_manifest.yaml --tlc-report specs/results/chm-internal-tlc.txt
      bound: 432
      distinct_states: 2065
      warnings: "component C1 touched by 12 actions, exceeding max_component_actions 8 (see budgets.rationale)"
      evidence: ../results/chm-internal-complexity.txt
    monolith:
      command: tla-spec-dev --spec-root specs analyze complexity specs/desired_program_model/SkillManager.tla specs/desired_program_model/MC_program_promotion.cfg --manifest specs/desired_program_model/spec_manifest.yaml
      bound: 2
      warnings: "C1 has 21 variables, C2 has 16 variables and 9 actions; 36 of 37 variables resolve as unconstrained"
      evidence: ../results/chm-monolith-complexity.txt
  unit_tests:
    command: "HOME=<sandbox> jbang -Duser.home=<sandbox> RunTests.java"
    baseline: "709 passed, 0 failed"
    after: "723 passed, 0 failed"
    new_suite: src/test/java/dev/skillmanager/store/HomeSyncMergeTest.java
    new_cases: 14
    covers: >
      What a Test Graph node cannot reach cheaply: the merge algebra decided
      path by path with absence as a value (added / deleted on each side, and
      delete-versus-edit), conflict atomicity with a cleanly-mergeable path
      present alongside the conflict, the reconcileKind protection against a
      second source change, record-absent and unknown-mode conservatism, the
      absent-per-file-baseline refusal, HomeLock placement / re-entrancy /
      release-on-failure / per-home independence, and the close-out gate
      followed by an ACTUAL teardown.
    mutation_proof:
      mutations: 5
      killed: 5
      floor: budgets.kill_rate_floor 0.8
      note: >
        Every kill is on a filesystem fact -- bytes, a file's existence, or a
        directory listing -- never on an exit code or a status enum, and two
        assertions were reordered to put the bytes first after a first pass
        killed on the status. Every mutation was reverted and verified with
        `shasum -a 256 -c`.
      evidence: ../results/chm-home-sync-mutations.txt
    observed_flakiness: >
      Two unrelated cases failed once each across six full runs and passed on
      every other run, including the pre-change baseline: three cases in
      ProjectTrunkSyncTest (git publish/push) and one in HomeSyncTest
      ("close-out refuses while the worktree holds work"). Not reproduced, not
      diagnosed, and recorded rather than explained away. Another agent was
      running test_graph against this checkout throughout.
  spec_unit:
    status: not_run
    blocked_on: case_adapters.toml mappings for the new actions (ticket CHM-4)
  graph:
    status: nodes_authored_and_passing_generated_cases_pending
    blocked_on: >
      Generated external cases and their adapter classes (ticket CHM-8). The
      Test Graph NODES half is no longer blocked: every External action now has
      a node and named assertions driving the real CLI, recorded action by
      action in testgraph_bindings.yml. What is missing is
      specs/desired_program_model/adapters.py, tlc_projection.py, and a
      generated external case package — case_codegen.generation_status is still
      `planned`, so there are no cases for the bindings to bind. See the
      `blocked:` block at the end of testgraph_bindings.yml.
    testgraph_bindings: testgraph_bindings.yml
    new_graph_home_level:
      name: home-clone
      command: python3 skills/test_graph/scripts/run.py home-clone
      status: passed
      nodes: 8
      assertions: 59
      models: External.tla HomeSpec
      note: >
        Clones a SYNTHETIC fixture home into a scaffolded project, points
        SKILL_MANAGER_HOME at the copy, writes through the copy, renames the
        source away, and asserts the source is BYTE-IDENTICAL by independent
        digest rather than by reading the clone's report. The fixture is built
        rather than copied from the developer's home: that home is 5.4 GB,
        /private/tmp has less free space than that, and the standing constraint
        on issue #1 forbids writing to it. It carries one artifact per problem
        class issue #20 measured -- an absolute in-unit symlink into the store,
        an absolute bin/cli symlink, a shim with the home path in its body, a
        shim whose target is under a skipped root, a pm/ entry, a venvs/ entry,
        legacy-form absolute state records, and an authored file that
        legitimately records an absolute home path.
      sandboxing: >
        Every subprocess gets SKILL_MANAGER_HOME, CLAUDE_HOME,
        CLAUDE_CONFIG_DIR, CODEX_HOME, GEMINI_HOME, HOME and
        JAVA_TOOL_OPTIONS=-Duser.home=<sandbox>. ProjectDependenciesResolved
        passes only the first and SKILL_MANAGER_INSTALL_DIR, which is issue #18:
        the agent-home fallbacks end at user.home, and on macOS the JVM derives
        user.home from the OS and ignores $HOME. A dedicated node
        (home.clone.no.agent.home.leak) asserts the OUTCOME rather than trusting
        the helper.
      mutations_registered: 17
      mutations_killed: 17
      mutation_note: >
        14 production-code mutations plus 3 artifact fault injections for the
        strictly-ordered tail nodes, which no production mutation can reach --
        every one is caught earlier by home.cloned.into.project's independent
        scan. Two mutations initially killed NOTHING and each exposed a real
        gap that is now closed: disabling HomeCloner.reanchorLedgers was
        invisible because reanchorRemainingState's byte substitution covers the
        same files (the clone silently degrades from relocatable to
        correct-once), and a ledger left naming the source home was invisible
        because `bindings list` never prints sourcePath. See
        specs/results/chm-home-isolation-mutations.txt.
      findings:
        - >
          `home describe` recomputes the descriptor from the home on every call
          and never reads the stored one back except for envContributions, so
          HomeDescriptor.decodeTravelling is unobservable through the CLI:
          disabling it entirely changes no output. The stored form is asserted
          by reading the file directly instead.
        - >
          BindingStore reconstructs deterministic default-agent bindings, so
          deleting a clone's installed/<unit>.projections.json does not make
          `bindings list` lose them.
    new_graph:
      name: project-child-home
      command: python3 skills/test_graph/scripts/run.py project-child-home
      status: passed
      nodes: 11
      note: >
        Drives `project resolve`, `project sync`, and prune end to end against
        throwaway projects. Each behavior was proven sensitive by mutating
        production code until the property was violated and confirming the
        matching assertion failed: LINK materialization, PRESERVE_LINK,
        OVERWRITE_LOCAL_CHANGES, silent hold-back, prune-ignores-local-changes,
        raw source digest, DELETE_THEN_WRITE, and a displaced tree parked beside
        the unit.
    home_sync_graph:
      name: home-sync
      command: python3 skills/test_graph/scripts/run.py home-sync
      status: passed
      nodes: 12
      assertions: 124
      models: External.tla SyncSpec
      landed: ea03c22, extended by the CHM-9 / CHM-10 fix
      note: >
        Authored separately and landed the same day this slice was modelled,
        which is why testgraph_bindings.yml briefly recorded these actions as
        having no node. Corrected there against the graph's real node and
        assertion ids. All four directions between the three tiers, driving the
        real CLI over real homes, with every survival claim taken as a per-file
        digest immediately before and after the pass. CHM-12 is closed by it.
      independent_findings: >
        That graph reported two findings of its own and both are now fixed. The
        merge baseline that went STALE (too old) and turned a clean fast-forward
        into a spurious conflict was the third direction of the one baseline
        question and was fixed with CHM-9 and CHM-10 rather than after them --
        `home clone` restates the baseline of a COPY unit whose inherited record
        describes content the copy does not hold, and home.sync.stale.baseline
        now measures reconciledWithoutAHuman = 1, spuriousConflict = 0. `home
        sync` / `home close-out` now catch FrozenHomeException and return its
        declared exit code 9 instead of a picocli stack trace.
      new_node: >
        home.sync.provenance, 12 assertions: CHM-9 as the three-command sequence
        it actually occurs in (sync up, close out, remove the worktree, sync
        down) and CHM-10 as three merges from one source. Neither is reachable
        in a single command, and every intermediate command reported success
        while the work was being destroyed, which is why they needed an
        end-to-end node and not only the unit pins.
    affected_graphs:
      - home-clone
      - project-child-home
      - project-resolve
      - project-smoke
      - project-profiles
      - harness-smoke
      - smoke
      - source-tracking
    strengthened_nodes:
      - graph: project-resolve
        node: project.dependencies.resolved
        was: >
          Asserted child units with Files.isRegularFile, which follows symlinks
          and is therefore true both of a symlink into the parent store and of
          an independent copy. It asserted reachability, never independence.
        now: >
          Adds NOFOLLOW/toRealPath independence checks, COPY-mode
          materialization records, a no-store-links-in-unit scan, and an actual
          write into the child unit with the parent store compared afterwards.
      - graph: project-profiles
        node: project.profiles.resolved
        was: >
          Asserted dev_profile_child_home_is_isolated and
          review_profile_child_home_is_isolated entirely with follow-links calls.
          Both profiles claim the same unit, which under the pre-epic symlink
          child home was literally the SAME directory — so both assertions passed
          then too, and still pass under a LINK-mode mutation today.
        now: >
          Adds that the shared unit is a DISTINCT real copy in each profile child
          home, that neither resolves into the parent store, that both carry COPY
          materialization records, and that an edit in one profile reaches neither
          the sibling profile nor the parent store.
      - graph: project-smoke
        nodes:
          - project.global.sync.cli.refresh
          - project.local.sync.cli.refresh
        was: >
          Asserted the child-home CLI shim with Files.isExecutable, which follows
          symlinks and is therefore equally true of a copied binary.
        now: >
          Adds project_child_cli_is_a_symlink_at_the_parent_shim, comparing the
          RAW link target against the parent bin entry. Shims are the one
          documented exception to copy materialization; a copy here would
          silently pin the project to a toolchain the parent may later upgrade.
      - graph: harness-smoke
        node: harness.child.home.materialized
        was: >
          Asserted child units with Files.exists(NOFOLLOW), which is equally
          true of a symlink and of a real directory — vacuous from the other
          direction. 14 assertions could not distinguish symlink from copy.
        now: >
          Same independence checks as above, plus an explicit assertion that CLI
          shims DO stay symlinks at the parent bin entry, which is the one
          documented exception to copy materialization.

