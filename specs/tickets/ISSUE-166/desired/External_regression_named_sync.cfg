\* Regression model for the pre-#166 claimant refresh that independently pulled
\* upstream B after the public command selected and persisted A.
\* Expected outcome: the named-sync invariants are violated while every
\* carried-forward invariant remains active.
SPECIFICATION NamedSyncRegressionSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  \* Git-backed unit dimension (issue #29). FALSE pins every variable it
  \* adds at its initial value, so this config explores exactly the state
  \* space it explored before the dimension existed.
  GitBackedUnits = FALSE
  GitProvenance = "SPLIT_AT_GIT"
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  \* Home-level policies. The desired configuration; this config does not vary
  \* them -- it checks the unit-level slice, whose actions leave every
  \* home-level variable at its initial value.
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  \* Three-tier reconciliation policies. The desired configuration; this
  \* config does not vary them -- it checks a slice whose actions leave every
  \* sync variable at its initial value.
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "SOURCE_WITNESSED"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  ChildHomeWritesNeverReachTheParentStore
  AgentEditedChildUnitsAreNeverDestroyed
  EveryPassReportsExactlyTheHeldBackUnits
  UnmodifiedChildUnitsConvergeOnTheirSource
  ResolveLeavesOnlyClaimedOrHeldBackUnits
  SuccessfulNamedSyncHasOneSelectedRevision
  AutomaticClaimantRefreshPerformsNoSourceSelection
