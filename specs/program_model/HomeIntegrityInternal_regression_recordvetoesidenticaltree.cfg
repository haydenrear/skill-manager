\* HIS-1, clause 1. `disposable()` asks the RECORD as well as the source:
\* sourceHeldTheseBytes && recordIsAboutThisSource. A tree byte-identical to
\* what the live source is standing on is held back because its record names a
\* worktree that was deleted in July.
\*
\* Expected outcome: AnIdenticalTreeIsDisposableWhateverItsRecordNames FAILS.
\*
\* ADivergentTreeIsNeverSilentlyReplaced is listed too and must NOT be the
\* invariant TLC names. The broken rule still holds back everything that
\* differs -- it is strictly MORE conservative -- so if TLC reports clause 2
\* here, the model is wrong rather than the fix. That is the mechanism-A check
\* the vacuity ledger asks for, written into the configuration instead of into
\* a note nobody re-runs.
SPECIFICATION RecordVetoesIdenticalTreeSpec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ADivergentTreeIsNeverSilentlyReplaced
  AnIdenticalTreeIsDisposableWhateverItsRecordNames
