\* #390 bug 2, in the reconcile itself. gitDestIsBehind accepted the
\* destination when the source could reach its head from ANY ref, so a source
\* on an older head whose origin/main named the destination head was a
\* "fast-forward", and applying it rewound the destination.
\* Expected outcome: ASyncNeverMovesTheDestinationBackwards FAILS.
\*
\* Flipped from the healthy configuration: FastForward = "ANY_SOURCE_REF".
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  MaxTrunk = 2
  SideCommits = {"s1", "s2"}
  RefContainment = "UNPUBLISHED_REFS"
  FastForward = "ANY_SOURCE_REF"
  RemedyPolicy = "NEVER_BACKWARDS"

INVARIANTS
  TypeOK
  UnpublishedWorkIsNeverDestroyed
  ASyncNeverMovesTheDestinationBackwards
  AnAncestorCopyWithNothingUnpublishedIsNeverBlocked
  NoRemedySyncsTowardANewerDestination
