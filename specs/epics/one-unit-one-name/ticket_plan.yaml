      installer change, no unit removed.
    objective: >
      Measure the baselines for all four goals, and write down ONCE how a unit
      name is addressed -- including that a contained skill is not addressable
      today and that two mechanisms address by different keys.
    existing_seam: >
      MarkdownImportValidator.installedRoot is the name-addressed reader.
      Resolver already carries requestedBy for coordinate-addressed
