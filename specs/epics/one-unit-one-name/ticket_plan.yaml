  - id: OUN-12
    assignment_issue: https://github.com/haydenrear/skill-manager/issues/316
    delivery: main
    delivery_reason: >
      Delivered as its own PR against the DEFAULT branch, not into this epic
      branch, and that is a deviation from rule 4 recorded deliberately. A
      Skill Manager home is about to be baked into a container image; these
      four have to be on main for that, and an epic branch merges to main only
      at finalization. #309 and #314 took the same route for the same reason.
      They are scheduled here so the epic OWNS them and its terminal evaluation
      decides their goal -- not so they queue behind the one-name chain.
    title: A home can be copied on a platform without copy-on-write
    wave: 6
    depends_on: []
    blocks:
      - OUN-8
    promotion_order: 12
    promotion_predecessor: OUN-10
    contribution: primary
    slice: >
      The copy path's platform assumptions and what a copy carries that is
      machine-specific. Not a container build, not a Dockerfile.
    objective: >
      Make the copy work, and its cost known, where clonefile(2) does not
      exist -- and stop a copy carrying binaries for the wrong platform.
    existing_seam: >
      Fs.copyRecursive already documents that COPY_ATTRIBUTES is what takes the
      clonefile(2) path on APFS, and the cost node already probes block sharing
      with controls. What is missing is a fallback and a platform-aware
      decision about pm/, which is in PROVISIONABLE_ROOTS but NOT in
      SKIPPED_DIRS -- so it is copied.
    expected_effect: >
      a home copies on Linux with a known cost, and carries no Mach-O binary
      into a Linux image
    local_signal: >
      the cost node no longer SKIPS on the platform CI runs, and pm/ is either
      skipped or re-provisioned for the target
    test_constraint: >
      The cost assertion must not be satisfied by skipping. A node that skips
      on the only platform CI runs asserts nothing there, which is the present
      state.
    conflict_keys:
      production: ["store/home-copy-platform"]
      tla: []
      adapters: []
      test_graph: ["home-clone"]
      workflow: []
    goals:
      - goal: GOAL-a-home-survives-being-copied-into-an-image
        contribution: direct
        expected_effect: property (d) no -> yes
        local_signal: the copy runs on Linux and holds no Mach-O binary
