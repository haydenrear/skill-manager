# Ticket plan -- one-unit-one-name.
#
# The spec-workflow slot is FREE for the first time in this repository's recent
# history: child-home-materialization-workflow was closed on 2026-09-05 and
# specs/current + specs/desired_program_model were removed from main. This plan
# is still canonical for scheduling and issue assignment; scaffolding a TLA
# workflow on top of it is an owner decision that has not been taken.
version: 1
schedule_revision: 1
name: one-unit-one-name
slug: one-unit-one-name
branch: epic/one-unit-one-name
base: "e07e577"
repository: haydenrear/skill-manager
ticket_prefix: OUN
updated: "2026-09-05"

purpose: >
  A unit name does not mean one thing in a home, and nothing can tell you what
  depends on what.

  THREE FACTS, MEASURED 2026-09-05. (1) A skill contained in a plugin is not
  addressable at all: MarkdownImportValidator.installedRoot resolves a `unit:`
  name against plugins/, harnesses/, docs/ and skills/ and never looks inside a
  plugin. skt has contained `unit-authoring` since it shipped; nothing imports
  it, because nothing can. (2) There are TWO forward-edge mechanisms with two
  different addressing schemes -- `skill-imports` in markdown frontmatter names
  a unit BY NAME, `skill_references` in skill-manager.toml names it BY
  COORDINATE -- and neither is recorded in installed/*.json, which holds only
  name, version, gitHash, kind, origin, installSource, errors and installedAt.
  So the reverse edge does not exist on disk in either spelling. (3) Asking
  "what imports skill-manager?" today means recursive grep, and it returns a
  DIFFERENT ANSWER PER HOME: 6 units in the project home, 8 in root.

  The consolidation the owner wants -- skill-dev-skill gone, skill-manager-skill
  living inside skt, one plugin -- is blocked on (1), and is unsafe without (3).
  Moving skill-manager-skill today breaks 19 importing files, 14 of them inside
  skt itself.

  The gate this needs is the owner's: a unit name must resolve to ONE copy in a
  home, and a plugin carrying a contained skill whose name already exists
  standalone must be REFUSED rather than merged. That gate is also what makes
  the migration sticky, because during migration both copies exist by
  construction.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-one-unit-one-name/deferred/backlog.yaml
  rule: >
    A failure case outside a ticket's declared slice is appended to the backlog
    with its reproduction and left there. This epic touches the resolver, the
    installer and the unit inventory at once; every one of those invites a
    rewrite. Agents do not widen a ticket into one.

review_policy:
  cadence: wave
  gate: true
  merges: owner
  walkthrough: required
  artifact_root: results/epic-one-unit-one-name/reviews/
  rule: >
    The epic agent merges each wave's PRs into the epic branch in promotion
    order, then writes the review artifact and stops. Silence is not approval.

epic_goals:
  - id: GOAL-one-name-one-copy
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-one-name-one-copy/
    evaluation_ticket: OUN-8
    statement: >
      A unit name resolves to exactly one copy in a home. A plugin carrying a
      contained skill whose name already exists as a standalone unit is refused,
      not merged.
    metric: "(home, unit-name) pairs that resolve to two distinct unit roots"
    harness: >
      A walker over every home that indexes every addressable unit name --
      standalone AND plugin-contained -- and reports each name claimed twice,
      with both roots. Reported per pair; one bad pair is the whole defect.
    baseline:
      value: >
        0 today, but VACUOUSLY: a contained skill is not addressable, so no
        contained name can collide with a standalone one. The number becomes
        meaningful only once OUN-1 lands, which is why OUN-1 precedes the gate.
      measured_at: "2026-09-05"
    target: "0, non-vacuously, with the gate refusing a planted collision"

  - id: GOAL-a-contained-skill-is-addressable
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-a-contained-skill-is-addressable/
    evaluation_ticket: OUN-8
    statement: >
      A skill contained in a plugin can be named by `unit:` in a skill-import
      and resolve, exactly as a standalone skill does.
    metric: "does `unit: unit-authoring` resolve from a markdown skill-import"
    harness: "a unit case that plants an import naming a plugin-contained skill and asserts it validates"
    baseline:
      value: >
        no -- installedRoot has four branches (plugins/, harnesses/, docs/,
        skills/) and none descends into a plugin's contained skills. Measured:
        unit-authoring is in no installed/ record, no skills/ directory, and
        nothing imports it.
      measured_at: "2026-09-05"
    target: "yes"

  - id: GOAL-migration-lands-on-one-skt
    kind: integration
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-migration-lands-on-one-skt/
    evaluation_ticket: OUN-8
    statement: >
      Upgrading a home that holds the old shape leaves skill-dev-skill gone, no
      standalone skill-manager, and exactly one skt -- without the collision
      gate refusing the upgrade that causes it.
    metric: "(skill-dev-skill present, standalone skill-manager present, skt count) after upgrading an old-shape home"
    harness: "bootstrap a home at the pre-epic shape, upgrade it, and read the three counts"
    baseline:
      value: "(1, 1, 1) on the operator root home, measured 2026-09-05"
      measured_at: "2026-09-05"
    target: "(0, 0, 1)"

  - id: GOAL-who-imports-this
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-who-imports-this/
    evaluation_ticket: OUN-8
    statement: >
      One command answers "what in this home imports X" across BOTH edge
      mechanisms, transitively, and terminates on a cycle.
    metric: "can a single command answer it for skill-manager, covering skill-imports AND skill_references, transitively"
    harness: >
      A unit case over a fixture home containing both edge kinds and a
      deliberate cycle; asserts the command names every importer, direct and
      transitive, and returns rather than looping.
    baseline:
      value: >
        no such command. Answering it on 2026-09-05 took recursive grep over two
        homes and produced DIFFERENT ANSWERS -- 6 importing units in the project
        home, 8 in root -- because the two mechanisms live in different files
        with different addressing and neither is indexed.
      measured_at: "2026-09-05"
    target: "one command, both mechanisms, transitive, terminates on cycles"

