# AMENDMENT, schedule_revision 2, 2026-09-05. Four findings from the
# meta-harness effort (DEF-282..285) are scheduled here at the owner's
# instruction, because a Skill Manager home is about to be baked into a
# container image and none of the four survives that. They are a DIFFERENT
# subject from the rest of this epic -- portability of a home across a machine
# boundary, which is substrate-home-model's (#274) territory -- and they get
# their own goal rather than being attached to the one-name goals. Recorded so
# a later reader does not mistake the widened scope for drift.

purpose: >
  A unit name does not mean one thing in a home, and nothing can tell you what
  depends on what.

  THREE FACTS, MEASURED 2026-09-05. (1) A skill contained in a plugin is not
  addressable at all: MarkdownImportValidator.installedRoot resolves a `unit:`
  name against plugins/, harnesses/, docs/ and skills/ and never looks inside a
  plugin. skt has contained `unit-authoring` since it shipped; nothing imports
  it, because nothing can. (2) There are TWO forward-edge mechanisms with two
  different addressing schemes -- `skill-imports` in markdown frontmatter names
  a unit BY NAME, `skill_references` in skill-manager.toml names it BY
  COORDINATE -- and neither is recorded in installed/*.json, which holds only
  name, version, gitHash, kind, origin, installSource, errors and installedAt.
  So the reverse edge does not exist on disk in either spelling. (3) Asking
  "what imports skill-manager?" today means recursive grep, and it returns a
  DIFFERENT ANSWER PER HOME: 6 units in the project home, 8 in root.

  The consolidation the owner wants -- skill-dev-skill gone, skill-manager-skill
  living inside skt, one plugin -- is blocked on (1), and is unsafe without (3).
  Moving skill-manager-skill today breaks 19 importing files, 14 of them inside
  skt itself.

  The gate this needs is the owner's: a unit name must resolve to ONE copy in a
  home, and a plugin carrying a contained skill whose name already exists
  standalone must be REFUSED rather than merged. That gate is also what makes
  the migration sticky, because during migration both copies exist by
  construction.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-one-unit-one-name/deferred/backlog.yaml
  rule: >
    A failure case outside a ticket's declared slice is appended to the backlog
    with its reproduction and left there. This epic touches the resolver, the
    installer and the unit inventory at once; every one of those invites a
    rewrite. Agents do not widen a ticket into one.

review_policy:
  cadence: wave
  gate: true
  merges: owner
  walkthrough: required
  artifact_root: results/epic-one-unit-one-name/reviews/
  rule: >
    The epic agent merges each wave's PRs into the epic branch in promotion
    order, then writes the review artifact and stops. Silence is not approval.

epic_goals:
  - id: GOAL-one-name-one-copy
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-one-name-one-copy/
    evaluation_ticket: OUN-8
    statement: >
      A unit name resolves to exactly one copy in a home. A plugin carrying a
      contained skill whose name already exists as a standalone unit is refused,
      not merged.
    metric: "(home, unit-name) pairs that resolve to two distinct unit roots"
    harness: >
      A walker over every home that indexes every addressable unit name --
      standalone AND plugin-contained -- and reports each name claimed twice,
      with both roots. Reported per pair; one bad pair is the whole defect.
    baseline:
      value: >
        0 today, but VACUOUSLY: a contained skill is not addressable, so no
        contained name can collide with a standalone one. The number becomes
        meaningful only once OUN-1 lands, which is why OUN-1 precedes the gate.
      measured_at: "2026-09-05"
    target: "0, non-vacuously, with the gate refusing a planted collision"

  - id: GOAL-a-contained-skill-is-addressable
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-a-contained-skill-is-addressable/
    evaluation_ticket: OUN-8
    statement: >
      A skill contained in a plugin can be named by `unit:` in a skill-import
      and resolve, exactly as a standalone skill does.
    metric: "does `unit: unit-authoring` resolve from a markdown skill-import"
    harness: "a unit case that plants an import naming a plugin-contained skill and asserts it validates"
    baseline:
      value: >
        no -- installedRoot has four branches (plugins/, harnesses/, docs/,
        skills/) and none descends into a plugin's contained skills. Measured:
        unit-authoring is in no installed/ record, no skills/ directory, and
        nothing imports it.
      measured_at: "2026-09-05"
    target: "yes"

  - id: GOAL-migration-lands-on-one-skt
    kind: integration
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-migration-lands-on-one-skt/
    evaluation_ticket: OUN-8
    statement: >
      Upgrading a home that holds the old shape leaves skill-dev-skill gone, no
      standalone skill-manager, and exactly one skt -- without the collision
      gate refusing the upgrade that causes it, and BY EVERY ROUTE a home
      takes.
    metric: >
      (skill-dev-skill present, standalone skill-manager present, skt count)
      after upgrading a home at the pre-epic shape, measured once per route:
      `install <carrier>` and `sync`.
    harness: >
      bootstrap a home at the pre-epic shape, upgrade it by each route, and
      read the three counts. The homes that exist on the measuring machine are
      READ and reported as context, and are not the verdict.
    baseline:
      value: "(1, 1, 1) on the operator root home, measured 2026-09-05"
      measured_at: "2026-09-05"
    target: "(0, 0, 1) by both routes"
    # AMENDMENT, schedule_revision 4, 2026-09-06, at the owner's instruction:
    # "each project and skill manager home is responsible for migration [...]
    # We need to validate that instead of worrying about every home that
    # exists."
    #
    # The metric was a census -- how many of the homes on this machine hold
    # (0,0,1). That is not a property of the software. It counts homes nobody
    # has synced yet and homes belonging to checkouts nobody has opened, it
    # reads "not yet upgraded" and "cannot be upgraded" as one number, and no
    # amount of correct code drives it to zero.
    #
    # It now grades the MECHANISM, by both routes, because every home migrates
    # itself when it syncs. Widening from one route to two was not cosmetic:
    # the sync route was wired and untested, and it did not work for `sync
    # skill-manager` -- the single command a person runs after being told this
    # migration exists.

  - id: GOAL-who-imports-this
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-who-imports-this/
    evaluation_ticket: OUN-8
    statement: >
      One command answers "what in this home imports X" across BOTH edge
      mechanisms, transitively, and terminates on a cycle.
    metric: "can a single command answer it for skill-manager, covering skill-imports AND skill_references, transitively"
    harness: >
      A unit case over a fixture home containing both edge kinds and a
      deliberate cycle; asserts the command names every importer, direct and
      transitive, and returns rather than looping.
    baseline:
      value: >
        no such command. Answering it on 2026-09-05 took recursive grep over two
        homes and produced DIFFERENT ANSWERS -- 6 importing units in the project
        home, 8 in root -- because the two mechanisms live in different files
        with different addressing and neither is indexed.
      measured_at: "2026-09-05"
    target: "one command, both mechanisms, transitive, terminates on cycles"

  - id: GOAL-a-home-survives-being-copied-into-an-image
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-a-home-survives-being-copied-into-an-image/
    evaluation_ticket: OUN-8
    statement: >
      A home copied onto another machine carries no credential, runs the copy
      it landed in rather than the one it came from, and can be built on a
      platform that is not the one it was made on.
    metric: >
      three independently checkable properties of a copied home: (a) no
      credential travels, (b) no bin/cli entry names the source home, (c) the
      copy is usable on Linux.

      A FOURTH was scoped and withdrawn at schedule_revision 3 -- the gateway
      state a copy inherits (DEF-284, OUN-11, issue #317). It is deferred, not
      solved; it is out of the GOAL so the goal can be decided.
    harness: >
      A probe that copies a home the way an image build would -- not `home
      clone`, which is the APFS-only path -- and answers the three questions on
      the result. Reported per property; one bad property is the whole defect.
    baseline:
      value: >
        0 of 4 AS SCOPED THEN, measured 2026-09-05 on this machine, and the
        letters below are the ORIGINAL four. (c) was withdrawn to
        GOAL-a-copied-home-knows-its-gateway-state at schedule_revision 3, so
        the (d) here is the (c) of the metric above. The prose is left as it
        was measured rather than renumbered: a baseline is a record of a
        reading, and rewriting the reading to match a later scope is how a
        ledger stops being evidence. (a) auth.token is copied
        verbatim, 0600, keys access_token/refresh_token/expires_at -- observed
        by cloning a home holding one, not inferred from the absence of an
        exclusion. (b) bin/cli/tla-spec-dev execs an absolute path into its own
        home, and `home repair` reports 0 findings because its rule is "does
        this reach ANOTHER home", which an own-home absolute path does not.
        (c) three tiers, three gateway states: root owned=true, worktree
        owned=false, project home has no gateway.properties at all, all naming
        one port. (d) pm/ is not in HomeCloner.SKIPPED_DIRS and is 203 MB of
        Mach-O arm64 here; the CoW the three-tier model was adopted on is an
        implicit side effect of clonefile(2) on APFS, and the node that asserts
        it SKIPS where the JDK cannot reflink -- which is the only platform CI
        runs.
      measured_at: "2026-09-05"
    target: "3 of 3"

  - id: GOAL-a-copied-home-knows-its-gateway-state
    kind: quality
    evidence_root: results/epic-one-unit-one-name/goals/GOAL-a-copied-home-knows-its-gateway-state/
    evaluation_ticket: OUN-11
    statement: >
      What a copied home believes about the gateway is decided by a written
      rule, not inherited by accident.
    metric: "do the tiers hold a state some written rule predicts"
    harness: >
      Read gateway.properties in each tier and compare against the rule. The
      rule has to exist first; that is the ticket's own constraint.
    baseline:
      value: >
        no rule exists. Measured 2026-09-05: root gateway.owned=true, worktree
        gateway.owned=false, project home has no gateway.properties at all,
        and two of the three name one port.
      measured_at: "2026-09-05"
    target: "the tiers agree with a rule that is written down"
    carried_to: >
      SPLIT OUT AND CARRIED at schedule_revision 3. This began as property (c)
      of GOAL-a-home-survives-being-copied-into-an-image, and bundling it there
      was the mistake: four independent properties in one goal meant retiring
      one contributor forced a choice between moving the whole goal and moving
      none of it. The plan validator refused the halfway state, correctly.
      Split out, it carries whole to substrate-home-model (#274) with OUN-11,
      and the remaining three properties stay here and stay decidable.

