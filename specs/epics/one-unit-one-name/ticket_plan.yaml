    wave: 1
    depends_on: []
    blocks: ["OUN-1", "OUN-3"]
    promotion_order: 1
    promotion_predecessor: null
    contribution: measurement-and-contract
    slice: >
      The measurement harnesses and the written rule. No resolver change, no
      installer change, no unit removed.
    objective: >
      Measure the baselines for all four goals, and write down ONCE how a unit
      name is addressed -- including that a contained skill is not addressable
      today and that two mechanisms address by different keys.
    existing_seam: >
      MarkdownImportValidator.installedRoot is the name-addressed reader.
      Resolver already carries requestedBy for coordinate-addressed
      skill_references and already has cycle handling. Neither is being changed
      here; both are being described and measured.
    expected_effect: "four baselines where there are none, and one written rule"
    local_signal: "the harnesses run and print numbers; the contained-skill case is RED"
    test_constraint: >
      The addressability baseline must be demonstrated on unit-authoring, which
      exists and is unreachable -- not on a fixture invented for the purpose.
    conflict_keys:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["plan/baseline"]
    goals:
      - goal: GOAL-one-name-one-copy
        contribution: guard
        expected_effect: "a number, and the note that today it is vacuous"
        local_signal: "the walker runs over every home and reports 0 with the reason"
      - goal: GOAL-a-contained-skill-is-addressable
        contribution: guard
        expected_effect: "a failing case naming unit-authoring"
        local_signal: "the case is RED on today's tree"
      - goal: GOAL-who-imports-this
        contribution: guard
        expected_effect: "the two-mechanism finding written down with counts per home"
        local_signal: "6 and 8 reproduced by the harness rather than by grep"

