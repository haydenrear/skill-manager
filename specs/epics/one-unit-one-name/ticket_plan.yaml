    conflict_keys:
      production: ["resolve/installed-root"]
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    goals:
      - goal: GOAL-a-contained-skill-is-addressable
        contribution: direct
        expected_effect: "no -> yes"
        local_signal: "the OUN-0 case flips green without being edited"

