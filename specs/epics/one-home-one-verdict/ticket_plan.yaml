  refusal_on_record: >
    tla-spec-dev --spec-root specs scaffold workflow --dry-run -> "the accepted
    program model is incomplete" (actions.yml, adapters.py, providers.py,
    effect_provider_usage.yaml, tlc_projection.py missing). Not onboarded here.

purpose: >
  Commands that judge a home disagree with each other and with the disk, CI has
  been red for a week, and plugin updates do not reach Claude in some homes.

  Kickoff baseline on v0.27.2 (results/epic-one-home-one-verdict/baseline/
  2026-09-13-v0.27.2/): on 50 of 61 homes `home verify` exits 0 while `home
  repair` finds damage; root and this project home carry 4 damaged facts each
  while all five verdict commands exit 0; `home repair` exempts a shim its own
  rewrite left half-anchored (DEF-OHV-001); graph_set=full fails 6 of 25.
  This epic fixes each defect where it lives, makes `verify` and `repair`
  unable to disagree, and pins every shape with a regression graph.

adjacent:
  - {issue: 351, why: "Gemini consumes no plugins -- agent projection, not home verdicts"}
  - {issue: 353, why: "eval harness: a max_turns run loses Stop-hook graders (#328)"}
  - {issue: 327, why: "remove/uninstall on unpushed checkouts -- owner decision on remove friction"}
  - {issue: 269, why: "HBR-1 child-home shim boundary -- the open home-boundary-resolution epic"}
  - {finding: DEF-OHV-006, why: "skt ticket sweep cannot prove squash-merged work -- skt plugin"}
  - {finding: DEF-OHV-009, why: "git-epic-workflow validator cannot retire one contributor to a shared goal"}
  - {what: "one home-state reader; one writer behind the five records; TLA spec baseline onboarding", why: "dropped at schedule_revision 2 -- unmeasured recurrence claims"}

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-one-home-one-verdict/deferred/backlog.yaml
  rule: >
    A failure case outside a ticket's declared slice is appended to the backlog
    with its reproduction and left there. Search results/*/deferred/backlog.yaml
    and GitHub issues for a duplicate BEFORE filing, and name the disk
    observation that shows a home-state defect so it can be planted in
    home-verdicts. Every defect is also recorded in bug attribution under
    results/epic-one-home-one-verdict/attribution/.

review_policy:
  cadence: wave
  gate: false
  merges: owner
  walkthrough: required
  artifact_root: results/epic-one-home-one-verdict/reviews/
  rule: >
    Owner decision 2026-09-13 (schedule_revision 2): the epic agent implements
    every ticket, merges each wave's PRs into the epic branch in promotion
    order, commits a review artifact per wave, and continues without stopping.
    It stops at finalization, before the epic PR merges to main, and
    immediately on a blocking finding or a merge conflict. Each wave's graph
    evidence is a CI run on the epic branch (`gh workflow run ci.yml --ref
    epic/one-home-one-verdict -f graph_set=full`) read from
    graphs-executed.json. Graphs stay suspended on push/PR (owner, same day).

validation_standards: >
  Run the real thing on real homes: for any change to what a sync installs,
  retires or reports, back up installed/ and run this repo's ./skill-manager
  against real project homes (not commit-diff-context-parent unless the owner
  says so). A local graph sweep's count is not evidence; CI per-graph jobs are.
  macOS can disagree with Linux CI on home-path scans (#343). Run local graphs
  with GRADLE_OPTS="-Dorg.gradle.daemon=false" and, from a worktree,
  COMPOSE_PROJECT_NAME=skill-manager -- and never two local graph runs at once.

