# Ticket plan -- one-home-one-verdict (#337).
#
# STAGED SPEC WORKFLOW, by owner decision 2026-09-13 ("do 3"). The owner chose a
# full TLA workflow, but `tla-spec-dev scaffold workflow` refuses on this
# repository: the accepted program model lacks actions.yml, adapters.py,
# providers.py, effect_provider_usage.yaml and tlc_projection.py. So:
#   - wave 1 closes on evidence under results/, like the three preceding epics;
#   - OHV-7 onboards the baseline in wave 1;
#   - at wave-1 close the epic agent scaffolds specs/current +
#     specs/desired_program_model ONCE, bumps schedule_revision, and re-renders
#     the assignments of waves 2-5 to open and close through tla-spec-dev.
# Every ticket from wave 2 on depends on OHV-7 for that reason.
version: 1
schedule_revision: 1
name: one-home-one-verdict
slug: one-home-one-verdict
branch: epic/one-home-one-verdict
base: "71c5146489fea3283e9df81dba311f53f4169c9e"
repository: haydenrear/skill-manager
ticket_prefix: OHV
updated: "2026-09-13"
spec_workflow:
  state: staged
  blocked_by: OHV-7
  scaffold_at: wave-1 close, by the epic agent
  refusal: >
    tla-spec-dev --spec-root specs scaffold workflow --dry-run OHV-0 ... ->
    "the accepted program model is incomplete", five baseline files missing.

purpose: >
  A home has no single description of itself, so every guard reimplements a
  partial one.

  41% of 154 findings across three epic backlogs are a guard whose rule is
  narrower than its name; 25% are two records of one fact disagreeing; 19.5%
  are a home's identity written as an absolute path. Five commands answer five
  different questions about one home, and the kickoff baseline on v0.27.2
  (results/epic-one-home-one-verdict/baseline/2026-09-13-v0.27.2/) measured all
  five exiting 0 on root and this project home, which carry four damaged facts
  each. The sharpest instance is DEF-OHV-001: `home repair` exempts a shim its
  own rewrite left half-anchored, because its rule is "can I rewrite this", not
  "does this name the home".

adjacent:
  - {issue: 351, why: "Gemini consumes no plugins -- agent projection, not home verdicts"}
  - {issue: 353, why: "eval harness: a max_turns run loses Stop-hook graders (#328)"}
  - {issue: 327, why: "remove/uninstall on unpushed checkouts -- owner decision on remove friction"}
  - {issue: 269, why: "HBR-1 child-home shim boundary -- the open home-boundary-resolution epic"}
  - {finding: DEF-OHV-006, why: "skt ticket sweep cannot prove squash-merged work -- skt plugin"}

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-one-home-one-verdict/deferred/backlog.yaml
  rule: >
    A failure case outside a ticket's declared slice is appended to the backlog
    with its reproduction and left there. Two additions for this epic, agreed
    2026-09-13: (1) search results/*/deferred/backlog.yaml and GitHub issues for
    a duplicate BEFORE filing -- 155 predecessor findings are uncross-referenced
    and #334 duplicated #292; (2) a finding about home state names the disk
    observation that shows it, so it can be planted as a shape for
    GOAL-one-verdict. Every defect is also recorded in bug attribution under
    results/epic-one-home-one-verdict/attribution/.

review_policy:
  cadence: wave
  gate: true
  merges: owner
  walkthrough: required
  artifact_root: results/epic-one-home-one-verdict/reviews/
  rule: >
    The epic agent merges each wave's PRs into the epic branch in promotion
    order, then writes the review artifact and stops. Silence is not approval.
    Each wave's graph evidence is a CI run on the epic branch
    (`gh workflow run ci.yml --ref epic/one-home-one-verdict -f graph_set=full`)
    read from graphs-executed.json -- a local sweep's count is not evidence.

validation_standards: >
  Run the real thing on real homes: for any change to what a sync installs,
  retires or reports, back up installed/ and run this repo's ./skill-manager
  against real project homes (not commit-diff-context-parent unless the owner
  says so). macOS can disagree with Linux CI on home-path scans (#343). An eval
  measures only a released build.

