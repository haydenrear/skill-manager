# Ticket plan -- one-home-one-verdict (#337).
#
# AMENDMENT, schedule_revision 2, 2026-09-13, owner decision. Recorded before any
# ticket was started: no branch, PR or commit exists for any ticket at revision 1.
#
#   "So this is great. Can you go ahead and do the entire epic? Make sure we're
#    adding test graphs to catch regressions - and we need to fix our CI and
#    test graphs as well."
#
# in answer to a walkthrough that found nine of the ten recorded bugs fixable
# where they live, and the epic's two architectural claims -- one home-state
# reader with verify/repair as views (#339), and one writer behind the five
# records (#340) -- justified by recurrence the plan could not measure. So:
#   - the one-reader and one-writer REFACTORS are dropped as goals and slices.
#     #339 becomes a composition: `home verify` fails on what `home repair`
#     finds, and both read agent-dir links and orphaned projection records.
#     #340 is narrowed to #292's fixpoint plus reaping on uninstall/retirement.
#   - the TLA spec workflow is dropped. The epic stays plan-only like the three
#     before it; every ticket closes on evidence under results/.
#   - regression coverage is a TEST GRAPH, `home-verdicts` (OHV-0), planting each
#     known defect shape; every fix adds the node that pins it.
#   - OHV-7 (#357) is re-scoped, not retired: validate_epic_plan.py refuses to
#     retire a ticket while its goal stays active through another ticket
#     (lines 1074-1084), and GOAL-ci-green-fresh-runner stays active through
#     OHV-5. It now owns DEF-OUN-023, split out of #346 -- the same goal, the CI
#     and test-graph work the owner asked for. Recorded as DEF-OHV-009.
#   - review_policy: artifact per wave, no stop until finalization (owner,
#     2026-09-13). Graphs stay suspended on push/PR (owner, 2026-09-13).
