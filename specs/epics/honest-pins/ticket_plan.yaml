# Ticket plan -- honest-pins (#411).
#
# KICKOFF, schedule_revision 1, 2026-11-07. Owner decisions in the kickoff
# conversation:
#   - SPLIT. The cost issues (#410 skt check timeout, #261 specs/.history in
#     every home, #401 close-out byte compare, #402 cloned-home installers)
#     interact little with the pin and record defects; they move to a second
#     draft epic, cheap-checks, so this epic's validation loop stays small.
#   - GOALS accepted as proposed in #411 (goals 1 and 2; goal 3 left with the split).
#   - DEFERMENT inline: a ticket may fix an out-of-slice defect inside its own
#     conflict keys, and records it either way.
#   - REVIEW finalization-only; the epic agent merges ticket PRs, no wave gate.
#   - WORKTREES on /Volumes/dev (owner, same day).
#   - PR #405 (#404) was open against main; it was retargeted to this branch and
#     merged as HP-1 (b9dd09b0) before this plan was written.
