spec_workflow:
  state: none
  decided: "2026-11-07, epic agent, following this repository's epic precedent (one-home-one-verdict, one-unit-one-name)"
  rule: >
    No shared desired/current workflow. Tickets close on evidence under their
    evidence_root and do NOT run `tla-spec-dev open ticket`, `close ticket`,
    `scaffold workflow` or `close_tickets.py`: parallel tickets each promoting
    into specs/program_model collide on spec_manifest.yaml and README.md. HP-1
    landed specs/program_model/CliPinInternal.tla before this rule existed.
    A model of the integrated pin/record behaviour, if wanted, is a finalization
    item (as #379 was for one-home-one-verdict).

purpose: >
  A home says one thing and holds another. A bumped CLI pin kept the old binary
  (#404). `sync --lock` follows the installed ref instead of the pin (#406), and
  `project resolve` reports success off-pin with no way back (#407). `home sync`
  changes skills without arming the drift gate (#403). Recorded versions lag the
  bytes (#298, #103). Onboarding writes no CLI pin (#376). Bytecode is published
  and reads as local edits (#400). System CLIs read as stale shims (#409). A root
  sync removed a declared plugin against a stale cached manifest (#394). The
  commit-diff-context-parent retrospective of its epic #462 (2026-11-06)
  measured the cost.

adjacent:
  - {issue: 387, why: "clean-upgrade draft epic: auth.token, unit-history loss, partial-sync projection, uv lockfiles, shim resolution, write guard"}
  - {issue: 410, why: "cheap-checks (split out): skt check timeout"}
  - {issue: 261, why: "cheap-checks (split out): specs/.history in every home"}
  - {issue: 401, why: "cheap-checks (split out): close-out byte compare"}
  - {issue: 402, why: "cheap-checks (split out): cloned-home installer reruns"}
  - {issue: 331, why: "container work, #274-#279"}

deferment_policy:
  mode: inline
  blocking: escalate
  budget: 5
  backlog: results/epic-honest-pins/deferred/backlog.yaml
  per_ticket_backlog: "results/epic-honest-pins/deferred/{ticket}.yaml"
  rule: >
    Owner decision 2026-11-07: a defect found outside a ticket's slice may be
    fixed inline when the fix stays inside the ticket's own conflict keys; it is
    recorded in the ticket's per-ticket backlog either way, with a reproduction,
    and listed under `## Deferred findings` in the PR. A fix that would touch
    another ticket's conflict keys is recorded, not made. Search
    results/*/deferred/ and GitHub issues for a duplicate first. A finding that
    blocks the ticket's REQUIRED validation escalates to the owner.

review_policy:
  cadence: finalization-only
  gate: false
  merges: owner
  milestones: []
  walkthrough: required
  artifact_root: results/epic-honest-pins/reviews/
  rule: >
    Owner decision 2026-11-07: the epic agent merges ticket PRs into
    epic/honest-pins in promotion order and keeps dispatching. One review
    artifact and walkthrough at finalization, before the epic PR goes to main.
    The epic agent still stops immediately on a merge conflict (back to its
    ticket agent) or a blocking finding. The merge of epic/honest-pins into main
    is the owner's.

validation_standards: >
  Run the real thing on real homes: for any change to what a sync installs or
  records, back up installed/ and run this repo's ./skill-manager against a real
  project home and read the SECOND sync. Local graph runs: GRADLE_OPTS=
  "-Dorg.gradle.daemon=false", JAVA_TOOL_OPTIONS="-Djava.net.preferIPv6Addresses=true",
  COMPOSE_PROJECT_NAME=skill-manager, SKILL_MANAGER_HOME unset, never two runs
  at once, through the installed runner
  .skill-manager/plugins/tla-spec-dev/skills/test-graph/scripts/run.py.
  A graph sweep's verdict comes from its own sweep summary, never from
  build/validation-reports/.

epic_goals:
  - id: GOAL-a-pin-is-honoured
    kind: quality
    evidence_root: results/epic-honest-pins/goals/GOAL-a-pin-is-honoured/
    evaluation_ticket: HP-9
    statement: >
      After any install, sync, `sync --lock` or `project resolve`, every governed
      unit and CLI is at its declared pin, or the command refuses by name. It
      never reports convergence to a different revision.
    metric: >
      Of the planted shapes, how many end at the pin or refuse by name:
      (a) a unit bumps its own CLI pin (#404); (b) a lock's resolved_sha is bumped
      for an installed unit (#406); (c) a unit installed AHEAD of an older pin,
      no local edit (#407); (d) the same with one local edit that applies (#407);
      (e) an MCP binary's install url changes under the same bin_path (#103).
    harness: "the honest-pins test graph (built by HP-0): one node per planted shape"
    baseline:
      value: >
        0 of 5 at 3b92ed6e (0.28.2): (a) measured -- the cli-pin graph and
        CliPinTest fail with the #404 fix disabled; (b)-(d) reproduced in #406's
        and #407's reports (commit-diff-context-parent, 2026-11-06); (e) by
        source, virtual-mcp-gateway provisioning.py:396-406. 1 of 5 at b9dd09b0
        once HP-1 landed. HP-0 re-measures all five on the honest-pins graph.
      measured_at: "3b92ed6ee277d40a09e30039aa49c9da0d13eed6"
      evidence: results/epic-honest-pins/baseline/
    target: "5 of 5"

  - id: GOAL-the-record-describes-the-home
    kind: quality
    evidence_root: results/epic-honest-pins/goals/GOAL-the-record-describes-the-home/
    evaluation_ticket: HP-9
    statement: >
      What skt status, cli-lock.toml, installed/*.json, the drift gate and
      `artifacts stale` say matches what is on disk.
    metric: >
      False or missing reports across the planted shapes: (a) a unit-changing
      `home sync` leaves no pending drift record (#403), and a no-op sync must
      leave none; (b) a unit's installed record (installed/*.json) carries a version that
      disagrees with the synced checkout's manifest (#298); (c) a system-provided CLI is reported as a
      stale cli-shim while a deleted installed shim must still be (#409);
      (d) __pycache__ bytecode is published by `unit publish` or makes sync
      refuse with "extra local changes" (#400); (e) a root-home sync removes a
      plugin the project's own skill-project.toml declares (#394).
    harness: "the honest-pins test graph (built by HP-0) plus `skill-manager artifacts stale --json` on this repository's project home"
    baseline:
      value: >
        Unmeasured as a count; HP-0 measures it. Reported: (a) every unit-changing
        home sync, 0 pending records (#403); (b) skt recorded 0.2.0 while running
        0.8.1 (#298); (c) 7 false positives in this project home, 2026-11-04 (#409);
        (d) recurred 2026-11-06 in commit-diff-context-parent (#400); (e) one
        incident, 2026-09-17 (#394).
      measured_at: "3b92ed6ee277d40a09e30039aa49c9da0d13eed6"
      evidence: results/epic-honest-pins/baseline/
    target: "0 false or missing reports across (a)-(e), with each shape's control arm still detected"

