# Staged ticket plan -- substrate-home-model.
#
# STAGED, NOT ACTIVE, for the same reason as home-boundary-resolution: the
# child-home-materialization-workflow still occupies specs/current and
# specs/desired_program_model.
version: 1
schedule_revision: 1
name: substrate-home-model
slug: substrate-home-model
branch: epic/substrate-home-model
base: "4423b80"
repository: haydenrear/skill-manager
ticket_prefix: SUB
updated: "2026-08-28"

scope_boundary: >
  READ THIS FIRST, because the obvious reading of "integrate with substrate" is
  the wrong one.

  This epic DOES NOT deploy anything to Kubernetes. It does not deploy anything
  to Substrate. skill-manager and skt do not gain the ability to drive
  Substrate, schedule actors, or manage a cluster. Substrate is a control plane
  someone else operates; agents will be deployed onto it by that operator.

  What this epic does is ANSWER A QUESTION ABOUT OUR OWN MODEL: when an agent
  is running inside a Substrate actor, how does skill-manager change management
  propagate? skill-manager has been designed end to end on the assumption that
  every home is on one machine and one filesystem. That assumption is load
  bearing in places nobody has enumerated. This epic enumerates them, decides
  each one, and makes skill-manager and skt SUPPORT the containerized case.

  The expected finding is that most of it does not change -- Claude sub-agents
  will still provision skill-manager homes in worktrees, just inside a
  container. The value is in finding the places where that is NOT true, before
  an agent finds them at runtime.

purpose: >
  Identify and close every machine-local assumption in the home tier model, so
  that root, project and worktree homes have a defined meaning when the machine
  is an ephemeral, suspendable, snapshot-restored container.

premise: >
  There is already one hard-won piece of evidence pointing at the answer: unit
  state reaches another home two different ways, and only one of them crosses a
  machine boundary. `skt publish` goes to the unit's own git repository, which
  is machine-independent by construction. `home sync` walks a parent path on the
  local filesystem, which is not. The three tiers are defined by containment on
  one disk -- a project home is a copy of the root home ABOVE IT, a worktree
  home a copy of the project home ABOVE IT -- and "above" has no meaning across
  two containers. Whether that matters is exactly what SUB-0 measures rather
  than assumes.

non_goals:
  - Deploying skill-manager, skt, or any agent to Kubernetes or Substrate.
  - Any capability for skill-manager or skt to create, schedule, suspend, or
    route Substrate actors.
  - Building a container image as a deliverable of this epic.
  - Changing Substrate. It is a dependency to be supported, not modified.

goals:
  - id: GOAL-every-machine-local-assumption-is-named
    kind: analysis
    statement: >
      Every place the home model depends on one machine or one filesystem is
      written down, with its Substrate consequence and an owner decision.
    metric: "identified machine-local assumptions carrying a recorded disposition"
    harness: >
      A survey checklist over the enumerated surfaces -- home discovery, tier
      derivation, bin/cli and bin/launch shims, home sync, child materialization,
      CLI pins, agent projections, credentials, the drift digest -- each marked
      unaffected / needs-contract / needs-change with the evidence for that call.
    baseline:
      value: "0 -- no inventory exists; the assumption has never been stated, only relied on"
      measured_at: "2026-08-28"
    target: "every surface in the checklist dispositioned, none left 'unknown'"

  - id: GOAL-propagation-paths-are-classified
    kind: analysis
    statement: >
      Each way unit state moves between homes is classified as
      machine-independent or machine-local, with evidence, so it is knowable
      which ones survive containerization.
    metric: "propagation paths classified with evidence"
    harness: >
      For each path -- skt publish, skt sync, home sync, home clone, child
      materialization, project resolve -- demonstrate on a scratch fixture
      whether it can cross a filesystem boundary.
    baseline:
      value: "0 classified. One informal observation: publish uses git, home sync uses a parent path."
      measured_at: "2026-08-28"
    target: "all paths classified, each by demonstration rather than by reading"

  - id: GOAL-the-tiers-have-a-container-meaning
    kind: design
    statement: >
      Root, project and worktree homes have a written, owner-accepted meaning
      when the machine is an ephemeral container -- including what a root home
      IS when there is no durable machine to own it.
    metric: "owner-accepted answer for each of the three tiers"
    harness: "a design document walked through with the owner at the wave review; acceptance is recorded, not assumed"
    baseline:
      value: "0 of 3 -- the tiers are currently defined by containment on one disk"
      measured_at: "2026-08-28"
    target: "3 of 3 accepted"

  - id: GOAL-support-without-driving
    kind: capability
    statement: >
      skill-manager and skt carry whatever the survey shows is needed for a
      containerized tier, and nothing that drives Substrate.
    metric: "named gaps from SUB-0/SUB-1/SUB-2 that are closed, and Substrate-driving APIs added"
    harness: "the gap list from the survey, checked off; plus a review that no Substrate client, CRD, or scheduling call entered the tree"
    baseline:
      value: "gaps unknown until SUB-0 runs; Substrate-driving APIs: 0, and that number must not move"
      measured_at: "2026-08-28"
    target: "every named gap closed; Substrate-driving APIs still 0"

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-substrate-home-model/deferred/backlog.yaml
  rule: >
    This epic's adjacency is the whole product, so the deferment rule matters
    more than usual. A finding that is really "the home model should be
    different" goes to the backlog, not into a ticket. In particular, anything
    that begins "we should just deploy" is out of scope by the scope_boundary
    above and gets escalated to the owner rather than absorbed.

review_policy:
  cadence: wave
  gate: true
  merges: epic-agent
  walkthrough: required
  artifact_root: results/epic-substrate-home-model/reviews/
  rule: >
    Every wave stops for the owner. GOAL-the-tiers-have-a-container-meaning is
    decided BY the review -- acceptance is the measurement, so a skipped review
    is a missed goal rather than a faster epic.

