# Ticket plan -- cheap-checks (#414).
#
# KICKOFF, schedule_revision 1, 2026-11-08. Owner decisions in the kickoff
# conversation:
#   - IDENTITY IS GIT. Owner: "shouldn't we be able to just use if there's a new
#     git tag or new commits to see if we need a new artifact ... this comparison
#     thing is more of a bug ... artifact stale should be immediate ... EVERYTHING
#     IS GIT." A clean git checkout's identity is its commit; bytes are not read.
#   - #261 STAYS IN, reshaped. Owner: "for the specs/.history we should just be
#     excluding certain things from the commit, and the blob - BUT MAKE SURE WE
#     STILL HAVE FULL GIT FUNCTIONALITY." Read as: partial clone plus sparse
#     checkout; history is not rewritten, and commits keep the excluded paths.
#   - SCOPE: #410, #261, #401, #402, plus #402's agent re-projection cost (#442).
#   - TARGETS accepted as proposed for artifacts stale, close-out and installers.
#     The projection and git-functionality clauses follow from the owner's scope
#     and git requirements; they carry no separately agreed number.
#   - DEFERMENT batch. REVIEW finalization-only; the epic agent merges ticket PRs
#     into epic/cheap-checks.
#   - WORKTREES on /Volumes/dev (owner), all provisioned at kickoff.
#
# AMENDMENT, schedule_revision 2, 2026-11-09. Owner decisions after CC-5 merged:
#   - CC-7 added (appended, so every ordinal is unchanged): home clone refreshes
#     git indexes (DEF-CC3-001) and artifacts stale stops reading install scripts
#     (DEF-CC1-001). CC-6 depends on it and promotes after it.
#   - A gitignored file is NOT part of a unit's identity. The "every planted edit"
#     clause reads as tracked, untracked and re-pointed-link edits. The target's
#     numbers are unchanged.
#   - CC-2's scoping of sync --force-scripts stands: named units are forced; other
#     units get no reconcile.
#
# AMENDMENT, schedule_revision 3, 2026-11-09. Owner decisions after CC-6 merged:
#   - CC-8 added (appended): cheap-checks returns to EXCLUDED as local-only,
#     because its timing nodes need macOS time -l and every CI job is ubuntu
#     (DEF-CC6-003). doc-smoke and onboarding matchers are fixed inside the epic
#     (DEF-CC6-001, DEF-CC6-002). CC-8 changes no measured code path, so CC-6's
#     measurement still describes the integrated product.
#   - Carried to main: #454 (DEF-CC6-004), #455 (DEF-CC3-002, DEF-CC5-001).
#   - Manual acceptance: epic agent runs the scenarios, owner reviews the record.
