  rule: >
    No shared desired/current workflow. Tickets close on evidence under their
    evidence_root and do NOT run `tla-spec-dev open ticket`, `close ticket`,
    `scaffold workflow` or `close_tickets.py`.
planning_rules:
  model_ownership_rule: >
    No TLA+ model is opened for this epic (see spec_workflow). Ticket agents run
    no open/close ticket command and no --accept-new. A model change found
    necessary comes back to the epic agent in the PR body.

purpose: >
  skt check, home close-out and sync <unit> cost in proportion to the size of the
  home, not to what changed. Every unit is a git checkout, so what changed is a
  question git already answers.

non_goals:
  - "Raising skt's 6 s artifact budget (#410)."
  - "home clone copying cache/, or changing --force-scripts semantics (#402)."
  - "Rewriting any repository's history, or removing specs/.history from a commit."
  - "Reclaiming specs/.history copies already on disk (#261's companion sweep)."

acceptance_scenario: >
  In a project home holding tla-spec-dev: skt check reports artifacts inside its
  budget and still reports an edited plugin; closing a worktree is quick and
  flat in memory; provisioning a worktree home and syncing one unit runs no
  other unit's installer and projects no other plugin; and an installed unit
  that excludes specs/.history has none of it on disk while log, blame, diff,
  commit, fetch and push all still work.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-cheap-checks/deferred/backlog.yaml
  per_ticket_backlog: "results/epic-cheap-checks/deferred/{ticket}.yaml"
  rule: >
    Owner decision 2026-11-08. Record out-of-slice defects in the ticket's
    per-ticket backlog with a reproduction, keep working the slice, list them
    under `## Deferred findings`. Triage at finalization. Search
    results/*/deferred/ and GitHub for a duplicate first. A finding that blocks
    the ticket's REQUIRED validation escalates to the owner.

review_policy:
  cadence: finalization-only
  gate: false
  merges: owner
  milestones: []
  walkthrough: required
  artifact_root: results/epic-cheap-checks/reviews/
  rule: >
    Owner decision 2026-11-08: the epic agent merges ticket PRs from their
    ticket branches into epic/cheap-checks in promotion order and keeps
    dispatching. One review artifact and walkthrough at finalization. A merge
    conflict goes back to its ticket agent. The merge into main is the owner's.

