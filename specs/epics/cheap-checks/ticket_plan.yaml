  JAVA_TOOL_OPTIONS="-Djava.net.preferIPv6Addresses=true", SKILL_MANAGER_HOME
  unset, through the installed runner
  .skill-manager/plugins/tla-spec-dev/skills/test-graph/scripts/run.py. A ticket
  runs only its declared graphs, once; the full sweep is CC-6's. Graphs that boot
  the gateway (smoke, plugin-smoke) must not run concurrently across worktrees:
  set HONEST_PINS_SERIAL=1. A sweep's verdict comes from its own summary, never
  from build/validation-reports/. Timings are recorded with /usr/bin/time -l.

