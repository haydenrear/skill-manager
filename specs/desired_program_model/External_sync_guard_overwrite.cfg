\* GUARD config -- THIS ONE MUST KEEP RETURNING "No error has been found".
\*
\* Same destructive policy as External_regression_syncoverwrite.cfg, checked
\* with the witness-free invariants only. It explores the ENTIRE reachable state
\* space and finds nothing, because a reconciliation that overwrites a
\* destination also rewrites that destination's record: afterwards the home is
\* perfectly coherent and its report is perfectly truthful about content nobody
\* chose. This is tla-spec-dev issue #127 restated at home-pair granularity, and
\* it is why AReconciliationOnlyWritesPathsTheDestinationDidNotMove is stated
\* over the sync_takes write log instead.
\*
\* If this ever starts producing a violation, one of these two invariants has
\* been strengthened into something else and this record no longer says what it
\* says.

SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "OVERWRITE_DESTINATION"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  SyncTiers = {"project", "worktree"}
  SyncPaths = {"p1", "p2"}

INVARIANTS
  TypeOK
  EveryDivergenceFromARecordIsAnEditMadeInThatHome
