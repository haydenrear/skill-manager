\* EXPECTED-VIOLATION config: "the source is newer, so it wins". Every path the
\* source moved is taken, so a path BOTH sides moved is silently resolved in the
\* source's favour instead of being reported as a conflict.
\* Target: AReconciliationOnlyWritesPathsTheDestinationDidNotMove.
\* Running this must produce a TLC counterexample.
\*
\* Narrowed invariant list: with no conflicts ever declared,
\* AConflictedUnitIsNeverPartiallyWritten is vacuously true here, and the
\* baseline invariant fires on the same states. Each is the declared target of
\* another config in this set.

SPECIFICATION SyncSpec

