\* EXPECTED-VIOLATION config, home level: models the pre-epic write path repaired by HomeCloner's substitution pass.
\* Every clone comes out CORRECT -- nothing in it names the source -- so a leak
\* check passes and `home clone` exits 0. What is lost is that the home is no
\* longer a function of its root: its records name its own absolute location, so
\* moving it breaks them and only another clone repairs them. That is exactly
\* what HomeCloner.reanchorRemainingState warns about when it fires
\* ("consider encoding it at write time"), and it is why the fix is at WRITE
\* time rather than in the copier.
\*
\* Running this must produce a TLC counterexample violating
\* AHomeIsAPureFunctionOfItsRoot. A clean run here is a failure of the
\* invariant, not a pass: it means the desired-state model stopped being able to
\* see this regression.
SPECIFICATION HomeSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "ABSOLUTE_REANCHORED_ON_CLONE"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"

INVARIANTS
  TypeOK
  AHomeIsAPureFunctionOfItsRoot
  NoOwnedSurfaceNamesAnotherHome
  WritesThroughOneHomeReachNoOtherHome
  SourceHomeIsByteIdenticalToItsCloneTimeSelf
  AuthoredContentIsNeverRewritten
  ToolchainRootsAreNeverShared
  AHomeMissingItsToolchainsStillHasItsPackageManagers
  EveryHomeMissingItsToolchainsSaysSo
  EveryToleratedContentReferenceIsReported
