\* CHM-15: the `project resolve` / `project sync` × `home sync` seam.
\*
\* Everything here is the desired configuration EXCEPT ChildRefreshProvenance,
\* which is set to the reading the downward materialization actually used before
\* CHM-15: "does the destination still hold exactly what its record says was
\* written there", and nothing else.
\*
\* That reading is correct for a home whose record is about the store. It is a
\* licence for a home a worktree merged into, because the merge rewrote the
\* record: the tree is pristine relative to it and is a wholesale copy of no
\* store on earth. The counterexample is the epic's own documented flow --
\* resolve, clone, edit, merge back, refresh -- with the ticket's bytes gone at
\* the end and every command reporting success.
\*
\* The violated invariant is the one the whole epic turns on rather than a new
\* one, and deliberately: a reconciliation may destroy bytes only where it can
\* show the source passed through them. `project resolve` is a reconciliation
\* and the parent store is a source. Naming a second invariant for the second
\* writer would have been the same mistake the code made -- one rule read twice.
\* Expected outcome: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough violated.

SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "CONTENT_DIGEST_ONLY"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
