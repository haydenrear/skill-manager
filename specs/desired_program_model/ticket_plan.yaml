# Desired program model + ticket plan for the child-home materialization epic.
# Source of truth for tickets. Keep synchronized with spec_manifest.yaml status.
version: 1
name: child-home-materialization-workflow
updated: "2026-07-28"
purpose: >
  Project child homes stop being symlink farms into the parent store and become
  independent copies that an agent can edit. Every unit in
  <project>/.skill-manager is materialized by copy, carries a per-unit
  materialization record, and is held back and reported -- never overwritten,
  never deleted -- once it has local edits. Symlinks inside a unit that point
  into the parent store are dereferenced so the isolation actually holds, and
  `harness instantiate --child-home-dir` goes through the same materializer.

sources:
  implementation:
    - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
    - src/main/java/dev/skillmanager/project/ProjectChildHomeScaffolder.java
  predecessor_workflow: ../.history/project-and-child-home-workflow/
  superseded_port: "specs/program_model/SkillManager.tla:1315 (@port SkillManagerCli.scaffold_project_child_home)"

problem_statement: >
  The accepted model made this epic's central bug inexpressible.
  ScaffoldProjectChildHome models child_home_units as a bare set of
  <<home, unit>> pairs that only ever grows: there is no notion of what a child
  unit CONTAINS, no notion of materialization, and no notion of independence.
  Under symlinks the parent store unit and the child home unit were the same
  bytes, so "the agent's edit survived" and "the parent store was not touched"
  were the same proposition, and neither could be violated. The first
  implementation of this epic silently deleted an agent's edits on the next
  `project resolve` and the model could not have caught it. Core/Internal/
  External make parent-store content and child-home content two distinct
  objects so all four properties below are statable AND violable.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_validation_rule: Run the narrow affected test_graph graph after unit/current-model checks pass; run all graphs before promotion.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  regression_config_rule: >
    Every desired-state property carries an expected-violation cfg that must
    keep failing. A regression config that starts passing is a defect in the
    invariant, and closing a ticket requires re-running ALL of them -- twenty
    as of 2026-07-27, not the five this rule was first written for.
  guard_config_rule: >
    Every WITNESS-DEPENDENT invariant additionally carries a guard cfg that
    models the same defect with the witness-reading invariant removed, and that
    guard must keep returning "No error has been found". A guard that starts
    failing means the remaining invariants have been strengthened into
    something else and the record of why the witness exists is stale. State for
    each new invariant whether it is witness-dependent; if it is, it needs one.
  dual_representation_rule: >
    While SkillManager.tla and Core/Internal/External coexist, never state the
    same rule in both. See spec_manifest.yaml modules.legacy_monolith.overlap_rule.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.

