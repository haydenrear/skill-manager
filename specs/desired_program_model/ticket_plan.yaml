# Home-level properties, added for T19 (#20). Same shape as the four below:
# invariant, view, statement, and the expected-violation config that must keep
# failing. See spec_manifest.yaml validation.regression_configs for measured
# traces and validation.negative_result for why every one of these is stated
# against a witness or a filesystem fact rather than against a report.
desired_home_properties:
  relocatability:
    invariant: AHomeIsAPureFunctionOfItsRoot
    view: External (HomeSpec)
    statement: Renaming a home's root changes no behavior; nothing on a relocatable surface anchors to an absolute location.
    regression_config: External_regression_absstate.cfg
    scope_note: >
      Scoped to {state, symlink}. A venv console script's shebang is resolved
      literally by the kernel, so the provisioned surface can be neither
      tokenized nor made relative and is re-anchored per clone instead. That
      asymmetry is why `home clone` exists rather than `mv`, and stating the
      invariant over all surfaces would claim a guarantee the code does not have.
  cross_home_independence:
    invariant: WritesThroughOneHomeReachNoOtherHome
    view: External (HomeSpec)
    statement: A write through one home lands in that home and in no other -- not a sibling project's, not the home it was copied from.
    regression_config: External_regression_abslink.cfg
  source_untouched:
    invariant: SourceHomeIsByteIdenticalToItsCloneTimeSelf
    view: External (HomeSpec)
    statement: The source home is read once, at clone time, and still holds exactly the bytes it held then.
    regression_config: External_regression_verbatimstate.cfg
  toolchains_absent_not_stale:
    invariant: ToolchainRootsAreNeverShared
    view: External (HomeSpec)
    statement: A clone carries no venvs/, tools/ or npm/, never points at another home's, and pm/ IS carried so it can rebuild them.
    regression_configs:
      - External_regression_sharedtoolchain.cfg
      - External_regression_nopm.cfg
      - External_regression_silentshims.cfg
    reporting_invariant: EveryHomeMissingItsToolchainsSaysSo
  authored_content_exception:
    invariant: AuthoredContentIsNeverRewritten
    view: External (HomeSpec)
    statement: A file under skills/, plugins/, docs/ or harnesses/ that records an absolute home path is authored content, left exactly as written and counted in the report.
    regression_config: External_regression_rewritecontent.cfg
    reporting_invariant: EveryToleratedContentReferenceIsReported
    negative_result_config: External_regression_rewritecontent_reportonly.cfg
  clone_phase_gate:
    invariant: EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver
    view: Internal (CloneSpec)
    statement: Every surface fixup has run before SKILL_MANAGER_HOME is pointed at the copy -- not merely before the command exits.
    regression_config: Internal_regression_unreanchored.cfg
  clone_atomicity:
    invariant: NoUnfinishedDestinationSurvivesAFailedClone
    view: Internal (CloneSpec)
    statement: A failed clone leaves the destination as it was found; a half-populated directory the next attempt refuses is worse than no clone.
    regression_config: Internal_regression_partialclone.cfg

desired_properties:
  independence:
    invariant: ChildHomeWritesNeverReachTheParentStore
    view: External (restated in Internal)
    statement: A write to a child-home unit does not change the parent-store unit it was materialized from.
    regression_config: External_regression_symlink.cfg
  no_silent_destruction:
    invariant: AgentEditedChildUnitsAreNeverDestroyed
    view: External (AgentEditsSurviveMaterialization in Internal)
    statement: An agent-modified child unit is never overwritten or deleted by resolve, sync, or prune; it is held back and reported.
    regression_config: External_regression_overwrite.cfg
    reporting_invariant: EveryPassReportsExactlyTheHeldBackUnits
  convergence:
    invariant: UnmodifiedChildUnitsConvergeOnTheirSource
    view: External
    statement: An unmodified child unit refreshes when its source changes, including when the change is behind a dereferenced symlink.
    regression_config: External_regression_rawdigest.cfg
  atomicity:
    invariant: InFlightMaterializationLeavesTheChildUnitIntact
    view: Internal
    statement: A failed materialization leaves the previous child unit intact.
    regression_config: Internal_regression_nonatomic.cfg

service_catalog:
  existing_boundaries:
    - project dependency resolution into SKILL_MANAGER_HOME
    - project child-home scaffolding and the parent child-home registry
    - harness-derived child Skill Manager homes
    - child-home CLI/MCP shim mirroring
    - parent-side sync refresh of claiming child homes
  desired_boundaries:
    - per-unit materialization by copy with a staged, atomically swapped tree
    - per-unit materialization record (mode, source digest, content digest)
    - locally-modified detection against that record
    - hold-back-and-report on refresh and on prune
    - dereferencing of in-unit symlinks that point into the parent store
    - one materializer shared by project resolve and harness instantiate
  adapter_boundaries:
    - ChildHomeMaterializer (stage / swap / abort / hold-back / adopt / prune)
    - ProjectChildHomeScaffolder (pass orchestration and the held-back report)
    - ChildHomeHarnessInstaller (same materializer, harness payload)
  known_gaps:
    - Shim mirroring stays a symlink and is deliberately outside the isolation guarantee; not modeled.
    - Symlinks pointing outside the parent store are preserved verbatim; writes through them are out of scope and not modeled.
    - A symlink cycle inside the parent store omits the entry with a warning; the omission is not modeled as a distinct outcome.
    - Child-home MCP servers, tool shims, and agent configs stay in SkillManager.tla until phase MIG.

# ---------------------------------------------------------------------------
tickets:
  - id: CHM-1
    title: "Child home units materialize by copy, not by symlink"
    phase: CHM
    status: next
    depends_on: []
    production_status: implemented_spec_pending
    objective: >
      A project child home holds an independent tree per unit. No entry in it
      is a symlink at a parent-store unit directory, so an ordinary edit below
      a child unit cannot reach the parent store.
    desired_actions:
      - EditChildHomeUnit
      - ResolveProjectChildHome
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
      - src/main/java/dev/skillmanager/bindings/MaterializationMode.java
      - src/main/java/dev/skillmanager/project/ProjectChildHomeScaffolder.java
    current_increment:
      model_state:
        - store_body
        - child_home
        - agent_edits
      model_actions:
        - EditChildHomeUnit
        - ResolveProjectChildHome
      adapters:
        - ChildHomeMaterializerPort.swap_in
        - AgentWorkspacePort.edit_child_home_unit
      unit_tests:
        - editing a child unit does not change the parent store unit
        - a resolved child unit directory is not a symlink
      graph_after_unit_pass:
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
        - bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/External.tla specs/desired_program_model/External_regression_symlink.cfg
      assertions:
        - ChildHomeWritesNeverReachTheParentStore holds under External.cfg.
        - External_regression_symlink.cfg still produces a counterexample.
      evidence: []

  - id: CHM-2
    title: "Per-unit materialization record as the local-change baseline"
    phase: CHM
    status: planned
    depends_on: [CHM-1]
    production_status: implemented_spec_pending
    objective: >
      Each materialized unit writes <child home>/.materialization/<kind>/<name>.json
      recording the mode, the digest of the MATERIALIZED VIEW of the parent tree,
      and the digest of the tree that was written. That record is the only
      evidence that a child unit is disposable; a unit without a usable one is
      treated as modified.
    desired_actions:
      - StageChildUnitMaterialization
      - SwapInChildUnit
      - AdoptIdenticalChildUnit
      - PlaceUntrackedChildUnit
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
    current_increment:
      model_state:
        - record
        - child_unit
      model_actions:
        - StageChildUnitMaterialization
        - SwapInChildUnit
        - AdoptIdenticalChildUnit
        - PlaceUntrackedChildUnit
      adapters:
        - ChildHomeMaterializerPort.adopt
      unit_tests:
        - a record written by a newer skill-manager with an unknown mode reads as "no usable baseline"
        - a directory with no record and identical content is adopted
        - a directory with no record and different content is refused
      graph_after_unit_pass:
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/Internal.tla specs/current/Internal.cfg
      assertions:
        - ChildUnitContentMatchesItsRecord holds.
        - MaterializationRecordsDescribePresentChildUnits holds.
      evidence: []

  - id: CHM-3
    title: "Hold back and report locally modified units on resolve and sync"
    phase: CHM
    status: planned
    depends_on: [CHM-2]
    production_status: implemented_spec_pending
    objective: >
      A child unit whose tree no longer matches its record is left completely
      alone by resolve and sync and is reported to the caller. This is the
      slice that fixes the silent-deletion bug.
    desired_actions:
      - HoldBackModifiedChildUnit
      - SyncProjectChildHome
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
      - src/main/java/dev/skillmanager/project/ProjectChildHomeScaffolder.java
    current_increment:
      model_state:
        - held_back
        - pass
      model_actions:
        - HoldBackModifiedChildUnit
        - SyncProjectChildHome
      adapters:
        - ChildHomeMaterializerPort.hold_back
        - SkillManagerCliChildHomePort.sync_claiming_project_child_homes
      unit_tests:
        - an edited child unit survives a second project resolve byte for byte
        - the held-back unit appears in the resolve result
        - the child installed record for a held-back unit is not rewritten with the parent's sha
      graph_after_unit_pass:
        - project-resolve
        - smoke
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
        - bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/External.tla specs/desired_program_model/External_regression_overwrite.cfg
      assertions:
        - AgentEditedChildUnitsAreNeverDestroyed holds under External.cfg.
        - EveryPassReportsExactlyTheHeldBackUnits holds under External.cfg.
        - External_regression_overwrite.cfg still produces a counterexample at depth 4.
      evidence: []

  - id: CHM-4
    title: "Prune holds back modified units it no longer claims"
    phase: CHM
    status: planned
    depends_on: [CHM-3]
    production_status: implemented_spec_pending
    objective: >
      "No longer a dependency" is not a licence to delete someone's work. A
      child unit the project stopped claiming is dropped only when it is
      unmodified; otherwise it stays and is reported.
    desired_actions:
      - PruneUnclaimedChildUnit
    implementation_scope:
      - src/main/java/dev/skillmanager/project/ProjectChildHomeScaffolder.java
    current_increment:
      model_state:
        - child_unit
        - record
      model_actions:
        - PruneUnclaimedChildUnit
      adapters:
        - ChildHomeMaterializerPort.prune
      unit_tests:
        - an unclaimed unmodified unit is removed and its record forgotten
        - an unclaimed modified unit is left in place and reported
        - pruning is skipped entirely when the child home resolves to the parent store
      graph_after_unit_pass:
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
      assertions:
        - ResolveLeavesOnlyClaimedOrHeldBackUnits holds.
        - AgentEditedChildUnitsAreNeverDestroyed holds across a prune.
      evidence: []

  - id: CHM-5
    title: "Dereference in-unit symlinks that point into the parent store"
    phase: CHM
    status: planned
    depends_on: [CHM-1]
    production_status: implemented_spec_pending
    objective: >
      A symlink inside a copied unit whose target resolves back into the parent
      store is replaced by its content, and the freshness digest is taken over
      that materialized view. Hashing the raw tree would hash the link as its
      target string, so an upgrade behind the link would never be noticed.
    desired_actions:
      - UpgradeLinkedParentSource
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
    current_increment:
      model_state:
        - store_body
      model_actions:
        - UpgradeLinkedParentSource
        - UpgradeParentStoreUnit
      adapters:
        - ChildHomeMaterializerPort.stage
      unit_tests:
        - a store link inside a unit becomes real content in the child home
        - upgrading the linked unit refreshes the child copy
        - a link outside the parent store is preserved verbatim
        - a relative link that stays inside the unit is preserved
        - a link cycle inside the store omits the entry with a warning
      graph_after_unit_pass:
        - project-resolve
        - source-tracking
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
        - bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/External.tla specs/desired_program_model/External_regression_rawdigest.cfg
      assertions:
        - UnmodifiedChildUnitsConvergeOnTheirSource holds under External.cfg.
        - External_regression_rawdigest.cfg still produces a counterexample.
      evidence: []

  - id: CHM-6
    title: "Staged, atomically swapped materialization"
    phase: CHM
    status: planned
    depends_on: [CHM-2]
    production_status: implemented_spec_pending
    objective: >
      The desired tree is built under the child home's staging area and moved
      into place with ATOMIC_MOVE; the displaced tree is parked under staging,
      never beside the destination. A failure part way through leaves the
      previous child unit exactly as it was.
    desired_actions:
      - AbortChildUnitMaterialization
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
    current_increment:
      model_state:
        - staging
      model_actions:
        - AbortChildUnitMaterialization
      adapters:
        - ChildHomeMaterializerPort.abort
      unit_tests:
        - a copy failure leaves the previous child unit intact
        - a move failure restores the displaced tree
        - staging left by an interrupted run is swept before and after a pass
        - a non-directory squatting on the staging path is removed
      graph_after_unit_pass:
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/Internal.tla specs/current/Internal.cfg
        - bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/Internal.tla specs/desired_program_model/Internal_regression_nonatomic.cfg
      assertions:
        - InFlightMaterializationLeavesTheChildUnitIntact holds under Internal.cfg.
        - Internal_regression_nonatomic.cfg still produces a counterexample at depth 5.
      evidence: []

  - id: CHM-7
    title: "harness instantiate --child-home-dir goes through the same materializer"
    phase: CHM
    status: planned
    depends_on: [CHM-3, CHM-6]
    production_status: implemented_spec_pending
    objective: >
      Both paths that populate a child home write the same layout, so they must
      agree on how units get there and on what happens to local edits.
    desired_actions:
      - InstantiateHarnessChildHome
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeHarnessInstaller.java
    current_increment:
      model_state:
        - child_home
      model_actions:
        - InstantiateHarnessChildHome
      adapters:
        - SkillManagerCliChildHomePort.instantiate_child_home_from_harness
      unit_tests:
        - harness instantiate holds back a locally modified child unit
        - harness and project payloads share one materialization record layout
      graph_after_unit_pass:
        - harness-smoke
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
      assertions:
        - EveryPassReportsExactlyTheHeldBackUnits holds for pass.kind = "harness".
      evidence: []

  - id: CHM-8
    title: "Spec-unit adapters and Test Graph bindings for the new views"
    phase: CHM
    status: planned
    depends_on: [CHM-1, CHM-2, CHM-3, CHM-4, CHM-5, CHM-6, CHM-7]
    objective: >
      Wire case_adapters.toml (Internal -> spec-unit) and testgraph_bindings.yml
      (External -> Test Graph) so the model is actually validated against
      production instead of only against itself.
    desired_actions: []
    implementation_scope:
      - specs/desired_program_model/case_adapters.toml
      - specs/desired_program_model/testgraph_bindings.yml
      - specs/desired_program_model/adapters.py
      - specs/desired_program_model/tlc_projection.py
    current_increment:
      model_state: []
      model_actions: []
      adapters:
        - ChildHomeMaterializerPort
        - SkillManagerCliChildHomePort
        - AgentWorkspacePort
      unit_tests:
        - tla-spec-dev run spec-unit-tests --target specs/current
      graph_after_unit_pass:
        - project-resolve
        - harness-smoke
        - smoke
        - source-tracking
    acceptance:
      commands:
        - tla-spec-dev --spec-root specs run spec-unit-tests --target specs/current
      assertions:
        - Every Internal action has a spec-unit adapter.
        - Every External action has a Test Graph binding running out of process.
      note: >
        test_graph node authoring for this epic is owned by a separate agent;
        this ticket owns the bindings file, not the nodes.
      evidence: []

# ---------------------------------------------------------------------------
# PHASE MIG -- fold the remaining monolith into Internal/External.
# PLANNED, NOT SCHEDULED. Do not start without owner sign-off: this is a
# whole-program remodel, not a slice of the child-home epic.
  - id: MIG-0
    title: "Owner decision: schedule the Internal/External migration"
    phase: MIG
    status: blocked_on_owner
    depends_on: [CHM-8]
    objective: >
      Decide whether to migrate SkillManager.tla into Core/Internal/External as
      its own epic, and on what budget. Inputs are recorded, the decision is not.
    inputs:
      measured_today:
        variables: 37
        actions_in_next: 9
        type_invariant: absent
        resolvable_bound: 2
        unconstrained_variables: 36
        god_state_variables: "project_model and result, each touched by 9/9 actions"
        clusters: "C1 21 variables / 1 action, C2 16 variables / 9 actions, C3 1 variable / 0 actions, modularity Q = 0.122"
        promotion_tlc: "measured 2026-07-25: did NOT complete. Stopped after >3000s at 79,225,632 generated / 3,032,979 distinct / depth 14 with 836,363 states still queued. 25x+ over tlc_seconds 120, and past the stale 2,337,504-distinct figure recorded in .history/project-and-child-home-workflow -- nobody has a completed whole-model number for it."
        ports: 29
      cost_estimate: >
        Six to eight tickets, comparable in size to the child-home epic itself.
        The expensive parts are not the module split: they are (1) writing a
        TypeOK for 37 variables that currently have no declared domains at all,
        which is where the state space becomes measurable and where most of the
        real modeling decisions surface; (2) deciding which of the 29 @port
        blocks are External (public CLI surface) and which are Internal
        (fine-grained program state), since today every one of them is both;
        and (3) writing the Test Graph adapters that External implies, which
        the repository has never had. The mechanical part -- moving CONSTANTS
        and helper operators into Core -- is a day.
      risk:
        - "The monolith's promotion config is the only thing checking 57 invariants. Splitting it can silently drop coverage; every invariant must be re-homed explicitly and counted before and after."
        - "project_model is a single record holding ~30 relations. Splitting it across views is the hard call and the place where the two views can start disagreeing."
        - "The promotion cfg already exceeds tlc_seconds. If the split does not reduce per-view state, the migration buys structure and no measurability."
        - "specs/current, specs/program_model and the five history snapshots all carry the monolith. The close-time semantic comparison spans them, so a partial migration must keep both shapes valid simultaneously."
    proposed_ordering:
      - "MIG-1 Core.tla absorbs the shared constants, domain sets, and edge relations from SkillManager.tla; monolith EXTENDS Core. No behavior change, TLC must be byte-equivalent in state counts."
      - "MIG-2 Write TypeOK for all 37 variables and add it to MC_program_promotion.cfg. Measurement only; expect the bound to go from 2 to a real number and expect warnings."
      - "MIG-3 Split the C1 cluster (gateway + server + effect/rollback, 21 variables, 1 crossing action) into its own view first. It is the loosest cluster and the cheapest rehearsal."
      - "MIG-4 Split the CLI store/bindings half of C2 (cli_store_units, cli_installed_records, cli_lock_units, cli_bindings, cli_projection_rows, cli_managed_copies, cli_import_directives, cli_tool_records, cli_cli_lock)."
      - "MIG-5 Decompose project_model. Largest and riskiest; the child-home part is already done by this epic and is the worked example."
      - "MIG-6 Rebuild External.tla as public CLI inputs plus observable projection only, re-home all 57 invariants with a before/after count, and add testgraph_bindings.yml for every external action."
    acceptance:
      assertions:
        - Every invariant in MC_program_promotion.cfg is re-homed to exactly one view, with a before/after count.
        - Each view model-checks inside tlc_seconds.
        - External gets thinner, not thicker, than the monolith's public surface.
      evidence: []

# ---------------------------------------------------------------------------
# PHASE EFF -- effectful fuzzing and complexity minimization.
# PLANNED, NOT SCHEDULED, AND HARD-BLOCKED. effectful_onboarding.md states the
# prerequisite plainly: Internal/External views, TLC green, adapters mapped.
# That prerequisite is met for the child-home slice ONLY. Phase 0 of
# migration.md also requires the budgets in spec_manifest.yaml to be AGREED
# with the owner before any spec is touched; they are currently
# source: proposed_awaiting_owner.
  - id: EFF-0
    title: "Phase 0: agree the budgets"
