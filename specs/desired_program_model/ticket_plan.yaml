  # ------------------------------------------------------------------------
  # Phase COH -- architectural coherence and edge cases surfaced by review.
  #
  # These are not new behavior. They are places where the implementation is
  # correct but not PREDICTABLE from a neighbouring part, which is the debt
  # the owner named: "I understand this at one level so I can predict at
  # multiple others." Each one is a case where knowing one component told you
  # nothing true about its sibling. Tracked as GitHub issues; recorded here so
  # the spec workflow owns the conformance question rather than only the code.
  - id: COH-0
    title: "Decide whether the effects pipeline is the target architecture"
    phase: COH
    status: open
    github_issue: 24
    objective: >
      Executor / Compensation / RollbackJournal exist but are wired to no
      command -- effects/Executor.java:31-35 says wiring happens in "09b" and
      until then the class is exercised only by CompensationLogicTest. So
      rollback is three bespoke idioms (materializer stage-and-swap, cloner
      cleanup, sync registration snapshot) and new code adds a fourth surface
      with none. Decide: wire it, or delete the unwired layer so it stops
      implying a contract that does not exist. The middle state is the
      expensive one.
    acceptance:
      assertions:
        - A written rule states which rollback idiom applies to which shape of write.
        - No component invents a fourth idiom without that rule naming it.
  - id: COH-1
    title: "Make @port enforceable rather than a comment"
    phase: COH
    status: open
    github_issue: 24
    objective: >
      Internal.tla carries 19 @port tags and External.tla 11, including the
      clone lifecycle phase by phase. Nothing checks that those symbols name
      real code: case_adapters.toml has no mappings for the new actions,
      testgraph_bindings.yml has no adapter classes, and zero of the 15
      ContextFacts mention home / clone / drift / policy. Renaming
      HomeCloner.reanchorState would break nothing.
