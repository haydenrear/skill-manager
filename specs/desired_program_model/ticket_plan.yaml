# Home-level properties, added for T19 (#20). Same shape as the four below:
# invariant, view, statement, and the expected-violation config that must keep
# failing. See spec_manifest.yaml validation.regression_configs for measured
# traces and validation.negative_result for why every one of these is stated
# against a witness or a filesystem fact rather than against a report.
desired_home_properties:
  relocatability:
    invariant: AHomeIsAPureFunctionOfItsRoot
    view: External (HomeSpec)
    statement: Renaming a home's root changes no behavior; nothing on a relocatable surface anchors to an absolute location.
    regression_config: External_regression_absstate.cfg
    scope_note: >
      Scoped to {state, symlink}. A venv console script's shebang is resolved
      literally by the kernel, so the provisioned surface can be neither
      tokenized nor made relative and is re-anchored per clone instead. That
      asymmetry is why `home clone` exists rather than `mv`, and stating the
      invariant over all surfaces would claim a guarantee the code does not have.
  cross_home_independence:
    invariant: WritesThroughOneHomeReachNoOtherHome
    view: External (HomeSpec)
    statement: A write through one home lands in that home and in no other -- not a sibling project's, not the home it was copied from.
    regression_config: External_regression_abslink.cfg
  source_untouched:
    invariant: SourceHomeIsByteIdenticalToItsCloneTimeSelf
    view: External (HomeSpec)
    statement: The source home is read once, at clone time, and still holds exactly the bytes it held then.
    regression_config: External_regression_verbatimstate.cfg
  toolchains_absent_not_stale:
    invariant: ToolchainRootsAreNeverShared
    view: External (HomeSpec)
    statement: A clone carries no venvs/, tools/ or npm/, never points at another home's, and pm/ IS carried so it can rebuild them.
    regression_configs:
      - External_regression_sharedtoolchain.cfg
      - External_regression_nopm.cfg
      - External_regression_silentshims.cfg
    reporting_invariant: EveryHomeMissingItsToolchainsSaysSo
  authored_content_exception:
    invariant: AuthoredContentIsNeverRewritten
    view: External (HomeSpec)
    statement: A file under skills/, plugins/, docs/ or harnesses/ that records an absolute home path is authored content, left exactly as written and counted in the report.
    regression_config: External_regression_rewritecontent.cfg
    reporting_invariant: EveryToleratedContentReferenceIsReported
    negative_result_config: External_regression_rewritecontent_reportonly.cfg
  clone_phase_gate:
    invariant: EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver
    view: Internal (CloneSpec)
    statement: Every surface fixup has run before SKILL_MANAGER_HOME is pointed at the copy -- not merely before the command exits.
    regression_config: Internal_regression_unreanchored.cfg
  clone_atomicity:
    invariant: NoUnfinishedDestinationSurvivesAFailedClone
    view: Internal (CloneSpec)
    statement: A failed clone leaves the destination as it was found; a half-populated directory the next attempt refuses is worse than no clone.
    regression_config: Internal_regression_partialclone.cfg

desired_properties:
  independence:
    invariant: ChildHomeWritesNeverReachTheParentStore
    view: External (restated in Internal)
    statement: A write to a child-home unit does not change the parent-store unit it was materialized from.
    regression_config: External_regression_symlink.cfg
  no_silent_destruction:
    invariant: AgentEditedChildUnitsAreNeverDestroyed
    view: External (AgentEditsSurviveMaterialization in Internal)
    statement: An agent-modified child unit is never overwritten or deleted by resolve, sync, or prune; it is held back and reported.
    regression_config: External_regression_overwrite.cfg
    reporting_invariant: EveryPassReportsExactlyTheHeldBackUnits
  convergence:
    invariant: UnmodifiedChildUnitsConvergeOnTheirSource
    view: External
    statement: An unmodified child unit refreshes when its source changes, including when the change is behind a dereferenced symlink.
    regression_config: External_regression_rawdigest.cfg
  atomicity:
    invariant: InFlightMaterializationLeavesTheChildUnitIntact
    view: Internal
    statement: A failed materialization leaves the previous child unit intact.
    regression_config: Internal_regression_nonatomic.cfg

# Three-tier reconciliation properties, added for the `home sync` slice. Same
# shape as the blocks above: invariant, view, statement, the expected-violation
# config that must keep failing, and -- new here, and mandatory -- whether the
# invariant is witness-dependent and which GUARD config proves it. See
# spec_manifest.yaml validation.guard_configs and validation.negative_result_sync.
#
# These EXTEND AgentEditedChildUnitsAreNeverDestroyed rather than restate it.
# That invariant is about one home's units and a materializer refreshing them
# from a store; its destroyer is a refresh policy and its scope is a unit. These
# are about two homes, per path, and their destroyers are a merge base, a
# provenance rule and a teardown -- none of which the unit-level slice has an
# action for. dual_representation_rule is satisfied by that separation, not by
# accident: no sync invariant mentions child_home and no unit invariant mentions
# sync_body.
desired_sync_properties:
  no_edit_loss:
    invariant: AReconciliationOnlyWritesPathsTheDestinationDidNotMove
    view: External (SyncSpec)
    statement: >
      Every path a reconciliation wrote was one the destination had not moved
      away from its own recorded baseline -- held back or merged, never lost.
    extends: AgentEditedChildUnitsAreNeverDestroyed, across the home boundary and at path granularity
    witness_dependent: true
    witness: sync_unsound (the write log)
    guard_config: External_sync_guard_overwrite.cfg
    regression_config: External_regression_syncoverwrite.cfg
    also_violated_by: External_regression_prefersource.cfg
  merge_soundness:
    invariant: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
    view: External (SyncSpec)
    statement: >
      A three-way merge folds in only changes ONE side made, and that is only
      decidable against a state the SOURCE itself passed through. A baseline the
      destination recorded from a third home is not a common ancestor of these
      two: measured against it the source looks like the only side that moved.
    witness_dependent: true
    witness: sync_history (every content each home has ever held)
    guard_config: External_sync_guard_ffprovenance.cfg
    regression_configs:
      - External_regression_nomergekind.cfg    # the defect 7468b4f fixed
      - External_regression_ffprovenance.cfg   # CHM-9, fixed; kept, must keep failing
      - External_regression_mergebase.cfg      # CHM-10, fixed; kept, must keep failing
    note: >
      This is the one invariant the code did not satisfy, in two independent
      ways. Both were reproduced end to end against the real classes, ticketed
      as CHM-9 and CHM-10, and then fixed together under one rule
      (ChildHomeMaterializer, "The baseline rule") along with the opposite-
      direction stale-baseline finding. All three configs above keep producing
      their counterexamples, because each models a rule the code no longer has.
  conflict_atomicity:
    invariant: AConflictedUnitIsNeverPartiallyWritten
    view: External (SyncSpec)
    statement: >
      A unit with any conflicted path writes nothing -- not even the paths that
      would have merged cleanly. The destination stays a coherent version of
      something rather than half of two, and both versions still exist.
    witness_dependent: true
    witness: sync_unsound (the UnitWasConflicted reason)
    guard_config: External_sync_guard_conflict.cfg
    regression_config: External_regression_partialconflict.cfg
    note: >
      Not a corollary of the loss invariant, and the guard config is the proof:
      a partial write takes only paths the destination had NOT moved, so it
      destroys no edit and every loss-shaped invariant holds throughout.
  close_out_gate:
    invariant: NoHomeIsTornDownWhileItHoldsUniqueWork
    view: External (SyncSpec)
    statement: >
      A worktree home is not removed while it holds content no other live home
      has ever held.
    witness_dependent: true
    witness: sync_gone (the tree, snapshotted BEFORE the directory went)
    guard_config: External_sync_guard_teardown.cfg
    regression_config: External_regression_ungatedcloseout.cfg
    finding: >
      First stated over final bytes and refuted by TLC at depth 5 with a trace
      that is not a defect: the worktree's edit reaches the project, the
      project's own agent edits that path on top of it, and the worktree is torn
      down still holding the older bytes. Nothing was lost -- the project HAD the
      work and moved past it deliberately -- but by then the bytes are nowhere.
      What close-out actually promises is that the work REACHED another tier, so
      the invariant is stated over sync_history. Same correction, and the same
      cause, as WritesThroughOneHomeReachNoOtherHome.
  round_trip:
    invariant: NoWorktreeEditEverReachesTheRootHome
    view: External (SyncSpec)
    kind: reachability probe -- MUST produce a counterexample
    statement: >
      Edits flow worktree -> project -> root without loss. Not a safety
      property, so it is checked as its negation and the counterexample is the
      deliverable.
    witness_dependent: false
    config: External_sync_roundtrip.cfg
    why: >
      Every other config checks that the mechanism destroys nothing. A mechanism
      that moves nothing at all satisfies all of them; over-holding-back is safe
      and worthless. This is the only check in the directory that would notice.
  negative_result:
    invariant: EveryDivergenceFromARecordIsAnEditMadeInThatHome
    view: External (SyncSpec)
    kind: guard -- MUST keep returning "No error has been found"
    statement: >
      A home's bytes differ from its own materialization record only where an
      agent edited that home. True, and useless as a safety property, and both
      halves are the point: every destructive policy here satisfies it, because
      a reconciliation rewrites the record along with the bytes.
    witness_dependent: false

service_catalog:
  existing_boundaries:
    - project dependency resolution into SKILL_MANAGER_HOME
    - project child-home scaffolding and the parent child-home registry
    - harness-derived child Skill Manager homes
    - child-home CLI/MCP shim mirroring
    - parent-side sync refresh of claiming child homes
  desired_boundaries:
    - reconciliation of one home into another, in either direction, through the same materializer
    - a per-file baseline (MaterializationRecord.entryDigests) and the three-way merge decided against it
    - a conflicted unit that writes nothing at all
    - provenance on the destination record, so "pristine copy" names what it is a copy OF
    - a home-wide mutex, so two worktrees closing out at once cannot interleave
    - a close-out gate that refuses while a worktree holds work found nowhere else
    - per-unit materialization by copy with a staged, atomically swapped tree
    - per-unit materialization record (mode, source digest, content digest)
    - locally-modified detection against that record
    - hold-back-and-report on refresh and on prune
    - dereferencing of in-unit symlinks that point into the parent store
    - one materializer shared by project resolve and harness instantiate
  adapter_boundaries:
    - HomeSync (which units to visit, the lock, the report)
    - HomeCloseOut (the gate; writes nothing, exits non-zero while work remains)
    - HomeLock (process-wide ReentrantLock plus an OS FileLock, because neither substitutes for the other)
    - ChildHomeMaterializer (stage / swap / abort / hold-back / adopt / prune / planSync / applySync)
    - ProjectChildHomeScaffolder (pass orchestration and the held-back report)
    - ChildHomeHarnessInstaller (same materializer, harness payload)
  known_gaps:
    - "The sync model gives each home ONE authoring token per path, so it cannot express one home editing one path twice. CHM-10 was therefore reached in the model through three tiers and in the unit test through two; same mergeBase, two routes."
    - Shim mirroring stays a symlink and is deliberately outside the isolation guarantee; not modeled.
    - Symlinks pointing outside the parent store are preserved verbatim; writes through them are out of scope and not modeled.
    - A symlink cycle inside the parent store omits the entry with a warning; the omission is not modeled as a distinct outcome.
    - Child-home MCP servers, tool shims, and agent configs stay in SkillManager.tla until phase MIG.

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# EPIC: home-integrity-sync
#
# Scheduled on top of this workflow rather than in a spec root of its own.
# The decision and its reason: every ticket below is a defect in
# ChildHomeMaterializer, DriftGate or the records they write, which is what
# this workflow already models. A sibling root would have forked the same
# subject into two live workflows that later had to be reconciled, and
# ARTI-22's home_integrity views already live in this manifest.
#
# CHM-1..CHM-8 remain planned and CHM-24 remains open; this epic does not
# touch them and does not promote the workflow. Only finalization does.
# ---------------------------------------------------------------------------
epic:
  slug: home-integrity-sync
  branch: epic/home-integrity-sync
  base: "76434c7"                       # epic/artifact-dag cb0369f + main e5ba7ce
  repository: haydenrear/skill-manager
  umbrella_issue: 215
  ticket_prefix: HIS
  validation: >
    validate_epic_plan.py cannot be run against this file as a whole: it
    requires full epic scheduling fields (wave, promotion_order, blocks,
    conflict_keys, goals) on EVERY ticket, and the 34 pre-epic CHM/COH/EFF/
    ISSUE/MIG tickets predate the epic primitive and legitimately carry none.
    Running it here reports those 34 and buries the epic's own findings.
    The epic is validated against a generated projection instead --
    results/epic-home-integrity-sync/validation/epic_plan_projection.yaml,
    which carries the epic blocks and the HIS-* tickets only. Regenerate it
    from this file after any schedule change; this file stays canonical.
    Last run: OK, 6 tickets, 0 retired, 4 waves, 5 goals.
  note: >
    Branched from epic/artifact-dag and NOT closing it out. That branch is the
    constituent side of integration-repository epic #100 (the derived-artifact
    DAG), which is open with ~31 ARTI tickets and an unrun terminal evaluation
    (#117 / ARTI-16). Folding it in here would strand #100's goal accounting,
    so the branch stays intact and this epic simply starts from its tip.

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  backlog: results/epic-home-integrity-sync/deferred/backlog.yaml
  rule: >
    A failure case a ticket agent finds outside its declared slice is appended
    to the backlog with its reproduction and left there. Agents do not widen a
    ticket to fix it and do not chase a goal metric by expanding scope. The
    epic agent triages the backlog with the owner at each wave review.

review_policy:
  cadence: wave
  gate: true
  merges: owner
  walkthrough: required
  artifact_root: results/epic-home-integrity-sync/reviews/
  rule: >
    The epic agent merges each wave's ticket PRs into the epic branch in
    promotion order, reconciles each ticket worktree's home into the project
    home, writes the review artifact, walks the owner through it, and then
    STOPS. No issue URL from the next wave is handed out until the owner has
    answered. Silence is not approval.

# ---------------------------------------------------------------------------
# VALIDATION POLICY. Set by the owner 2026-08-21, at the wave-3 gate:
# "--all takes forever. We'll do it once at the end with the goal/evals/
# scorecard."
#
# So the sweep is a TERMINAL instrument, not a per-wave one, and this file says
# so rather than leaving each wave to decide and each review to apologise for a
# subset. Waves 1-3 each validated against a hand-picked subset and reported it
# honestly as a subset; that is now the policy, not a shortfall against it.
# ---------------------------------------------------------------------------
validation_policy:
  per_ticket:
    required:
      - "jbang RunTests.java"
      - "uv run pytest specs/"
      - "the graphs named in this ticket's conflict_keys.test_graph"
      - "any graph whose fixtures exercise the SOURCES this ticket edited, named in the goal contribution with the reason"
    rule: >
      RELEVANT GRAPHS, NOT ALL GRAPHS. The unit tests and the spec tests are
      cheap and run every time. Graphs are selected by what the ticket TOUCHED:
      its declared conflict_keys.test_graph, plus any graph whose fixtures
      exercise the sources it edited -- and that second set is named with its
      reason, because "the usual ones" is not a selection rule.
    not_required: >
      `run.py --all`. It is multi-hour and it belongs to HIS-6. A ticket agent
      that runs it is spending the epic's time on the terminal instrument.
  per_wave:
    required:
      - "jbang RunTests.java on the merged tip, not on any branch"
      - "uv run pytest specs/ on the merged tip"
      - "the union of the wave's tickets' relevant graphs, re-run on the merged tip"
    rule: >
      Same selection rule, applied to the union, and RE-RUN rather than carried
      forward. A ticket's green was measured on its own branch; the wave asks
      the same question of the integrated tree, and a green carried forward
      from before a sibling merged is the wrong kind of evidence. HIS-10 caught
      this on itself -- it re-ran project-child-home and harness-smoke after a
      late change narrowed the predicate they exercise, rather than reusing the
      earlier pass.
    argued_in_the_review: >
      The review artifact names which graphs ran, which did not, and why the
      selection covers what the wave changed.
  terminal:
    owner: HIS-6
    command: "python skills/test_graph/scripts/run.py --all"
    runs: once, on the integrated epic tip, with the goal scorecard
    prerequisite: >
      DEF-011's SECOND half must be answered first. `--all` is a strictly
      ordered Gradle chain that stops at the first failing task, so a single
      red graph at position 1 produces "stopped at 1", which is
      indistinguishable in the output from "only 1 graph exists". Measured
      2026-08-21: one lost teardown race in `smoke` -- the FIRST graph -- meant
      1 graph of 24 executed and 23 never ran.

      Running the sweep ONCE at the end is the right economy and it is also
      exactly when that single point of failure costs the most: a terminal
      scorecard that dies on graph 1 yields no scorecard, at the moment the
      epic most needs one and with no earlier full run to fall back on. So the
      ordering question is a PREREQUISITE for HIS-6 rather than optional
      cleanup. Options are in DEF-011; choosing between them is the owner's.
  known_state:
    value: "`run.py --all` has never completed in this epic"
    measured_at: "22b947c"
    detail: >
      Runs 20260821-164405 (--all) and 20260821-170159 (smoke alone) both died
      at servers.down / registry_down -- the same node, the same assertion, so
      not a flake. The cause was a teardown that raced its own SIGKILL and
      sampled isAlive() before the reap; the registry process was CONFIRMED
      DEAD afterwards. Fixed in ServersDown as epic-machinery work. The
      ORDERING half is not fixed and is the prerequisite above.

# ---------------------------------------------------------------------------
# GOALS. Agreed with the owner 2026-08-20 before scaffolding. Baselines were
# measured on the operator's real homes at the epic base commit and committed
# under results/epic-home-integrity-sync/baseline/ BEFORE any ticket landed.
#
# The theme the owner named is token efficiency, productivity and
# functionality. The mechanism underneath four of these five goals turned out
# to be one thing: PERSISTED STATE THAT IS NEVER RE-DERIVED FROM THE LIVE TREE.
# A materialization record naming a store that is gone (HIS-1), a drift gate
# that only an explicit ack retires (HIS-3), an installed-record error whose
# condition cleared nine days earlier (HIS-4). Stating it here because a ticket
# agent that knows the shape will recognise the fourth instance when it meets
# it, and file it rather than working around it.
# ---------------------------------------------------------------------------
epic_goals:
  - id: GOAL-no-spurious-holdback
    kind: integration
    statement: >
      A child home whose unit is byte-identical to the live parent store
      reconciles silently, whatever its record says about where the bytes came
      from -- and a unit that genuinely differs is still held back.
    metric: >
      units held back by copyUnit() whose tree is byte-identical to the live
      source outside .git, over the 4 registered child homes
    harness: >
      jbang RunTests.java -- ProjectChildHomeMaterializationTest, the cases
      "a pristine unit whose record names a store that is gone is not held back"
      (clause 1) and "a unit that genuinely differs is still held back, foreign
      record or not" (clause 2); THEN
      python skills/test_graph/scripts/run.py home-integrity for the integrated
      home. A re-count over
      results/epic-home-integrity-sync/baseline/holdback-records.txt is
      SUPPORTING evidence about the operator's homes, not the deciding run --
      those homes have moved since the baseline and must not be re-measured as
      if they had not.
    baseline:
      value: "16 of 18 records held back; 18 of 18 pristine by their own digest"
      measured_at: "76434c7"
      evidence: results/epic-home-integrity-sync/baseline/holdback-records.txt
    target: >
      CLAUSE 1: 0 of the 18 held back.
      CLAUSE 2: a unit whose content genuinely differs from the live source is
      STILL held back, with the same message -- proved by a deliberately
      divergent fixture in the same node.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-no-spurious-holdback

  - id: GOAL-sync-quiet
    kind: quality
    statement: >
      A sync tells the agent WHAT moved, not every path that moved. The per-file
      diff stops being the default surface and becomes something you ask for.
    metric: >
      lines and characters DriftReport.render() emits over the recorded
      7-unit baseline drift record
    harness: >
      jbang RunTests.java -- HomeDriftGateTest, the case "the committed baseline
      fixture renders inside GOAL-sync-quiet's bound", which reads
      results/epic-home-integrity-sync/baseline/root-home-drift.json and asserts
      both clauses over the real record; plus the cases "the rollup is one line
      per unit, and the paths are still reachable" and "`home drift` shows the
      pending change and exits non-zero" (clause 2, through the CLI).
    baseline:
      value: >
        896 lines, 88,308 characters (~22,077 tokens), re-emitted every sync /
        exec gate / home drift. MEASURED by rendering the committed record
        through the product's own renderer. An earlier figure of "889 lines,
        87,208 characters" appears in this epic's first commits: 889 was the
        per-FILE line count without the 7 per-unit headers, and 87,208 was an
        estimate (path length + 6 per line) rather than a render. The rendered
        figure above is the one HIS-6 compares against; the estimate is
        superseded, not deleted, so the record shows which number moved.
      measured_at: "76434c7"
      evidence: results/epic-home-integrity-sync/baseline/root-home-drift.json
    target: >
      CLAUSE 1: at most one line per changed unit plus one total line -- at most
      10 lines over this fixture -- and at least a 99% character reduction.
      CLAUSE 2: the full per-file list is still reachable, unchanged, through
      --json / the detail surface. Collapsing is a default, not a deletion.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-sync-quiet

  - id: GOAL-gate-settles
    kind: integration
    statement: >
      An unacknowledged drift gate is reported once in full and thereafter as a
      one-line reminder. A genuinely new change still gates.
    metric: >
      output size and exit code on the 2nd..Nth surfacing of one unacknowledged
      gate, with no new change between passes
    harness: >
      python skills/test_graph/scripts/run.py home-integrity -- node
      home.integrity.ack.is.stable, extended by HIS-3 to drive
      record -> surface -> surface -> ack; plus jbang RunTests.java --
      HomeDriftGateTest for the per-surface output shape.
    baseline:
      value: "full report re-emitted on every pass; exec refuses with exit 8 each time"
      measured_at: "76434c7"
      evidence: results/epic-home-integrity-sync/baseline/root-home-drift.json
    target: >
      CLAUSE 1: the 2nd and later surfacing of the SAME unacknowledged gate is a
      single line naming the count and the ack command.
      CLAUSE 2: a change the agent has not seen still gates the next launch, and
      DriftGate's documented reason for not clearing on digest refresh
      (DriftGate.java:39-49) still holds -- the regression that rationale cites
      must stay caught.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-gate-settles

