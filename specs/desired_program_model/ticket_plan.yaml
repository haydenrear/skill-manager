  - id: HIS-9
    title: "nothing refuses a write outside the home SKILL_MANAGER_HOME names -- the class behind repeated root-home damage"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    status_note_delivered: >
      DELIVERED. WriteConfinement + WriteOutsideHomeException, enforced at the
      four sites where measured damage occurred. DEF-007: with the guard removed
      homeA's bin/cli went 2 -> 0 entries at exit 0; with it in force, 2 -> 2 and
      exit 1.

      THE DESIGN POINT: writes, deletes and containers get DIFFERENT questions.
      A write follows the final component, a delete does not, and a container
      about to be listed through needs the write rule anyway. The first version
      got that wrong and REFUSED NOTHING on the exact fixture it was written
      for -- kept as a vacuity row rather than quietly fixed.

      REVIEW CAUGHT TWO THAT WOULD HAVE SHIPPED: the refusal printed a --home
      flag that did not exist on `sync`, and the refusal was swallowed by a
      catch (Exception) so `sync` still exited 0 -- while the exception's own
      javadoc claimed being unchecked prevented exactly that.

      THREE INERT ENTRY POINTS WERE DELETED rather than documented. Acceptance
      item 2 is met instead by HomeCloner.unsanctionedForeignHome -- the
      predicate `home verify` itself uses, which cannot drift from what the gate
      refuses.

      DISCLOSED, NOT HIDDEN: a home whose bin/cli is a symlink at another home's
      can no longer be synced at all and nothing here repairs it (HIS-13's test
      case); --force-scripts in a child home now rebuilds locally, a deliberate
      partial narrowing of HIS-10 for that flag; LAUNCHER_PIN declared cut;
      acceptance (d)'s READ path uncovered; the three prune "tiers" run
      byte-identical tier-blind code.
    delivered_in: "PR #230, merged into epic/home-integrity-sync as 62e91ea"
    github_issue: 226
    added_in_schedule_revision: 4
    wave: 4
    depends_on: [HIS-7]
    blocks: [HIS-11, HIS-13, HIS-14, HIS-5, HIS-6, HIS-8]
    promotion_order: 7
    promotion_predecessor: HIS-4
    conflict_keys:
      production: [LiveInterpreter.writeGuard, SkillEffect, InstallerRegistry.installOne]
      tla: []
      adapters: []
      test_graph: [home-integrity/ParentHomeSurvivesAChildBuild]
      workflow_data: []
    found_by: >
      HIS-7, twice, on the operator's real root home -- and the second time
      while measuring the first. A producer in a cloned home wrote through an
      inherited symlink into ~/.skill-manager/bin/cli/computeq and tlc2. tlc2
      survived because its shim is BIN_DIR-relative; computeq was rewritten with
      scratchpad paths and had to be repaired by hand.
    root_cause: >
      HIS-7 FIXED ONE INSTANCE. THIS IS THE CLASS.

      `rebuildCliArtifact` now takes ownership of the one shim it is about to
      write, so that path is closed. Nothing generalises it. A producer is an
      arbitrary script handed $SKILL_MANAGER_BIN_DIR and $SKILL_MANAGER_HOME; it
      may write anywhere the process can write, and no layer between the effect
      and the filesystem asks whether the destination is inside the home the
      command was given. Every new producer, every new effect and every new
      output root is a fresh chance to be wrong, and root is the tier with no
      tests, so it is where being wrong is discovered last.

      FOUR known instances, all live:
        (0) THE DESTRUCTIVE ONE, added in wave 3 as DEF-007 and MEASURED:
            CliShimPruner.prune opens store.cliBinDir() with Files.isDirectory +
            Files.list, both of which FOLLOW a symlink. Where homeB/bin/cli is
            itself a link at homeA/bin/cli, a `sync` in homeB decides each entry
            correctly and deletes it IN THE WRONG HOME -- homeA/bin/cli went from
            2 entries to 0. `home verify` SEES the shape and refuses it
            (walkFileTree without FOLLOW_LINKS); the repair path follows it. Two
            readers, disagreeing in the one direction that destroys bytes.
            Nothing the product does creates this shape today
            (mirrorExistingShim mirrors ENTRIES, never the directory), so it is
            reachable by hand or by a restored backup -- which is why it was
            filed rather than allowed to stop HIS-10;
        (1) a producer following an inherited symlink out of the home -- fixed
            for cli-shim rebuilds only;
        (2) a home's PINNED bin/cli/skill-manager rebinding SKILL_MANAGER_HOME to
            its own home, so `SKILL_MANAGER_HOME=<x> <y>/bin/cli/skill-manager`
            edits y, not x (this is why scratch homes must be driven with the raw
            build);
        (3) bootstrap-home.sh and skt resolving their CLI from the ROOT home, so
            a worktree bootstrap runs a root-pinned binary.
    slice: >
      A write-confinement guard at the effect boundary: an effect declares the
      roots it may write under, and a write outside every declared root is
      REFUSED with the offending path and the home it escaped, not logged.
      Producers run with the guard in force. Instance (2) is in scope -- the
      pinned shim must honour an explicitly-set SKILL_MANAGER_HOME or refuse and
      say which home it would have edited. Instance (3) is a REPORT, not a fix:
      those live in git-issue-workflow and skt, and reaching them is HIS-8's
      publish path.
      Instance (0) is IN SCOPE and is the reason this ticket is no longer only
      preventative: a delete path that follows a link out of the home is the
      same defect as a write path that does, and the guard belongs in one place
      for every writer rather than bolted onto the pruner.
      NOT IN SCOPE: repairing a home already damaged -- that is HIS-13.
    acceptance:
      assertions:
        - A producer that writes outside the home is refused, and the refusal names the path and the home.
        - "DEF-007: a `sync` in homeB whose bin/cli is a symlink at homeA's does not remove one byte from homeA. Reproduced before the fix, refused after."
        - The confinement covers DELETES, not only writes -- the pruner is a writer for this purpose.
        - The refusal is proved by a fixture that PASSES when the guard is removed -- vacuity checked, in writing.
        - "`SKILL_MANAGER_HOME=<x> <y>/bin/cli/skill-manager home describe` reports x or refuses; it never silently reports y."
        - A legitimate write into a sanctioned parent store (an inherited toolchain a child is allowed to read) is not broken by the guard.
        - The root tier is covered, not just project and worktree.
    goals:
      - goal: GOAL-no-destructive-recovery
        contribution: direct
        expected_effect: >
          the (a) half's mechanism generalised: no effect can write outside its
          declared roots, so a producer cannot damage a home it was not given
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"
      - goal: GOAL-home-invariants
        contribution: direct
        expected_effect: "an invariant stating a producer writes only inside the home SKILL_MANAGER_HOME names"
        local_signal: "jbang RunTests.java"

  - id: HIS-10
    title: "a clone records no durable descent, so three readers give three answers and its first sync discards the inherited toolchain"
    phase: HIS
    epic: home-integrity-sync
    github_issue: 227
    also_closes: [206]
    added_in_schedule_revision: 4
    status_note_delivered: >
      DELIVERED IN FULL, after a review round that sent it back. PR #228, merged
      into epic/home-integrity-sync as 22b947c.

      THE FIRST VERSION WAS UNMERGEABLE AND THE REVIEW WAS RIGHT. The provenance
      record was SELF-CERTIFYING: a hand-written home.provenance.json flipped
      `home verify` from exit 1 to exit 0, and `clonedFrom: /nowhere` -- a path
      that does not exist -- was accepted and printed as authoritative descent.
      Anything that could write one file into a home switched that home's
      isolation gate off permanently, and the new verify output ADVERTISED the
      filename. A second case needed no hand-editing at all: revoking a parent's
      claim left `verify proj` = 1 and `verify wt1` = 0 on the same shim and the
      same parent, and re-cloning re-minted the claim -- this goal's own failure
      mode, recreated on the tier axis by the fix for it.

      WHAT LANDED INSTEAD: the record is a POINTER TO EVIDENCE, not the evidence.
      HomeProvenance.sanctions walks `clonedFrom` hop by hop and asks
      ChildHomeLink.isChildOf LIVE at each hop, with a cycle guard and
      MAX_HOPS = 16; parentStoresOf derives at WRITE time rather than copying
      the source's set forward, so nothing is carried between clones;
      `parentStores` survives only as a reporting/repair snapshot that nothing
      consults; a relative `clonedFrom` is refused outright rather than resolved
      against the process CWD.

      THE COST IS STATED WHERE THE OLD JAVADOC PROMISED THE OPPOSITE. That
      javadoc chose this evidence because it "needs no second home to be
      present, readable, or even to still exist when the question is asked."
      Re-derivation gives that up, and it FAILS CLOSED: evidence that cannot be
      re-derived does not sanction. Worst case is a worktree whose project home
      was deleted reverting to pre-HIS-10 behaviour.

      NOT CLAIMED: forgery-proof. A writer can still name some other home that
      genuinely is a claimed child, and the chain re-derives. What is gone is
      the ARBITRARY grant. This adds no new class of in-home forgery, because
      ChildHomeLink already accepts a materialization record inside the judged
      home -- that pre-existing trust is named, not widened.
    status: delivered
    delivered_in: "PR #228, merged into epic/home-integrity-sync as 22b947c"
    wave: 3
    depends_on: [HIS-7]
    blocks: [HIS-13, HIS-4, HIS-5, HIS-6, HIS-8]
    promotion_order: 5
    promotion_predecessor: HIS-7
    conflict_keys:
      production: [HomeCloner.sanctionedParentShim, HomeCloner.verifyRoots, ChildHomeLink.isChildOf, CliShimPruner, CliArtifact.usableInHome]
      tla: []
      adapters: []
      test_graph: [home-integrity/EveryShimResolves]
      workflow_data: []
    found_by: >
      HIS-7's adversarial review (findings HIGH-3, MED-4, MED-6, MED-7), then
      MEASURED end to end on 2026-08-21 against epic tip 23e35c7. Evidence in
      results/epic-home-integrity-sync/probes/his-10/.
    root_cause: >
      A CLONE IS A GRANDCHILD THAT RECORDS NOTHING ABOUT ITS DESCENT.

      The project home is a REGISTERED CHILD of root: root holds
      child-homes/<id>/child-home.json, so ChildHomeLink.isChildOf can answer
      yes and the five bin/cli symlinks into root are sanctioned parent-store
      shims. A worktree home is a COPY of the project home. Nothing in the copy
      records that it descends from a home whose parent is root. So every reader
      that needs "is this foreign path sanctioned" has to guess, and they guess
      differently:

        home clone            clean -- "no path in it reaches another home"
        home verify           exit 1 -- 5x FOREIGN_HOME
        home verify --against exit 0 -- "5 sanctioned parent-store shim(s)"
        sync                  PRUNES all five, "not this home's parent store",
                              then spends ~90s re-provisioning five toolchains

      Four readers, three answers, one home, same five paths. The only thing
      that makes the sanction visible is an operator typing --against, which is
      a flag, not a fact.

      THE SYNC BEHAVIOUR IS THE EXPENSIVE ONE and it contradicts the contract
      the owner stated for HIS-7: "we clone, then we say, here are the artifacts
      for these skills on the path for you, and here is how you rebuild them if
      you make a change. Why would we build them without the agent changing?"
      Today every worktree rebuilds five toolchains nobody touched, on its first
      sync, silently.

      SECOND HALF, #206: the verdict is not even spelling-invariant.
      HomeCloner.verifyRoots resolves the destination root (`realOrSame(dstRoot)`
      at :1635) for the symlink branch but hands the UNRESOLVED spelling to the
      provisioned-file branch (`missingReferencesIn(file, dstRoot)` at :1691),
      and destReferences (:1428) does a raw `text.indexOf(dstRoot.toString())`.
      Where the home is reached through a symlink, that branch reports clean
      WITHOUT HAVING CHECKED. CliArtifact.usableInHome does the same string walk.

      MEASURED 2026-08-21, and the obvious fixture is VACUOUS -- see
      results/epic-home-integrity-sync/probes/his-10/path-spelling.md. The macOS
      temp case does NOT trigger it: "/private/var/X" CONTAINS the substring
      "/var/X", so indexOf accidentally matches and the reference IS found. 24 of
      29 registered graphs wire HomeFixpointLaw and every test-graph home lives
      under /var/folders/.../T; they are saved by that accident, not by
      correctness. The defect bites only where the two spellings are not
      substring-compatible -- a symlinked intermediate directory, a symlinked
      $HOME or checkout, /Volumes/..., a symlinked worktree path:

        --home <s>/link/homeC     -> "every reference ... resolves"       BLIND
        --home <s>/realdir/homeC  -> "1 reference(s) ... do not resolve"  CORRECT

      one home, one broken file, two spellings. A fixture built on /var or /tmp
      would pass before AND after the fix, which would have been this epic's
      THIRD vacuous assertion.
    slice: >
      (1) PROVENANCE. A clone records its descent durably -- what it was cloned
      from, and what that home's parent store is -- so the sanction is a fact in
      the copy rather than a flag on the command line. Every reader answers from
      that one record.
      (2) SPELLING. Resolve the home root ONCE and hand the same spelling to
      every branch, in HomeCloner.verifyRoots and CliArtifact.usableInHome.
      (3) THE PRUNER. CliShimPruner stops deleting an inherited shim that the
      provenance record sanctions. The clone keeps it on PATH and DECLARES it,
      per the lazy contract.
      NOT IN SCOPE: the write-confinement guard (HIS-9), and repairing homes
      already pruned (HIS-13).
    acceptance:
      assertions:
        - All four readers give the SAME verdict on one cloned home, with no --against flag.
        - "A clone's first sync leaves its inherited parent-store shims in place, and provisions nothing that was already provided."
        - The reader-agreement assertion FAILS when the provenance record is removed -- vacuity checked, in writing.
        - A home reached through a symlinked path verifies identically to the same home reached through its real path, and that assertion fails when the resolution is removed.
        - "A copy of an UNSANCTIONED home is still unsanctioned: cloning is not a laundering step. The existing HomeCloner guard for this must still pass."
        - "`--against` no longer decides the answer; it may still explain it."
    goals:
      - goal: GOAL-one-home-one-answer
        contribution: direct
        expected_effect: "four readers, three answers -> four readers, one answer, and spelling-invariant"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"
      - goal: GOAL-home-invariants
        contribution: direct
        expected_effect: "an invariant that a home's sanction set is a function of its recorded descent, not of the command line"
        local_signal: "jbang RunTests.java"

  - id: HIS-11
    title: "compensation for CommitUnitsToStore is delete-only, so a failed install destroys the bytes it overwrote"
    phase: HIS
    status: planned
    epic: home-integrity-sync
    github_issue: 186
    added_in_schedule_revision: 4
    wave: 5
    depends_on: [HIS-9]
    blocks: [HIS-15, HIS-5, HIS-6, HIS-8]
    promotion_order: 9
    promotion_predecessor: HIS-12
    conflict_keys:
      production: [Executor.preStateCompensations, Executor.runStaged, Executor.runWithContext,
                   Compensation, MaterializationEscrow, HomeLock, LiveInterpreter.runOne]
      # CORRECTED after HIS-11's review. The declared pair under-described the
      # change in two ways the reviewer found and the author extended:
      #   Compensation gained a record IN A SEALED PERMITS CLAUSE, so anything
      #     switching exhaustively on it breaks -- the sharpest omission;
      #   MaterializationEscrow is HIS-4's class, extended here, and it was the
      #     one surface the review was asked to attack;
      #   `preStateCompensations` alone under-described a change to eight
      #     members of Executor.
      # The epic agent's declared keys have now been wrong in BOTH directions in
      # every wave of this epic. See the wave-4 review; this is the instance that
      # made it a pattern rather than a slip.
      tla: []
      adapters: []
      test_graph: []
      workflow_data: []
    found_by: "revision-4 sweep of open issues against the owner's all-home-bugs instruction"
    root_cause: >
      Executor.java:307 -- `case SkillEffect.CommitUnitsToStore e -> List.of();`
      An EMPTY pre-state compensation, in an exhaustive switch, for the one
      effect that overwrites bytes already in the home. The commit deletes the
      destination and copies the new tree in; the walk-back then deletes what it
      finds and restores nothing, because nothing was captured. A publish or
      resolve that fails partway into a NON-EMPTY home therefore leaves that unit
      absent rather than as it was. The severity scales with the tier: root is
      the home with the most installed units and the least test coverage.

      Second half, from the same issue: no HomeLock on the resolve/install path,
      so two concurrent resolves interleave staging and commit. That is squarely
      per-home isolation and belongs with the first half rather than after it.
    slice: >
      Capture the pre-image before the destructive commit and restore it on
      walk-back; take the home lock for the resolve/install path. NOT IN SCOPE:
      any other effect's compensation, and the compensation FRAMEWORK's shape.
    acceptance:
      assertions:
        - A resolve that fails after CommitUnitsToStore leaves every previously installed unit byte-identical to what it was.
        - That assertion FAILS when the move-aside is removed -- vacuity checked, in writing.
        - Two concurrent resolves into one home do not interleave; the second waits or refuses, and says which.
        - The pre-image is cleaned up on success, so the guard does not grow the home without bound.
    goals:
      - goal: GOAL-no-destructive-recovery
        contribution: direct
        expected_effect: "0 pre-existing unit bytes survive a failed install -> all of them survive"
        local_signal: "jbang RunTests.java"

  - id: HIS-12
    title: "a refusal names a home you were not in and a build that cannot run the remedy, and project sync loses the typed refusal entirely"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    status_note_delivered: >
      DELIVERED, after a review that sent it back and a design decision the
      EPIC AGENT got wrong first.

      The /usr/bin/env SKILL_MANAGER_HOME=... <build> binding came out entirely.
      Review measured three things against it: it broke a remedy parser and put
      home-sync, a CORE graph, at 12-of-18-skipped BECAUSE OF THE DIFF; it was
      not runnable verbatim, because a home path containing `$` is shell-expanded
      and BINDS A DIFFERENT HOME -- DEF-002's failure mode produced by DEF-002's
      fix; and it did not defend the head-token graph assertion but NEUTRALIZED
      it, turning three readers permanently green where a bare `env` would have
      turned them visibly red.

      The epic agent then proposed a replacement -- print the home's own
      entrypoint and branch the guard on absolute-vs-bare invocation -- and put
      it up to be attacked. IT LOST ON MEASUREMENT. `$0` cannot carry
      "deliberate": a #! script never sees the typed word, so bare-via-PATH and
      absolute give identical `$0`, and the only shape that differs is
      ./skill-manager, a human at a keyboard, which the rule would have refused.
      And not every home has bin/cli/skill-manager -- it is written by
      `home shims` and nothing else, so the premise was false.

      WHAT SHIPPED IS THE PER-VERB RULE: verbs that already name their target
      bind nothing; verbs that take --home carry it; sync and project sync were
      given it. The binding lives in --home rather than the head token because
      EVERY CONSUMER FEELS ENTITLED TO REPLACE THE HEAD TOKEN -- remedyArgs and
      close-change.sh's run_cli both document doing exactly that.

      A GUARD, NOT JUST A FIX. A source scan enforces the per-verb rule, and it
      fired on the integrated tip against HIS-4's three unbound remedies --
      catching a cross-ticket drift that two reviews and two green suites had
      missed. Its own vacuity check then found a GAP IN THE GUARD (the pattern
      missed the assignment form), which was widened.

      KNOWN LIMITATION, stated at the top of the goal contribution rather than
      as a footnote: --home binds the STORE axis and not the AGENT axis. HIS-14
      (#232) closes the other half, and that defect was found by this ticket
      pasting its own remedy into a shell and looking at what it touched.
    delivered_in: "PR #229, merged into epic/home-integrity-sync as fb9205b"
    github_issue: 161
    also_closes: [187]
    added_in_schedule_revision: 4
    wave: 4
    depends_on: [HIS-7]
    blocks: [HIS-14, HIS-5, HIS-6, HIS-8]
    promotion_order: 8
    promotion_predecessor: HIS-9
    conflict_keys:
      production: [HomeDescriptor.resolveCli, HomeDescriptor.cliSpelling, ProjectCommand.SyncCmd]
      tla: []
      adapters: []
      test_graph: []
      workflow_data: []
    found_by: >
      #161 and #187 from the revision-4 sweep, joined to DEF-002 from this
      epic's own kickoff -- three faces of one surface, the refusal a home
      operation prints.
    root_cause: >
      A REMEDY IS AN INSTRUCTION, AND THESE ONES EDIT A DIFFERENT HOME THAN THE
      ONE YOU WERE IN.

      HomeDescriptor.resolveCli (:379-395) falls through to `onPath(
      "skill-manager")` with no version check, so the printed remedy names an
      absolute path to whatever build PATH happened to find -- often an older
      release that cannot run the remedy it is being named in. Step 2 of that
      same precedence (the current process) is DEAD in every shipped launcher,
      because the process basename is jbang or java, so the javadoc's stated
      precedence is false as well.

      DEF-002 is the same defect landing on the operator: a sync run against the
      PROJECT home prints `re-run with:
      /Users/hayde/.skill-manager/bin/cli/skill-manager sync <unit> --merge`.
      Following that verbatim edits the ROOT home.

      #187 is the same surface losing its type: ProjectCommand.ResolveCmd
      catches ProjectImportViolationException (:166) and renders it; SyncCmd does
      not, so the identical failure arrives as an untyped IOException with a
      generic exit.
    slice: >
      Make the refusal name the home it is about and a build that can run it:
      mark the PATH-fallback case rather than presenting it as authoritative,
      correct the javadoc's precedence, spell the remedy against the home the
      command was given, and give SyncCmd the typed catch ResolveCmd already
      has. NOT IN SCOPE: changing what any of those operations DO.
    acceptance:
      assertions:
        - A remedy printed by a command run against home X names X, never another home.
        - A remedy resolved by the PATH fallback says so, rather than reading as authoritative.
        - "`project sync` renders a ProjectImportViolationException with the same typed output and exit code as `project resolve`."
        - The javadoc's stated precedence matches what the code does, proved by a test that walks it.
    goals:
      - goal: GOAL-one-home-one-answer
        contribution: direct
        expected_effect: >
          the remedy surface joins the readers that agree: a printed command
          names the home the operator was in
        local_signal: "jbang RunTests.java"

