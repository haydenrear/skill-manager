  - id: CHM-17
    title: "close-out compares build and tool state inside a unit as if it were unit content"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 41
    found_by: running a worktree's own tooling once, on three real repositories
    objective: >
      Running `discover.py` in a ticket worktree -- the thing a worktree exists
      to do -- writes
      `skills/test-graph/project_sdk_sources/build-logic/.gradle/**` and
      `scripts/__pycache__/*.pyc` INSIDE a unit. Those moved the unit's digest,
      so `home close-out` returned `conflicted` with a non-actionable remedy
      ("... then resolve: executionHistory.bin, ..."), the printed remedy run
      verbatim exited 1 without clearing the gate, and `home sync --merge` then
      reported that nothing was written. The unit stayed unreconciled forever.
      Authorship confirmed by timestamps: 6, 5 and 5 files across three
      repositories. A built jar
      (validation-graph-build-logic-0.1.0.jar) was separately carried
      worktree -> project by a merge as though it were somebody's work.

      `home clone` had skipped these names inside a unit since the first clone.
      ChildHomeMaterializer never asked. One name skipped by one caller and not
      the other is a unit that reports conflicted for good.
    resolution: >
      One definition of re-derivable, dev.skillmanager.shared.util.Rederivable,
      read by both. It is applied at the top of BOTH walkers, so a skipped path
      is invisible to the materializer in every direction at once: not
      fingerprinted, so it cannot make a unit look edited; not copied, so it
      cannot travel between homes; and NOT DELETED, because
      carryOverUnownedTrees moves it across the atomic swap. "Not mine to
      compare" and "mine to destroy" cannot both be true of the same bytes. A
      directory whose only content is unowned is itself unowned, or the
      exclusion would fail by exactly one directory level.

      TWO SCOPES, and the asymmetry is the answer to "shared, derived, or
      separate". Rederivable.CACHES -- tool-private names that can only be
      caches -- is shared verbatim with HomeCloner, so its behaviour is
      unchanged. Rederivable.OUTPUT_ROOTS (build, target, node_modules, .venv,
      venv) is read by the reconcile ONLY: a clone has to hand over a home that
      WORKS and re-anchors those trees per copy, and
      node_modules/<pkg>/build/Release/*.node is a prebuilt native binary
      nothing on the destination rebuilds; a reconcile has no re-anchoring pass
      at all, so a .venv it copied would arrive with console-script shebangs
      naming the SOURCE home. Two questions, one answer where the questions
      agree.

      `.git` IS DELIBERATELY NOT IN THE SET, stated at length in Rederivable's
      javadoc under an anchor, because it churns exactly like the entries that
      are and every instinct says to add it. Issue #29: a unit whose agent
      COMMITTED work holds those commits in .git and nowhere else, so a skipped
      .git makes the unit read as unmodified, clears the teardown, and takes
      the commits with it.
    model_change: >
      None, and the reason is recorded rather than left implicit. The claim is
      about WHICH BYTES a reconciliation owns; sync_body is a total function
      over SyncPaths in which every path is content by construction. Expressing
      it needs a second, disjoint path class and multiplies the axis this slice
      was already decomposed to control -- for a property decided by one
      predicate over path NAMES. Covered end to end instead.
    acceptance:
      assertions:
        - A worktree that was only built in is reported unchanged and its teardown clears.
        - Build output does not travel between homes.
        - A refresh that rewrites the unit around it does not delete it.
        - A unit the agent committed in still blocks the teardown.
    evidence:
      unit:
        - 'HomeSyncTest "build output written inside a unit does not make the unit differ" -- status, the gate, and the bytes still on disk'
        - 'HomeSyncTest "a refresh keeps the build output it does not own"'
        - 'HomeSyncTest "a .git directory inside a unit is content, never skipped as build output" -- the guard on the fix'
      graph: >
        home-sync node home.sync.built.in.unit. It RUNS python3 on a script that
        imports a sibling module and writes a Gradle cache and a jar, then
        asserts about whatever the run left behind -- the .pyc's path and
        filename are CPython's, not the node's. Carries the #29 guard in the
        same node: a second unit is `git init`ed and committed in, and the
        teardown must still refuse.
      tlc: 'Not modelled; see model_change. All 24 pre-existing expected-violation configs still violate and all 11 must-pass configs still pass.'
      mutation: >
        `isUnowned` -> `return false` (4 occurrences of the symbol counted
        first: 1 definition and 3 uses, all routing through the one definition).
        Killed HomeSyncTest "build output written inside a unit does not make
        the unit differ" on the STATUS and "a refresh keeps the build output it
        does not own" on the refresh. Reverted; shasum -a 256 -c OK.

  - id: CHM-18
    title: "`--dry-run` creates a directory and a lock file in the destination it promised not to write"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 42
    found_by: measuring what a dry run left behind in the operator's own read-only home
    objective: >
      A dry run created `~/.skill-manager/.materialization/` and a zero-byte
      `.materialization/.home.lock` inside it. `--dry-run` is documented
      "Compute and print the whole report, write nothing". Content-benign, and
      still: it breaks the contract, it would fail outright against a read-only
      or frozen destination, and it is exactly the write a caller reaches for
      `--dry-run` to avoid. The lock was acquired BEFORE the plan was computed,
      so no amount of care later could have prevented it.
    resolution: >
      HomeLock.acquireWithoutCreating. The in-process ReentrantLock is taken
      unconditionally -- it is memory, not disk, and it excludes every writer in
      this JVM completely. The OS file lock is taken only when the lock file
      already EXISTS, and that is not a concession: creating that file is the
      first thing acquiring the lock does, so its absence is positive evidence
      that no process anywhere holds it. There is nothing to exclude against
      and nothing to wait for. Where the file is there, the ordinary path runs
      unchanged, wait included.

      The residual window -- a peer that begins AFTER the check -- is bounded
      and stated rather than waved away: every real writer stages each unit and
      swaps it in atomically, so no unit is ever read half-written, and the
      worst case is a report naming units from either side of a peer's pass,
      which is what it would have said had the peer run a millisecond earlier.
    model_change: >
      None. The claim is about a filesystem side effect of acquiring a lock,
      and this model has neither a filesystem nor a lock.
    acceptance:
      assertions:
        - A dry run against a destination that does not exist does not create it.
        - A dry run against an existing home creates nothing at all in it.
        - A real run still creates and holds the lock file.
    evidence:
      unit: 'HomeSyncTest "--dry-run reports the whole reconciliation and writes nothing" -- on file PRESENCE, plus the empty-directory case so "nothing was created" is measured rather than inferred from the parent being absent, plus the real run still locking'
      graph: 'home-sync node home.sync.permutations: the allow-list handed to wroteNothingBut is now EMPTY, and the fresh-destination case asserts the directory does not exist'
      tlc: 'Not modelled; see model_change.'
      mutation: >
        `HomeLock.acquireWithoutCreating` -> `HomeLock.acquire` at its one call
        site (counted first: 1 use, 1 javadoc reference). Killed HomeSyncTest
        "--dry-run reports the whole reconciliation and writes nothing" on
        "a dry run against a destination that does not exist does not create
        it", which is a file-presence assertion. Reverted; shasum -a 256 -c OK.

  - id: CHM-19
    title: "project -> root is a silent no-op against the only destination an operator has"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 43
    found_by: running the documented upward sync against the real root home
    objective: >
      `home sync --from <project> --to ~/.skill-manager` reported EVERY shared
      unit held-back -- "no usable materialization record, so its contents
      cannot be shown to be disposable" -- and exited 0 having reconciled
      nothing. 6, 7 and 5 units on three real repositories. The same sync
      against a throwaway root produced by `home clone` succeeds (6 updated,
      byte-identical), because a clone records baselines and a home that was
      INSTALLED into has none.
    resolution: >
      A second showing of the baseline rule's first decision, not a second
      rule. Disposal gains sourceHeldTheseBytes: the SOURCE's own record names
      the tree the destination is standing on now. The rule is unchanged word
      for word -- the bytes a fast-forward destroys must be bytes the source
      passed through -- and only the evidence differs, because a record-less
      destination cannot answer for itself and the source can.

      NOT adoption, deliberately. Writing a baseline into the record-less
      destination asserts that two homes shared bytes they may never have
      shared, it persists, and the next reconcile in either direction reads it
      as a licence. Nothing is written; this is a question asked and answered
      from evidence already on disk, once, per pass.

      contentDigest and NOT sourceDigest, which is the whole safety argument in
      one field name: contentDigest is "the bytes this reconcile wrote HERE",
      so the source demonstrably held them, while sourceDigest is the tree the
      source was HANDED, which after a merge the source never held. It is also
      whole-tree, which entryDigests deliberately is not after a merge.

      Every hazardous shape stays blocked because all of them make the
      destination hold something else -- a third home's work merged in since, an
      edit made there, an upstream change -- and each moves the destination's
      digest off the source's recorded content, routing the unit back to
      held-back or to a conflict a human resolves. copyUnit was brought under
      the same value in the same edit, because Disposal is the single reading of
      the rule and CHM-15 was exactly what happens when it is not.
    model_change: >
      External gains RecordlessDestinationPolicy (SOURCE_WITNESSED /
      NEVER_DISPOSABLE / ALWAYS_DISPOSABLE), the NoRecordOrigin token, and a
      ROOT tier that starts record-less in Init. That last is what made the
      defect expressible: Init handed EVERY tier a clone-time baseline -- the
      state `home clone` leaves behind -- so the one destination an operator
      actually has was unrepresentable, and a reconciliation that could write
      nothing into it was indistinguishable from a correct one. DestMovedAt
      gained the `# NoBaseline` guard the record-write rule already had, because
      a record that claims nothing cannot have been moved away from.

      NEVER_DISPOSABLE -- the code as it was -- violates NOTHING, and that is
      why the axis had to exist rather than a counterexample: safe and useless
      is not catchable by a safety invariant.
    acceptance:
      assertions:
        - A plain upward sync into a record-less home moves the bytes.
        - A record-less home holding bytes no record accounts for is still held back, intact.
        - The refusal names which of the two reasons applied.
        - External_regression_blindadoption.cfg keeps producing a counterexample.
    evidence:
      unit:
        - 'HomeSyncMergeTest "a record-less destination the source is on record as having held is refreshed" -- both halves, on bytes'
        - 'HomeSyncMergeTest "a destination unit with no materialization record is never overwritten" -- the untouched-bytes half, message updated'
        - 'HomeSyncTest "a clone of a home that edited a unit in place restates the baseline" -- now UPDATED rather than MERGED, same clone-time baseline doing the work'
      graph: 'home-sync node home.sync.project.to.root, rewritten: the fast-forward that now happens AND the hold-back that still must, plus that --merge folds the two disjoint edits without spending the root home own edit'
      tlc: 'External_regression_blindadoption.cfg violates AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough at depth 3 (8 distinct states). All 24 pre-existing expected-violation configs still violate the same invariant; all 11 pre-existing terminating must-pass configs still pass. Sync-slice state counts moved and are re-recorded in spec_manifest.yaml.'
      mutation: >
        `sourceHeldTheseBytes` -> `if (true) return false` (8 occurrences of the
        symbol counted first: 1 definition, 1 record component, 1 read in
        disposable(), 1 write in disposal(), 4 in prose -- all routing through
        the one definition). Killed HomeSyncMergeTest "a record-less destination
        the source is on record as having held is refreshed" on
        "a plain upward sync is no longer a silent no-op", and HomeSyncTest
        "a clone of a home that edited a unit in place restates the baseline".
        Reverted; shasum -a 256 -c OK.

  - id: CHM-20
    title: "the home's CLI entrypoint could never find a CLI, and the assertion covering it was one-sided"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    found_by: an operator running the shim on a machine with a working CLI on PATH
    objective: >
      LauncherShims.cliScript() emitted `printf '%%s'`. That is correct in
      script(String), which ends in `.formatted(agent)`, and wrong here, where
      nothing unescapes it: the doubled percent reached bash literally, and bash
      `printf '%%s'` prints the two characters `%s` rather than its argument. So
      the filtered PATH became the single entry `%s`, `command -v skill-manager`
      found nothing, and the shim took the "no CLI is provisioned" branch
      UNCONDITIONALLY. Measured with /opt/homebrew/bin/skill-manager on PATH:
      exit 127. All seven onboarded constituent homes affected.

      It survived because CheckoutHomeProvisioned only ever exercised the
      no-CLI-reachable case -- SKILL_MANAGER_CLI cleared and PATH set to the
      shim's own directory -- and asserted a non-zero exit. A shim that ALWAYS
      exits 127 satisfies that perfectly. A one-sided assertion cannot tell a
      correct refusal from a dead command.

      Worse than under-tested: the PATH-filtering loop exists so the shim does
      not resolve to ITSELF (LaunchEnv puts <home>/bin/cli at the front of the
      launch PATH). With printf broken the filter had never once run, so the
      self-recursion guard was untested in practice.
    resolution: >
      Write the percent once, and say in the javadoc why it is once here and
      twice one method above -- naming the trap for whoever adds a format
      specifier later. The assertion is now two-sided in both the unit suite and
      the graph, asserted on the exec'd CLI's OUTPUT rather than on a zero exit
      (a shim that exits 0 without launching is the defect the shim exists to
      prevent), plus a direct assertion that no `%%` survives in the generated
      body.

      The recursion guard is exercised for real: the shim's own directory FIRST
      on PATH and a working stub behind it, exactly as a launch arranges them,
      with a bounded wait so a self-exec spin is a NAMED failure rather than a
      hung suite. Every case runs on a hermetic PATH holding links to bash,
      dirname and tr and nothing else -- emptying PATH makes the shim die on a
      missing dirname, which is a non-zero exit that looks like a refusal and is
      not one, and leaving /usr/bin on it would let the refusal case find a real
      skill-manager on some machines.
    model_change: none
    acceptance:
      assertions:
        - The shim execs the skill-manager it finds and hands the arguments over.
        - The shim does not resolve to itself when its own directory leads PATH.
        - The shim still refuses, with its diagnostic, when nothing is reachable.
        - The generated body contains no doubled percent.
    evidence:
      unit:
        - 'LauncherShimsTest "the cli entrypoint execs the skill-manager it finds on PATH" -- on the stub CLI output and its view of the arguments'
        - 'LauncherShimsTest "the cli entrypoint never resolves to itself" -- bounded, so recursion is a named failure'
        - 'LauncherShimsTest "the cli entrypoint refuses when no skill-manager is reachable" -- on the diagnostic, not on a bare non-zero exit'
        - 'LauncherShimsTest "the cli entrypoint body carries no unformatted percent"'
      graph: 'checkout-home node checkout.home.provisioned, three bounded invocations on a hermetic PATH: nothing reachable, a stub reachable, and the shim own directory first with the stub behind it'
      mutation: >
        Restored `printf '%%s'` at BOTH sites in cliScript() (2 occurrences
        counted first; mutating one would have left the other half of the filter
        working). Killed three named tests: "the cli entrypoint body carries no
        unformatted percent" on the BYTES, and both
        "the cli entrypoint execs the skill-manager it finds on PATH" and
        "the cli entrypoint never resolves to itself" on the exec'd output --
        each reporting the refusal banner where the stub sentinel was expected.
        Reverted; shasum -a 256 -c OK.

  - id: CHM-21
    title: "a git-sourced unit's .git was digested as unit content, so it was held back forever -- and skipping it destroys commits"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 29
    found_by: end-to-end home-sync graph coverage, then TLC three times over on the model of the fix
    objective: >
      A unit installed from a git source keeps .git inside the home, so a COPY
      carries it -- 61 entries, measured. .git rewrites itself on every git
      command, `git status` included, so the unit's whole-tree digest moved off
      contentDigest the first time anybody looked at it and every later pass
      reported it locally modified. Nothing cleared that, ever, on exactly the
      units an agent works in: `home close-out` could not be satisfied and the
      worktree could not be torn down.

      Skipping .git from the digest removes that symptom and is a DATA-LOSS
      DEFECT, which is why this is its own ticket. A commit moves bytes ONLY
      inside .git. An agent whose edit has already been synced up and who then
      commits it locally has a working tree byte-identical to the record and
      history that exists in one home on earth; excluded from the digest, that
      unit reads UNMODIFIED, the gate clears, the worktree is removed, and the
      commits stop existing.
    resolution: >
      Split the tree at .git and ask each half of the authority that can answer
      it -- ChildHomeMaterializer.gitCopyIsUntouched: the digest for every byte
      OUTSIDE .git (a new record field, worktreeDigest), and git for the history
      (a second new field, historyDigest). Bookkeeping moves neither half; a
      commit moves the second. `git status` is deliberately NOT consulted for the
      worktree half: a unit that does not gitignore its build/ would come back
      dirty and put issue #41 straight back.

      gitHistoryMovedOn is shared with checkoutIsModified so a CHECKOUT and a
      git-backed COPY cannot come to disagree about what "the agent has
      committed something" means.

      REWORKED AFTER REVIEW. The first version of this asked git ONE question --
      HEAD == the recorded revision -- and that was a data-loss REGRESSION, not
      merely a gap. A commit on a side branch the agent switched away from, and a
      `git stash`, both leave HEAD where it was and the working tree clean, so the
      unit read as pristine and a plain downward sync replaced .git wholesale:
      measured, cat-file -e exit 128 on the side commit and an empty
      `git stash list`, from a pass reporting "the destination held no local
      work". Before #29 the whole-tree digest never matched after ANY git command,
      so the permanent false positive was ACCIDENTALLY protecting every object in
      the repository; replacing "the bytes are identical" with "(HEAD, worktree
      bytes) are identical" made side branches, stashes, tags and notes disposable
      at a stroke.

      historyDigest is therefore a digest over the FULL ref listing
      (`for-each-ref refs/`, which includes refs/stash) plus HEAD -- the asymmetry
      rule applied literally, when in doubt conflict. A listing digest rather than
      `rev-list --all --not <rev>` because a ref DELETION and an annotated tag are
      both invisible to a reachability query, and the whole point is to stop
      converting "cannot see" into "nothing there". Named costs: a fetched
      remote-tracking ref and a deleted merged branch both read as moved-on, each
      worth one conflict a human resolves.

      Also added, because the record-based route cannot reach it:
      gitTwinsDifferOnlyInBookkeeping, an UNCHANGED shortcut for two homes that
      are identical outside .git and stand on the same refs. It is what makes the
      issue's own words -- "after ANY git command on EITHER side" -- true, and it
      is the only thing that clears close-out when the destination is an installed
      home with no record at all (#43's shape) or when the churn happened in the
      SOURCE. Safe unconditionally because it writes nothing.
    model_change: >
      A new axis on External.tla, additive and default-off. Constants
      GitBackedUnits (FALSE pins every variable the axis adds at its initial
      value, so all thirty pre-existing configs keep their exact state counts --
      External_sync.cfg is still 65297/6379/21 and External_sync_guard_ffprovenance
      still 480496/45542/24) and GitProvenance with FOUR values, because all three
      of the others are defects and they fail in different directions.

      sync_git carries TWO history components, head and side, and the second was
      added in the rework because without it the HEAD_ONLY defect is
      INEXPRESSIBLE: with only a tip, "the predicate reads HEAD" and "the
      predicate reads the repository" are the same proposition and
      External_sync_git.cfg is clean because the question cannot be asked. That
      was a vacuous-model finding about this very slice, on a defect that had
      already been measured on real homes.

      Variables sync_git (per home: whether git has rewritten its own
      bookkeeping, and the SET of commits reachable from HEAD) and sync_committed
      (WITNESS: every commit ever made, written at the moment it is made because
      a reconciliation destroys the commit and the evidence of it in the same
      step). Actions ChurnGitBookkeepingInHomeTier -- which deliberately leaves
      sync_history alone, because nobody authored anything -- and
      CommitInHomeTier, which deliberately leaves sync_body alone, because that
      is the whole trap. The record gained TWO git fields, not one:
      git_head (evidence about this home alone) and git_base (evidence about a
      pair, claimed only where the pass can show it).
    spec_findings: >
      THREE defects in the model of the fix, each found by TLC and none of which
      a test would have reached:

      1. SourceHeldDestBytes licensed a fast-forward into a RECORD-LESS
         destination on the strength of the worktree paths alone, so a root home
         that had committed was overwritten from a home whose worktree merely
         agreed with it. The code does not have that hole -- the digest
         sourceHeldTheseBytes compares is the WHOLE tree, .git included -- but a
         desired-state model weaker than the code cannot protect it.
         SourceHeldDestGit states the other half.

      2. Writing the destination's own current head as the merge base made `d =
         b` hold trivially, so the next merge read it as "only the source moved"
         and took the agent's commit away with no conflict and no report. That is
         CHM-10 exactly, one dimension across, and it is why the record carries
         git_base separately from git_head.

      3. A tip-only history produced a FALSE violation: a commit merged up and
         then committed on top of is no longer any home's tip, and git has it as
         an ancestor. Modelling the history as the reachable SET fixed the
         invariant rather than weakening it.
    acceptance:
      assertions:
        - Bookkeeping churn inside a unit does not hold the unit back, on EITHER side, and the churn is asserted to have moved the whole-tree digest first so the case cannot pass vacuously; the gate is asserted through HomeCloseOut.inspect().safe() rather than UnitSync.unresolved(), which is a strictly smaller set than what remedyFor blocks on.
        - A commit reachable only from a side branch, and a stash, both survive -- asserted on cat-file -e and git stash list, never on a status.
        - A commit the source does not have holds the unit back, with the working tree asserted byte-identical through entryDigests(root, {".git"}) -- the exact view the naive fix compares.
        - A reconcile with the source moved on keeps the commit: HEAD, the commit object and the committed file's content are all still readable out of the destination afterwards.
        - An uncommitted edit still holds the unit back, so the worktree half of the conjunction is load-bearing on its own.
    evidence:
      unit:
        - 'HomeSyncGitUnitTest "git''s own bookkeeping inside a unit does not hold the unit back"'
        - 'HomeSyncGitUnitTest "a commit the source does not have holds the unit back"'
        - 'HomeSyncGitUnitTest "a reconcile keeps commits made in a unit whose working tree it did not change"'
        - 'HomeSyncGitUnitTest "an uncommitted edit in a git-backed unit is still an edit"'
        - 'HomeSyncGitUnitTest "a commit on a side branch survives, with HEAD never having moved"'
        - 'HomeSyncGitUnitTest "a stash survives a sync that would otherwise replace .git"'
        - 'HomeSyncTest "a .git directory inside a unit is content, never skipped as build output" -- epic #1''s guard, still green'
      spec:
        - 'External_sync_git.cfg -- No error has been found, 61149 states / 10120 distinct / depth 15'
        - 'External_regression_wholetreegit.cfg -- GitBookkeepingIsNeverReportedAsWork violated at depth 2'
        - 'External_regression_headonlygit.cfg -- CommittedWorkIsNeverDestroyed violated at depth 3, counterexample CommitOnSideRefInHomeTier then TearDownWorktreeHome'
        - 'External_regression_skipgit.cfg -- CommittedWorkIsNeverDestroyed violated, 45 distinct states'
        - 'External_sync_guard_skipgit.cfg -- GUARD: No error has been found, 83275/14924/19'
        - 'External_sync_guard_headonlygit.cfg -- GUARD: No error has been found, 80241/13876/17, with TWO invariants removed; see the manifest entry for why the second removal is itself the finding'
        - 'All 36 External configs re-run: every regression config violates its named invariant, every guard and must-pass config clean, and the pre-existing counts are byte-identical to the parent commit (External_sync 65297/6379/21, External_sync_guard_ffprovenance 480496/45542/24, External_home 2966/706/12, External 1302/250/9)'
      graph: 'home-sync 17 nodes / 180 assertions passed; project-child-home 11/60; home-clone 8/59'
      mutation: >
        R1, THE SHIPPED REGRESSION AS A MUTATION: gitHistoryMovedOn's
        historyDigest comparison replaced by the HEAD-only reading it had before
        the rework (1 occurrence, counted first). Killed "a commit on a side
        branch survives, with HEAD never having moved" ON THE OBJECT STORE
        (cat-file -e 128) and "a stash survives a sync that would otherwise
        replace .git" ON `git stash list` (empty) -- both reporting the pass's own
        words, "refreshed from the source; the destination held no local work".

        R2, the differ-only-in-bookkeeping shortcut stops comparing the history
        (1 occurrence): killed "a commit the source does not have holds the unit
        back" -- UNCHANGED for HELD_BACK, i.e. the shortcut would have become a
        second way to call a home with a unique commit pristine.

        R3, the shortcut removed entirely (1 occurrence): killed "git's own
        bookkeeping inside a unit does not hold the unit back" on the close-out
        gate, whose blocker came back as `updated -- the destination held no local
        work` with a remedy. That is the symptom this shortcut exists for.

        M1, THE REQUIRED NAIVE FIX: gitCopyIsUntouched's history clause replaced
        by `return true`, which IS "skip .git in the digest" in this code's terms
        (1 occurrence). Killed FOUR: both commit-survival cases, the side-branch
        case and the stash case.

        M1b, the literal form, adding .git to isUnowned (1 occurrence): killed
        SEVEN, including epic #1's guard "a .git directory inside a unit is
        content, never skipped as build output".

        M1c, the worktree half of the conjunction removed (1 occurrence): killed
        "an uncommitted edit in a git-backed unit is still an edit" plus
        ProjectTrunkSyncTest "project sync does not destroy an edit in the child
        home" -- ProjectTrunkSyncTest, corrected from an earlier report that named
        ProjectChildHomeMaterializationTest, under which class the mutation kills
        nothing.

        Every mutation reverted; shasum -a 256 -c OK.

  - id: CHM-24
    title: "a git-backed unit's .git goes through the three-way merge algebra, so close-out names .git/index as a file to resolve"
    phase: CHM
    status: open
    needs_github_issue: true
    found_by: adversarial review of CHM-21, which measured it against the parent commit and found it byte-identical
    objective: >
      MEASURED, and reproduced again while closing CHM-21. Agent commits real
      work in the worktree home, upstream also moves, `home close-out` exits 1:

        conflicted  skill:gitskill -- 5 file(s) changed on both sides; nothing was written
        fix skill:gitskill: <cli> home sync --from <wt> --to <proj> --merge
          (then resolve: .git/COMMIT_EDITMSG, .git/index, .git/logs/HEAD,
           .git/logs/refs/heads/main, .git/refs/heads/main)

      Running that remedy verbatim exits 1 and leaves the gate exactly as it was,
      permanently. Nobody resolves .git/index. This is issue #41's shape
      re-created one directory over: a binary bookkeeping file named as a human's
      merge task, in a remedy the gate's whole contract says is the exact command
      that clears it.

      PRE-EXISTING, not a regression: byte-identical against e8c6b96, and CHM-21
      touched only the disposal question (Disposal.destUntouched and the
      differ-only-in-bookkeeping shortcut), never mergePlan or
      SyncConflictPaths. CHM-21 did narrow it -- a unit whose .git merely CHURNED
      now reconciles as unchanged in both directions, so the remaining
      unsatisfiable case needs genuinely divergent commits, where a human really
      does have to do something. What they have to do is still not
      "resolve .git/index".
    why_its_own_ticket: >
      Both obvious fixes are decisions with blast radius, and one of them is
      unsafe:

      (a) Exclude .git from the merge algebra's take/conflict sets. Then a
          divergent history stops being reported by the MERGE path while the
          DISPOSAL path still asks about it -- two readings of one question in one
          class, which is CHM-15's shape exactly. Worse, for a unit whose only
          difference IS the history (worktree files identical, the shape CHM-21's
          central test uses), take and conflicts both go empty, the status becomes
          unchanged, and close-out reports a worktree holding a unique commit as
          SAFE. The narrow fix is itself a data-loss defect -- the same trap #29
          had, one layer down.

      (b) Route a git-backed COPY to `unit publish` the way a CHECKOUT already is,
          and never merge its .git by file copy. Coherent, and it decides that a
          commit may NOT travel between homes by `home sync` at all -- which
          contradicts what CHM-21's spec slice models (GitTakeAllowed is currently
          how a commit reaches the tier above) and needs `unit publish` in the
          model before the invariant can be restated. It also has to answer what
          clears the gate after publishing, since the two .git trees still differ.

      So it needs a decision, a spec slice and its own mutation proofs. Bundling
      it into a ticket whose blocker was a data-loss regression is how the epic
      gets a second one.
    acceptance:
      assertions:
        - The remedy a git-backed conflicted unit prints is runnable and, run verbatim, changes the verdict.
        - No .git path is ever named to a human as a file to resolve.
        - A worktree holding a commit the destination lacks is still refused, whichever route is chosen.

