# ---------------------------------------------------------------------------
# Two defects in ALREADY-MERGED code, found by modelling the sync mechanism and
# then reproduced end to end against the real classes. Both were silent data
# loss and both needed a decision about the CONTRACT rather than a patch, which
# is what these tickets were for. They were then fixed TOGETHER, with the
# stale-baseline finding, because all three are the same question -- what is the
# merge baseline of these two homes, and who is allowed to rewrite it -- and
# three independent patches would have been a fourth idiom (issue #24).
  - id: CHM-9
    title: "A fast-forward makes the destination a pristine copy of a home that may be gone"
    phase: CHM
    status: closed
    closed: "2026-07-27"
    resolved_with: [CHM-10, the stale-baseline finding]
    depends_on: []
    production_status: defect_in_merged_code
    severity: silent_data_loss
    found_by: >
      External_regression_ffprovenance.cfg, then reproduced against HomeSync /
      HomeCloseOut / ChildHomeMaterializer directly.
    objective: >
      MaterializationRecord.reconcileKind distinguishes a merge result from a
      pristine copy. It does not distinguish one pristine copy from another, and
      that is the distinction that matters: a pristine copy is only disposable
      relative to the home it is a copy OF.
    reproduction:
      - "root home installs skill s at ROOT V1; project and worktree are clones."
      - "the ticket agent edits s in the worktree home."
      - "`home sync --from worktree --to project` -- the project had moved nothing, so this is a clean fast-forward. Status UPDATED. The project's record: reconcileKind = \"copy\", source = <worktree>/skills/s."
      - "`home close-out` reports the worktree as safe -- correctly, the work is in the project now."
      - "the worktree is torn down."
      - "the root home ships ROOT V2. `home sync --from root --to project`."
      - "reconcile sees destUntouched (true -- the project matches its own record) and !isMergeResult (true -- kind is \"copy\"), takes the wholesale-copy path, and OVERWRITES. The agent's SKILL.md and agent-note.md are gone, from the only place they existed. Status UPDATED. Nothing is reported."
    why_nothing_catches_it: >
      The record's `source` field names the worktree, and nothing reads it --
      reconcile reads sourceDigest, contentDigest, entryDigests and
      reconcileKind, never source. And the write really is entitled by every
      test about the DESTINATION: the project home genuinely had not moved
      anything. External_sync_guard_ffprovenance.cfg is that fact as a config
      that must keep passing.
    aggravating: >
      HomeCloseOut.remedyFor returns a plain `home sync` (no --merge) for status
      UPDATED, so the remedy the tool prints is the one that creates this state.
      `--merge` is not affected: it records reconcileKind = "merge".
    modelled_as: 'ReconcileProvenance: SOURCE_AWARE (desired) vs MERGE_KIND_ONLY (today)'
    resolution: >
      MaterializationRecord.source was already written and correct; reconcile now
      READS it. A destination may be replaced wholesale only when it still holds
      exactly what its record says was written there AND that record is evidence
      about the home now pushing -- it names it, or names nobody (a clone's own
      baseline), or the two homes recorded the same baseline, or the source is
      standing on that baseline right now. Anything else holds back, and under
      --merge conflicts. The rule is stated once, in ChildHomeMaterializer's
      class javadoc under "The baseline rule", and CHM-10 and the stale-baseline
      finding are the same rule applied to the merge base and to what a clone
      writes down.
    acceptance:
      assertions:
        - A destination may be replaced wholesale only when its current content came from the home now pushing, or from nobody.
        - External_regression_ffprovenance.cfg keeps producing a counterexample.
        - The reproduction above ends with the agent's bytes still in the project home.
      evidence:
        unit: 'HomeSyncMergeTest "a fast-forward is not disposable to a home it never came from (CHM-9)" -- the whole reproduction including the teardown, asserted on bytes'
        graph: 'home-sync node home.sync.provenance: sync up, close out, remove the worktree, sync down, through the real CLI over real homes'
        tlc: External_regression_ffprovenance.cfg still violates AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough at depth 4 (24 distinct states)
        mutation: 'dropped `&& recordIsAboutThisSource` from the wholesale-copy guard; the named unit test failed with "expected <AGENT IMPROVED THIS> but was <ROOT V2>"; reverted and verified with shasum -a 256 -c'

  - id: CHM-10
    title: "mergeBase picks a baseline newer than the common ancestor, and reverts work without a conflict"
    phase: CHM
    status: closed
    closed: "2026-07-27"
    resolved_with: [CHM-9, the stale-baseline finding]
    depends_on: []
    production_status: defect_in_merged_code
    severity: silent_data_loss
    found_by: >
      A unit test written for this slice, which failed on the first run:
      HomeSyncMergeTest "DEFECT PIN CHM-10". Independently modelled as
      External_regression_mergebase.cfg.
    objective: >
      ChildHomeMaterializer.mergeBase prefers the DESTINATION's record. A merge
      rewrites that record over the whole merged tree -- local work included --
      so the destination's own edits become part of its recorded baseline. On
      the next --merge the source, which never held those bytes, is measured
      against them: s != d, s != b, d == b, which the algebra reads as "only the
      source moved" and takes. The local work is reverted with no conflict and
      no report.
    reproduction:
      - "source and destination share SKILL.md / upstream.md / local.md at v1."
      - "the agent edits local.md in the destination; the source moves upstream.md to v2."
      - "`home sync --merge` -- MERGED. upstream.md becomes v2, local.md keeps the agent's work. Correct. The record's entryDigests now say local.md = the agent's bytes."
      - "the source moves upstream.md again, to v3. Nothing touches local.md on either side."
      - "`home sync --merge` -- MERGED. upstream.md becomes v3, and local.md is REVERTED to the source's v1. No conflict is reported."
    the_javadoc_is_wrong: >
      mergeBase's own comment argues that the cost of choosing the wrong base
      "is a conflict a human resolves, not an edit nobody sees again". That
      holds only when the chosen base is OLDER than the true common ancestor --
      an older ancestor produces more conflicts and never fewer. Here it is
      NEWER, and the cost is exactly the edit nobody sees again.
    scope: >
      Two homes and one repeated source change are enough. It does not need a
      worktree, a teardown, or three tiers. Any project home that has ever taken
      a --merge is exposed on the next one.
    modelled_as: 'MergeBasePolicy: SHARED_ANCESTOR (desired) vs DESTINATION_RECORD (today)'
    relationship_to_the_stale_baseline_finding: >
      ea03c22 records the OPPOSITE failure of the same design: a baseline that
      is too OLD (a clone inherits a record describing content neither home
      holds any more, and a completed sync rewrites only the destination's
      record) turns a clean fast-forward into a conflict a human has to settle.
      That one is safe and annoying; this one is unsafe and silent. They are the
      two directions of one question -- what is the common ancestor of these two
      homes -- and mergeBase answered it with whatever the destination last wrote
      down. Fixing either without the other would have moved the failure rather
      than removed it, so they were fixed together: `home clone` now restates the
      baseline of a COPY unit whose inherited record describes content the copy
      does not hold, which is what makes the merge base of a clone the clone
      itself. home.sync.stale.baseline measures the result --
      reconciledWithoutAHuman = 1, spuriousConflict = 0.
    design_note: >
      The model's SHARED_ANCESTOR abstraction -- take a path only against a
      baseline the SOURCE has itself held -- is one implementable answer
      (compare the two homes' entryDigests, or keep a per-source ancestor the
      way a remote-tracking ref does). Refusing with a conflict instead is
      another, and cheaper. Which one is an owner decision about what --merge
      promises, which is why this is a ticket and not a patch.
    resolution: >
      Neither of the two options in design_note, and both of their effects. What
      a merge WRITES DOWN was wrong, not only what it reads: entryDigests now
      records the SOURCE's tree at the reconcile -- the state the two homes then
      demonstrably share -- while contentDigest goes on recording what was
      written here. A merged tree is a state the source never passed through, so
      it was never eligible to be the next merge's base. mergeBase then prefers
      the destination's record only when it is evidence about this source, and
      otherwise falls back to the SOURCE's record, which is sound because the
      source passed through it by construction and the destination's half of
      "only one side moved" is enforced per path by mergePlan. Neither
      available: no base, and the unit conflicts.
    acceptance:
      assertions:
        - A merge takes a path only against a baseline the source itself passed through.
        - External_regression_mergebase.cfg keeps producing a counterexample.
        - 'HomeSyncMergeTest "DEFECT PIN CHM-10" is turned into the assertion of the correct behaviour and renamed, not deleted: the pin is the record that the defect was real, and a third merge round was added because the defect was in what a merge writes down and would otherwise revert the work one round later.'
      evidence:
        unit: 'HomeSyncMergeTest "a second --merge keeps the work the first one kept (CHM-10)" (was the DEFECT PIN)'
        graph: 'home-sync node home.sync.provenance: three merges from one source, asserted on the bytes of the file the source never touched'
        tlc: External_regression_mergebase.cfg still violates AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough at depth 4 (26 distinct states)
        mutation: 'recorded the merged tree as the baseline again (entryDigests from the staged tree, sourceDigest unchanged); the named unit test failed with "expected <AGENT WORK> but was <v1>"; reverted and verified with shasum -a 256 -c'

