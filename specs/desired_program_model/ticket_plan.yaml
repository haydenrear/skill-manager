  - id: HIS-14
    title: "`--home` binds one of a home's two axes, so a remedy edits the operator's real agent directories"
    phase: HIS
    status: planned
    epic: home-integrity-sync
    github_issue: 232
    added_in_schedule_revision: 5
    wave: 5
    depends_on: [HIS-9, HIS-12]
    blocks: [HIS-13, HIS-15, HIS-5, HIS-6, HIS-8]
    promotion_order: 10
    promotion_predecessor: HIS-11
    conflict_keys:
      production: [HomeCommand.homeEnvPrefix, SyncCommand.home, ProjectCommand.SyncCmd.home, AgentHomes]
      tla: []
      adapters: []
      test_graph: [home-integrity/EveryShimResolves]
      workflow_data: []
    found_by: >
      HIS-12 (#161), filed as DEF-029 -- by pasting its OWN printed remedy into
      a fresh shell and then looking at what it had touched. Not by a check.
    root_cause: >
      A HOME HAS TWO AXES AND `--home` PINS ONE.

      SKILL_MANAGER_HOME says where the UNITS live. CLAUDE_CONFIG_DIR,
      CODEX_HOME and GEMINI_HOME say where the AGENT CONFIGS live, and they are
      a separate axis. `--home` sets the first only, so the store half goes
      where it was told and the agent half resolves against the ambient
      environment.

      MEASURED, with SKILL_MANAGER_HOME unset and the root home's bin/cli first
      on PATH:

        $ <build> sync probe-unit --merge --home <scratch>/project/.skill-manager
          ✓ units.lock.toml: wrote 1 unit(s) -> <scratch>/project/...
          ✓ agents: 1 unit(s) linked into claude, codex, gemini   <-- WHICH claude?

      The agent half landed in the OPERATOR'S REAL homes -- three dangling
      symlinks under ~/.claude, ~/.codex, ~/.gemini plus marketplace
      registrations in ~/.claude/settings.json,
      ~/.claude/plugins/known_marketplaces.json and ~/.codex/config.toml. The
      scratch directory was deleted afterwards, so `probe-unit` began appearing
      as a loadable skill IN AN UNRELATED AGENT SESSION. That is how it was
      found. Repaired by hand 2026-08-21; the config edits had to be approved by
      the owner because the permission layer correctly refused both the ticket
      agent and the epic agent.

      THE CORRECT SHAPE IS ALREADY IN THE CODEBASE. HomeCommand.homeEnvPrefix
      binds all four variables and its own javadoc states the rule that was
      broken. `home verify`'s remedy is unaffected because of it. So this is not
      a missing design -- it is the epic's signature defect once more, TWO
      SPELLINGS OF ONE DECISION, where one spelling is right and the other is
      the one every other remedy uses.
    not_introduced_by_his_12: >
      A bare `sync <unit> --merge` behaved identically and could not name a home
      at all. What HIS-12's per-verb contract changes is that the remedy now
      LOOKS bound while binding half, which is worse than visibly unbound: it
      suppresses the doubt that would make a reader check. The epic agent chose
      that contract, so this is a consequence of an epic-level decision rather
      than a ticket-level mistake, and it is recorded that way.
    slice: >
      (1) `--home` binds BOTH axes, or refuses and names the variable it cannot
      set -- on every verb that accepts it: sync, project sync, home drift,
      home shims, home close-out, unit publish, exec.
      (2) Every remedy printing `--home` is runnable without touching an unnamed
      home, PROVED BY EXECUTING the printed string rather than asserting on its
      text.
      (3) A regression fixture that fails when the agent axis is unbound -- the
      assertion this epic did not have, which is why the damage was found by an
      unrelated agent session instead of by the suite.
      NOT IN SCOPE: write confinement (HIS-9, merged), clone provenance (HIS-10,
      merged), detection and repair of homes already damaged (HIS-13).
    acceptance:
      assertions:
        - "A command carrying `--home <X>` writes no byte outside X and the agent directories X owns."
        - That fixture FAILS when the agent axis is left unpinned -- vacuity checked, in writing.
        - "`home verify`'s four-variable prefix and `--home` produce the SAME binding: one answer, not two spellings."
        - A printed remedy is EXECUTED by a test, in a shell whose ambient agent variables name a different home, and leaves that other home untouched.
        - "The root tier is covered by a synthetic root-shaped fixture, and NO test writes to the operator's real agent homes -- the thing that caused this."
    goals:
      - goal: GOAL-one-home-one-answer
        contribution: direct
        expected_effect: >
          two spellings of "which home is this command about" -> one; the agent
          axis stops resolving against whatever the shell happened to export
        local_signal: "jbang RunTests.java"
      - goal: GOAL-no-destructive-recovery
        contribution: guard
        expected_effect: "must not weaken the sanctioned parent-store sharing HIS-10 landed"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"

  - id: HIS-15
    title: "`home close-out --json` emits no JSON when it fails, so the `wt close` gate loses every verdict"
    phase: HIS
    status: planned
    epic: home-integrity-sync
    github_issue: 235
    added_in_schedule_revision: 6
    wave: 6
    depends_on: [HIS-11, HIS-14]
    blocks: [HIS-13, HIS-5, HIS-6, HIS-8]
    promotion_order: 11
    promotion_predecessor: HIS-14
    conflict_keys:
      production: [HomeCloseOut, HomeCommand.CloseOutCmd, HomeLock.acquire, Executor.runStaged]
      tla: []
      adapters: []
      test_graph: [ticket-lifecycle/TicketLifecycleConcurrentCloseOut]
      workflow_data: []
    found_by: >
      The EPIC AGENT, verifying a blocker HIS-14 reported and could not attribute
      -- and it is a regression from HIS-11 (#186), which the epic agent had
      merged an hour earlier on graphs measured ON ITS OWN BRANCH.
    root_cause_as_filed_was_WRONG: >
      THE EPIC AGENT FILED THIS AND GOT THE CAUSE WRONG. Corrected by the ticket
      agent, which measured instead of accepting the framing it was handed --
      the third time in this epic that has happened, after HIS-7 and HIS-4.

      FILED AS: the losing invocation exits non-zero with its explanation on
      stderr and nothing on stdout.

      MEASURED, with a peer holding the project home's lock for 8s:

        $ skill-manager home close-out --home <wt> --into <proj> --json
        exit=0                      <-- THE COMMAND SUCCEEDED
        home sync --dry-run: waiting for /.../proj-home — another
          skill-manager process holds this home's lock
        {"home":"...","into":"...","safe":true,"exitCode":0,...}

      Byte-identical to the error in the red node. The cause is
      HomeLock.announceWait -- the line HIS-11 added so a wait would not look
      like a hang -- going to STDOUT via Log.info. It corrupts the document on
      any run that waits, WHETHER OR NOT that run then fails. The failing run
      exited 0, so every word of the filed cause describing a non-zero exit with
      empty stdout is wrong about the graph.
    root_cause: >
      THREE DISTINCT BREAKS OF ONE CONTRACT, all measured:

        (1) extra non-JSON on stdout (announceWait)   exit 0   unparseable
            <- this is the red graph
        (2) close-out's own not_a_home paths          exit 2   correct JSON already
        (3) an exception escaping the command         exit 1   EMPTY stdout
            <- the filed defect, real, but not the red one

      So the contract is NOT "emit JSON when you fail". It is: UNDER --json,
      STDOUT CARRIES ONLY JSON -- exactly one document, and nothing else -- ON
      EVERY EXIT PATH. A fix aimed only at failure paths closes (3) and leaves
      (1), which is the one that is red.

      MEASURED on epic tip d40c39f, ticket.lifecycle.concurrent.close.out:

        close-change-a:  run: <abs>/skill-manager home sync --from ... --to ...
        close-change-b:  could not parse the verdict:
                         Expecting value: line 1 column 1 (char 0)
                         FIX  .../close-change.sh TICKET-B --force

      `both_close_change_runs_were_refused_by_the_gate` PASSES -- the refusal is
      correct. What is lost is the VERDICT. 6 nodes skip behind the failure,
      home.fixpoint.law among them.
    why_this_is_a_product_defect: >
      close-change.sh:440-447 is the `wt close` gate every ticket in this
      repository runs, and it branches on stdout being parseable. On the
      unparseable path it downgrades to "re-run with --force" -- advising the
      operator to DISCARD work the gate just refused to destroy. That is the
      worst possible fallback for this specific command.

      The HIS-14 reviewer predicted this same consumer harm independently, for a
      DIFFERENT cause (a new exit code whose explanation is on stderr while
      stdout is discarded). Two causes, one hole -- which makes it a CONTRACT
      GAP rather than a bug. `--json` is a promise of machine-readable output,
      and a command that emits none on the failure path breaks it exactly when
      the consumer most needs the reason.
    slice: >
      (1) `--json` always emits JSON, on every exit path, carrying the exit
      reason, the home, and any blockers known at the point of failure.
      (2) The lock refusal is one of those structured reasons rather than an
      unstructured stderr line.
      (3) close-change.sh distinguishes "the gate refused and told me why" from
      "the gate produced nothing", and NEVER advises --force for the second.
      NOT IN SCOPE: the lock's scope or its 120s patience -- that is DEF-041,
      open and unassigned.
    acceptance:
      assertions:
        - "`home close-out --json` emits parseable JSON on EVERY exit path, proved by driving the failure paths and PARSING stdout rather than asserting on text."
        - Two concurrent close-outs — the loser emits a JSON verdict naming contention as the reason.
        - That fixture FAILS when the failure-path JSON is removed — vacuity checked, in writing.
        - "GENERAL, not just this command: an assertion that holds for EVERY command declaring --json, so the next one to grow a failure path is covered by a check that already exists."
        - ticket.lifecycle.concurrent.close.out is green and the 6 nodes behind it run.
        - "close-change.sh never prints --force as the remedy for an unparseable verdict."
    the_assertion_that_was_missing: >
      THIS IS THE POINT OF THE TICKET, stated separately because a fix without
      it leaves the next instance uncaught.

      The graph node DID catch this -- but only on the integrated tip, and only
      because somebody had written that specific node. Nothing asserts the
      GENERAL contract, so every command that grows a `--json` failure path is a
      fresh chance to break it silently, and the failure surfaces as a red
      graph in another ticket's wave rather than as a red unit test in the wave
      that caused it.

      What is wanted is the shape HIS-12 shipped for remedies: a check over the
      CONVENTION, not over one instance. Enumerate the commands declaring
      --json, drive each one's failure paths, and parse stdout. Cheap, runs in
      the unit lane every ticket already runs, and it fails in the wave that
      breaks it.
    goals:
      - goal: GOAL-one-home-one-answer
        contribution: direct
        expected_effect: >
          a machine-readable verdict and a human-readable refusal are currently
          two answers and one of them is empty; after, one answer in two
          renderings
        local_signal: "python skills/test_graph/scripts/run.py ticket-lifecycle"
      - goal: GOAL-no-destructive-recovery
        contribution: guard
        expected_effect: "the gate stops recommending --force, which discards work it just refused to destroy"
        local_signal: "jbang RunTests.java"
