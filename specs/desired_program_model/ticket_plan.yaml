  - id: HIS-1
    title: "copyUnit holds back a tree it can see is identical, because it asks the record instead of the source"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    github_issue: 214
    wave: 1
    depends_on: []
    blocks: [HIS-4, HIS-5, HIS-6]
    promotion_order: 1
    promotion_predecessor: null
    conflict_keys:
      production: [ChildHomeMaterializer.copyUnit, ChildHomeMaterializer.Disposal]
      tla: []
      adapters: []
      test_graph: [home-integrity/ForeignRecordDoesNotHoldBackAnIdenticalTree]
      workflow_data: []
    objective: >
      MEASURED on the operator's real homes: 16 of 18 per-unit materialization
      records name a `source` that is not the root store, and all 18 are
      pristine by their own digest. Every one is held back on every sync,
      printing a five-line paragraph about work that "may exist nowhere else"
      -- over trees nobody has touched. Six of the 16 name a path that no
      longer exists at all: two deleted ticket worktrees, and one
      /private/tmp scratchpad from a past evaluation session.

      The root home is INSTALLED into and carries no per-unit record, so
      `sourceHeldTheseBytes` is unavailable; the destination's own record names
      a worktree rather than this store, so `recordIsAboutThisSource` is false;
      `disposable()` is therefore false and copyUnit() refuses.
    root_cause: >
      NOT the one issue #214 proposes. #214 asks for a "root owns these bytes"
      re-baselining path, which invents provenance -- exactly the move
      `sourceHeldTheseBytes`'s own javadoc argues against, at length, as the
      thing that would persist and be read as licence by the next reconcile in
      either direction.

      The actual defect is a divergence between two paths this file already
      declares must agree. `reconcile()` -- the `home sync` path -- answers
      three questions from evidence on disk BEFORE it consults any record:

        ChildHomeMaterializer.java:1164  src.digest().equals(dst.digest())
        ChildHomeMaterializer.java:1168  gitTwinsDifferOnlyInBookkeeping(source, dest)
        ChildHomeMaterializer.java:1174  gitSourceIsBehind(source, dest)

      `copyUnit()` -- the `project resolve` / root-sync path -- has NONE of
      them. It computes currentDigest at :2173 and hands it straight to
      disposal(). `gitTwinsDifferOnlyInBookkeeping` has exactly one caller in
      the codebase, at :1168.

      So the comment at :2181 -- "`home sync` and `project resolve` read the
      same value or they eventually disagree about the units that matter,
      which is what CHM-15 was" -- is false again, in the opposite direction.
      home sync says UNCHANGED where copyUnit says HELD_BACK.
    slice: >
      Give the baseline rule its THIRD showing, the one that needs no record at
      all: the source is standing on exactly these bytes RIGHT NOW. Where that
      holds, refreshing is a byte-identical no-op, so nothing can be destroyed
      -- whatever either record says, and whether or not the recorded source
      still exists. Route copyUnit through the same three answers reconcile()
      already gives, from one shared function, so the next divergence is a
      compile error rather than a paragraph.

      Do NOT write a baseline into the record-less destination. Nothing is
      written by this showing; it is a question asked and answered from
      evidence already on disk, once, per pass.
    acceptance:
      assertions:
        - A unit byte-identical to the live source outside .git reconciles silently, whatever its record names.
        - A unit whose content genuinely differs is still held back, with the message unchanged.
        - copyUnit and reconcile answer the disposability question through ONE function, not two.
        - No record is written by the new showing.
    goals:
      - goal: GOAL-no-spurious-holdback
        contribution: direct
        expected_effect: "16 of 18 held back -> 0, with the divergent-fixture clause still refusing"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"
      - goal: GOAL-sync-quiet
        contribution: enabling
        expected_effect: "none on its own -- removes 16 five-line paragraphs, which is most of the non-diff noise HIS-2 then bounds"
        local_signal: "N/A: enabling"

  - id: HIS-2
    title: "DriftReport.render() prints every changed path, and re-prints it on every pass"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    github_issue: 212
    wave: 1
    depends_on: []
    blocks: [HIS-3, HIS-5, HIS-6]
    promotion_order: 2
    promotion_predecessor: HIS-1
    conflict_keys:
      production: [DriftReport.render, ProjectSyncUseCase.sync, ExecCommand.launchGate, HomeCommand.drift]
      tla: []
      adapters: []
      test_graph: [home-integrity/DriftReportIsBounded]
      workflow_data: []
    objective: >
      MEASURED: the root home's pending drift record is 87,054 bytes over 7
      units. DriftReport.render() emits one line per changed file -- 889 lines,
      ~87,208 characters, ~21,800 tokens -- and re-emits them on every
      `project sync`, every `exec` launch gate, and every `home drift`. One
      unit, spec-double-compiler, is 776 of the 889.

      The per-unit SHA-256 the report wants already exists as
      HomeDigest.UnitDigest.digest(); DriftReport keeps the file lists and
      throws the digest away.
    slice: >
      Collapse the default surface to at most one line per changed unit -- unit,
      kind, change, short digest, changed-file COUNT -- plus one total line.
      Keep the full per-file list reachable and unchanged behind --json and the
      detail surface. This is a default, not a deletion: an operator who wants
      the paths must still be able to get exactly the paths they get today.
    note: >
      spec-double-compiler's 776 "removed files" are the dereferenced in-unit
      symlink trees being read as deletions -- HIS-4's subject. Do not fix that
      here. Bound the report; let HIS-4 remove the cause. If bounding it makes
      the 776 invisible before HIS-4 lands, say so in the PR, because a number
      that disappears from view is not a number that got smaller.
    acceptance:
      assertions:
        - The committed baseline fixture renders in at most 10 lines.
        - Character count over that fixture falls by at least 99%.
        - --json output over the same fixture is byte-identical to today's.
    goals:
      - goal: GOAL-sync-quiet
        contribution: direct
        expected_effect: "889 lines / 87,208 chars -> <=10 lines, >=99% char reduction, over the committed fixture"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"

  - id: HIS-3
    title: "the drift gate re-fires instead of settling -- the safety is right, the re-emission is not"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    github_issue: 213
    wave: 2
    depends_on: [HIS-2]
    blocks: [HIS-5, HIS-6]
    promotion_order: 3
    promotion_predecessor: HIS-2
    conflict_keys:
      production: [DriftGate.record, DriftGate.recordSince, ExecCommand.launchGate, ProjectSyncUseCase.sync]
      tla: [HomeIntegrityInternal.AcknowledgeCurrentDigest]
      adapters: []
      test_graph: [home-integrity/AckIsStable]
      workflow_data: []
    objective: >
      A sync records drift; the next sync or launch finds the pending gate and
      re-warns or refuses with exit 8; nothing retires the record except an
      explicit `home drift --ack`. DriftGate.record() returns the EXISTING
      pending gate even when the incoming report is empty
      (DriftGate.java:86), so a pass that changed nothing still hands its
      caller an unacknowledged gate.
    why_the_intent_is_load_bearing: >
      This is deliberate and the rationale is written down at
      DriftGate.java:39-49: a gate that cleared when the digest was refreshed
      would let the SECOND recompute report "nothing to acknowledge" while the
      change from the FIRST sync was still unread. That was reproduced as a
      false pass -- prune_did_not_destroy_the_agent_edit failed while
      child_home_holds_only_claimed_or_held_back_units passed vacuously.

      So the ticket is NOT "clear the gate on refresh". Do not weaken the
      safety to make the noise stop.
    slice: >
      Separate FIRST surfacing from SUBSEQUENT surfacing of the same
      unacknowledged gate. First is the full (now bounded, per HIS-2) report.
      Second and later, with no new change between them, is one line: the count
      still unread and the ack command. A genuinely new change re-opens the
      full report and still gates the next launch.
    design_decision_to_make_before_coding: >
      THERE IS NO FIELD TODAY THAT DISTINGUISHES THE TWO. home.drift.json
      carries detectedAt, operation, acknowledged, acknowledgedAt and the
      report; nothing records that a pass has SHOWN this gate. So "second
      surfacing" is not observable yet, and the ticket must choose how it
      becomes observable. Two routes, and they are not equivalent:

      (a) A PERSISTED MARKER on the gate -- surfacedAt / surfacedCount. Works
      across processes, which is the case that actually bites: `exec` refuses,
      the operator runs `home drift`, then `exec` again, and those are three
      processes. It is a schema change to home.drift.json, so it needs a schema
      version and a decision about what an old record without the field means
      (proposal: absent == not yet surfaced, which degrades to today's
      behaviour rather than to silence). It also touches ack/re-pend, which
      AckIsNotStaleOnArrival constrains -- a marker that survives an ack would
      let a re-pended gate open collapsed.

      (b) A CALL-SITE DISTINCTION -- the caller decides, from whether the
      incoming report added anything, whether this is a re-read. Writes no new
      state and cannot get stale, but it is per-process: it collapses nothing
      across the exec -> drift -> exec sequence above, which is the sequence
      the complaint is about.

      Write the choice and its reason into the ticket before any code. Recording
      it here because a decision made silently inside an implementation is the
      one nobody can review, and this one changes a persisted schema.
    merge_interaction: >
      DriftGate.record() MERGES a new report into the pending one and rewrites
      the gate (DriftGate.java:87-95), so "a genuinely new change" and "the same
      gate again" are the same record, differing only in content. Whichever
      route above is taken must define change against the UNION, not against
      the record's existence. The two failure modes to test for, both plausible:
      a gate that stays collapsed across a real new change (the safety this
      ticket must not break), and one that never collapses at all (the drag it
      exists to remove).
    acceptance:
      assertions:
        - Second and later surfacing of one unacknowledged gate is a single line.
        - A new unseen change still gates a launch and still exits 8.
        - The regression DriftGate.java:39-49 cites is still caught.
    goals:
      - goal: GOAL-gate-settles
        contribution: direct
        expected_effect: "full report every pass -> full once, one line thereafter; exit-8-on-new-change unchanged"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"
      - goal: GOAL-sync-quiet
        contribution: guard
        expected_effect: "must not reintroduce per-file output on any surface"
        local_signal: "python skills/test_graph/scripts/run.py home-integrity"

  - id: HIS-4
    title: "a scaffolded gitignored tree strands the installed baseline, and the unit is never syncable again"
    phase: HIS
    status: delivered
    epic: home-integrity-sync
    status_note_delivered: >
      DELIVERED, and the hard acceptance item was met -- the graph went RED
      before it went green. The old node passed because THE ROOT TIER NEVER
      DEREFERENCES ANYTHING; only ChildHomeMaterializer does, and only when a
      home is materialized from another home, so no root-tier fixture could
      reach it.

      TWO DEFECTS THE DIFF ITSELF CREATED were found by review and fixed before
      merge: `sync --from` began DESTROYING the materialization it had
      previously refused to touch (exit 0, symlink restored, child bytes gone) --
      MaterializationEscrow is now a shared class used by BOTH sync paths,
      holding bytes under <home>/cache/ rather than inside the units namespace;
      and every rolled-back conflict reported "0 file(s)" and "already clear"
      with a record that erased itself on the next command.

      CLAUSE 2 WAS ALREADY TRUE AND THAT IS THE DELIVERABLE. ReconcileUseCase ->
      ValidateAndClearError re-derives the installed-record error on every
      command; adding a `resolvedAt` field would have been a second answer to a
      question the code already answers.

      HONEST NEGATIVE, corrected in review: slice (1), the digest side, was NOT
      DELIVERED and its acceptance assertion is unmet. The plan is not wrong;
      the work is missing, and GOAL-sync-quiet is not advanced by this ticket.
    delivered_in: "PR #231, merged into epic/home-integrity-sync as 15fd561"
    github_issue: 216
    wave: 4
    depends_on: [HIS-1, HIS-7, HIS-10]
    blocks: [HIS-5, HIS-6]
    promotion_order: 6
    promotion_predecessor: HIS-10
    rescheduled_in_revision_4: >
      Moved from wave 3 to wave 4 and given a dependency on HIS-10. HIS-4's
      first acceptance item needs a ticket WORKTREE HOME, and a clone's first
      sync currently prunes the five inherited parent-store shims and
      re-provisions five toolchains locally -- measured 2026-08-21, evidence in
      results/epic-home-integrity-sync/probes/his-10/. HIS-10 is what makes a
      clone usable without that.
    conflict_keys:
      production: [Rederivable, ChildHomeMaterializer.materializedView, SyncUseCase.merge, InstalledRecord.errors]
      tla: [HomeIntegrityInternal.RecordDescribesItsStoreOrSaysWhy]
      adapters: []
      test_graph: [sync-settles/ScaffoldTreeDoesNotStrandTheBaseline]
      workflow_data: []
    objective: >
      THE SINGLE BIGGEST CHANGE-MANAGEMENT DRAG THE HOME MECHANISM HAS
      PRODUCED, and the reason this ticket is scoped wider than the issue that
      opened it. Two units in the operator's project home -- deploy-helm and
      spec-double-compiler -- sat permanently unsyncable for nine days. Every
      agent in every worktree cloned from that home inherited both, which is
      why it reads as a productivity problem rather than a bug.
    the_chain: >
      FOUR LINKS, and any one of them left in place reproduces the drag. This
      is why the ticket is not "exclude the tree from the digest".

      (1) THE TRIGGER. The test-graph scaffolder writes
      test_graph/{build-logic,sdk,standard-nodes} into a consuming unit as
      SYMLINKS into the test-graph store copy, and ALSO writes the .gitignore
      that declares all three not-content -- ensure_provider_binding_ignores,
      skills/test_graph/scripts/_common.py:318-346.

      READ THAT CAREFULLY, because an earlier draft of this ticket got it
      wrong: the ignore lines are GENERATED at bind time, not checked in. The
      repo's own skills/test_graph/test_graph/.gitignore is 26 lines and names
      none of the three. The installed copy in the operator's project home is
      33 lines and carries them at 30-32. Any fixture that hand-writes a
      plausible .gitignore is testing the fixture; capture what the scaffolder
      actually emits. CHM-5
      dereferences them into real directories so the child home is independent
      -- correct -- but Rederivable does not carry these names and the digest
      walk does not read .gitignore, so they count as unit content. MEASURED:
      root store test_graph/ holds 10 entries, the project home holds 13 and
      12. Rederivable's own membership test is "can a tool write it again from
      content that is still here", and these pass it.

      (2) THE MECHANISM. Sync reads that as a dirty tree, stashes, merges
      upstream -- THE MERGE COMMIT LANDS -- then pops. The pop conflicts: the
      stash carries a change to a path upstream holds at mode 120000 and the
      working tree cannot hold both a directory and a symlink there. Sync
      aborts. MEASURED: index stages 1 and 3 at 120000 for all three paths,
      stage 2 absent, no MERGE_HEAD, HEAD tracking none of them.

      (3) THE PERMANENCE, AND THE LOAD-BEARING LINK. The merge is committed;
      installed/<unit>.json is not updated. MEASURED: record gitHash c72d03a6
      written 2026-07-25, store HEAD at eab28837. HEAD is ahead of the baseline
      FOREVER, so every later sync reports "extra local changes (working tree
      edits, or commits ahead of the installed baseline)" and refuses. Fixing
      (1) and (2) does NOT release a home already in this state -- which is the
      state the operator was actually in, and the reason a fix that only
      excludes the tree would look right and change nothing.

      (4) THE INVISIBILITY. errors[{kind: MERGE_CONFLICT}] carries no
      resolvedAt and is never re-derived, so `skt check` kept reporting the
      conflict after the git state was clean.
    slice: >
      (1) Decide whether a unit's own .gitignore, or an extension to
      Rederivable, or both, keeps scaffolded re-derivable trees out of the
      digest. Prefer the unit's declaration over a global name list: `sdk` and
      `standard-nodes` are generic enough to be real content in some other
      unit, and #180 already establishes that gitignored paths should be
      honoured on a neighbouring surface. Whatever is chosen, the skip must be
      on BOTH sides -- not hashed, not copied, and NOT DELETED
      (carryOverUnownedTrees). Excluding a path must make it invisible, not
      disposable.

      (2) Make the merge and the record atomic, or compensated. A sync that
      leaves a merge committed and the baseline unwritten is the generator of
      the permanent state; either roll the merge back on a failed pop, or write
      the advanced baseline together with the recorded conflict.

      (3) Re-derive an installed-record error from the live tree when it is
      read.

      (4) Provide the release path for a home ALREADY stranded. Fixes (1)-(3)
      are prospective; the operator's two units were only recovered by hand.
    manual_recovery_performed: >
      2026-08-20, recorded so the ticket is not measured against a state that
      no longer exists. The deadlock was cleared by `git reset` (restoring the
      index from HEAD; working trees untouched). That was NOT sufficient: both
      units still refused with "extra local changes" because of link (3). They
      were released by removing the gitignored scaffold trees from the project
      home copies -- which made the working tree clean -- and then
      `sync --merge`, which merged with no stash, no pop and no conflict. Both
      tiers then reported `skt check: all current` for the first time. Backups
      of the removed trees, the original indexes and the original installed
      records are in the session scratchpad. THE PRODUCT WAS NOT CHANGED, so
      the mechanism is intact and will re-produce this state.
    acceptance:
      assertions:
        - FIRST, reproduce it. sync-settles/ScaffoldTreeDoesNotStrandTheBaseline currently PASSES on a root-tier install/sync fixture and does not reach the project-tier materialized case. Make it red against the real defect before fixing anything.
        - A unit carrying a scaffolded gitignored tree stays syncable, at every tier.
        - A sync that fails partway never leaves the baseline behind a merge it already committed.
        - An excluded path is not hashed, not copied, and not deleted.
        - An installed-record error whose condition has cleared stops being reported, with no hand edit.
        - A home already stranded has a documented, runnable release path that is not `git reset` plus manual deletion.
    goals:
      - goal: GOAL-symlink-merge-settles
        contribution: direct
        expected_effect: "2 of 21 units permanently stuck -> 0; a stranded baseline becomes impossible rather than manually recoverable"
        local_signal: "python skills/test_graph/scripts/run.py sync-settles"
      - goal: GOAL-sync-quiet
        contribution: enabling
        expected_effect: "none on its own -- removes the cause of 776 of the baseline's 889 lines"
        local_signal: "N/A: enabling"

