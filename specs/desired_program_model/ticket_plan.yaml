  - id: GOAL-mechanism-documented
    kind: quality
    statement: >
      An agent can learn the derived-artifact contract from the documentation
      instead of from the source, because the last two agents to need it read
      the source and got it wrong.
    metric: >
      (a) markdown files across installed units documenting the contract;
      (b) whether a fresh agent, given only the docs, answers three questions
      correctly: what a derived artifact is, what a clone inherits versus
      declares, and when to rebuild
    harness: >
      (a) uv run .github/scripts/check-docs-coverage.py, which re-runs the
      baseline measurement; (b) a judged read -- one agent, no repository
      access beyond the units' markdown, answering the three questions above,
      its answers recorded under the evidence root beside the count. Read
      together, not combined: a link count cannot show that the prose is
      right, and a judged read of one agent is not a statistic.
    baseline:
      value: >
        `skill-manager build` in 0 md files; cold shim / ColdArtifact in 0;
        declared-only in 1; `home clone` in 4. skt's SKILL.md -- the
        session-start front door -- mentions artifacts once, in a code comment,
        and ships no references/ pages, while skt/src/skt/check.py:877 prints
        artifact state to the agent at every session start.
      measured_at: "5aacfdf"
      evidence: results/epic-home-integrity-sync/baseline/docs-coverage.txt
    target: >
      CLAUSE 1: the contract is stated ONCE, and the units that instruct agents
      about homes -- skt, skill-manager, git-issue-workflow, git-epic-workflow
      -- link to it rather than restate it. Restating it in four places is the
      failure this epic already warns about for rubrics; a copy is covered by
      nothing and will drift.
      CLAUSE 2: the judged read answers all three questions correctly from the
      docs alone.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-mechanism-documented

  - id: GOAL-home-invariants
    kind: quality
    statement: >
      Each behavioural fix above is stated as an invariant that a deliberately
      broken model violates, so the defect cannot come back unnoticed.
    metric: >
      invariants over the home-integrity view, each carrying a regression cfg
      that must keep failing
    harness: "specs/program_model/run_tlc.sh and uv run pytest specs/"
    baseline:
      value: "4 invariants, 5 regression cfgs (ARTI-22, HomeIntegrityInternal)"
      measured_at: "76434c7"
      evidence: specs/desired_program_model/spec_manifest.yaml
    target: >
      CLAUSE 1: every new invariant carries an expected-violation cfg that
      fails, per this file's regression_config_rule, and states whether it is
      witness-dependent (and carries a guard cfg if it is).
      CLAUSE 2: all 5 pre-existing regression cfgs still fail. A regression cfg
      that starts passing is a defect in the invariant, not a success.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-home-invariants

  # ---------------------------------------------------------------- rev 4 ---
  # Added in schedule revision 4, when the owner said "all home bugs across
  # root, project, and worktree should be resolved by this epic" and a sweep of
  # the open issues found five uncovered ones (#206, #159, #161, #186, #187).
  # Those five do not map onto the six goals above. Adding them WITHOUT adding
  # goals would leave HIS-6 reporting six verdicts against an epic that had
  # grown by half -- so the goals are stated here rather than left implicit.

  - id: GOAL-one-home-one-answer
    kind: integration
    statement: >
      "Which home is this path in, and does this home own it" has ONE answer.
      Every reader -- clone, verify, verify --against, sync's shim pruner,
      presence, and every remedy that names a CLI -- gives that same answer, for
      root, project and worktree tiers, and for every spelling of the same path.
    metric: >
      distinct verdicts returned by the readers over one fixed scenario matrix
      (tier x reader x path spelling); the target is one verdict per scenario
    harness: >
      python skills/test_graph/scripts/run.py home-integrity -- the reader-
      agreement node HIS-10 adds, which drives all four readers over ONE cloned
      home and fails if any two disagree; plus jbang RunTests.java for the
      path-spelling cases (#206) over a symlinked home root.
    baseline:
      value: >
        FOUR READERS, THREE ANSWERS, on one cloned home. Measured 2026-08-21 on
        epic tip 23e35c7, cloning this repository's project home:
          home clone            -> clean; "no path in it reaches another Skill
                                   Manager home"
          home verify           -> exit 1; 5x FOREIGN_HOME on bin/cli/{computeq,
                                   helm-deploy,monitoring,tla-spec-dev,tlc2}
          home verify --against -> exit 0; "5 sanctioned parent-store shim(s)"
          sync                  -> PRUNES all five ("not this home's parent
                                   store") and re-provisions five toolchains
                                   locally, ~90s
        The sanction therefore depends on an operator-supplied --against flag
        and on nothing durable in the clone. Separately, where a home is reached
        through a symlink whose spelling is not substring-compatible with its
        real path, the provisioned-file branch of HomeCloner.verifyRoots compares
        against the UNRESOLVED spelling and reports clean without having checked
        -- measured on one home addressed two ways, blind through the symlink and
        correct through the real path.
      measured_at: "23e35c7"
      evidence: results/epic-home-integrity-sync/probes/his-10/
    target: >
      CLAUSE 1: one verdict per scenario -- no two readers disagree about the
      same path in the same home, with no operator-supplied flag needed to make
      them agree.
      CLAUSE 2: the verdict is spelling-invariant. The same home reached through
      a symlinked path verifies identically, and the assertion proving it FAILS
      when the resolution is removed.
      CLAUSE 3: the lazy contract holds -- a clone keeps its inherited shims on
      PATH and declares them; nothing prunes and re-provisions a toolchain
      nobody changed.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-one-home-one-answer

  - id: GOAL-no-destructive-recovery
    kind: integration
    statement: >
      A home operation never destroys bytes it did not itself create -- not on
      success, and especially not while walking back from a failure. A home that
      has ALREADY been damaged can be told apart from a healthy one and repaired.
    metric: >
      (a) pre-existing unit bytes surviving a failed resolve/install into a
      non-empty home; (b) whether a damaged home is detectable by a command
      rather than by an operator noticing
    harness: >
      jbang RunTests.java -- the walk-back cases HIS-11 adds over
      Executor.preStateCompensations; plus
      python skills/test_graph/scripts/run.py home-integrity for the
      detect-and-repair node HIS-13 adds.
    baseline:
      value: >
        (a) ZERO survive by construction: Executor.java:307 pairs
        CommitUnitsToStore with `List.of()` -- an empty pre-state compensation --
        so the walk-back deletes the destination it overwrote and restores
        nothing. The previously installed version is gone. (#186)
        (b) NO detection and NO repair exist. HomeCommand ships clone, verify,
        describe, policy, shims, drift, sync, close-out, refresh-plugins and
        nothing that repairs. A root home mis-anchored by 0.20.0 (#159), or
        written through by a producer following an inherited symlink (measured
        twice on the operator's own root home during HIS-7), stays damaged until
        somebody notices by hand.
      measured_at: "23e35c7"
      evidence: results/epic-home-integrity-sync/probes/his-10/root-before.txt
    target: >
      CLAUSE 1: a failed resolve/install into a non-empty home leaves every
      previously installed unit byte-identical to what it was before, proved by
      a fixture that fails when the move-aside is removed.
      CLAUSE 2: one command names what is damaged in a home and what would
      repair it, and the repair is idempotent.
      CLAUSE 3: the guard does not become a new hold-back -- a home that is
      merely STALE is not reported as damaged. Measured against
      GOAL-no-spurious-holdback's fixture, which must not regress.
    evaluation_ticket: HIS-6
    evidence_root: results/epic-home-integrity-sync/goals/GOAL-no-destructive-recovery

tickets:
  - id: CHM-1
    title: "Child home units materialize by copy, not by symlink"
    phase: CHM
    status: next
    depends_on: []
    production_status: implemented_spec_pending
    objective: >
      A project child home holds an independent tree per unit. No entry in it
      is a symlink at a parent-store unit directory, so an ordinary edit below
      a child unit cannot reach the parent store.
    desired_actions:
      - EditChildHomeUnit
      - ResolveProjectChildHome
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
      - src/main/java/dev/skillmanager/bindings/MaterializationMode.java
      - src/main/java/dev/skillmanager/project/ProjectChildHomeScaffolder.java
    current_increment:
      model_state:
        - store_body
        - child_home
        - agent_edits
      model_actions:
        - EditChildHomeUnit
        - ResolveProjectChildHome
      adapters:
        - ChildHomeMaterializerPort.swap_in
        - AgentWorkspacePort.edit_child_home_unit
      unit_tests:
        - editing a child unit does not change the parent store unit
        - a resolved child unit directory is not a symlink
      graph_after_unit_pass:
        - project-resolve
    acceptance:
      commands:
        - bash specs/current/run_tlc.sh specs/current/External.tla specs/current/External.cfg
        - bash specs/desired_program_model/run_tlc.sh specs/desired_program_model/External.tla specs/desired_program_model/External_regression_symlink.cfg
      assertions:
        - ChildHomeWritesNeverReachTheParentStore holds under External.cfg.
        - External_regression_symlink.cfg still produces a counterexample.
      evidence:
        desired_model_half: verified 2026-07-27
        measured: >
          External.cfg PASS 1302 generated / 250 distinct / depth 9; AgentEdited... and ChildHomeWritesNeverReachTheParentStore hold. External_regression_symlink.cfg VIOLATED[ChildHomeWritesNeverReachTheParentStore] at depth 3.
        current_model_half: >
          NOT RUN. The command names specs/current/External.tla (or
          Internal.tla); specs/current holds only SkillManager.tla. See
          status.current_model_blocker.
      status_note: >
