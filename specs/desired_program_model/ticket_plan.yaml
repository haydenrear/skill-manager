  - id: CHM-12
    title: "A merge records the source's whole tree as the shared baseline, and the next reconcile overwrites the work"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: manual exploratory testing of the ordinary three-tier round trip
    objective: >
      The documented three-tier flow, with TWO ticket worktrees instead of one,
      destroys the second worktree's edit while reporting clean=true at every
      step. No operator error is involved. Root cause: writeCopyRecord wrote the
      SOURCE's entire tree as the destination's new entryDigests, including
      paths the reconciliation had DECLINED to write. After `project -> root
      --merge`, the root home's record claimed root and project last shared a
      byte root had never held; the next `root -> project --merge` read d = b as
      "the destination is standing on the base" and overwrote it, describing
      itself as "1 file(s) taken from the source; local work kept" while
      deleting the local work. Afterwards the edit existed in NO home.

      This is CHM-10's failure mode reintroduced through the record-WRITE side
      rather than the base-selection side, and it violates the class's own
      stated rule: a reconciliation may destroy bytes in the destination only
      where it can show the SOURCE passed through them.
    resolution: >
      The baseline rule gains a fourth decision, "what a reconciliation writes
      down", stated in ChildHomeMaterializer's class javadoc beside the three
      that were already there. ChildHomeMaterializer.sharedAfterMerge computes
      the record a merge may write: a path is claimed only where this pass can
      SHOW both homes stood on the byte -- it was just written here from the
      source, the two sides already agreed on it, or the source is still
      standing on a base that was itself shared with this destination. Anything
      else is omitted, and a missing path reads as "no baseline here", which
      routes the next merge on that path to a conflict rather than to a silent
      overwrite. writeMergeRecord is separate from writeCopyRecord so that
      passing the source's whole fingerprint is no longer something a caller can
      do by accident.
    also_fixed: >
      The related report. A merge whose every differing path had s = b announced
      "the destination is ahead of the source; the source has nothing to
      contribute" even when the destination was BEHIND and the base was only the
      source's own record of what it was handed. The status stays UNCHANGED --
      measured: reporting it as unresolved blocks close-out for the ordinary,
      correct case of a worktree that is merely behind on a file another
      worktree contributed -- but the sentence no longer asserts a direction the
      evidence cannot support, and it names what to run when the direction turns
      out to be the other one.
    model_change: >
      The record-WRITE decision is now separate from base selection in
      External.tla, and it had to be: with only MergeBasePolicy to vary, a
      reconciler that reads soundly and then records something it has no right
      to was inexpressible, and this defect was invisible to every config in the
      directory. External gains RecordWritePolicy (SHARED_ONLY / SOURCE_TREE /
      MERGED_TREE), the NoBaseline value a partial entryDigests map needs, the
      source-record FALLBACK the code has always had and the model did not, and
      the invariant ARecordClaimsNoBaselineTheDestinationNeverStoodOn.

      Two operators were split along the way, because separating the policies
      exposed that the model had been conflating them: DestMovedAt ("has the
      destination moved off its OWN record", which is what makes a tree pristine
      for the wholesale-copy path) and DestOnBaseAt ("is the destination
      standing on the base this merge measured"). The write log now asks the
      wholesale-copy path and the merge path the question each of them actually
      answered, which is also why all three pre-existing merge-base regression
      configs keep producing their original counterexamples.
    acceptance:
      assertions:
        - After a merge, entryDigests names no path the two homes are not both standing on.
        - The ordinary three-tier round trip with two worktrees loses neither worktree's edit.
        - External_regression_recordsourcetree.cfg keeps producing a counterexample.
    evidence:
      unit:
        - 'HomeSyncMergeTest "a merge claims no shared baseline for a path it declined to write (CHM-12)" -- the invariant, stated over the record on disk'
        - 'HomeSyncMergeTest "the ordinary three-tier round trip destroys no worktree edit (CHM-12)" -- the consequence, four homes and a teardown'
      graph: 'home-sync node home.sync.round.trip: the six-command sequence through the real CLI over real homes, with a real rm -rf between, asserted on bytes read back off disk'
      tlc: 'External_regression_recordsourcetree.cfg violates ARecordClaimsNoBaselineTheDestinationNeverStoodOn at depth 7 (2,815 distinct states, 1s). External_sync.cfg and External_sync_merge.cfg carry the same invariant and pass to exhaustion. All 22 pre-existing expected-violation configs still violate the same invariant; all 11 pre-existing terminating must-pass configs still pass.'
      mutation: 'restored `writeCopyRecord(name, kind, source, stagedPrint.digest(), src, MERGED)` in place of the sharedAfterMerge call (1 occurrence, counted first); the named unit test failed on the record claim AND the round-trip test failed on the bytes; reverted and verified with shasum -a 256 -c'

  - id: CHM-15
    title: "`project resolve` refreshes from the store over a tree a worktree just merged in"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: asking which OTHER writers destroy bytes in a home, after CHM-9/10/12 closed home sync
    objective: >
      `home sync --merge` from a ticket worktree leaves the project home
      holding a tree that is PRISTINE BY ITS OWN RECORD -- the merge rewrote
      that record -- while being a wholesale copy of no store on earth.
      ChildHomeMaterializer.reconcile asks all three clauses of the baseline
      rule before it destroys anything: the destination still holds what its
      record says, the record is evidence about THIS source, and the tree is
      not a merge result. copyUnit -- the downward materialization that
      `project resolve` and `project sync` run -- asked only the first, and so
      did isLocallyModified, the predicate a prune, a teardown and a close-out
      consult before deleting.

      Consequence, reproduced end to end against the real CLI: resolve, clone
      the project home into a worktree, edit, `home sync --merge` back,
      `home close-out` clears, `rm -rf` the worktree, `project resolve` again.
      The ticket's bytes then existed in NO home, and the command that deleted
      them reported MATERIALIZED with the detail "copied from the parent
      store". No operator error is involved: it is the epic's documented flow
      with the ordinary dependency-refresh command run after it.
    resolution: >
      One reading of the rule, not three. ChildHomeMaterializer.Disposal is the
      whole conjunction as a value -- baseline, destUntouched,
      recordIsAboutThisSource, mergeResult -- computed once by disposal() and
      consumed by copyUnit, reconcile and isLocallyModified. The three inlined
      copies that disagreed are gone. linkUnit was brought under the same
      value: linkPath deletes a real directory to put a symlink where it stood,
      so a COPY child home somebody edited could be destroyed by a later pass
      that merely asked for LINK.

      The choke point is inside ChildHomeMaterializer rather than in Fs or in a
      new collaborator, and the reason is what evidence is available where: Fs
      knows nothing about homes or records, so a guard there would either have
      to be handed a baseline by every caller -- which is the same N call sites
      -- or invent provenance it cannot have.
    model_change: >
      External gains ChildRefreshProvenance (SOURCE_AWARE /
      CONTENT_DIGEST_ONLY), the StoreOrigin token for a writer that is not a
      tier, and the action RefreshProjectChildHomeFromStore in the tier slice.
      That is what made the defect expressible at all: the unit slice's
      LocallyModified is content-based and so already forbade this, while the
      code's is record-based and did not. The defect lives in the difference,
      and the difference is only visible where records are.
    acceptance:
      assertions:
        - A tree a worktree merged into a project home survives the next materialization from the store.
        - The pass that declines to overwrite it names it, and names something to run.
        - A LINK-mode pass does not delete an edited child unit to install a symlink.
        - External_regression_childrefresh.cfg keeps producing a counterexample.
    evidence:
      unit:
        - 'ProjectChildHomeMaterializationTest "a merge from a worktree survives the next parent-store materialization" -- bytes, plus the isLocallyModified predicate'
        - 'ProjectChildHomeMaterializationTest "LINK mode does not delete an edited child unit to install a symlink"'
      graph: 'home-sync node home.sync.project.seam: resolve / clone / edit / merge / close-out / rm -rf / resolve / project sync, through the real CLI over real homes, asserted on bytes read back off disk'
      tlc: 'External_regression_childrefresh.cfg violates AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough (51 distinct states). All 23 pre-existing expected-violation configs still violate the same invariant; all 11 pre-existing terminating must-pass configs still pass.'
      mutation: >
        Three, each reverted and verified with shasum -a 256 -c.
        (1) `if (!disposal.disposable())` -> `if (false)` in copyUnit (1 occurrence, counted first)
        failed "a merge from a worktree survives the next parent-store materialization" on the bytes.
        (2) isLocallyModified restored to the two-line copyBaseline comparison
        failed the same test on "a tree merged up from a worktree is not the parent store's to delete".
        (3) the linkUnit guard condition -> `if (false)`
        failed "LINK mode does not delete an edited child unit to install a symlink" on the symlink assertion.

  - id: CHM-16
    title: "Three writers delete hand-authored skills out of an agent tree, and one of them writes the licence for another"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: enumerating every writer into a home that does not go through ChildHomeMaterializer
    objective: >
      `<home>/.claude|.codex|.gemini/skills/<name>` is not a skill-manager-only
      namespace. It is where a human writes skills by hand. Three writers
      destroyed content there with no warning, no backup, and no mention in any
      report, and no two of them were in the same file:

      - the three projectors' apply(), each carrying its own copy of "delete
        whatever is at the target, then link";
      - their remove(), the same six lines inverted;
      - BindingBackfill, which adopted ANY existing path at a projection target
        into the projection ledger as though skill-manager had put it there --
        after which the ledger-driven LiveInterpreter.reverseProjection deleted
        it on the next uninstall, believing it was removing its own symlink.

      The third is the one that makes this a choke-point problem rather than a
      guard problem: guarding the projectors closed the install door and left
      the uninstall door open, and the ledger row that authorized the deletion
      was written by a third file again. Measured that way -- the graph node
      failed on `uninstall` after the projector fix passed on `install`.
    resolution: >
      ProjectionOwnership, one predicate shared by all three doors: a
      projection may destroy only a symlink (its bytes live where it points) or
      a directory the source still holds byte for byte (the copy fallback's own
      output). Anything else is left alone and named.

      Deliberately NOT a materialization record. A projection is a pure
      function of the store, so entitlement is decidable from the two paths
      alone; a provenance file for it would be machinery nobody needs. Two
      mechanisms -- ChildHomeMaterializer.Disposal for unit trees,
      ProjectionOwnership for agent trees -- because the evidence available
      differs; one rule, because the requirement does not.

      Projector.apply and .remove became default methods returning whether the
      write landed, so ProjectorRegistry records only projections that are
      really there, and a unit whose every projection was held back fails its
      agent-sync step instead of reporting success.
    acceptance:
      assertions:
        - Installing a unit whose name collides with a hand-written skill does not destroy it.
        - Uninstalling does not delete a hand-written skill through the ledger.
        - The backfill does not adopt a path it cannot show is a projection.
        - An ordinary unit still projects, and an ordinary uninstall still removes its own projection.
    evidence:
      unit:
        - 'ClaudeProjectorTest "skill -- apply does not destroy a hand-authored directory at the target"'
        - 'ClaudeProjectorTest "skill -- remove does not delete a hand-authored directory at the target"'
        - 'ClaudeProjectorTest "skill -- apply still replaces the projector''s own copy-fallback output" (the happy path a guard must not refuse)'
      graph: 'home-sync node home.sync.authored.agent.tree: install over a hand-written skill, then uninstall, through the real CLI, asserted on the authored bytes'
      tlc: 'Not modelled. The agent-tree slice has no record to reason about and the entitlement is a two-path comparison; AuthoredContentIsNeverRewritten already carries the home-level form of the requirement. Recorded as a deliberate omission rather than an oversight.'
      mutation: >
        Replaced ProjectionOwnership.clear''s hold-back branch with
        `Fs.deleteRecursive(target); return true;` (1 occurrence, counted first).
        Both named ClaudeProjectorTest cases failed on the authored bytes;
        reverted and verified with shasum -a 256 -c.

  - id: CHM-13
    title: "`home close-out` clears a teardown for a path that is not a home at all"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: manual exploratory testing
    objective: >
      `home close-out --home <the worktree DIRECTORY>` -- rather than
      <worktree>/.skill-manager -- exited 0 with "safe": true, "blockers": [],
      and printed the check mark line naming the directory that held the only
      copy of the agent's edit. So did a --home that did not exist at all. The
      gate FAILED OPEN, and the mistake is maximally likely: <worktree> is
      exactly the argument `git worktree remove` takes.

      Mechanism: nothing validated home-ness. HomeSync.unitsToVisit returns the
      union of both sides, a non-home yields zero units, every unit becomes
      REMOVED_UPSTREAM, and HomeCloseOut.remedyFor maps REMOVED_UPSTREAM to no
      blocker. Same hole on the sync side: `home sync --from <a nonexistent
      path>` printed "reconciled" with all-zero counts, exit 0, and created the
      destination's layout on the way; --from <a regular file> behaved
      identically.
    resolution: >
      NotAHomeException.require refuses before anything is read or written, for
      `home sync --from`, `home close-out --home` and `home close-out --into`.
      Home-ness is decided by LaunchEnv.looksLikeStoreRoot, made public rather
      than re-spelled: it already encoded the test for the PATH sanitizer, and
      three spellings of "is this a home" would eventually disagree about
      exactly the homes where it matters. Exit code 2, distinct from 0
      (reconciled / safe), 1 (this home still holds work) and 9 (refused by
      policy); --json callers get {"error":"not_a_home", "safe":false,
      "clean":false} rather than a stack trace, so a script cannot read the
      refusal as approval.

      A sync DESTINATION is deliberately not validated: creating a tier by
      reconciling into it is the operation this epic exists for.
    not_fixed_here: >
      `home describe`, `home drift` and `home policy` also answer for arbitrary
      paths, and each calls store.init(), which lays out a home wherever it is
      pointed. Left alone on purpose and reported instead: `home policy frozen
      --home <a home being created>` is a real gesture, and none of the three
      claims anything about content or authorises a teardown. A command that
      says "there is nothing here to lose" is a different class of defect from
      one that leaves an empty directory tree at a mistyped path.
    evidence:
      unit: 'HomeSyncTest "close-out refuses a path that is not a home rather than clearing it" -- the worktree directory, a nonexistent path, a regular file, and the --into end, each asserted on the exception TYPE and on the real home being untouched'
      graph: 'home-sync node home.sync.homeness: the same four through the real CLI, asserted on exit code AND on nothing having been created'
      mutation: 'deleted the NotAHomeException.require call in HomeSync.run (1 occurrence, counted first) and both in HomeCloseOut.inspect (2 occurrences, both mutated); the named unit test failed with "it did NOT refuse, which is the defect"; reverted and verified with shasum -a 256 -c'

  - id: CHM-14
    title: "A symlinked unit or kind directory is invisible to the enumerator and reported clean"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: manual exploratory testing
    objective: >
      ChildHomeMaterializer.unitDirectories skipped any unit directory that was
      a symlink, and skipped an entire KIND directory that was one, with no
      report of either. MaterializationMode.LINK produces exactly that shape.
      Measured: a home whose skills/ was a symlink reconciled as
      {"clean":true,"units":[]} with the destination's skills/ left empty; a
      single symlinked unit beside a normal one synced only the normal one,
      reported clean=true, and never named the other.

      Worse, the enumerator and the reconciler disagreed. reconcile() applies
      NOFOLLOW_LINKS only to the final path component, so it reads THROUGH a
      symlinked skills/, and the same unit was invisible to `home sync` while
      `home close-out` reported it conflicted -- purely because the destination
      contributed the name to the union.
    resolution: >
      Symlinks are enumerated, not skipped, and answered by a new outcome:
      SyncStatus.LINKED, which is unresolved(), so clean is false, `home sync`
      exits non-zero and `home close-out` blocks with a remedy. reconcile()
      checks both levels -- the kind directory and the unit directory -- through
      one helper (symlinkOnUnitPath) before it reads any bytes, so the
      enumerator and the reconciler cannot disagree by construction. The report
      names which side is linked and where it points.

      The gate blocks rather than clears on LINKED because it genuinely cannot
      tell whether the link points inside the home about to be removed or
      outside it. "Cannot tell" is not "nothing to lose".
    known_gap: >
      `home clone` still reproduces such a link verbatim, so the clone is not an
      independent copy for that unit, and `home verify --against <source>` still
      passes because the link points somewhere else rather than back at the
      source. Reported, not fixed here: it is a home-clone property, and the
      sync side now refuses to be silent about the result either way.
    evidence:
      unit: 'HomeSyncTest "a symlinked unit or kind directory is reported, never silently skipped"'
      graph: 'home-sync node home.sync.homeness: both shapes through the real CLI, asserting the unit is NAMED, the report is not clean, nothing was copied through the link, and the link target outside every home was never written to'
      mutation: 'restored the two skip conditions in unitDirectories -- the kind-directory NOFOLLOW_LINKS test and the per-unit isSymbolicLink skip (2 sites, counted first, both mutated); the named unit test failed with "the linked unit was not named at all: []"; reverted and verified with shasum -a 256 -c'

# ---------------------------------------------------------------------------
# PHASE MIG -- fold the remaining monolith into Internal/External.
# PLANNED, NOT SCHEDULED. Do not start without owner sign-off: this is a
# whole-program remodel, not a slice of the child-home epic.
  - id: MIG-0
    title: "Owner decision: schedule the Internal/External migration"
    phase: MIG
    status: blocked_on_owner
    depends_on: [CHM-8]
    objective: >
      Decide whether to migrate SkillManager.tla into Core/Internal/External as
      its own epic, and on what budget. Inputs are recorded, the decision is not.
    inputs:
      measured_today:
        variables: 37
        actions_in_next: 9
        type_invariant: absent
        resolvable_bound: 2
        unconstrained_variables: 36
        god_state_variables: "project_model and result, each touched by 9/9 actions"
        clusters: "C1 21 variables / 1 action, C2 16 variables / 9 actions, C3 1 variable / 0 actions, modularity Q = 0.122"
        promotion_tlc: "measured 2026-07-25: did NOT complete. Stopped after >3000s at 79,225,632 generated / 3,032,979 distinct / depth 14 with 836,363 states still queued. 25x+ over tlc_seconds 120, and past the stale 2,337,504-distinct figure recorded in .history/project-and-child-home-workflow -- nobody has a completed whole-model number for it."
        ports: 29
      cost_estimate: >
        Six to eight tickets, comparable in size to the child-home epic itself.
        The expensive parts are not the module split: they are (1) writing a
        TypeOK for 37 variables that currently have no declared domains at all,
        which is where the state space becomes measurable and where most of the
        real modeling decisions surface; (2) deciding which of the 29 @port
        blocks are External (public CLI surface) and which are Internal
        (fine-grained program state), since today every one of them is both;
        and (3) writing the Test Graph adapters that External implies, which
        the repository has never had. The mechanical part -- moving CONSTANTS
        and helper operators into Core -- is a day.
      risk:
        - "The monolith's promotion config is the only thing checking 57 invariants. Splitting it can silently drop coverage; every invariant must be re-homed explicitly and counted before and after."
        - "project_model is a single record holding ~30 relations. Splitting it across views is the hard call and the place where the two views can start disagreeing."
        - "The promotion cfg already exceeds tlc_seconds. If the split does not reduce per-view state, the migration buys structure and no measurability."
        - "specs/current, specs/program_model and the five history snapshots all carry the monolith. The close-time semantic comparison spans them, so a partial migration must keep both shapes valid simultaneously."
    proposed_ordering:
      - "MIG-1 Core.tla absorbs the shared constants, domain sets, and edge relations from SkillManager.tla; monolith EXTENDS Core. No behavior change, TLC must be byte-equivalent in state counts."
      - "MIG-2 Write TypeOK for all 37 variables and add it to MC_program_promotion.cfg. Measurement only; expect the bound to go from 2 to a real number and expect warnings."
      - "MIG-3 Split the C1 cluster (gateway + server + effect/rollback, 21 variables, 1 crossing action) into its own view first. It is the loosest cluster and the cheapest rehearsal."
      - "MIG-4 Split the CLI store/bindings half of C2 (cli_store_units, cli_installed_records, cli_lock_units, cli_bindings, cli_projection_rows, cli_managed_copies, cli_import_directives, cli_tool_records, cli_cli_lock)."
      - "MIG-5 Decompose project_model. Largest and riskiest; the child-home part is already done by this epic and is the worked example."
      - "MIG-6 Rebuild External.tla as public CLI inputs plus observable projection only, re-home all 57 invariants with a before/after count, and add testgraph_bindings.yml for every external action."
    acceptance:
      assertions:
        - Every invariant in MC_program_promotion.cfg is re-homed to exactly one view, with a before/after count.
        - Each view model-checks inside tlc_seconds.
        - External gets thinner, not thicker, than the monolith's public surface.
      evidence: []

