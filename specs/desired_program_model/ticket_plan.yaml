  - id: CHM-22
    title: "RECORD_SCHEMA_VERSION was not bumped when the digest scope changed, so a stale record held a unit back with no cause an operator could act on"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 46
    found_by: review of #41's fix
    objective: >
      #41 changed what a materialization record's digests are computed OVER:
      re-derivable build output stopped counting as unit content. The version
      number did not move, so a record written before it and one written after
      describe two different trees and are not comparable. The first pass over a
      home holding a pre-#41 record therefore saw a mismatch it could not
      explain and held the unit back -- correctly, and SILENTLY. All seven
      onboarded constituent homes carry such records. The silence is the defect,
      not the hold-back.
    resolution: >
      Both halves of the issue's "either/or", because they answer different
      questions.

      BUMP: RECORD_SCHEMA_VERSION is 2, and usableAsEvidence -- one definition,
      three readers (copyBaseline, hasEntries, sourceHeldTheseBytes: exactly the
      three showings the baseline rule accepts) -- makes any other version no
      evidence at all. Under the baseline rule that costs exactly the ability to
      fast-forward and cannot cost bytes. The OTHER reading of "re-baseline" --
      recomputing contentDigest from whatever the destination currently holds so
      the tree reads as untouched again -- is the unsafe one: true by
      construction, proving nothing about whether an agent edited the unit since
      the copy, and a licence for the next reconcile. That is CHM-9's shape
      reached through the version field.

      `mode` is deliberately NOT gated on the version. It is the one field whose
      whole job is to stop a deletion: a project-wide COPY default that won over
      a recorded CHECKOUT would demote a tree holding unpushed commits.

      Deliberate re-baselining happens in the one place it is sound --
      recordCloneBaselines, where the home's content IS what the home it was
      copied from held, by construction. Elsewhere a pristine unit self-heals on
      the next pass and a non-pristine one holds back.

      MESSAGE: staleSchemaNote names the schema and issue #41 as the cause, on
      all three surfaces that report a hold-back (home sync's detail, which
      close-out renders; copyUnit's held-back detail; and locallyModifiedUnits,
      the predicate a prune and a teardown consult).
    model_change: >
      NONE, and the reason is worth stating rather than assuming. A record whose
      schema this build cannot read is exactly RecordlessSyncRecord -- every path
      claims NoBaseline -- which External.tla has had since #43, and
      AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough is already
      the property that such a record may not license a write. Adding a schema
      dimension would state the same rule twice, which
      planning_rules.dual_representation_rule forbids for the same reason.
    acceptance:
      assertions:
        - A record whose only defect is its version holds the unit back with its bytes intact, and the identical record at the current version still fast-forwards.
        - The hold-back names the schema and the change, and does NOT say "locally modified".
        - A clone re-baselines a record it cannot read and leaves one it can.
        - A stale CHECKOUT record still keeps the unit a checkout.
    evidence:
      unit:
        - 'HomeSyncTest "a record from an older schema is not a licence to replace anything" -- on the destination''s bytes, its tree digest, and both surfaces'' wording, with the current-schema half asserted too'
        - 'HomeSyncTest "a clone re-baselines a record it cannot read, and leaves one it can"'
        - 'HomeSyncGitUnitTest "a record this build cannot read still keeps a checkout a checkout" -- on the record''s own bytes'
      graph: 'home-sync 17/180, project-child-home 11/60, home-clone 8/59 -- all passed'
      mutation: >
        Removed the schema gate (usableAsEvidence -> `record != null`, 1
        definition site feeding 3 readers, counted first): killed "a record from
        an older schema is not a licence to replace anything" ON THE BYTES --
        the destination was overwritten -- and "a clone re-baselines a record it
        cannot read".

        Silenced staleSchemaNote (1 site): killed the same test on the message,
        which then fell back to the #43 sentence about "no materialization
        record of its own" -- true, and useless to whoever has to act on it.

        Gated `mode` on the version too (1 site added): killed "a record this
        build cannot read still keeps a checkout a checkout" -- the record came
        back as mode COPY, the checkout demoted to an ordinary copy.

        Removed the deliberate clone re-baseline (1 site): killed "a clone
        re-baselines a record it cannot read". Every mutation reverted;
        shasum -a 256 -c OK.
      note: >
        The insensitive first version of the checkout assertion never landed --
        it was written and replaced inside the same session, so
        `git show --stat -- src/test` on the first commit is 673 insertions and
        ZERO deletions. No coverage was lost; an earlier report described it as a
        deletion, which the diff does not say.

        A first version of the checkout assertion, written against a non-git
        child tree, was INSENSITIVE to the mode mutation -- the stale record also
        fails as a COPY baseline, so the unit was held back either way and the
        test passed for the wrong reason. Replaced with the git-backed form, where
        the child tree is byte-identical to the store's and the demotion is
        reachable through the adopt-an-identical-copy branch. A mutation that
        kills nothing is a finding about the test.

  - id: CHM-23
    title: "audit.log was written by install and not by sync -- no trail for the command that touches the most files"
    phase: CHM
    status: closed
    closed: "2026-07-29"
    github_issue: 45
    found_by: attributing a real-home change during the sync-blocker work, which is exactly what an audit log is for
    objective: >
      Measured on the operator's home: audit.log's last entry was 8 days old
      while a `skill-manager sync` rewrote 101 files in it.
    resolution: >
      Give sync install's treatment -- the same SkillEffect.RecordAuditPlan, in
      the same position (after the plan is built, before it runs) -- and then the
      part that makes it non-vacuous. Sync's plan comes from
      BuildResolveGraphFromUnmetReferences, so a steady-state sync plans ZERO
      actions and the same treatment alone would have logged nothing on the pass
      that re-merged every unit. Proven by mutation, not asserted.

      So RecordAuditPlan gained a `targets` component, filled from the one place
      that already builds the targets (SyncUseCase.auditTargets), naming the unit
      AND the arm -- git, from-dir, doc-repo, harness -- because an entry that
      named only the unit could not tell an investigator which set of bytes
      moved. One definition (AuditLog.record), one handler, one emission site. A
      new component on the existing effect rather than a second audit-writing
      effect or an AuditLog call in each of the four target handlers: four
      handlers writing their own line is four chances to miss one, which is how
      this came to be missing. Install's behaviour is byte-identical (empty
      targets).

      HomeCloner.SKIPPED_ROOT_FILES still excludes audit.log, and that is now
      asserted: it is the SOURCE home's history, and a clone that inherited it
      would claim actions it never took.
    model_change: none
    acceptance:
      assertions:
        - A sync appends an entry naming the verb, the unit and the arm, and the log had none before it ran.
        - Every entry keeps the log's four-field shape however it got there.
        - A second sync appends rather than replacing.
        - A clone of a home that has a log does not carry it, while demonstrably copying the rest of the home.
    evidence:
      unit:
        - 'AuditTrailTest "sync appends a line naming the verb and the unit it touched" -- on the file''s bytes, through a real Executor run of the sync program'
        - 'AuditTrailTest "a clone does not carry the source home''s audit log"'
      mutation: >
        Removed the effect from the sync program (1 site): killed "sync appends a
        line naming the verb and the unit it touched" -- no audit.log at all.

        THE INTERESTING ONE: kept the effect and dropped the targets, i.e.
        install's treatment exactly as specified (1 site). Killed the same test,
        and again with no audit.log created at all -- direct evidence that "give
        sync the same treatment" would have shipped a green fix that logged
        nothing on the measured scenario.

        Removed audit.log from HomeCloner.SKIPPED_ROOT_FILES (1 site): killed "a
        clone does not carry the source home's audit log". Every mutation
        reverted; shasum -a 256 -c OK.

  - id: CHM-13
    title: "`home close-out` clears a teardown for a path that is not a home at all"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: manual exploratory testing
    objective: >
      `home close-out --home <the worktree DIRECTORY>` -- rather than
      <worktree>/.skill-manager -- exited 0 with "safe": true, "blockers": [],
      and printed the check mark line naming the directory that held the only
      copy of the agent's edit. So did a --home that did not exist at all. The
      gate FAILED OPEN, and the mistake is maximally likely: <worktree> is
      exactly the argument `git worktree remove` takes.

      Mechanism: nothing validated home-ness. HomeSync.unitsToVisit returns the
      union of both sides, a non-home yields zero units, every unit becomes
      REMOVED_UPSTREAM, and HomeCloseOut.remedyFor maps REMOVED_UPSTREAM to no
      blocker. Same hole on the sync side: `home sync --from <a nonexistent
      path>` printed "reconciled" with all-zero counts, exit 0, and created the
      destination's layout on the way; --from <a regular file> behaved
      identically.
    resolution: >
      NotAHomeException.require refuses before anything is read or written, for
      `home sync --from`, `home close-out --home` and `home close-out --into`.
      Home-ness is decided by LaunchEnv.looksLikeStoreRoot, made public rather
      than re-spelled: it already encoded the test for the PATH sanitizer, and
      three spellings of "is this a home" would eventually disagree about
      exactly the homes where it matters. Exit code 2, distinct from 0
      (reconciled / safe), 1 (this home still holds work) and 9 (refused by
      policy); --json callers get {"error":"not_a_home", "safe":false,
      "clean":false} rather than a stack trace, so a script cannot read the
      refusal as approval.

      A sync DESTINATION is deliberately not validated: creating a tier by
      reconciling into it is the operation this epic exists for.
    not_fixed_here: >
      `home describe`, `home drift` and `home policy` also answer for arbitrary
      paths, and each calls store.init(), which lays out a home wherever it is
      pointed. Left alone on purpose and reported instead: `home policy frozen
      --home <a home being created>` is a real gesture, and none of the three
      claims anything about content or authorises a teardown. A command that
      says "there is nothing here to lose" is a different class of defect from
      one that leaves an empty directory tree at a mistyped path.
    evidence:
      unit: 'HomeSyncTest "close-out refuses a path that is not a home rather than clearing it" -- the worktree directory, a nonexistent path, a regular file, and the --into end, each asserted on the exception TYPE and on the real home being untouched'
      graph: 'home-sync node home.sync.homeness: the same four through the real CLI, asserted on exit code AND on nothing having been created'
      mutation: 'deleted the NotAHomeException.require call in HomeSync.run (1 occurrence, counted first) and both in HomeCloseOut.inspect (2 occurrences, both mutated); the named unit test failed with "it did NOT refuse, which is the defect"; reverted and verified with shasum -a 256 -c'

  - id: CHM-14
    title: "A symlinked unit or kind directory is invisible to the enumerator and reported clean"
    phase: CHM
    status: closed
    closed: "2026-07-28"
    found_by: manual exploratory testing
    objective: >
      ChildHomeMaterializer.unitDirectories skipped any unit directory that was
      a symlink, and skipped an entire KIND directory that was one, with no
      report of either. MaterializationMode.LINK produces exactly that shape.
      Measured: a home whose skills/ was a symlink reconciled as
      {"clean":true,"units":[]} with the destination's skills/ left empty; a
      single symlinked unit beside a normal one synced only the normal one,
      reported clean=true, and never named the other.

      Worse, the enumerator and the reconciler disagreed. reconcile() applies
      NOFOLLOW_LINKS only to the final path component, so it reads THROUGH a
      symlinked skills/, and the same unit was invisible to `home sync` while
      `home close-out` reported it conflicted -- purely because the destination
      contributed the name to the union.
    resolution: >
      Symlinks are enumerated, not skipped, and answered by a new outcome:
      SyncStatus.LINKED, which is unresolved(), so clean is false, `home sync`
      exits non-zero and `home close-out` blocks with a remedy. reconcile()
      checks both levels -- the kind directory and the unit directory -- through
      one helper (symlinkOnUnitPath) before it reads any bytes, so the
      enumerator and the reconciler cannot disagree by construction. The report
      names which side is linked and where it points.

      The gate blocks rather than clears on LINKED because it genuinely cannot
      tell whether the link points inside the home about to be removed or
      outside it. "Cannot tell" is not "nothing to lose".
    known_gap: >
      `home clone` still reproduces such a link verbatim, so the clone is not an
      independent copy for that unit, and `home verify --against <source>` still
      passes because the link points somewhere else rather than back at the
      source. Reported, not fixed here: it is a home-clone property, and the
      sync side now refuses to be silent about the result either way.
    evidence:
      unit: 'HomeSyncTest "a symlinked unit or kind directory is reported, never silently skipped"'
      graph: 'home-sync node home.sync.homeness: both shapes through the real CLI, asserting the unit is NAMED, the report is not clean, nothing was copied through the link, and the link target outside every home was never written to'
      mutation: 'restored the two skip conditions in unitDirectories -- the kind-directory NOFOLLOW_LINKS test and the per-unit isSymbolicLink skip (2 sites, counted first, both mutated); the named unit test failed with "the linked unit was not named at all: []"; reverted and verified with shasum -a 256 -c'

# ---------------------------------------------------------------------------
# PHASE MIG -- fold the remaining monolith into Internal/External.
# PLANNED, NOT SCHEDULED. Do not start without owner sign-off: this is a
# whole-program remodel, not a slice of the child-home epic.
  - id: MIG-0
    title: "Owner decision: schedule the Internal/External migration"
    phase: MIG
    status: blocked_on_owner
    depends_on: [CHM-8]
    objective: >
      Decide whether to migrate SkillManager.tla into Core/Internal/External as
      its own epic, and on what budget. Inputs are recorded, the decision is not.
    inputs:
      measured_today:
        variables: 37
        actions_in_next: 9
        type_invariant: absent
        resolvable_bound: 2
        unconstrained_variables: 36
        god_state_variables: "project_model and result, each touched by 9/9 actions"
        clusters: "C1 21 variables / 1 action, C2 16 variables / 9 actions, C3 1 variable / 0 actions, modularity Q = 0.122"
        promotion_tlc: "measured 2026-07-25: did NOT complete. Stopped after >3000s at 79,225,632 generated / 3,032,979 distinct / depth 14 with 836,363 states still queued. 25x+ over tlc_seconds 120, and past the stale 2,337,504-distinct figure recorded in .history/project-and-child-home-workflow -- nobody has a completed whole-model number for it."
        ports: 29
      cost_estimate: >
        Six to eight tickets, comparable in size to the child-home epic itself.
        The expensive parts are not the module split: they are (1) writing a
        TypeOK for 37 variables that currently have no declared domains at all,
        which is where the state space becomes measurable and where most of the
        real modeling decisions surface; (2) deciding which of the 29 @port
        blocks are External (public CLI surface) and which are Internal
        (fine-grained program state), since today every one of them is both;
        and (3) writing the Test Graph adapters that External implies, which
        the repository has never had. The mechanical part -- moving CONSTANTS
        and helper operators into Core -- is a day.
      risk:
        - "The monolith's promotion config is the only thing checking 57 invariants. Splitting it can silently drop coverage; every invariant must be re-homed explicitly and counted before and after."
        - "project_model is a single record holding ~30 relations. Splitting it across views is the hard call and the place where the two views can start disagreeing."
        - "The promotion cfg already exceeds tlc_seconds. If the split does not reduce per-view state, the migration buys structure and no measurability."
        - "specs/current, specs/program_model and the five history snapshots all carry the monolith. The close-time semantic comparison spans them, so a partial migration must keep both shapes valid simultaneously."
    proposed_ordering:
      - "MIG-1 Core.tla absorbs the shared constants, domain sets, and edge relations from SkillManager.tla; monolith EXTENDS Core. No behavior change, TLC must be byte-equivalent in state counts."
      - "MIG-2 Write TypeOK for all 37 variables and add it to MC_program_promotion.cfg. Measurement only; expect the bound to go from 2 to a real number and expect warnings."
      - "MIG-3 Split the C1 cluster (gateway + server + effect/rollback, 21 variables, 1 crossing action) into its own view first. It is the loosest cluster and the cheapest rehearsal."
