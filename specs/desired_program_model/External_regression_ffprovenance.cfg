\* EXPECTED-VIOLATION config. It modelled CODE THAT WAS IN THE TREE until CHM-9
\* was fixed; it is kept, and must keep failing, because a config that stops
\* failing is a rule that has come back.
\* MaterializationRecord.reconcileKind distinguishes a merge result from
\* a pristine copy, but not one pristine copy from another. A plain (non-merge)
\* `home sync --from <worktree> --to <project>` records reconcileKind = "copy";
\* `home close-out` then correctly reports the worktree as UNCHANGED and it is
\* torn down; the next `home sync --from <root> --to <project>` sees an unmoved
\* destination whose record is not a merge result, takes the wholesale-copy
\* path, and deletes the agent's only copy of the work.
\*
\* Reproduced end to end against the real classes; see ticket CHM-9 and
\* spec_manifest.yaml validation.findings.
