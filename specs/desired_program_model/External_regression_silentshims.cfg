\* EXPECTED-VIOLATION config, home level: models a clone that skips the toolchain roots and reports success anyway.
\* `bin/cli/computeq` execs into
\* <home>/cache/skill-script-deploy-helm-computeq/venv/bin/computeq; the clone
\* skips that, so the re-anchored path is CORRECT and points at nothing. The
\* dangling-symlink scan cannot see it because it is a path in a script body,
\* which is why HomeCloner grew danglingReferences: without it the clone hands
\* over three broken CLI tools while exiting 0.
\*
\* Running this must produce a TLC counterexample violating
\* EveryHomeMissingItsToolchainsSaysSo. A clean run here is a failure of the
\* invariant, not a pass: it means the desired-state model stopped being able to
\* see this regression.
SPECIFICATION HomeSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_SILENTLY"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  \* Three-tier reconciliation policies. The desired configuration; this
  \* config does not vary them -- it checks a slice whose actions leave every
  \* sync variable at its initial value.
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  AHomeIsAPureFunctionOfItsRoot
  NoOwnedSurfaceNamesAnotherHome
  WritesThroughOneHomeReachNoOtherHome
  SourceHomeIsByteIdenticalToItsCloneTimeSelf
  AuthoredContentIsNeverRewritten
  ToolchainRootsAreNeverShared
  AHomeMissingItsToolchainsStillHasItsPackageManagers
  EveryHomeMissingItsToolchainsSaysSo
  EveryToleratedContentReferenceIsReported
