\* EXPECTED-VIOLATION config, home level: models the seven in-unit symlinks issue #20 found pointing absolutely into
\* the home, copied verbatim by a plain `cp -R`. A symlink target cannot hold an
\* environment variable -- the kernel resolves the stored bytes literally -- so
\* the copy holds a live channel into the home it came from and an ORDINARY EDIT
\* below it writes there. No skill-manager code is involved in the leak, which
\* is why write-time relativization is the fix rather than a guard on a code
\* path.
\*
\* Running this must produce a TLC counterexample violating
\* WritesThroughOneHomeReachNoOtherHome. A clean run here is a failure of the
\* invariant, not a pass: it means the desired-state model stopped being able to
\* see this regression.
\*
\* NARROWED INVARIANT LIST, deliberately. Under this policy
\* NoOwnedSurfaceNamesAnotherHome and AHomeIsAPureFunctionOfItsRoot are BOTH
\* violated at depth 2, one step after the clone, which masks the behavioral
\* consequence this config exists to show. They are not dropped from coverage:
\* NoOwnedSurfaceNamesAnotherHome is the target of
\* External_regression_sharedtoolchain.cfg and AHomeIsAPureFunctionOfItsRoot of
\* External_regression_absstate.cfg, so every invariant in External_home.cfg is
\* the declared target of exactly one config in this set.
SPECIFICATION HomeSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  \* Git-backed unit dimension (issue #29). FALSE pins every variable it
  \* adds at its initial value, so this config explores exactly the state
  \* space it explored before the dimension existed.
  GitBackedUnits = FALSE
  GitProvenance = "SPLIT_AT_GIT"
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "ABSOLUTE_CARRIED_VERBATIM"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  \* Three-tier reconciliation policies. The desired configuration; this
  \* config does not vary them -- it checks a slice whose actions leave every
  \* sync variable at its initial value.
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "SOURCE_WITNESSED"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  WritesThroughOneHomeReachNoOtherHome
