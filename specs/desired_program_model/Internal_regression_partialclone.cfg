\* EXPECTED-VIOLATION config, clone view: models a clone that leaves whatever it had copied when it failed.
\* HomeCloner rolls the destination back precisely because the next attempt
\* refuses a non-empty destination, so the failure mode is not a lost clone but
\* a directory nobody can safely retry into or delete.
\*
\* Running this must produce a TLC counterexample violating
\* NoUnfinishedDestinationSurvivesAFailedClone. A clean run here is a failure of the
\* invariant, not a pass.
SPECIFICATION CloneSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  \* Home-level policies. The desired configuration; this config does not vary
  \* them -- it checks the unit-level slice, whose actions leave every
  \* home-level variable at its initial value.
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  CloneFailureHandling = "LEAVE_PARTIAL"

INVARIANTS
  TypeOK
  EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver
  NoUnfinishedDestinationSurvivesAFailedClone
  AnInFlightCloneIsNeverHandedOver
  NoHandedOverHomeNamesAnotherHome
