# External.tla -> Test Graph bindings for the child-home materialization slice.
#
# STATUS: PARTIAL AND DELIBERATELY LOUD. Ticket CHM-8 owns this file. What is
# recorded here is the half that is real today: the six unit-level and
# home-level External actions each have a concrete Test Graph node and named
# assertions that drive them against the real `skill-manager` CLI (graph
# `project-child-home`, plus the strengthened `project-resolve` /
# `harness-smoke` nodes).
#
# The three three-tier actions added with the `home sync` slice have NO node.
# They are listed anyway, with `test_graph: status: absent` and the named JVM
# cases that do cover them, because an action missing from this file and an
# action with no coverage read identically to whoever opens it and only one of
# them is true. See `blocked.decision_2026_07_27` at the end.
#
# What is NOT here, and why, rather than a plausible-looking mapping that would
# fail at the first run:
#
#   * `adapter` / `projector` / `expected_projection` / `assertion` are absent.
#     references/testgraph_adapters.md requires four Python classes per action,
#     loaded by scripts/run_generated_case_adapters.py. This repository has no
#     specs/desired_program_model/adapters.py and no tlc_projection.py, and
#     spec_manifest.yaml still records `case_codegen.generation_status: planned`
#     — there are no generated cases for these bindings to bind. Naming classes
#     that do not exist would turn a missing deliverable into a silent one.
#     External channel enforcement treats an absent key as a violation, which is
#     the correct behavior here: this file fails loudly until CHM-8 lands.
#
#   * `production_package` names the Java package under test. The enforcement
#     gate is a PYTHON import guard, so it is vacuous for this program: the unit
#     under test is a Java CLI driven out-of-process over the `cli` channel and
#     the filesystem, and no Python adapter could import it in-process even by
#     accident. CHM-8 should decide whether to keep this declaration as
#     documentation or to widen the contract for non-Python programs.
#
# The `test_graph` keys below are not part of the spec-double-compiler binding
# schema. They are the traceability CHM-8 needs and the thing this ticket
# actually delivered: which node and which named assertion check each action.

external:
  production_package: dev.skillmanager
  port_bindings:
    SkillManagerCliChildHomePort: real
    AgentWorkspacePort: real
    ChildHomeMaterializerPort: real

actions:

  ResolveProjectChildHome:
    view: external
    layer: external
    channel: cli
    controllability: e2e_direct
    port: SkillManagerCli.resolve_project_child_home
    command: skill-manager project resolve --skip-gateway --json --project-dir <project>
    test_graph:
      graph: project-child-home
      nodes:
        child.home.resolved:
          - initial_resolve_ok
          - resolve_after_store_link_injection_ok
          - resolve_json_summary_carries_a_held_back_field
          - clean_child_home_holds_back_nothing
          - all_claimed_units_materialized
        child.home.resolve.preserves.edits:
          - resolve_did_not_destroy_the_agent_edit          # AgentEditedChildUnitsAreNeverDestroyed
          - resolve_did_not_destroy_the_edit_behind_the_link
          - resolve_reports_exactly_the_held_back_units      # EveryPassReportsExactlyTheHeldBackUnits
          - default_output_names_the_held_back_units_and_how_to_take_the_parent_version
          - resolve_left_the_parent_store_untouched          # ChildHomeWritesNeverReachTheParentStore
        child.home.prune.preserves.edits:
          - prune_did_not_destroy_the_agent_edit
          - prune_removed_the_unmodified_dropped_unit
          - child_home_holds_only_claimed_or_held_back_units # ResolveLeavesOnlyClaimedOrHeldBackUnits
        child.home.materialization.atomic:
          - failed_materialization_left_the_child_unit_bytes_intact  # Internal: InFlightMaterializationLeavesTheChildUnitIntact
          - failed_materialization_left_the_child_unit_tree_intact
      also_covered_by:
        - graph: project-resolve
          node: project.dependencies.resolved
          assertions:
            - project_child_home_units_are_independent_copies
            - no_child_home_entry_links_into_the_parent_store
            - child_home_edit_does_not_reach_the_parent_store
        - graph: project-profiles
          node: project.profiles.resolved
          assertions:
            - shared_unit_is_a_distinct_copy_in_each_profile_child_home
            - profile_child_home_units_recorded_as_copies
            - profile_child_home_edit_reaches_neither_sibling_nor_parent
          note: >
            Two profiles of one project both claim the same unit. Under the
            pre-epic symlink child home those were literally the same directory,
            so profile isolation and unit independence are the same property
            here.
        - graph: project-smoke
          nodes:
            project.global.sync.cli.refresh:
              - project_child_cli_is_a_symlink_at_the_parent_shim
            project.local.sync.cli.refresh:
              - project_child_cli_is_a_symlink_at_the_parent_shim
          note: >
            The shim exception, from the other side: units are copies, shims are
            still links at the parent toolchain.

  SyncProjectChildHome:
    view: external
    layer: external
    channel: cli
    controllability: e2e_direct
    port: SkillManagerCli.sync_claiming_project_child_homes
    command: skill-manager project sync --skip-gateway --json --project-dir <project>
    test_graph:
      graph: project-child-home
      nodes:
        child.home.sync.preserves.edits:
          - sync_over_modified_child_home_ok
          - sync_did_not_destroy_the_agent_edit
          - sync_did_not_destroy_the_edit_behind_the_link
          - sync_reports_exactly_the_held_back_units
          - sync_left_the_parent_store_untouched

  InstantiateHarnessChildHome:
    view: external
    layer: external
    channel: cli
    controllability: e2e_direct
    port: SkillManagerCli.instantiate_child_home_from_harness
    command: skill-manager harness instantiate <harness> --id <id> --child-home-dir <dir>
    test_graph:
      graph: harness-smoke
      nodes:
        harness.child.home.materialized:
          - child_units_are_independent_copies
          - child_units_recorded_as_copies
          - no_child_unit_entry_links_into_the_parent_store
          - child_home_edit_does_not_reach_the_parent_store
          - cli_shim_stays_a_symlink_at_the_parent_toolchain
    note: >
      The harness path shares ChildHomeMaterializer with project resolve, so its
      hold-back and convergence behavior is covered by the project-child-home
      graph. What is asserted here is the part that is specific to this entry
      point: that `--child-home-dir` materializes copies, and that CLI shims are
      still symlinks at the parent toolchain (the one documented exception).

  EditChildHomeUnit:
    view: external
    layer: external
    channel: fs
    controllability: e2e_direct
    port: AgentWorkspace.edit_child_home_unit
    test_graph:
      graph: project-child-home
      nodes:
        child.home.unit.edited:
          - agent_edit_written_into_child_unit
          - agent_edit_written_behind_dereferenced_link
        child.home.edit.stays.in.child.home:
          - parent_store_tree_is_byte_identical_after_child_edit
          - edited_child_unit_bytes_did_not_reach_the_parent_unit
          - edit_behind_the_link_did_not_reach_the_linked_parent_unit
          - no_symlink_in_a_child_unit_resolves_into_the_parent_store
          - in_unit_store_link_is_dereferenced_content
    note: >
      Two edits, matching the two write-through channels the model distinguishes:
      an ordinary file in the unit (escapes under MaterializationMode.LINK) and a
      file behind an in-unit symlink into the parent store (escapes under
      PRESERVE_LINK). The bytes written are published downstream so a later pass
      can prove they are still there, which is what distinguishes destruction
      from a consistent-but-empty held-back report.

  UpgradeParentStoreUnit:
    view: external
    layer: external
    channel: fs
    controllability: e2e_direct
    port: SkillManagerCli.sync_unit
    test_graph:
      graph: project-child-home
      nodes:
        child.home.converges.on.source:
          - unmodified_child_unit_picks_up_new_parent_bytes
          - next_pass_agrees_the_refreshed_unit_is_unmodified
          - convergence_did_not_cost_the_hold_back_rule
    note: >
      Driven by writing the parent store unit directory directly, which is what
      install / sync / upgrade all reduce to. Binding it to the `sync_unit` port
      through the real CLI is CHM-8 work.

  UpgradeLinkedParentSource:
    view: external
    layer: external
    channel: fs
    controllability: e2e_direct
    port: SkillManagerCli.sync_unit
    test_graph:
      graph: project-child-home
      nodes:
        child.home.converges.on.source:
          - unmodified_child_unit_picks_up_bytes_behind_the_store_link
          - refreshed_link_content_is_still_dereferenced
    note: >
      Upgraded in a pass of its OWN, before the unit's own bytes change. If both
      changed together, a materializer digesting the raw source tree would still
      refresh — because the unit's own file moved — and would pick up the linked
      content as a side effect, hiding the freshness bug this action exists to
      expose (External_regression_rawdigest).

  # -------------------------------------------------------------------------
  # The three-tier reconciliation actions, added with the `home sync` /
  # `home close-out` slice of External.tla (SyncSpec).
  #
  # These have NO `test_graph` key, and that absence is the honest record
  # rather than an oversight. The two halves of a binding are the External
  # action and the out-of-process node that drives it; the node half does not
  # exist for any of these three, and test_graph node authoring for this epic
  # is owned by a separate agent. Inventing a graph and node name here would
  # make a missing deliverable look like a delivered one, which is the same
  # failure mode as naming adapter classes that are not on disk.
  #
  # What DOES exercise them today is named per action under `unit_tests`. That
  # is a weaker binding than a Test Graph node in exactly one way that matters
  # and should be said plainly: these run IN-PROCESS against the Java classes,
  # so they cannot catch anything that only goes wrong across the CLI boundary
  # — argument parsing, exit codes, JSON shape, the launcher's environment.
  # `home sync --json` and `home close-out --json` have no out-of-process
  # coverage at all. That is CHM-11.

  ReconcileHomeTiers:
    view: external
    layer: external
    channel: cli
    controllability: e2e_direct
    port: SkillManagerCli.home_sync
    command: skill-manager home sync --from <home> --to <home> [--merge] [--dry-run] [--json]
    test_graph:
      status: absent
      owner: test_graph node authoring (separate agent)
      ticket: CHM-11
    unit_tests:
      suite: src/test/java/dev/skillmanager/store/HomeSyncMergeTest.java
      cases:
        - "absence is a value in the merge, not a case of its own"
        - "a file deleted on one side and edited on the other is a conflict"
        - "a conflict anywhere in a unit suppresses the paths that would have merged"   # AConflictedUnitIsNeverPartiallyWritten
        - "a merge result survives a second, unrelated source change"                    # AReconciliationOnlyWritesPathsTheDestinationDidNotMove
        - "a plain fast-forward records which home the bytes came from"                  # CHM-9 characterization
        - "a destination unit with no materialization record is never overwritten"
        - "a record written by a newer skill-manager reads as no baseline, not as a crash"
        - "a merge with no per-file baseline anywhere conflicts rather than guessing"
        - "DEFECT PIN CHM-10: a second --merge reverts the work the first one kept"
      also_covered_by:
        suite: src/test/java/dev/skillmanager/store/HomeSyncTest.java
        cases:
          - "a clean fast-forward copies the source unit into the destination"
          - "a locally modified destination unit is held back with its bytes intact"
          - "--merge folds disjoint edits from both homes together"
          - "a file changed on both sides is reported as a conflict and nothing is written"
          - "--dry-run reports the whole reconciliation and writes nothing"
          - "a sync that fails part way leaves the destination unit exactly as it was"
          - "two concurrent syncs into one home do not interleave"
          - "a unit only the source has arrives; one only the destination has is reported"
          - "a frozen destination refuses and a frozen source is only read"
          - "a cloned home records the baseline that lets its edits merge back"

  TearDownWorktreeHome:
    view: external
    layer: external
    channel: cli
    controllability: e2e_direct
    port: SkillManagerCli.home_close_out
    command: skill-manager home close-out --home <worktree home> --into <project home> [--json]
    test_graph:
      status: absent
      owner: test_graph node authoring (separate agent)
      ticket: CHM-11
    unit_tests:
      suite: src/test/java/dev/skillmanager/store/HomeSyncTest.java
      cases:
        - "close-out refuses while the worktree holds work and passes once it is synced"  # NoHomeIsTornDownWhileItHoldsUniqueWork
        - "close-out refuses a unit whose two sides conflict, and names it"
      also_covered_by:
        suite: src/test/java/dev/skillmanager/store/HomeSyncMergeTest.java
        cases:
          - "the work survives the teardown that close-out cleared"
        note: >
          Written for this slice because the two HomeSyncTest cases above assert
          the VERDICT and stop there, and the proposition
          NoHomeIsTornDownWhileItHoldsUniqueWork is about what happens after the
          verdict is acted on. This case removes the worktree home and then
          compares the project home's tree, by digest, against what the worktree
          held at the moment the gate cleared it. A gate that returns the right
          answer to a teardown that then loses the work is no gate at all, and
          nothing here could previously tell those apart.

  EditUnitInHomeTier:
    view: external
    layer: external
    channel: fs
    controllability: e2e_direct
    port: AgentWorkspace.edit_unit_in_home
    test_graph:
      status: absent
      owner: test_graph node authoring (separate agent)
      ticket: CHM-11
    note: >
      An ordinary editor write inside whichever home SKILL_MANAGER_HOME names.
      No skill-manager code runs, which is why it is driven directly by every
      unit test above rather than through a port.

# ---------------------------------------------------------------------------
blocked:
  ticket: CHM-8
  decision_2026_07_27: >
    The gap was NOT closed for the sync slice, and the reasoning is recorded
    here rather than left as an absence. Closing it means four Python classes
    per action loaded by scripts/run_generated_case_adapters.py, and those
    classes bind GENERATED CASES. `case_codegen.generation_status` is still
    `planned`, so there are no cases; adapters written now would be classes
    that nothing loads, validating nothing, while making
    `adapter:`/`projector:`/`expected_projection:`/`assertion:` keys appear in
    this file and turn a missing deliverable into a silent one. That is the
    same failure the header already warns about, and adding three more actions
    to it would have made it worse rather than better.

    So the honest documentation was EXTENDED to cover the three new actions
    instead: each carries the port and command it is bound to, the named
    unit-test cases that exercise it today, and — for TearDownWorktreeHome —
    the specific proposition that nothing currently checks. What is still
    missing is unchanged and listed below.

    On `production_package`: the External content rule forbids an External
    adapter from importing the production package. For this program the rule is
    unenforceable AND unnecessary in the same breath, because the unit under
    test is a Java CLI driven out of process over the `cli` channel and the
    filesystem: no Python adapter could import it if it wanted to. The
    declaration is kept as documentation of what is under test. CHM-8 should
    decide whether to widen the contract for non-Python programs or drop the
    key for them.
  missing:
    - specs/desired_program_model/adapters.py (adapter / projector /
      expected_projection / assertion classes for all nine actions)
    - specs/desired_program_model/tlc_projection.py
    - generated external case package (spec_manifest.yaml
      case_codegen.generation_status is `planned`, so no cases exist yet)
    - a decision on `production_package` for a non-Python program under test
    - Test Graph nodes for ReconcileHomeTiers / TearDownWorktreeHome /
      EditUnitInHomeTier, so `home sync` and `home close-out` get their first
      out-of-process coverage (CHM-11)
  not_blocked:
    - the Test Graph nodes for the six unit-level and home-level actions, which
      exist and pass; see spec_manifest.yaml validation.graph
