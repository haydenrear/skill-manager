\* EXPECTED-VIOLATION config: models a materializer that removes the live child
\* unit before writing the new tree, so an interrupted run leaves nothing behind.
\* Running this must produce a TLC counterexample.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "DELETE_THEN_WRITE"

INVARIANTS
  TypeOK
  InFlightMaterializationLeavesTheChildUnitIntact
  AgentEditsSurviveMaterialization
  ChildHomeWritesNeverReachTheParentStore
  MaterializationRecordsDescribePresentChildUnits
  HeldBackUnitsAreLocallyModified
  ChildUnitContentMatchesItsRecord
