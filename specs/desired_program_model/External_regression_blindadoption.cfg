\* EXPECTED-VIOLATION config. It models THE FIX #43 WAS NOT ALLOWED TO BE, and
\* it is kept, and must keep failing, because a config that stops failing is a
\* rule that has come back.
\*
\* A root home is INSTALLED into, never materialized into, so it carries no
\* materialization record at all. The tempting repair is to treat a record-less
\* destination as pristine -- or, identically, to ADOPT a baseline into it and
\* then read that baseline back. Both assert that the two homes shared bytes
\* they may never have shared.
\*
\* The counterexample is the shape that makes it expensive: a second project (or
\* a torn-down worktree, through the project) has already pushed its work into
\* the root home, and the FIRST project -- which has never seen that work --
\* then pushes. Under ALWAYS_DISPOSABLE the record-less destination is disposable
\* by definition, so the wholesale copy takes it, and the other home's only copy
\* is gone with every command reporting success. Under SOURCE_WITNESSED the same
\* pass asks whether THIS source ever passed through the bytes it is about to
\* destroy, finds it did not, and holds back.
\*
\* Target: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough.
\* Running this must produce a TLC counterexample.

SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "ALWAYS_DISPOSABLE"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

\* Narrowed to the declared target, the same way every other expected-violation
\* config in this directory is: a config that could fail for any of six reasons
\* is not evidence about one of them.
INVARIANTS
  TypeOK
  AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
