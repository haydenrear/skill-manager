\* NEGATIVE-RESULT config. The ONLY config in this directory that must return
\* "No error has been found" while modeling a regression -- and that is the
\* finding it records, not a pass.
\*
\* Same policy as External_regression_rewritecontent.cfg
\* (CloneContentPolicy = "REWRITE"): the clone re-anchors authored unit content
\* like any other path, corrupting append-only spec history and effect-provider
\* evidence. The only content invariant checked here is the REPORTING one,
\* EveryToleratedContentReferenceIsReported.
\*
\* TLC explores the entire 706-state space and finds nothing. After the rewrite
\* there is no surviving reference to report, so the antecedent of the reporting
\* invariant goes false and the equivalence holds vacuously -- the report is
\* perfectly self-consistent about a record that has been silently destroyed.
\* Adding AuthoredContentIsNeverRewritten, which reads the home_authored
\* witness, produces a counterexample at depth 2.
\*
\* This is the same shape as the negative result established earlier on this
\* epic at unit granularity: with OVERWRITE_LOCAL_CHANGES and only
\* EveryPassReportsExactlyTheHeldBackUnits, TLC returns clean, because after an
\* overwrite the unit is no longer modified and both sides of the equivalence go
\* false together. Only the agent_edits witness catches it. Keep both halves of
\* this pair: if this config ever starts producing a violation, the reporting
\* invariant has been strengthened into something else and the negative result
\* no longer says what it says.
SPECIFICATION HomeSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "REWRITE"
  \* Three-tier reconciliation policies. The desired configuration; this
  \* config does not vary them -- it checks a slice whose actions leave every
  \* sync variable at its initial value.
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  EveryToleratedContentReferenceIsReported
