\* EXPECTED-VIOLATION config: models the historical symlink child home, where child and parent were the same bytes.
\* Running this must produce a TLC counterexample. A clean run here means the
\* desired-state invariants stopped being able to see the regression.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "LINK"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "PRESERVE_LINK"
  ChildSwapStrategy = "ATOMIC_MOVE"

INVARIANTS
  TypeOK
  ChildHomeWritesNeverReachTheParentStore
  AgentEditedChildUnitsAreNeverDestroyed
  EveryPassReportsExactlyTheHeldBackUnits
  UnmodifiedChildUnitsConvergeOnTheirSource
  ResolveLeavesOnlyClaimedOrHeldBackUnits
