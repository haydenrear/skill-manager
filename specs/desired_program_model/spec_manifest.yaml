notes:
  direction: "This manifest records the target whole-program model and the ticket workflow status. Keep ticket_plan.yaml synchronized whenever scope, order, validation, or acceptance criteria change."
  package_from_program_model: skillmanager_program_cases
  resolver_limitation: >
    `analyze complexity` reports record-typed variables (child_home, pass,
    child_unit, record, staging) as explicit UNKNOWNs -- record sets are on the
    documented not-sizable list in architecture_tractability.md. The bounds of
    108 and 432 therefore exclude them. The reachable-state counts from TLC
    (250 and 2065) are the load-bearing measurement, not the static bound.
  variables_block_formatting: >
    Blank lines between entries in a TLA+ VARIABLES block make the complexity
    scanner see only the first variable. Both new modules keep the block
    contiguous and put per-variable commentary above it. Candidate
    skill_feedback item (profile-schema-cli) at workflow close.
