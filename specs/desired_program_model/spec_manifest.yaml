# --------------------------------------------------------------------------
# Module layout of this workflow directory.
#
# TRANSITIONAL, AND DELIBERATELY SO. The accepted baseline in
# specs/program_model is a single 1897-line SkillManager.tla with no
# Internal/External split -- `tla-spec-dev scaffold workflow` warns about
# exactly this. That monolith is carried forward here unchanged so
# desired_program_model still describes the WHOLE program, while the new
# Core/Internal/External modules carry the child-home materialization slice
# this epic changes.
#
# Two representations of one program is a hazard, not a feature. The overlap
# is enumerated below so it stays visible, and phase MIG in ticket_plan.yaml
# retires it.
modules:
  core:
    module: Core.tla
    role: shared constants and operators for the child-home slice
  internal:
    module: Internal.tla
    config: Internal.cfg
    clone_config: Internal_clone.cfg
    role: fine-grained program state; spec-unit case source
    generates: spec_unit
    adapter_mapping: case_adapters.toml
    status: authored_tlc_green_adapters_pending
  external:
    module: External.tla
    config: External.cfg
    home_config: External_home.cfg
    role: publicly observable behavior; Test Graph case source
    generates: testgraph
    adapter_mapping: testgraph_bindings.yml
    status: authored_tlc_green_bindings_pending

# Each of Internal.tla and External.tla now carries TWO specs over disjoint
# variable sets, and the reason is measured rather than stylistic.
two_specs_per_module:
  external:
    Spec: unit-level child-home materialization (store_body, child_home, agent_edits, pass)
    HomeSpec: home-level isolation (home, home_anchor, home_body, home_writes, home_authored, source_snapshot)
    SyncSpec: >
      three-tier reconciliation (sync_body, sync_record, sync_history,
      sync_unsound, sync_gone). Added 2026-07-27 on the same measured grounds as
      the first split: its variables are disjoint from both other slices and no
      invariant crosses them, so a combined Next would explore 250 x 706 x 180
      and check nothing the three do not already check apart. Five variables,
      inside budgets.max_component_variables 6.
  internal:
    Spec: the materializer, per unit (adds record, staging, held_back)
    CloneSpec: "`home clone` phase by phase (clone, dest, handed_over)"
  rationale: >
    The two slices share no invariant: nothing in the home-level invariants
    mentions a unit-level variable or vice versa. A single Next over both
    therefore explores the PRODUCT of the two reachable state spaces -- 250 x 706
    for External, 2065 x 105 for Internal -- which is 176,500 and 216,825
    distinct states against budgets.max_distinct_states 50000, while checking
    nothing that either spec does not already check. Each spec pins the other
    slice at its Init value, which is why the seven pre-existing configs still
    report exactly 250 / 2065 / 35 / 27 / 9 / 202 / 114 distinct states.
  cost_of_the_split: >
    A rule spanning the levels cannot be stated in any one view. The concrete
    example is "materializing a child unit inside a cloned home must not write
    through the clone's own in-home links": both halves are covered
    independently (unit-level PRESERVE_LINK, home-level
    ABSOLUTE_CARRIED_VERBATIM) but their composition is not. Folding the levels
    together belongs with phase MIG, where store_body indexed BY HOME would
    remove the duplication instead of multiplying it. Recorded here rather than
    left implicit because a reader is entitled to know what the split does not
    check.
  action_naming_note: >
    Every action carries the other slice's UNCHANGED itself rather than having it
    conjoined onto Next in the Spec formula. TLC only names an action in a
    counterexample when the box subscript encloses a bare disjunction of
    actions, so `[][Next /\ UNCHANGED home_vars]_vars` silently costs every trace
    in the module its action names. Measured: traces went from
    "<Action line 417, ...>" to "<UnbindUnitThroughHome line 362, ...>".
  legacy_monolith:
    module: SkillManager.tla
    config: MC_program_promotion.cfg
    role: the not-yet-migrated remainder of the accepted program model
    status: carried_forward_unchanged
    # OWNER DECISION 2026-07-26: record this and proceed on the new views.
    # Phase MIG owns fixing it; this epic validates against External/Internal.
    baseline_has_no_completed_tlc_run: true
    baseline_tlc_finding: >
      MC_program_promotion.cfg does not complete. Killed after >3000s at
      79,225,632 generated / 3,032,979 distinct / depth 14 with 836,363 states
      still on the queue - 25x over the tlc_seconds budget, no violation found
      up to that point. It also exceeded the 2,337,504-distinct figure recorded
      in .history/project-and-child-home-workflow, so THAT RECORD IS STALE and
      no completed whole-model TLC number currently exists for this baseline.
      Root cause is not module structure: SkillManager.tla declares 37 variables
      and has no TypeOK at all, so 36 of 37 resolve as unconstrained. Writing
      those domains is the expensive part of phase MIG, not splitting modules.
      Evidence: ../results/chm-monolith-tlc.txt
    baseline_validation_rule: >
      Until MIG lands, do not treat a monolith TLC run as a gate for this
      epic's tickets. External.cfg (250 distinct, depth 9) and Internal.cfg
      (2065 distinct, depth 12) are the authoritative fast checks for
      child-home materialization behavior.
    overlaps_with_new_modules:
      - ScaffoldProjectChildHome
      - InstantiateChildHomeFromHarness
      - SyncClaimingProjectChildHomes
      - ResolveProjectProfile
    overlap_rule: >
      While both representations exist, the Core/Internal/External modules are
      authoritative for child-home MATERIALIZATION (what a child unit contains,
      whether it is independent, and what happens to local edits). SkillManager.tla
      stays authoritative for child-home MEMBERSHIP (which units, servers, shims,
      and agent configs a child home has, and the parent/registration graph).
      Do not restate a rule in both. Phase MIG removes the split.

# --------------------------------------------------------------------------
internal_external_decision:
  question: "Introduce Internal/External for this slice only, migrate the whole monolith, or something else?"
  chosen: slice_now_full_migration_planned_not_executed
  rationale: >
    Option (b), a full migration in this pass, is not honest work: the monolith
    has 37 variables, no TypeOK at all (every dimension resolves as
    "unconstrained"), two god-state variables written by 9/9 actions, and a
    promotion config that does not finish inside the 120s tlc_seconds budget.
    Splitting that correctly is its own multi-ticket epic and it would bury the
    child-home behavior this epic is actually about. Option (a) alone leaves the
    repository permanently in the state the scaffolder warns about. So: author a
    REAL Core/Internal/External for this slice now -- three modules, both cfgs
    TLC green, invariants that fail on the regressions -- and record the full
    migration as phase MIG with a component inventory, ordering, and risk, to be
    scheduled separately with the owner.
  evidence:
    - specs/results/chm-monolith-complexity.txt
    - specs/results/chm-external-complexity.txt
    - specs/results/chm-internal-complexity.txt

# --------------------------------------------------------------------------
# Per-program complexity and case budgets. PROPOSED, NOT AGREED.
# migration.md Phase 0 requires these to be settled with the owner BEFORE any
# effectful/modular migration touches a spec. Values below are the
# modular_fuzzing.md defaults except where `rationale` names a reason to move.
# Set source: negotiated once the owner has accepted or adjusted them.
budgets:
  tlc_seconds: 120
  max_distinct_states: 50000
  max_state_space_bound: 1000000
  max_internal_cases_per_component: 200
  max_external_cases_per_action: 50
  kill_rate_floor: 0.8
  max_component_variables: 6
  max_component_actions: 12
  max_symmetric_instances: 2
  source: owner_approved
  approved: "2026-07-26"
  approval_note: >
    Approved as proposed. max_component_actions raised 8 -> 12 deliberately:
    Internal is the fine-grained view of one materializer whose real lifecycle
    has that many named outcomes, and collapsing them into a status field would
    trade trace-readable actions for exactly the god-state the complexity
    descriptor warns about. The alternative considered and declined was
    splitting Internal into materializer + store components, which would add a
    component boundary and its ports before we know the split is natural.
    Revisit if Internal grows past 12 transitions rather than raising again.
  rationale:
    tlc_seconds: "Default kept. External is 250 states and Internal 2065, both sub-second; the only model that blows it is the carried-forward monolith, and that is the argument for phase MIG rather than for a bigger budget."
    max_distinct_states: "Default kept. Measured 250 (External) and 2065 (Internal), two orders of magnitude of headroom for the remaining slices."
    max_state_space_bound: "Default kept. Both new views report a resolvable bound of 108 and 432; the record-typed variables are honest UNKNOWNs the resolver cannot size, not hidden size."
    max_internal_cases_per_component: "Default kept. Internal has 12 transitions over 2065 states; an exhaustive dump is expected to sit well under 200, and the cap is the right place to find out otherwise."
    max_external_cases_per_action: "Default kept. Six external actions; 50 representatives each is far more than the child-home behavior distinguishes."
    kill_rate_floor: "Default kept. Non-gating (CD-09) and not yet exercised on this repository; keeping the default avoids pretending a floor was calibrated here."
    max_component_variables: "Default kept. Internal sits exactly at 6 and External at 4; keeping the default keeps pressure on phase MIG rather than legitimizing the monolith's 37."
    max_component_actions: "RAISED 8 -> 12. Internal is the fine-grained view of ONE materializer whose real lifecycle has this many named outcomes (stage/swap/abort/hold-back/adopt/prune/place-untracked plus two source-change and two pre-epic paths). Collapsing them into a status field would trade trace-readable actions for exactly the kind of god-state the descriptor warns about. Owner should reject this if the preferred answer is to split Internal into a materializer component and a store component instead."
    max_symmetric_instances: "Default kept. The finite model uses one project, one child home, one parent home."

