# The three witness variables at home granularity, and what each one is for.
# A witness exists when the property it guards is NOT recoverable from the final
# state -- that is the whole test for whether one is earning its keep.
witnesses:
  home_writes:
    guards: WritesThroughOneHomeReachNoOtherHome
    why: >
      A write's REACH is only observable at the instant of the write. TLC found
      the reason: the obvious body-comparison form ("no other home's copy holds
      bytes written through h") produces a counterexample at depth 4 that is not
      a defect -- edit through clone P, then clone P into clone Q, and Q
      legitimately carries the edit because copying a home copies its content.
      Afterwards leaked bytes and copied bytes are the same bytes. So the witness
      records one triple per home the write LANDED in.
  home_authored:
    guards: AuthoredContentIsNeverRewritten
    why: >
      A clone joins the set because the copy carried the author's bytes. Without
      that record, a policy that rewrites those bytes leaves nothing to compare
      against and nothing to report -- see the negative result below.
  source_snapshot:
    guards: SourceHomeIsByteIdenticalToItsCloneTimeSelf
    why: >
      Captured on the FIRST clone and never recaptured. Both halves matter:
      comparing against a live re-read compares the source to itself and passes
      unconditionally, and recapturing on every clone lets a source corrupted by
      clone 1 be re-baselined as correct by clone 2.
  sync_unsound:
    guards:
      - AReconciliationOnlyWritesPathsTheDestinationDidNotMove
      - AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
      - AConflictedUnitIsNeverPartiallyWritten
    why: >
      A reconciliation that overwrites a destination also REWRITES THAT
      DESTINATION'S RECORD, so afterwards the home is perfectly coherent, its
      report is perfectly truthful, and there is nothing left in the final state
      that differs from a correct run. Entitlement to write is only observable
      at the instant of the write. Same shape and same reason as home_writes.
      The reasons are computed by the model from the pre-state, never reported
      by the policy, so a reconciler that writes anyway logs that it was not
      entitled to. Guarded by External_sync_guard_overwrite.cfg and
      External_sync_guard_conflict.cfg.
  sync_history:
    guards: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
    why: >
      Monotone: every <<home, path, content>> that has ever been on disk at that
      location, and nothing may remove a triple. It answers the one question a
      merge base has to answer and that no report and no final state can --
      whether the SOURCE ever passed through the state being called the common
      ancestor -- and it survives the overwrite that destroys the bytes it is a
      record of. Also the thing that made NoHomeIsTornDownWhileItHoldsUniqueWork
      statable at all; see validation.negative_result_sync.
  sync_gone:
    guards: NoHomeIsTornDownWhileItHoldsUniqueWork
    why: >
      A teardown destroys the work and the evidence of the work in the SAME
      step, so the evidence has to be taken before the step. Comparing against
      the home afterwards compares against nothing, and that is precisely why
      the failure this slice exists for is completely silent: `rm -rf` succeeds
      identically whether the directory held work or not. Guarded by
      External_sync_guard_teardown.cfg.

