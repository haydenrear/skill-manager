  - id: EV-I-24
    title: "one unrecognised command scored as four separate findings"
    channel: census
    channel_note: "asked to define the problem precisely instead of calling it a case failure"
    area: "the eval harness's Stop hook — the early exit at the front-door check"
    detail: >
      When the extractor recognises nothing the hook exits before writing
      front-door-runs, worktree-has-its-own-home OR source-undamaged, so ONE
      defect reds FOUR graders and reads as 0.17. That is why
      epic-provisions looked like a collapse: it is one measurement failure,
      counted four times, in a case whose agent issued the correct command.
    note: >
      I called this 'provisioning epics is failing'. The skill was not failing;
      the grader was. The phrasing put a product defect where an instrument
      defect was.
    resolution: >
      The graders still go red -- nothing was verified, and they should -- but
      the hook now writes WHY-NO-FRONT-DOOR.txt naming the commands it saw and
      the ones it rejected, and run.sh archives it beside the score. A red
      carried no information before, which is why diagnosing this case cost
      three sweeps and roughly four dollars.

