  - id: EV-I-23
    title: "the sweeps exhausted first the disk and then the machine's memory"
    channel: operator-doing-the-work
    area: "the eval harness's resource footprint"
    detail: >
      After ENOSPC (EV-I-17), three background tasks were killed for low
      memory mid-sweep. 44 kept sandboxes had accumulated; removing them
      returned 203G. A --keep sandbox is a whole run tree and nothing expires
      them, so a diagnostic loop that keeps traces grows without bound.
    fix_needed: >
      --keep should retain the TRACE and drop the rest, or the harness should
      reap sandboxes older than the current sweep. Neither is done.
    status: open
    class_of: present-is-not-working

  - id: EV-I-19
    title: "a fix reported as applied that had never run — the && swallowed it"
    channel: census
    channel_note: "found by reading git show on the commit that claimed it"
    area: "the eval harness's operator — me"
    detail: >
      The 'state the contract' rewrite of the toolchain hook was run as
      `cd specs/evals/harness && python3 ...` from a shell already IN that
      directory. The cd failed, the && swallowed the edit, and the `bash -n`
      and the eval run that followed were separate statements -- so the block
      printed 'syntax ok' and 'score 1.00' and looked applied. `git show` on
      the commit shows it added the cd line and comments and nothing else.
      I then attributed a 4->2 call improvement to a fix that did not exist.
    class_of: read-a-stale-artifact-as-a-result
    fix: "read the file back and count both the new text and the old; done for the rewrite that replaced it"

  - id: EV-I-20
    title: "the toolchain hook told the no-home case to give up on its own task"
    channel: blind-judges
    channel_note: "bootstraps-a-home-for-a-repo, 3 runs at 0.10 / 0.10 / 0.30"
    area: "the eval harness's toolchain hook"
    detail: >
      For the one case whose subject IS a checkout with no home, the hook
      announced `skt -> NOT ON PATH (that is a defect in the eval setup, not
      something to work around)`. True about the path and exactly wrong as
      advice: giving the checkout a home is the task. Red on the front-door
      grader in all three runs.
    note: >
      CONSISTENT ACROSS THREE RUNS, which is what separated it from the
      2-vs-4 coin flip one row up. At --runs 1 this and that noise are
      indistinguishable, and I had been reading both as signal.
    resolution: >
      Fixed and MEASURED: 0.10 / 0.10 / 0.30 -> 0.80 / 1.00 / 1.00, mean 0.17
      -> 0.93. Consistent before and consistent after, which is what makes this
      one an effect rather than the coin flip in EV-I-16.

  - id: EV-I-17
    title: "the harness filled the disk and no command could run"
    channel: operator-doing-the-work
    area: "the eval harness's build lifecycle"
    detail: >
      Each case builds a ~5 GB home; setup.sh builds the next before the
      previous is gone, and every --keep run leaves a whole sandbox. Six cases
      plus 31 kept sandboxes reached ENOSPC, at which point no Bash call could
      run at all -- the harness writes each command's output to disk first.
      This repo's own memory note says to measure worktree cost with free space
      rather than du. I measured neither.
    class_of: present-is-not-working

  - id: EV-I-18
    title: "--runs 1 makes every number in the ledger a single sample"
    channel: census
    channel_note: "found by reading the archive that EV-I-16's correction came out of"
    area: "the eval harness's run count"
