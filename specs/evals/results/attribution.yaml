# Bug attribution for the eval suite — CATCH rows.
#
# WHERE THIS BELONGS. `specs/deferred_findings.yaml` does not exist on main:
# the rows live in sealed epic results, and creating that path from a branch
# would collide with all of them on merge. So these are written here, per
# bug_attribution.md §4's note, and move into the epic's sealed results at
# close.
#
# WHY IT EXISTS AT ALL, stated because the omission is itself the finding:
# every row below was already written — in a commit message, or in the results
# narrative beside it. None of it was in a file anything reads. That is the
# same defect as the eval scores living only in a terminal, and it went
# unnoticed for the same reason: prose looks like a record.
#
# `area` NAMES THE APPARATUS when the defect is the apparatus (§6a). Without
# that, a count of these rows reads as product quality and is inverted.

meta:
  epic: one-unit-one-name
