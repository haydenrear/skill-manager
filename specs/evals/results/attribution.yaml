  - id: EV-I-16
    title: "the SessionStart hook told every agent the front door was NOT ON PATH"
    channel: census
    channel_note: "read from a kept trace while asking why every case failed its cost grader"
    area: "the eval harness's toolchain hook"
    detail: >
      The agent's PATH leads with RELATIVE entries, which resolve against the
      workspace; the hook resolved `command -v` from its own directory. So it
      announced `skt -> NOT ON PATH (that is a defect in the eval setup)` and
      `skill-manager -> /opt/homebrew/bin/skill-manager` -- the operator's
      global CLI. Both false, and the second is the exact "teaching it to
      bypass what run.sh sets up" the file's own header warns against.
    effect: >
      This is the cost grader. An agent told the front door is absent goes
      looking, which is the 4-to-7 orientation calls EVERY case was red on.
    class_of: present-is-not-working
    resolution: >
      cd-ing the hook to the workspace did NOT fix it -- measured, still NOT ON
      PATH. Both hooks run at SessionStart and this one announces a workspace
      the FIXTURE hook has not necessarily placed yet, so the entry does not
      exist to be probed from anywhere. The file's own header already said a
      hook cannot verify on the agent's behalf; that was written about a more
      permissive environment and is just as true about an earlier one. It now
      STATES the entries the harness guarantees and probes only the absolute
      ones.
    effect_measured: >
      NOT MEASURED, and the first version of this row said it was. The claim
      was "4 calls / 0.82 -> 2 calls / 1.00". The archive of five runs of this
      case on one day says otherwise:

        12:00  1.00  2 calls   BEFORE any hook fix
        12:13  0.82  4 calls   after the cd attempt
        12:26  1.00  2 calls   after the contract rewrite
        12:54  0.82  4 calls   after the contract rewrite

      The 2-vs-4 split alternates and is UNCORRELATED with the change. The hook
      really was announcing the front door as absent -- that is read from a
      trace and stands -- and stating the contract instead is right on its own
      terms. What does not stand is the cost effect I attributed to it.
    correction: >
      Seventh single-run causal claim this session, and the first one to reach
      a commit message. The archive caught it because the scores are now in
      files instead of prose -- which is the wiring paying for itself in the
      most direct way available: it contradicted me.

  - id: EV-I-21
    title: "epic-provisions was not bimodal — the extractor was"
    channel: census
    channel_note: "read from three kept traces after --runs 3 showed 0.33 / 1.00 / 0.33"
    area: "the eval harness's Stop-hook extractor"
    detail: >
      The two failing runs issued the exact command SKILL.md teaches --
      `"$SKT" ticket new DEMO-1 --base "$(git rev-parse HEAD)" --path ...`.
      When the extractor moved from shlex to whitespace .split() to fix the
      BASENAME bug, it broke quoted arguments CONTAINING SPACES: `--base
      "$(git rev-parse HEAD)"` becomes four fields and `"$(git` fails the
      allowlist. The 1.00 run passed only because it had resolved the SHA in a
      PREVIOUS call, so its arguments were literal.
    resolution: >
      .split() for the program word (shlex splits `"${VAR}"/path/thing` at the
      closing quote), shlex for the arguments (split() breaks a substitution
      with spaces). Different problems; one tool solves neither alone.
    note: >
      FIFTH instance of EV-I-02's class: the grader rejecting the form the
      documentation teaches. Every one of the five scored a CORRECT agent
      command as a miss.
    class_of: grader-penalises-following-the-docs
    resolution: >
      REAL BUG, NOT THIS CASE'S CAUSE. The parsing defect is genuine and is
      fixed and verified offline against both documented forms. It did NOT
      resolve epic-provisions: with the fix confirmed present in the source AND
      in the deployed build, three more runs came back 1.00 / 0.17 / 0.33.
      Recorded as unresolved rather than quietly dropped -- a ledger that keeps
      the fixes that worked and loses the ones that did not is worse than none,
      which is the same failure as the guaranteed-red grader in EV-I-12.
    lesson: >
      Diagnosed from a passing/failing contrast across three traces and stopped
      there. The correlation was real and the mechanism was real, which is what
      made it convincing. A correlation over three runs is one step of
      evidence, not a cause.

  - id: EV-I-22
    title: "epic-provisions is unstable and the cause is still unknown"
    channel: census
    area: "the eval harness's epic case — cause unattributed"
    status: open
    detail: >
      Three separate 3-run sweeps: 0.33/1.00/0.50, 0.33/1.00/0.33,
      1.00/0.17/0.33. The failing runs go red on issues-the-front-door-command
      and everything downstream of it. Two candidate causes are eliminated (the
