# bootstrap-home.sh is the front door here, and it lives in a unit's scripts/
# rather than in bin/cli -- REPLAY_EXE_REL says so. VERB_RE is empty because
# this door has no verb: its first argument is already `--root`.
VERB_RE=''
PROG_RE='bootstrap-home\.sh'
REPLAY=yes
EXPECT=home
REPLAY_EXE_REL='skills/git-issue-workflow/scripts/bootstrap-home.sh'
REPLAY_VERB=''
REPLAY_HOME_KIND=eval-home
