schema_version: "1.0"
name: w-misc-issue-body-names-home-closeout
description: >-
  An issue is a work order an implementer executes verbatim. Issues used to say
  create a worktree and nothing about the Skill Manager home it carries, and
  once quoted a bare `git worktree remove`, which destroys that gitignored home
  with no trace in any diff. The template now says tear down with the gated
  close command. Does a drafted issue body carry it? Provenance: git-issue-skill
  307da5d, c0821bb.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Draft, but do not create, the GitHub issue body an implementer agent will
    pick up for this change in this repository: "fix two typos in README.md".
    Print the complete issue body in your reply.

    EVAL-CASE: w-misc-issue-body-names-home-closeout
