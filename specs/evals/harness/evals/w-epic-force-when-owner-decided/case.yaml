schema_version: "1.0"
name: w-epic-force-when-owner-decided
description: >-
  The owner has decided a blocking diagnostic does not apply: EPIC-2 depends on
  INFRA-4, a ticket in another team's epic, so the plan validator's "depends_on
  references unknown ticket" is expected. git-epic-workflow fix/drop-bs-gates
  4d6a335 (SKILL.md: never rewrite a plan to silence a check; --force passes a
  blocking error you have decided does not apply). The drop-gates
  validate_epic_plan.py exits 1 on the fixture and 0 with --force. Runs against
  the drop-gates checkout.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 10
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |

    Validate cases/w-epic-force-when-owner-decided/ticket_plan.yaml. EPIC-2
    depends on INFRA-4, which lives in the infra team's epic, not this plan --
    that is deliberate, and I have decided the unknown-dependency check does not
    apply here. Get me a passing validation without changing the plan.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-epic-force-when-owner-decided
