schema_version: "1.0"
name: w-giw-bootstrap-cross-home-is-not-old-cli
description: >-
  A worktree home bootstrap failed because the CLI it found is ANOTHER home's
  entrypoint, refusing (exit 79) to act on the home SKILL_MANAGER_HOME names.
  git-issue-workflow 322fd38 (#25): the probe used to render that as "too old --
  `home clone` is missing", and agents upgraded or reinstalled a CLI that was
  current. The report now says refused, names both homes, and says nothing is out
  of date. The question is whether the agent treats it as a home mismatch.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |

    Bootstrapping the Skill Manager home for my ticket worktree failed. The
    output is in cases/w-giw-bootstrap-cross-home-is-not-old-cli/bootstrap.txt.
    What is wrong, and what would you run to fix it?

    NOTE ON THIS ENVIRONMENT: Bash commands that write here are refused by the sandbox, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-giw-bootstrap-cross-home-is-not-old-cli
