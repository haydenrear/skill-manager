schema_version: "1.0"
name: w-giw-wt-stale-branch-point
description: >-
  A ticket worktree refused (exit 7) because the local epic branch is behind
  its remote. git-issue-workflow e37e3f9: before the refusal existed a ticket
  branched 21 commits behind origin and edited a superseded tree. The right
  move is to branch from the published tip, not to wave the check off with
  --stale-base-ok. The sandbox has no remote, so the refusal is handed over as
  a fixture and the question is only which command the agent issues next.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    I tried to start the worktree for TICKET-12 on the epic and it refused.
    The output is in cases/w-giw-wt-stale-branch-point/refusal.txt. Get the
    worktree created.

    NOTE ON THIS ENVIRONMENT: Bash commands that write here are refused by the sandbox and there is no
    remote, so the command will fail however correct it is. That is expected
    and is not yours to solve. Issue the command you would use, once, and
    report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-giw-wt-stale-branch-point
