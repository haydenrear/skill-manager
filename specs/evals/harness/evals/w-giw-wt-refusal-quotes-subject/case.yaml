schema_version: "1.0"
name: w-giw-wt-refusal-quotes-subject
description: >-
  Closing a ticket that has no worktree must report WHICH ticket and WHERE it
  looked. git-issue-workflow e4dfb02 (#27): `wt` quoted the last line of a
  multi-line refusal, so the agent was told "error: either." and nothing else.
  The fix quotes the child's own `error:` line, naming the ticket and the path
  it was not at. Graded on the agent reaching the gated close door and relaying
  the product's own subject line, which only a real run of it produces.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Ticket TICKET-9 is done. Tear down its worktree and its Skill Manager home
    the supported way, then tell me exactly what the tool reported.

    Do not look for the worktree first: whether it exists is what the close command reports.

    EVAL-CASE: w-giw-wt-refusal-quotes-subject
