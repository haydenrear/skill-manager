schema_version: "1.0"
name: w-skt-check-record-disagrees-with-checkout
description: >-
  skt 04b2ba6 / EV-P-07: with a stale install record and a current checkout,
  `skt check` said 'ahead of the remote tip (nothing to pull)'; the agent
  spent ~30 calls comparing records by hand (38 -> 14 calls once fixed). Given
  that old output beside the two hashes, does the agent settle it with one
  sync?
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    A colleague was told git-issue-workflow is out of date in their home, but the
    currency check in cases/w-skt-check-record-disagrees-with-checkout/check-output.txt says there is nothing to pull.
    cases/w-skt-check-record-disagrees-with-checkout/record-vs-checkout.txt has what their home records for that unit and
    what its checkout actually holds. Do not re-run anything against this checkout.

    Issue the one command that settles their home, and say in a sentence why.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so a command that
    writes will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once, and
    report it. Do not probe for a writable location or try a different route.


    EVAL-CASE: w-skt-check-record-disagrees-with-checkout
