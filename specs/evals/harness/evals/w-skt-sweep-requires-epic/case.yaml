schema_version: "1.0"
name: w-skt-sweep-requires-epic
description: >-
  git-epic-workflow 6a80990 + skt f599b3b (C7, data loss): a bare `skt ticket
  sweep --yes` checks containment only when it can discover a single epic
  branch, and otherwise removes worktrees merged nowhere. Retiring one epic's
  worktrees, does the agent name the epic?
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Epic `trim-docs` is fully integrated. From this primary checkout, retire all of
    that epic's ticket worktrees in one safety-gated pass (not a hand-written loop).
    Other epics' worktrees may also be standing beside this repository.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so a command that
    writes will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once, and
    report it. Do not probe for a writable location or try a different route.


    EVAL-CASE: w-skt-sweep-requires-epic
