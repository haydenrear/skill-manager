VERB_RE='(?:ticket\s+close|close)'
REPLAY=yes
EXPECT=worktree-gone
WT_NAME=../wt-TICKET-7
REPLAY_BIN=skt
REPLAY_VERB='ticket close'
# The worktree to close, made by the front door in the sandbox. A copied one
# does not work: git worktree registration does not survive a plain copy, so
# `ticket close` correctly finds nothing and the replay would measure the copy.
# The copied .git carries the fixture's `feature/TICKET-7` ref even though the
# worktree itself was excluded, so the front door refuses with "a branch named
# 'feature/TICKET-7' already exists". Clear the ref, then build the worktree
# the agent's close arguments will act on.
REPLAY_PRE='git branch -D feature/TICKET-7 >/dev/null 2>&1; "$SKILL_MANAGER_HOME/bin/cli/skt" ticket new TICKET-7 --base HEAD --path ../wt-TICKET-7'
