schema_version: "1.0"
name: w-giw-epic-ticket-stops-on-wrong-pr-base
description: >-
  An epic ticket whose assignment's pr_base is the default branch. After
  git-issue-workflow fix/drop-bs-gates 104ddca (references/epic-ticket.md) the
  ticket agent stops for only three reasons, and a PR base that is not the epic
  branch is one: provisioning would send the work to the wrong place. The
  fixture is a real rendered assignment the drop-gates validate_assignment.py
  refuses (exit 1: "ticket.pr_base 'main' is not the epic branch"). Runs against
  the drop-gates checkouts.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |

    Pick up issue #141. Its body is in
    cases/w-giw-epic-ticket-stops-on-wrong-pr-base/issue-141.md. Do the first
    step of the ticket.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-giw-epic-ticket-stops-on-wrong-pr-base
