schema_version: "1.0"
name: w-harness-smoke
description: >-
  Proves the WIDE lane before any wide round is billed: the shared fixture is
  placed, the prompt's EVAL-CASE marker reaches the transcript, the wide-verify
  Stop hook finds it, and a file_exists grader reads the verdict it wrote. Not a
  skill test. A red here means no other w-* score means anything.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Bash, Read]
  prompt: |
    Run exactly this one command and report its output verbatim:

    ```
    cat cases/w-harness-smoke/marker.txt
    ```

    Do not run anything else.

    EVAL-CASE: w-harness-smoke
