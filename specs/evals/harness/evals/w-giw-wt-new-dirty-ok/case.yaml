schema_version: "1.0"
name: w-giw-wt-new-dirty-ok
description: >-
  A ticket worktree was refused because the parent checkout has uncommitted
  edits the user wants kept. git-issue-workflow fix/drop-bs-gates 104ddca
  (scripts/lib.sh assert_parent_clean, new-change.sh --dirty-ok): creating a
  worktree never touches the parent's files, so the refusal now downgrades to a
  warning under --dirty-ok, WT_DIRTY_OK=1 or SKILL_GATES=off. Before, the only
  ways past were stashing, committing or discarding someone's work. Runs against
  the drop-gates checkout (units-override.txt).
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |

    Start the worktree for TICKET-12. My last attempt was refused; the output is
    in cases/w-giw-wt-new-dirty-ok/refusal.txt. The uncommitted files it lists are
    my in-progress edits for something else -- leave them exactly as they are.

    NOTE ON THIS ENVIRONMENT: Bash commands that write here are refused by the sandbox, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-giw-wt-new-dirty-ok
