schema_version: "1.0"
name: w-sdc-close-ticket-delivered-status
description: >-
  The terminal-status vocabulary was written out in three places and none held
  `delivered`: `close ticket` refused a delivered ticket while other commands
  treated it as done, so agents edited plan status to `done` just to get past
  the gate. On fix/drop-bs-gates `delivered` is in TICKET_CLOSED_STATUSES, the
  one shared set. Provenance: tla-spec-dev-drop-gates
  scripts/spec_evolution.py:79-82 (uncommitted); measures that checkout via
  units-override.txt.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Ticket T-1 is delivered and its PR is merged. Close it in the spec workflow.
    The spec root is cases/w-sdc-close-ticket-delivered-status/specs.

    NOTE ON THIS ENVIRONMENT: Bash commands that write here are refused by the sandbox, so the command will
    fail with "Operation not permitted" however correct it is. That is expected.
    Issue the command you would use, once, and report it.

    EVAL-CASE: w-sdc-close-ticket-delivered-status
