schema_version: "1.0"
name: w-misc-plugin-repo-finalize-sh
description: >-
  finalize-constituents.sh guards "did you commit first" with the pathspec
  `-- constituents`, a directory a plugin repo does not have, so in a plugin
  repo the guard never fires and finalizing early turns every skills/<n>/ into a
  gitlink. The plugin-repository skill ships scripts/finalize.sh for this. Does
  the agent reach for it? Provenance: plugin-repository-skill 9b15078.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    cases/w-misc-plugin-repo-finalize-sh/ is a plugin repository that bundles
    skill repos under skills/. A new skill was just added to the bundle and the
    registration is committed. Run the step that puts each bundled skill's own
    .git back.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe the filesystem for a writable location and do
    not attempt a different route — the command you choose is what is recorded.

    EVAL-CASE: w-misc-plugin-repo-finalize-sh
