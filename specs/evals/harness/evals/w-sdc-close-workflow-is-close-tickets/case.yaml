schema_version: "1.0"
name: w-sdc-close-workflow-is-close-tickets
description: >-
  Top-level help advertised "Close ticket or workflow history" while `close`
  accepts only `ticket`; an agent went looking for `close workflow`, got an
  argparse error, and could not tell whether the feature was missing. Workflow
  close is scripts/close_tickets.py (workflows.md step 5). Provenance:
  tla-spec-dev b9cd18a (E-03, #311), scripts/tla_spec_dev.py:819-832.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Every ticket in our spec workflow is closed. Close out the workflow itself now.
    The spec root is cases/w-sdc-close-workflow-is-close-tickets/specs.

    NOTE ON THIS ENVIRONMENT: the filesystem is read-only, so the command will
    fail with "Operation not permitted" however correct it is. That is expected.
    Issue the command you would use, once, and report it.

    EVAL-CASE: w-sdc-close-workflow-is-close-tickets
