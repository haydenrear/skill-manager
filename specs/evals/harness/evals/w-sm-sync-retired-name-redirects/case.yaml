schema_version: "1.0"
name: w-sm-sync-retired-name-redirects
description: >-
  After the migration folded the standalone skill-manager skill into the skt
  plugin, `sync skill-manager` answered "not installed: skill-manager" and
  agents went off to reinstall the retired unit, which the next sync then
  cloned back (17 homes halted). Asked to update the skill-manager skill, does
  the agent sync the carrier rather than install the retired unit?
  Provenance: skill-manager 24674e90, 863d8f09.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 10
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    This project's Skill Manager home is ./.skill-manager. Bring the
    skill-manager skill in this home up to date with its source.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe the filesystem for a writable location and do
    not attempt a different route — the command you choose is what is recorded.

    EVAL-CASE: w-sm-sync-retired-name-redirects
