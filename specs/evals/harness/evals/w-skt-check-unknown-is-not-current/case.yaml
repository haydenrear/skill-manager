schema_version: "1.0"
name: w-skt-check-unknown-is-not-current
description: >-
  skt f00b724 / EV-P-06: `skt check` once headlined 'all current' while every
  unit was unverifiable; the agent disbelieved it and rebuilt the check by
  hand (28 calls, $1.95). Given that old output, does the agent call currency
  UNKNOWN without reconstructing the check?
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    A teammate ran the home currency check on a laptop with no network and pasted
    the output into cases/w-skt-check-unknown-is-not-current/check-output.txt. Their home is not this one, so do
    not re-run anything against this checkout.

    From that output alone: are that home's units up to date? Answer in one or two
    sentences and say what the output does and does not establish.


    EVAL-CASE: w-skt-check-unknown-is-not-current
