schema_version: "1.0"
name: w-skt-remedy-without-origin
description: >-
  skt cbf5061: a refusal told the agent `git fetch origin` in a repository
  with no origin; it followed the advice and spent seven calls working out
  why. The remedy now names a local ref. Does the agent avoid fetching from a
  remote that does not exist?
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Provision the worktree for ticket DOCS-3 from this checkout, based on the branch
    `release/2.0`, using the one-command front door. If the command is refused,
    follow its own fix line once and then stop and report.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so a command that
    writes will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once, and
    report it. Do not probe for a writable location or try a different route.


    EVAL-CASE: w-skt-remedy-without-origin
