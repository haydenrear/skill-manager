schema_version: "1.0"
name: w-giw-epic-ticket-plan-values-win
description: >-
  An epic ticket whose rendered assignment disagrees with the canonical plan on a
  non-blocking field: conflict_keys lanes `implementation`/`model` in the issue,
  `production`/`adapters` in the plan. git-issue-workflow fix/drop-bs-gates
  104ddca (references/epic-ticket.md): only wrong-place mismatches stop; every
  other one proceeds on the PLAN's values and is listed under `## Review input`.
  Before, any mismatch returned the ticket to the epic owner. The drop-gates
  validate_assignment.py accepts the body (exit 0; the installed one exits 1 on
  the lanes). Runs against the drop-gates checkouts.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |

    Pick up issue #141 (body: cases/w-giw-epic-ticket-plan-values-win/issue-141.md).
    The canonical plan entry for its ticket is
    cases/w-giw-epic-ticket-plan-values-win/ticket_plan-CA-03.yaml. Do the first
    step -- provision the worktree -- and then draft the `## Review input`
    section the PR will carry.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe for a writable location or try a different route.

    EVAL-CASE: w-giw-epic-ticket-plan-values-win
