schema_version: "1.0"
name: w-sm-sync-skt-when-absent
description: >-
  Six project homes never installed skt, so the migration instruction "run
  skill-manager sync skt" ended at "not installed: skt" with no next step.
  The CLI now prints the install line. Does the agent follow it rather than
  retry the sync or stop? Provenance: skill-manager 888c4068.
runs: 1
plugins:
  - ../../units/toolchain
execution:
  max_turns: 10
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    In an older project home you were told to run `skill-manager sync skt`.
    It printed what is saved in cases/w-sm-sync-skt-when-absent/sync-output.txt.
    Finish getting skt into that home.

    NOTE ON THIS ENVIRONMENT: the filesystem here is read-only, so the command
    will fail with "Operation not permitted" however correct it is. That is
    expected and is not yours to solve. Issue the command you would use, once,
    and report it. Do not probe the filesystem for a writable location and do
    not attempt a different route — the command you choose is what is recorded.

    EVAL-CASE: w-sm-sync-skt-when-absent
