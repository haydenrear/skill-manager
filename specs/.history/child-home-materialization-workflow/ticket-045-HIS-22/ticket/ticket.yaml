    "slice": "DEF-103 -- one registered project's durability defect refuses EVERY unit sync into the root home, naming a project unrelated to the unit being synced. Six projects were registered; one had three absolutely-spelled vendored links; all four unit syncs failed. THE CHECK IS CORRECT AND MUST NOT BE WEAKENED -- its reasoning is HIS-19's, a path that resolves at write time and not after a move. Fix the BLAST RADIUS: scope the refusal to the units the failing project actually claims, or degrade an unrelated project's durability finding to a warning that names the risk. DEF-096 -- the project home never realized its own manifest. skill-project.toml declares [plugins.skt] and [skills.skill-manager]; the home held neither and projects/ was empty. Every worktree in this epic is a clone of that home, so every ticket agent worked without the two units that document the thing they were working on. DEF-101 -- close-out cannot express \"the destination can obtain this from its own manifest at a published ref\", so it must block on units that are unmodified checkouts the destination itself declares. AND THE SECOND HALF OF THE OWNER'S SENTENCE IS AN ACCEPTANCE ITEM, not a footnote: a direct root update must still work. A design that makes the enforced path work by making direct root updates impossible has failed.\n",
