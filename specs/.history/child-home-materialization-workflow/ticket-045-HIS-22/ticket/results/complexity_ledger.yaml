narrative: >
  Full narrative: results/epic-home-integrity-sync/tickets/HIS-22/goal-contribution.md
  Vacuity record: results/epic-home-integrity-sync/probes/his-22/vacuity-checks.md

  THE FINDING THIS TICKET CONSIDERS ITS MOST VALUABLE OUTPUT is that its own
  issue is wrong on two counts, both measured before implementation:
  (1) `meta-harness`, the project #254 calls "unrelated" to the four units that
  failed, CLAIMS ALL FOUR in its project-lock.toml; and (2) the fix #254
  prescribes -- scoping the refusal to units the failing project claims --
  SHIPPED IN #144 and is already guarded by a test. The acceptance node written
  to that prescription is green against the UNFIXED build; probe V1 reverts the
  whole fix and watches it stay green. It is kept as
  ProjectToRootPromotionTest CASE 3 and labelled a control, not evidence.

  The real scope is KIND OF FAILURE, not units-per-project. A project's
  [[vendored]] durability finding is a fact about that project's checkout: true
  before the unit sync, true after, and no byte the sync moved can cause or cure
  it. It is now typed and handled by the post-sync child-home refresh as a named
  skip carrying its own repair command, while `project resolve` and
  `project sync` refuse on exactly the same condition with exactly the same
  message and exit code.

  DELIBERATELY NOT DONE, and filed rather than hidden: External.tla's
  CloseOutIsSafe still reads `SyncStatusOf(...) = "unchanged"`, and DEF-101 adds
  a second way for the gate to clear that the model cannot express without a new
  variable plus a constant in ~25 cfgs. The assignment reads
  `tlc: N/A unless the fix states a new invariant`, and this states a WEAKENING
  of an existing safety predicate. DEF-112 carries the exact model change and
  the regression cfg it owes, including the
  test_tlc_expected_violations.py row naming which invariant must fall --
  vacuity-ledger row 15's countermeasure. DEF-110 and DEF-111 carry the two
  other things this ticket found and did not widen into.
