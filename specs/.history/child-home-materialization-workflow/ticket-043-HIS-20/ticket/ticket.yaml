    "id": "HIS-20",
    "method_note": "A judged read of a handful of agents is not a statistic and must not be reported as one. Report per-question, name every question answered only by reading source as a FAILURE, and keep the before-transcripts even where the after-transcripts are better. An agent that guessed correctly is not a pass; ask it where it got the answer.\n",
    "objective": "This epic spent eighteen tickets making the three tiers behave correctly and never once asked whether an agent standing in one can FIND OUT what it needs. The evidence says no: every ticket agent needed a hand-written brief carrying four facts no unit documents -- the two axes (HIS-14), the CLI pin (DEF-006/DEF-068), bootstrap's exit 79 (DEF-018), and a printed command that never worked (DEF-069/DEF-072). Those briefs came from the epic agent. Nothing in the product produces them.\n",
    "phase": "HIS",
    "promotion_order": 19,
    "promotion_predecessor": "HIS-19",
    "role": "implementation",
    "role_note_revision_9": "Typed `evaluation` when first written and corrected to `implementation` before dispatch, by the plan validator. HIS-20 MEASURES and then CLOSES the gaps it finds -- that is contribution, not adjudication. HIS-6 decides GOAL-progressive-disclosure, as `evaluation_ticket` on the goal has said all along. An evaluation ticket that also fixes what it measures would be the DEF-067 hazard applied to a person: an observer that repairs is no longer an observer.\n",
    "slice": "MEASURE FIRST, THEN FIX, AND RECORD BOTH. In that order, and the before-transcripts are committed before any documentation changes -- the same discipline HIS-4 was held to. (1) DOWNWARD -- root -> project -> worktree. One small agent per tier, home pinned, NO access to this repository's source. Ask: which tier am I in; what does it inherit from above; what may I change here; what must I not touch above me. (2) UPWARD -- worktree -> project -> root. One small agent per tier. Ask: how does my change reach the tier above; what does git carry and what does it NOT (the home is gitignored); what does close-out decide; what happens to a held-back or conflicted unit. (3) CHANGE MANAGEMENT THROUGH GITHUB. For every installed change-managed unit, can an agent name the command that publishes a local edit to that unit's GitHub repository, and the tier to run it from? Cover `skill-manager home sync`, `skt sync`, `unit publish` / `skt publish`, and what `skt check` compares. Then close the gaps the reads expose -- in the units that instruct agents, linking rather than restating, per GOAL-mechanism-documented's clause 1 -- and RE-RUN the reads with fresh agents. Both sets of transcripts ship.\n",
    "status": "planned",
    "title": "progressive disclosure has never been measured in either direction, and no tier says how a skill change reaches GitHub",
