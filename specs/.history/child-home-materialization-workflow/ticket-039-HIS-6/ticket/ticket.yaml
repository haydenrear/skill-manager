    "epic": "home-integrity-sync",
    "evaluation_design_revision_9b": "SET BY THE OWNER 2026-08-24, after the epic PR and before dispatch. This REPLACES the \"run every goal's harness\" shape with an ordered pipeline, because the point is not to produce nine verdicts -- it is to find what breaks at release and to leave a check behind for each thing found. PHASE 1 -- THE SWEEP, WITH RESUMPTION, AND `--all` CANNOT DO IT. Established by measurement 2026-08-24 before dispatch: `run.py` REFUSES the combination outright -- if args.run_all and (args.resume_from_build or replay_node_count): parser.error(\"resume options apply to one graph; pass <graph> instead of --all\") Resumption is PER GRAPH. So \"sweep everything\" and \"resume from the failing node\" cannot both be asked of `--all`, and the owner's instruction -- never restart from the beginning -- requires driving the graphs individually. DEF-011's fix and the resumption requirement turn out to be THE SAME FIX. That driver is `skills/test_graph/scripts/sweep.py`. One graph at a time; a red graph does NOT stop the sweep; every outcome recorded red or green; `graphs_executed` and `graphs_passed` written as SEPARATE numbers so neither can be inferred from the other; and `--retry-failed-from` re-runs only the failures, resuming each from its own first FAILED node. IT IS VALIDATED IN BOTH DIRECTIONS, and the selftest found a defect in it: the first version classified any node not `passed` as failing, which lumped `skipped` in with `failed`. On artifact-dag that reported THREE failing nodes where there is ONE -- `uninstall.prunes.the.subgraph` failed, and `home.fixpoint.law` / `home.membership.law` are downstream with spawnExitCode -1 and zero assertions. It would have told this evaluation that the cross-cutting laws were broken. Failed and skipped are now separate, and the distinction also matters for resumption: a skipped node has no saved input context to resume from. PHASE 2 -- SMALL AGENTS ON REAL ISSUES, NOT WHOLE-EPIC AGENTS. The owner: \"I don't want you to deploy whole agents. Instead, deploy agents on gh issues to validate their own worktree.\" So each evaluation agent takes ONE GitHub issue, works in ITS OWN worktree, and validates THAT worktree. Small and issue-scoped. This is the shape the epic used for tickets; it is now the shape of the evaluation. PHASE 3 -- THE PROMOTION PATHS, ALL OF THEM, INCLUDING THE ONE WE MISSED. The owner: \"we're also going to have to evaluate the promotion to skill manager root from project root. I think previously we missed that.\" Correct -- every close-out gate in this epic ran worktree -> project, and NOTHING exercised project -> root until 2026-08-24, when it was run by hand and immediately hit DEF-103. The paths to evaluate: worktree home -> project home      (close-out; exercised all epic) project home  -> root home         (MISSED; DEF-103 lives here) root home     -> project home      (downward: clone/inherit) project home  -> worktree home     (downward: bootstrap) The owner's direction on the middle pair: \"we need to be enforcing change management of the root skill manager from project home. However, we should still be able to update the root.\" So project -> root is the ENFORCED direction, and a direct root update must remain possible. Both halves get a case. PHASE 4 -- THE PROGRESSIVE DISCLOSURE GRAPH is validated during this, not as a separate exercise. HIS-20 measured it at ONE tier only; the other two corpora existed nowhere on disk. Now that the leaf PRs are merged and the root home is synced (docs coverage 0 of 4 -> 4 OF 4 on the real machine), root is measurable for the first time. PHASE 5 -- CLOSE THE LOOP, AND THIS IS THE PART THAT OUTLIVES THE EPIC. Every bug the AGENTS found that `--all` did NOT becomes (a) a new or widened test assertion, and (b) where it is a property rather than a case, a model update. The owner: \"we use the missing bugs to add as test assertions and updates to our model so that the same regressions get caught in the future.\" A bug found by an agent and not left behind as a check is a bug that will return. PHASE 6 -- THE SCORECARD. Nine goals, one verdict per clause, PLUS the regressions caught and the fixes made, PLUS a judgment -- argued, not asserted -- on how well the architecture and the validation actually did. The owner asked for \"solid judgment\", which means naming what the validation MISSED as plainly as what it caught.\n",
