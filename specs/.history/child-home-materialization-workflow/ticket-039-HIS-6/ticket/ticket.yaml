    "re_measurement_note": "GOAL-sync-quiet and GOAL-no-spurious-holdback are re-measured against the COMMITTED baseline fixtures under results/epic-home-integrity-sync/ baseline/, not against the operator's homes, which have moved since. GOAL-symlink-merge-settles is measured on HIS-4's synthetic fixture, because its live instance was cleared at kickoff -- say so in the report rather than presenting the synthetic number as the same measurement.\n",
    "rescheduled_in_revision_10": "Wave 14 -> 16, promotion 20 -> 22, behind HIS-21 and HIS-22. The manual sweep that was meant to PREPARE this evaluation found six defects the 26-graph sweep missed, and the owner chose to fix them and leave regression assertions behind BEFORE the terminal measurement rather than report them as findings against it. That makes the validation ITERATIVE, which is the point: round 1 is the sweep plus the manual pass; HIS-21 and HIS-22 fix what it found and add the assertions; round 2 re-runs the sweep against the fixed tree, which both confirms the fixes and gives the new assertions their first real exercise. HIS-6 then decides nine goals against a tree validated twice. The ID and plan ordinal are unchanged, per rule 3; only the schedule moved. This is the second time HIS-6 has moved for exactly this reason.\n",
    "rescheduled_in_revision_9": "Wave 12 -> 14, promotion 18 -> 20. Revision 9 inserted HIS-19 (the versioned CLI pin) and HIS-20 (progressive disclosure in both directions, and change management through GitHub) ahead of it. HIS-6 stays LAST by construction: it is the measurement, and a measurement that runs before the last change measures something else. The ID and plan ordinal are unchanged, per rule 3; only the schedule moved.\n",
    "role": "evaluation",
    "rules": "DOES NOT FIX GOALS. A goal that comes out short is reported short and is a decision for the owner. Never edits a target so a result passes; never re-runs selectively until a number passes. IT DOES FIX THE HARNESS, and that is the one exception, added in revision 9b: phase 5 REQUIRES adding assertions and model updates for every bug the agents found that the sweep missed. Repairing the PRODUCT to make a goal pass is forbidden; leaving a found bug without a check is also forbidden. Where the two conflict -- a bug whose fix would change a measured number -- file the fix and report the number as measured, then say so.\n",
