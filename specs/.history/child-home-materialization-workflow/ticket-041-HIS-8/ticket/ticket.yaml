    "promotion_predecessor": "HIS-13",
    "rescheduled_in_revision_4": "Moved from wave 3 to wave 6. HIS-8 documents the contract; revision 4 added five tickets that CHANGE the contract (what a clone records, what a remedy names, what a walk-back may delete, how a damaged home is repaired). Documenting it before those land would publish a page that is wrong within a wave, across four repositories, through `skt publish`.\n",
    "slice": "State the contract ONCE, in skt, as a references page -- skt is the session-start front door and the one unit every agent is told to read. It must answer, in the agent's order of need: - what a derived artifact is, and that `artifacts list` names them; - what a clone INHERITS (the parent's artifacts, on PATH, usable) and what it DECLARES rather than builds -- and why building unchanged artifacts is waste; - when to rebuild: after YOU change the unit, not on arrival; - the exact command, `skill-manager build <artifact-id>`, and how to read `artifacts stale`. Then skill-manager, git-issue-workflow and git-epic-workflow LINK to it. They must not restate it: a copy is covered by nothing and will drift, which is the rule this epic already applies to judged rubrics.\n",
