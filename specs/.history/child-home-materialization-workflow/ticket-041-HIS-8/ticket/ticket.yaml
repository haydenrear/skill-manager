    "objective": "MEASURED across every installed unit: `skill-manager build` appears in 0 markdown files, cold shim / ColdArtifact in 0, declared-only in 1. skt's SKILL.md -- the session-start front door an agent is told to read FIRST -- mentions artifacts once, inside a code comment, and the skill ships no references/ pages at all. Meanwhile skt/src/skt/check.py:877 prints artifact state into every session's opening context. So the tooling announces artifacts to every agent and nothing tells them what an artifact is, that `skill-manager build` exists, what a clone inherits, or when to rebuild. This is not a tidiness ticket. It is the direct cause of two wrong root-cause diagnoses in this epic's own wave 2, and the next agent will make the third.\n",
