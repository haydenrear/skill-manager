    "objective": "ARTI-22 gave the home-integrity view 4 invariants and 5 regression cfgs. None of them state the four properties this epic fixes, so all four can regress silently. Extend the view; do not restate anything the legacy monolith already says (dual_representation_rule).\n",
    "phase": "HIS",
