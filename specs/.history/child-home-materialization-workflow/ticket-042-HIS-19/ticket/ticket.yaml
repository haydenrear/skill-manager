        "local_signal": "python skills/test_graph/scripts/run.py home-integrity"
      },
      {
        "contribution": "guard",
        "expected_effect": "the pin must be re-derived by the reader HIS-10 made canonical, not become a fifth answer to which build this home runs",
        "goal": "GOAL-one-home-one-answer",
        "local_signal": "jbang RunTests.java"
      }
    ],
    "id": "HIS-19",
    "phase": "HIS",
    "promotion_order": 18,
    "promotion_predecessor": "HIS-5",
    "root_cause": "THE PIN NAMES A VERSION. `LauncherShims` writes the resolved CLI as an absolute path into the Homebrew Cellar -- /opt/homebrew/Cellar/skill-manager/<VERSION>/libexec/bin/skill-manager -- so the pin is correct exactly until the next upgrade and wrong forever after. HIS-13 now DETECTS it (`DANGLING_CLI_PIN`) and repairs it, but the product still WRITES it that way, so every upgrade re-creates the damage that HIS-13 then repairs. Detection plus repair of a defect the product re-introduces on a schedule is not a fix.\n",
    "slice": "Write a pin that survives an upgrade: a versionless path, the resolver, or a recorded intent re-derived on read -- the same shape HIS-10 chose for descent (\"the record is a pointer, not a grant\"). Migrate existing homes through HIS-13's repair rather than a second mechanism. NOT IN SCOPE: detection (HIS-13 owns it) and the release packaging itself.\n",
    "status": "delivered",
    "title": "a home's CLI pin is an absolute VERSIONED path, so every upgrade breaks the home and `home verify` says it is fine",
    "wave": 12
  },
