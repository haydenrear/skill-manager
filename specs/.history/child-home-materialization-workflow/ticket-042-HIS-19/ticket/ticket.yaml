    "found_by": "Observed LIVE on the operator's machine during this epic's own 0.24.0 release. `brew upgrade` deleted the Cellar directory the root home's pin named; the home broke; `home verify` returned EXIT 0. Filed as DEF-012, whose resolution half HIS-12 took and whose detection half HIS-13 took. DEF-027 is the part NEITHER of them took and it is the cause.\n",
