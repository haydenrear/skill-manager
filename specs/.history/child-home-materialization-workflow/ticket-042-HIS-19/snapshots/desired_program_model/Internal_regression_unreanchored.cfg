\* EXPECTED-VIOLATION config, clone view: models a plain `cp -R` with no state re-anchoring pass at all -- what
\* issue #20 measured as 54 metadata files still naming the original. The copy
\* COMPLETES and reports success; the defect is only visible as a surface whose
\* fixup never ran, which is what `done` records.
\*
\* Running this must produce a TLC counterexample violating
\* EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver. A clean run here is a failure of the
\* invariant, not a pass.
\*
\* NARROWED INVARIANT LIST: NoHandedOverHomeNamesAnotherHome is violated in the
\* same state and would mask the gate. It is the declared target of the External
\* leak configs, so it keeps its coverage.
SPECIFICATION CloneSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  \* Home-level policies. The desired configuration; this config does not vary
  \* them -- it checks the unit-level slice, whose actions leave every
  \* home-level variable at its initial value.
  HomeSelfReferenceEncoding = "ABSOLUTE_CARRIED_VERBATIM"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  CloneFailureHandling = "DISCARD_PARTIAL"

INVARIANTS
  TypeOK
  EveryOwnedSurfaceIsReanchoredBeforeAHomeIsHandedOver
