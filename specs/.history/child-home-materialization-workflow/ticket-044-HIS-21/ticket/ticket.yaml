    "root_cause": "A DIAGNOSTIC THAT CANNOT BE TRUSTED IS WORSE THAN NO DIAGNOSTIC. Each of these four is a reader answering confidently about a state it did not check, and three of them are answering about the ROOT home -- the tier this epic's own record says was damaged twice and the tier every other reader is weakest at.\n",
    "slice": "DEF-104 -- `home verify` reports the root home clean while three of its shims execute code inside the project home. `home repair` catches all five paths. Same home, same minute, two answers. Plausible mechanism, to be confirmed: verifyRoots frames its foreign-home question against a home's SOURCE, and the root home has no parent, so the branch never runs. DEF-105 -- the root home carries `policy.toml`, hand-written, headed \"guards against hostile skills\", and the product reads `home.policy.toml` and runs on defaults. `home policy` prints `live` whether the policy is absent or merely unread. This is vacuity-ledger row 8 on a real home. DEF-106 -- `home describe` prints a full descriptor for the project home, which holds no descriptor files at all, including a gateway marked (owned) that the root home also claims. `home policy` marks its defaults; `home describe` does not follow that convention. DEF-102 -- `skill-manager sync --help` runs project checks and prints a project-failure banner. Help output should be pure text. DEF-107 -- ADDED AFTER THE ROUND-1 SWEEP COMPLETED, and it is the same kind one layer down: HomeMembershipLaw flags DELIBERATE TEST STAGING as a product violation and reddens the CORE `home-sync` graph. The units it calls GAINED were written to disk on purpose by `HomeSyncSupport.mkUnit`, which is used in at least eight nodes to stage the precondition of a sync scenario. The law's own self-test passes in both directions first, so the instrument works and the RULE is wrong for this context. The deeper defect is that the law declares NO `dependsOn`, so it can run mid-scenario and call an intermediate state final. Do NOT fix it by dropping the GAINED direction -- that is the direction that caught DEF-047. NOT IN SCOPE: the promotion path itself (HIS-22), and repairing the operator's root home, which is the owner's call to make.\n",
