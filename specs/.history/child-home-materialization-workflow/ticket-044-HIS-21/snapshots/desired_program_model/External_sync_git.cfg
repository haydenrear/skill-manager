\* The three-tier view with GIT-BACKED units: the unit was installed from a git
\* source, so every home's copy carries a .git of its own. Issue #29.
\*
\* This is the desired configuration of that dimension -- GitProvenance =
\* "SPLIT_AT_GIT", what the code does since the issue was fixed: the tree is
\* split at .git and each half judged by the authority that can answer it. Every
\* invariant the git-less sync config checks is checked here too, because adding a
\* dimension must not cost any of them, plus the two the dimension is for.
\*
\* The two ways of getting it wrong are checked separately and must keep
\* producing counterexamples: External_regression_wholetreegit.cfg (the unit is
\* held back forever) and External_regression_skipgit.cfg (the commits are
\* destroyed).
\* Expected outcome: no invariant violations.

SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  \* Git-backed unit dimension (issue #29).
  GitBackedUnits = TRUE
  GitProvenance = "SPLIT_AT_GIT"
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "SOURCE_WITNESSED"
  \* TWO tiers, not three, and that is a budget decision stated rather than
  \* silently taken. The git dimension multiplies the state space by the product
  \* of every home's head and churn plus the commit witness's subsets; at three
  \* tiers the sync slice exceeds budgets.max_distinct_states. Two tiers still
  \* reach everything these two invariants are about -- a commit made in the
  \* worktree, a reconciliation into the project, and a teardown -- because
  \* neither of them needs a THIRD home the way the CHM-9 class does. The
  \* three-tier propositions keep their own configs.
  SyncTiers = {"project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  AReconciliationOnlyWritesPathsTheDestinationDidNotMove
  AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
  AConflictedUnitIsNeverPartiallyWritten
  NoHomeIsTornDownWhileItHoldsUniqueWork
  EveryDivergenceFromARecordIsAnEditMadeInThatHome
  ARecordClaimsNoBaselineTheDestinationNeverStoodOn
  GitBookkeepingIsNeverReportedAsWork
  CommittedWorkIsNeverDestroyed
