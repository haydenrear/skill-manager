# Map generated program-model action labels to production adapters.

[adapters.RenderProgressiveRootHelp]
adapter = "specs.program_model.production_adapters:CliHelpAdapter"

[adapters.RenderInstallCommandHelp]
adapter = "specs.program_model.production_adapters:CliHelpAdapter"

[adapters.RenderSyncCommandHelp]
adapter = "specs.program_model.production_adapters:CliHelpAdapter"

[adapters.RenderProjectProfilesListHelp]
adapter = "specs.program_model.production_adapters:CliHelpAdapter"

[adapters.ExposeInstallLocalUnitWorkflowDocs]
adapter = "specs.program_model.production_adapters:CliSkillDocsAdapter"

[adapters.ExposeSkillScriptsWorkflowDocs]
adapter = "specs.program_model.production_adapters:CliSkillDocsAdapter"

[adapters.ExposeProjectEnvWorkflowDocs]
adapter = "specs.program_model.production_adapters:CliSkillDocsAdapter"

[adapters.EmitSyncOneUnitAgentContext]
adapter = "specs.program_model.production_adapters:CliAgentContextAdapter"

[adapters.EmitProjectEnvAgentContext]
adapter = "specs.program_model.production_adapters:CliAgentContextAdapter"

# ISSUE-166's bounded internal semantic view observes only the automatic
# claimant-refresh policy seam.
[adapters.ReconcileClaimingProjectFromSelectedParent]
adapter = "specs.claimant_refresh_adapter:ClaimantRefreshPolicyAdapter"

# ---------------------------------------------------------------------------
# Internal.tla actions for the child-home materialization slice are NOT mapped
# yet. Ticket CHM-8 owns that; ticket CHM-4 owns the increment it lands in.
#
# Unmapped Internal actions (each needs a spec-unit adapter that drives
# dev.skillmanager.bindings.ChildHomeMaterializer directly):
#
#   StageChildUnitMaterialization   SwapInChildUnit
#   AbortChildUnitMaterialization   HoldBackModifiedChildUnit
#   AdoptIdenticalChildUnit         PruneUnclaimedChildUnit
#   PlaceUntrackedChildUnit         AgentEditChildUnit
#   UpgradeParentStoreUnit          UpgradeLinkedParentSource
#
# Plus the two regression-only actions, which exist to be model-checked as
# violations and must never be bound to a production adapter:
#
#   OverwriteModifiedChildUnit      DeleteUnclaimedModifiedChildUnit
#
# Why not wired here: every adapter above this line is a Python class that reads
# or shells out to production. A spec-unit adapter for the materializer has to
# call into Java in-process (or grow a purpose-built harness entry point), and
# case_codegen.generation_status is still `planned`, so no Internal cases exist
# to route through it. The EXTERNAL half of the same slice is covered instead by
# the Test Graph nodes recorded in testgraph_bindings.yml, including the
# atomicity property Internal states as
# InFlightMaterializationLeavesTheChildUnitIntact.
