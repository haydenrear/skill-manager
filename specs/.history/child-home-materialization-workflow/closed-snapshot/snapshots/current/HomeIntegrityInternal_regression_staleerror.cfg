\* HIS-4, clause 3. The condition clears on the tree -- `git reset`, a clean
\* merge -- and errors[{kind: MERGE_CONFLICT}] keeps being reported, because it
\* carries no resolvedAt and nothing re-derives it. `skt check` reported the
\* conflict for nine days after the git state was clean.
\*
\* Expected outcome: ARecordedErrorIsAFunctionOfTheLiveTree FAILS.
\*
\* RecordDescribesItsStoreOrSaysWhy is listed and must NOT be the invariant TLC
\* names, and the reason is the finding: a stale error SATISFIES it. The error
\* is that invariant's escape disjunct, so a record whose error has outlived its
\* cause looks healthy to the older invariant and is caught only by the newer
\* one. The regression action advances the record's revision for the same
\* reason, so the older invariant holds by its FIRST disjunct throughout and
\* cannot be the thing that fires.
SPECIFICATION StaleErrorSpec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  RecordDescribesItsStoreOrSaysWhy
  ARecordedErrorIsAFunctionOfTheLiveTree
