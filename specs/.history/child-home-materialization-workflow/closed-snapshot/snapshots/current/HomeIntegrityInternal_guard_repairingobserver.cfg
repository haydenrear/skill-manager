\* THE GUARD for AnObservationNeverRepairsWhatItObserved, per this workflow's
\* guard_config_rule. Same defect as the regression configuration beside it,
\* with the WITNESS-READING invariant removed.
\*
\* Expected outcome: "No error has been found".
\*
\* That is not good news about the instrument; it is the finding, made
\* executable. A repairing observer leaves a home that satisfies every other
\* invariant in this module -- including the detection invariant it was meant to
\* be checking -- because the repair destroys exactly the evidence that would
\* have told the verdict apart from a clean run. DEF-067 consequence 3, "it can
\* green a real defect", demonstrated rather than asserted.
\*
\* If this ever starts FAILING, some other invariant has been strengthened into
\* the witness-reading one and the record of why the witness exists is stale.
SPECIFICATION RepairingObserverSpec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  RecordDescribesItsStoreOrSaysWhy
  AckIsNotStaleOnArrival
  AckWritesFallInsideItsBaseline
  ProjectionSourceIsDecidable
  AnIdenticalTreeIsDisposableWhateverItsRecordNames
  ADivergentTreeIsNeverSilentlyReplaced
  OneGateIsSurfacedInFullAtMostOnce
  AnUnacknowledgedGateStillRefusesALaunch
  ARecordedErrorIsAFunctionOfTheLiveTree
  SanctionIsRederivedFromTheParentsOwnStore
  AHomesTwoAxesNameOneHome
  ADamagedHomeIsNeverReportedClean
