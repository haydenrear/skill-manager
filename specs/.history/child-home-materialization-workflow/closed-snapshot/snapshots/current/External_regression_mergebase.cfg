\* EXPECTED-VIOLATION config. It modelled CODE THAT WAS IN THE TREE until CHM-10
\* was fixed; it is kept, and must keep failing, because a config that stops
\* failing is a rule that has come back.
\* ChildHomeMaterializer.mergeBase preferred the DESTINATION's record,
\* and its javadoc argues the cost of choosing wrong "is a conflict a human
\* resolves, not an edit nobody sees again". That holds only when the chosen
\* base is OLDER than the true common ancestor. After a merge from a third home
\* the destination's record has advanced past anything the current source ever
\* held: measured against it the source is the only side that moved, the third
\* home's work is taken away, and no conflict is reported.
\* See ticket CHM-10.
\* Target: AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough.
\* Running this must produce a TLC counterexample.

SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  \* Git-backed unit dimension (issue #29). FALSE pins every variable it
  \* adds at its initial value, so this config explores exactly the state
  \* space it explored before the dimension existed.
  GitBackedUnits = FALSE
  GitProvenance = "SPLIT_AT_GIT"
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "DESTINATION_RECORD"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "SOURCE_WITNESSED"
  SyncTiers = {"root", "project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
