# This file is part of the desired program model.
# It is intentionally general: use it for any model-backed ticket workflow,
# not only migrations. Keep it synchronized with spec_manifest.yaml status.
version: 1
name: desired-ticket-workflow
updated: null
purpose: "Break the desired whole-program change into tickets that can be implemented, modeled in specs/current, unit-tested, and then validated with broader graph or integration checks."

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.

status:
  workflow: ticket
  active_ticket: SM-390B
  active_ticket_title: "the record route exempts published refs and never replaces an ahead checkout"
  desired_module: SkillManager
  phase: planning

# Replace or extend these sections with project-specific domains. Service,
# process, queue, database, file, API, model, permission, or UI boundaries can
# all be listed here when they matter to correctness.
service_catalog:
  existing_boundaries: []
  desired_boundaries: []
  adapter_boundaries: []
  known_gaps: []

tickets:
  - id: SM-390B
    title: "the record route exempts published refs and never replaces an ahead checkout"
    status: done
    depends_on: []
    objective: "A destination whose only history change is published refs is not local work, and no materialization record licenses replacing a checkout that is ahead of its source."
    desired_actions:
      - GitHistoryInternal.CheckoutOlder
      - GitHistoryInternal.PullTrunk
      - GitHistoryInternal.SyncApply
    implementation_scope:
      - src/main/java/dev/skillmanager/bindings/ChildHomeMaterializer.java
    current_increment:
      model_state:
        - GitHistoryInternal.rec
        - GitHistoryInternal.dstClean
      model_actions:
        - GitHistoryInternal.CheckoutOlder
      adapters: []
      unit_tests:
        - jbang RunTests.java (HomeSyncGitUnitTest)
      graph_after_unit_pass:
        - home-sync
        - ticket-lifecycle
    acceptance:
      commands:
        - specs/program_model/run_tlc.sh specs/program_model/GitHistoryInternal.tla specs/program_model/GitHistoryInternal.cfg
        - specs/program_model/run_tlc.sh specs/program_model/GitHistoryInternal.tla specs/program_model/GitHistoryInternal_regression_recorddigest.cfg
        - specs/program_model/run_tlc.sh specs/program_model/GitHistoryInternal.tla specs/program_model/GitHistoryInternal_regression_recordrewind.cfg
      assertions:
        - Healthy configuration has no error (115146 distinct states).
        - Every regression configuration violates exactly its target invariant.
        - The reach probe reports 4 violated invariants.
      evidence:
        - specs/tickets/SM-390B/results/tlc.md
