\* The healthy configuration: what the code does since #390.
\* Expected outcome: no invariant violations.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  MaxTrunk = 2
  SideCommits = {"s1", "s2"}
  RefContainment = "UNPUBLISHED_REFS"
  FastForward = "HEAD_ANCESTOR"
  RemedyPolicy = "NEVER_BACKWARDS"

INVARIANTS
  TypeOK
  UnpublishedWorkIsNeverDestroyed
  ASyncNeverMovesTheDestinationBackwards
  AnAncestorCopyWithNothingUnpublishedIsNeverBlocked
  NoRemedySyncsTowardANewerDestination
