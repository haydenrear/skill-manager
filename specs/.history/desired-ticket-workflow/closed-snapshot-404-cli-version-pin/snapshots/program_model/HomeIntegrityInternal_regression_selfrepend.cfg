\* An acknowledging operation that performs its own content writes after
\* computing the baseline it acknowledges — #124's defect 4.
\* Expected outcome: AckWritesFallInsideItsBaseline FAILS.
\*
\* Note this is a property of the COMMAND, not of the gate: the acknowledged
\* baseline still equals the digest, so AckIsNotStaleOnArrival is untouched and
\* the two regressions stay independent. Nothing here asks the drift gate to
\* clear itself, which DriftGate's class comment records a spec run against.
SPECIFICATION SelfRePendingAckSpec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  AckIsNotStaleOnArrival
  AckWritesFallInsideItsBaseline
