\* NEGATIVE-RESULT config. Must return "No error has been found" WHILE modelling
\* the regression the first fix for #29 shipped -- and that is the finding it
\* records, not a pass.
\*
\* Same policy as External_regression_headonlygit.cfg (GitProvenance =
\* "HEAD_ONLY"). TWO invariants are removed, and the second removal is itself the
\* finding, so it is spelled out rather than quietly taken:
\*
\*  - CommittedWorkIsNeverDestroyed, the only invariant that reads the
\*    sync_committed witness. That is the guard.
\*  - GitBookkeepingIsNeverReportedAsWork, which DOES fire on this arm -- and for
\*    the wrong proposition. Measured: TLC reaches it at depth 5 on a trace where
\*    both homes hold the same objects (equal AllRefs) but different tips, so a
\*    HEAD-only GitAgree calls the unit changed. That is the HEAD-only reading
\*    OVER-reporting, the mirror of the defect, and it says nothing whatever about
\*    the commit that was destroyed. Leaving it in would let this config look like
\*    a caught defect and hide the fact that nothing here can see the loss.
\*
\* With both removed TLC explores the whole space and finds nothing. That is why
\* the regression reached a commit and a review rather than a failing check:
\* nothing about the final state of a home that has lost a side branch is wrong.
\* No path diverges from its record, no write was unentitled, the record's own
\* git_head matches HEAD exactly BECAUSE HEAD never moved, and close-out reports
\* "unchanged" truthfully about every question it asks. The repository is
\* coherent; it is simply missing a commit. Only a witness recorded at the moment
\* the commit was made has anything left to compare against.
\*
\* Keep both halves of the pair. If this config ever starts producing a violation,
\* some other invariant has been strengthened into something that can see this
\* class, and the record of why the witness exists is stale.
SPECIFICATION SyncSpec

CHECK_DEADLOCK FALSE

CONSTANTS
  \* Git-backed unit dimension (issue #29).
  GitBackedUnits = TRUE
  GitProvenance = "HEAD_ONLY"
  ChildUnitA = ChildUnitA
  ChildUnitB = ChildUnitB
  LinkedSourceA = LinkedSourceA
  ProjectA = ProjectA
  ParentHomeA = ParentHomeA
  ChildHomeA = ChildHomeA
  AgentBytes = AgentBytes
  NoReason = NoReason
  \* Unit- and home-level policies. The desired configuration; this config does
  \* not vary them -- it checks the three-tier slice, whose actions leave every
  \* unit-level and home-level variable at its initial value.
  ChildMaterialization = "COPY"
  ChildRefreshPolicy = "HOLD_BACK_LOCAL_CHANGES"
  ChildLinkHandling = "DEREFERENCE"
  ChildSwapStrategy = "ATOMIC_MOVE"
  HomeSelfReferenceEncoding = "TOKENIZED"
  HomeLinkEncoding = "RELATIVE"
  CloneToolchainPolicy = "SKIP_AND_REPROVISION"
  CloneContentPolicy = "TOLERATE_AND_REPORT"
  HomeSyncPolicy = "HOLD_BACK_OR_MERGE"
  MergeAlgebra = "THREE_WAY"
  MergeBasePolicy = "SHARED_ANCESTOR"
  ReconcileProvenance = "SOURCE_AWARE"
  RecordWritePolicy = "SHARED_ONLY"
  ConflictHandling = "WHOLE_UNIT_OR_NOTHING"
  CloseOutGate = "REFUSE_WHILE_WORK_REMAINS"
  ChildRefreshProvenance = "SOURCE_AWARE"
  RecordlessDestinationPolicy = "SOURCE_WITNESSED"
  \* TWO tiers, not three, and that is a budget decision stated rather than
  \* silently taken. The git dimension multiplies the state space by the product
  \* of every home's head and churn plus the commit witness's subsets; at three
  \* tiers the sync slice exceeds budgets.max_distinct_states. Two tiers still
  \* reach everything these two invariants are about -- a commit made in the
  \* worktree, a reconciliation into the project, and a teardown -- because
  \* neither of them needs a THIRD home the way the CHM-9 class does. The
  \* three-tier propositions keep their own configs.
  SyncTiers = {"project", "worktree"}
  SyncPaths = {"p1"}

INVARIANTS
  TypeOK
  AReconciliationOnlyWritesPathsTheDestinationDidNotMove
  AReconciliationOnlyWritesAgainstABaselineBothHomesPassedThrough
  AConflictedUnitIsNeverPartiallyWritten
  NoHomeIsTornDownWhileItHoldsUniqueWork
  EveryDivergenceFromARecordIsAnEditMadeInThatHome
  ARecordClaimsNoBaselineTheDestinationNeverStoodOn
