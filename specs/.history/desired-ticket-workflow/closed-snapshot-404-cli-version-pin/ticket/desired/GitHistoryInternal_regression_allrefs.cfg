\* #390 bug 1 (and #370). historyContainedIn required the destination to hold
\* EVERY ref the source had, remote-tracking refs and published branches
\* included. An inherited, rebase-merged skill/<ticket>-<unit> branch, or a
\* remote ref fetched in one home only, made a strict-ancestor copy
\* "conflicted" forever. Origin: #210 (every ref, not HEAD).
\* Expected outcome: AnAncestorCopyWithNothingUnpublishedIsNeverBlocked FAILS.
\*
\* Flipped from the healthy configuration: RefContainment = "ALL_REFS".
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  MaxTrunk = 2
  SideCommits = {"s1", "s2"}
  RefContainment = "ALL_REFS"
  FastForward = "HEAD_ANCESTOR"
  RemedyPolicy = "NEVER_BACKWARDS"
  RecordRefs = "PUBLISHED_EXEMPT"
  DisposalGuard = "NOT_WHEN_AHEAD"

INVARIANTS
  TypeOK
  UnpublishedWorkIsNeverDestroyed
  ASyncNeverMovesTheDestinationBackwards
  AnAncestorCopyWithNothingUnpublishedIsNeverBlocked
  NoRemedySyncsTowardANewerDestination
  AFetchAloneNeverHoldsACopyBack
