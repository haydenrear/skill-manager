\* SM-390B, #390 on the record route. gitHistoryMovedOn read any change to the
\* ref-listing digest as local work, so a `git fetch` in a home's copy held
\* back every reconcile and its teardown. Origin: #29's "every ref, not HEAD",
\* which named this cost and accepted it.
\* Expected outcome: AFetchAloneNeverHoldsACopyBack FAILS.
\*
\* Flipped from the healthy configuration: RecordRefs = "ALL_REFS_DIGEST".
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
  MaxTrunk = 2
  SideCommits = {"s1", "s2"}
  RefContainment = "UNPUBLISHED_REFS"
  FastForward = "HEAD_ANCESTOR"
  RemedyPolicy = "NEVER_BACKWARDS"
  RecordRefs = "ALL_REFS_DIGEST"
  DisposalGuard = "NOT_WHEN_AHEAD"

INVARIANTS
  TypeOK
  UnpublishedWorkIsNeverDestroyed
  ASyncNeverMovesTheDestinationBackwards
  AnAncestorCopyWithNothingUnpublishedIsNeverBlocked
  NoRemedySyncsTowardANewerDestination
  AFetchAloneNeverHoldsACopyBack
