\* ARTI-22 (#124): a healthy home. Every invariant holds.
\* HIS-5 (#217) added the nine below the rule, one per behavioural fix this
\* epic made. HomeIntegrityNext now exercises all of them, so a run that is
\* green here is green over a home that actually reaches the states the new
\* invariants are about -- not over one sitting at Init.
SPECIFICATION HomeIntegritySpec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  RecordDescribesItsStoreOrSaysWhy
  AckIsNotStaleOnArrival
  AckWritesFallInsideItsBaseline
  ProjectionSourceIsDecidable
  AnIdenticalTreeIsDisposableWhateverItsRecordNames
  ADivergentTreeIsNeverSilentlyReplaced
  OneGateIsSurfacedInFullAtMostOnce
  AnUnacknowledgedGateStillRefusesALaunch
  ARecordedErrorIsAFunctionOfTheLiveTree
  SanctionIsRederivedFromTheParentsOwnStore
  AHomesTwoAxesNameOneHome
  AnObservationNeverRepairsWhatItObserved
  ADamagedHomeIsNeverReportedClean
