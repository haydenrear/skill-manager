; Scoped to specs/ on purpose. pytest picks the nearest ancestor inifile of the
; collection args, so this file becomes rootdir only for runs under specs/ --
; virtual-mcp-gateway/ and the skill pyprojects keep the rootdir they had.
;
; Why it exists: specs/program_model/tests and specs/current/tests hold five
; identically named test modules (test_program_model_contract.py,
; test_cli_help_program_model.py, test_cli_metadata_program_model.py,
; test_cli_skill_docs_program_model.py, test_cli_agent_context_program_model.py),
; because the current model is scaffolded as a copy of the accepted one. Under
; pytest's default "prepend" import mode a test module's name is its basename,
; so collecting both directories in ONE invocation aborts with five
; "import file mismatch" errors before a single assertion runs -- including the
; exact command ARTI-02 (#103) and epic #100 declare as the validation signal:
;
;   uv run --with pytest pytest specs/program_model/tests specs/current/tests -q
;
; importlib mode keys modules by path instead of basename, so both suites
; collect together. Renaming the current/ copies was the alternative and was
; rejected: those filenames are what the scaffold produces, so the collision
; would come straight back with the next scaffolded workflow.
[pytest]
addopts = --import-mode=importlib
