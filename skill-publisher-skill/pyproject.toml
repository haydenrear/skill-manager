[project]
name = "skt"
version = "0.3.0"
description = "Skill-lifecycle CLI: startup disclosure, version/sync notifications, and worktree change management for skill-manager homes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skt = "skt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
