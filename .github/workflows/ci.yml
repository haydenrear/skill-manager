name: CI

on:
  push:
    # `main` ONLY, deliberately, and this is narrower than ARTI-12 (#113) first
    # made it. The `pull_request` trigger below covers `epic/**`; `push` does
    # not, and the reasoning is a budget argument that survives scrutiny:
    #
    # Every ticket in an epic lands as a PR into the epic branch, so adding
    # `push: epic/**` runs the matrix twice per ticket — once on the PR, once on
    # the merge commit — for a dozen-plus tickets. The obvious defence is that a
    # rebase-merge produces a tree no PR run tested. True, but the gap closes
    # one ticket later: promotion into this epic is serialized, so ticket N+1's
    # PR rebases onto N's merge and its `pull_request` run tests exactly that
    # integrated tree. The only state never covered is the LAST merge, and the
    # epic PR into `main` covers that under the `main` trigger. So the second
    # run per ticket buys a signal that arrives anyway, and it is the first
    # thing to cut when the budget is the constraint.
    #
    # What that leaves uncovered, stated rather than glossed: a direct push to
    # an epic branch, bypassing a PR, runs nothing until the next PR. That is
    # accepted — this epic promotes through PRs by construction.
    branches:
      - main
    # Skip the test-graph matrix when a push only touches files that don't
    # affect tested code (release-please's bookkeeping, brew formula, docs,
    # server Dockerfile). The release.yml workflow still runs on those pushes;
    # only this CI workflow short-circuits.
    #
    # `.github/workflows/**` used to be on this list, as a blanket. ARTI-12
    # replaced it with the two workflow files that genuinely do not affect what
    # this workflow tests. The blanket made a CI-CONFIGURATION change the one
    # change CI would never execute, which is how `vars.ENABLE_TEST_GRAPH` could
    # gate the entire graph matrix off and stay that way across two releases
    # with every run green. Naming the other two keeps that property for
    # `ci.yml` without making a release-please or PR-title-lint edit pay for an
    # 8-graph matrix — which is what removing the whole line did, and is wider
    # than the argument for removing it.
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/lint-pr-title.yml"
      - "CHANGELOG.md"
      - "version.txt"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "infra/homebrew/**"
      - "infra/homebrew-skill-manager/**"
      - "Dockerfile.server"
      - "docker-compose-ghcr.yml"
      - "*.md"
  pull_request:
    # `epic/**` is here deliberately, and it is not free. An epic branch is an
    # integration branch: a dozen-plus ticket PRs merge into it over weeks and
    # only then does one PR carry the lot into main. With `branches: [main]`
    # alone, the first CI signal for all of that work arrives at the final epic
    # PR — the point where a red is most expensive to bisect and least possible
    # to attribute. This epic changes home provisioning, cloning and teardown,
    # which is precisely what the graphs under `test-graph` verify.
    #
    # Bounded on purpose: the automatic matrix is the 8-graph core set (see
    # .github/scripts/select-graph-set.py), not the 23-graph full set;
    # paths-ignore still short-circuits documentation-only changes; and the
    # `concurrency` group below supersedes queued runs on non-main refs.
    branches:
      - main
      - "epic/**"
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/lint-pr-title.yml"
      - "CHANGELOG.md"
      - "version.txt"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "infra/homebrew/**"
      - "infra/homebrew-skill-manager/**"
      - "Dockerfile.server"
      - "docker-compose-ghcr.yml"
      - "*.md"
  schedule:
    # Nightly full sweep, 07:00 UTC. This is where the graphs that are not in
    # the core set are actually run — they are deferred to a schedule, not
    # dropped, and `graph-set` names every one of them in the job summary of
    # every run so the deferral stays visible.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      graph_set:
        description: "Which test graphs to run"
        type: choice
        default: core
        options:
          - core
          - full
      run_browser_graphs:
        description: "Also run the Selenium graphs (browser-auth, password-reset)"
        type: boolean
        default: false

# A second push to the same branch supersedes the first. Without this, an epic
# branch taking several ticket merges an hour queues graph matrices behind each
# other and spends the budget this workflow is trying to respect. `main` is
# exempt: every commit that reaches it is a release candidate and gets its own
# complete record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Public pgvector image substituted for the local-registry one used in dev.
# docker-compose.yml reads ${POSTGRES_IMAGE} with a fallback to the local tag.
env:
  POSTGRES_IMAGE: pgvector/pgvector:pg16

  # No collector runs on a hosted runner. The noise is the SERVER's, not the
  # CLI's: `i.o.s.m.export.PeriodicMetricReader` in the Spring Boot process the
  # graph nodes start, retrying http://localhost:4318 on its metric interval.
  # CliObservability already installs a filter that swallows this for the CLI —
  # verified locally against a dead endpoint, where the CLI logs nothing — so
  # turning the SDK off at the job level is what reaches the server too.
  #
  # This comment used to call the exporter "NOISE AND NOT A CAUSE". For the
  # 2026-09-06 nightly's log lines that was true, but it was not true of the
  # home-clone content assertion it listed: #297 measured a live gateway
  # attached to the fixture home appending OTLP export failures to its
  # gateway.log, which HomeCloneSupport.treeDigest hashed, so "cloning does not
  # write to the source home" failed on a journal append. This setting is what
  # made that node pass on CI. OHV-5 fixes it where it lives -- the digest now
  # excludes home journals (HomeCloneSupport.homeDigest) -- so it no longer
  # depends on this variable, and a local run without it no longer flakes.
  #
  # Retry is already off by default (OTEL_JAVA_EXPORTER_OTLP_RETRY_DISABLED),
  # so this buys log clarity rather than wall-clock. Unset it locally to get
  # traces back against a real collector.
  OTEL_SDK_DISABLED: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Which graphs run, decided once, from the build file.
  #
  # The matrix used to be twelve names typed into this file while the repository
  # declared twenty-seven. Nothing reconciled them, so fifteen graphs were not
  # excluded from CI, they were merely absent — and absence leaves no record to
  # notice. This job computes the set instead, fails if a name in it no longer
  # exists, and prints every graph it is NOT running, with the reason for the
  # two that are excluded outright. Roughly 10 seconds; it gates the matrix so
  # that a stale graph name is a red selector rather than a quietly smaller run.
  #
  # SUSPENDED ON push AND pull_request, 2026-08-16, at the owner's instruction:
  # "go ahead and disable the graphs and just run them locally for now." This
  # `if` is the whole of that change — the matrix is unreachable on push and PR
  # because everything downstream `needs: graph-set`, and it is untouched on
  # `schedule` (07:00 UTC) and `workflow_dispatch`, which is where the graphs
  # keep running unattended. "For now" is why the triggers were not deleted.
  #
  # THE COST, stated rather than glossed: GOAL-validation-floor metric (a) is
  # "test_graph graphs executed per CI run", target >= 8, and it is met at 8
  # today. With this merged it is 8 nightly and 0 on push and PR — so a ticket
  # PR into the epic branch no longer carries a graph signal, and the first
  # automatic run over a merged ticket is the next 07:00 UTC sweep. The terminal
  # evaluation ticket has to decide whether the goal is met on the nightly
  # figure or missed on the per-run one; that is the owner's call, not this
  # change's, and it is recorded here so the decision is made in daylight.
  #
  # AND THE SECOND HALF OF THAT COST, which this comment omitted while the PR
  # body and CLAUDE.md both stated it: `graph-count` also `needs: graph-set`,
  # so a push/PR run emits NO `graphs-executed` artifact at all rather than one
  # reading zero. Anyone measuring metric (a) the documented way —
  # `gh run download <id> -n graphs-executed` — gets a missing artifact, not a
  # zero. That is the difference between "this run executed no graphs" and
  # "this run cannot tell you", and ARTI-16 (#117) exists precisely so the
  # count is READ rather than inferred. Recorded here so this file agrees with
  # the two documents that describe it.
  # ---------------------------------------------------------------------------
  graph-set:
    name: select graph set
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.pick.outputs.scope }}
      graphs: ${{ steps.pick.outputs.graphs }}
      count: ${{ steps.pick.outputs.count }}
      deferred: ${{ steps.pick.outputs.deferred }}
      registered: ${{ steps.pick.outputs.registered }}
      gateway_graphs: ${{ steps.pick.outputs.gateway_graphs }}
      browser: ${{ steps.browser.outputs.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Select graphs
        id: pick
        env:
          # push / pull_request run the bounded core set. schedule runs
          # everything. workflow_dispatch does what it was asked.
          GRAPH_SCOPE: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.graph_set || 'core' }}
        run: python3 .github/scripts/select-graph-set.py

      - name: Decide browser graphs
        id: browser
        run: |
          # Selenium graphs never run on a push or a PR. Reviewed again on
          # 2026-08-15 when the private-dependency wall came down, and the
          # answer did not change — because the dependency was never the reason:
          #
          #   * `refresh-flow` is excluded outright (#53): a 3s token TTL with
          #     CLOCK_SKEW_SECONDS=0 verified by a live /auth/me after a
          #     driver.quit() measured at 7.6-8.6s. ~1 in 4, by construction.
          #   * `browser-auth` and `password-reset` boot chromedriver and a real
          #     browser — the most expensive cells in the suite, and the budget
          #     argument for the core set is unaffected by what is public.
          #   * Neither has been OBSERVED to execute in this epic. Putting a set
          #     of graphs on every PR without one observed run is the same
          #     unvalidated-config move that left `ENABLE_TEST_GRAPH` set to
          #     nothing for two releases.
          #
          # First real evidence arrives from the nightly full sweep once this
          # reaches main. If browser-auth is green on two consecutive nightlies,
          # promoting it into CORE is a one-line change in select-graph-set.py.
          # Schedule and explicit dispatch only until then.
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event.inputs.run_browser_graphs }}" = "true" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: skill-manager unit tests (RunTests.java + spec models)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Every hand-authored YAML in the tree, parsed, plus the shape checks on
      # the spec manifests among them (ARTI-25, #127). FIRST in this job: it
      # costs about a second, needs nothing but uv, and each of the three
      # defects it exists for was found by whoever next needed the file to be
      # true rather than by CI — `specs/desired_program_model/spec_manifest.yaml`
      # was unreadable by any YAML parser on this branch while describing an
      # in-flight 17-ticket workflow, and `specs/program_model/spec_manifest.yaml`
      # named three TLA+ modules that do not exist for two whole releases (#103).
      #
      # On `unit-tests` and NOT on the schedule, deliberately: a manifest is
      # broken by a commit, and a nightly check reports it to whoever pushes
      # next instead of to whoever broke it.
      # PROVISIONING, NOT EXCLUSION (#40). OUN-6 stopped vendoring
      # skills/test_graph/, and ScaffoldedTreeIsNotContentTest reads the
      # SCAFFOLDER'S OWN SOURCE rather than restating its paths — deliberately:
      # "typing them here would make the fixture agree with itself". That
      # source is an installed unit now, and this job installs nothing, so
      # without this the fixture found nothing and the WHOLE suite died: the
      # throw escaped run() and main(), System.exit was never reached, and the
      # JVM went down on an uncaught throwable with 300 other cases unreported.
      #
      # Public repository, pinned by SHA, anonymous clone — the same shape as
      # the git-issue-workflow and test-graph steps in the graph jobs.
      - name: Provision the test-graph scaffolder (ScaffoldedTreeIsNotContentTest)
        env:
          TG_REPO: https://github.com/haydenrear/test-graph
          TG_SHA: b0e35fdfdbccffd6ac311e5b564aaba4925ec221
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/test-graph"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$TG_REPO" "$TG_SHA"
          git -C "$dest" checkout -q FETCH_HEAD
          test -f "$dest/scripts/_common.py" || {
            echo "::error::test-graph@$TG_SHA has no scripts/_common.py"; exit 1; }
          echo "TEST_GRAPH_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "test-graph@$(git -C "$dest" rev-parse HEAD) -> $dest/scripts"

      - name: Check hand-authored YAML and spec manifests
        run: uv run .github/scripts/check_yaml.py

      # HOISTED ABOVE THE SPEC SUITES by HIS-5 (#217), which is the only reason
      # this sits before JBang rather than beside it: the spec suites now shell
      # TLC, and TLC is a jar. Setting up the JDK is cached and costs seconds;
      # installing JBang and resolving Maven is the expensive part and still
      # runs after, so the ordering intent below is preserved.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # TLA+ tools, so the spec suites can actually MODEL-CHECK rather than skip.
      #
      # WHY THIS STEP EXISTS. HIS-5 (#217) made
      # specs/*/tests/test_tlc_expected_violations.py execute the manifest's
      # expected-violation table — every regression configuration must keep
      # FAILING, and must fail ON THE INVARIANT THE MANIFEST NAMES. Without a
      # tlc2 on the runner those 18 cases SKIPPED and CI enforced the manifest
      # bookkeeping while enforcing none of the invariants. Measured on this
      # runner before the change: 34 passed, 18 skipped. After: 52 passed, 0
      # skipped. GOAL-home-invariants says "so the defect cannot come back
      # unnoticed", and skipped-in-CI does not meet that.
      #
      # run_tlc.sh already had the fallback (`java -cp "$TLA2TOOLS_JAR"`), so
      # this is a jar download and not a skill install.
      #
      # PINNED BY DIGEST, and the digest is not decoration: this is the byte-
      # identical jar spec-double-compiler installs locally, verified equal, so
      # a green run here and a green run on a developer's machine are the same
      # model checker rather than two that happen to agree.
      - name: Fetch TLA+ tools
        env:
          TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/tla2tools.jar" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      # The accepted-baseline (specs/program_model) and working-model
      # (specs/current) contract suites. Neither was in any workflow before
      # ARTI-02 (#103), which is how
      # test_program_model_accepts_bounded_cli_disclosure_case_surface stayed
      # red on main across two releases: the check existed, nothing ran it.
      #
      # Runs before the JBang suite deliberately — a broken spec model is
      # reported before the runner spends minutes resolving Maven artifacts.
      # (This comment used to say "both suites finish in well under a second".
      # HIS-5 made that false: the TLC half adds ~18s. The ordering argument is
      # unchanged — 18 seconds is still far less than Maven resolution — but the
      # number was wrong to leave standing.)
      #
      # SPEC_REQUIRE_TLC=1 turns "tlc2 is missing" from a SKIP into a FAILURE.
      # Without it a runner that lost the jar would report an unbroken row of
      # dots, which is the exact defect the suite it is guarding exists to
      # prevent — a suite that fails to collect also reports no failures.
      #
      # specs/pytest.ini supplies --import-mode=importlib; the two directories
      # carry five identically named test modules and cannot be collected
      # together without it.
      #
      # specs/current/tests exists only while a spec workflow is scaffolded.
      # It was hardcoded here, so closing a workflow -- which REMOVES
      # specs/current -- turned every CI run on every branch red with
      # "file or directory not found", before a single assertion ran. That is
      # what happened on main at e07e577. The accepted baseline's suite always
      # runs; the workflow's runs when there is a workflow.
      - name: Run spec-model suites
        env:
          SPEC_REQUIRE_TLC: "1"
        run: |
          suites=(specs/program_model/tests)
          if [ -d specs/current/tests ]; then
            suites+=(specs/current/tests)
          else
            echo "note: no spec workflow is scaffolded (specs/current absent);"
            echo "      running the accepted baseline suite only."
          fi
          uv run --with pytest pytest "${suites[@]}" -q

      - name: Install JBang
        uses: jbangdev/setup-jbang@main

      # Cache JBang separately from the test-graph job — the unit suite
      # only needs the much smaller dep set declared in RunTests.java
      # (no Spring Boot), so a separate cache key keeps eviction
      # pressure off the heavier graph cache. Restore-keys still falls
      # back to any prior unit-tests cache.
      - name: Cache JBang (unit tests)
        uses: actions/cache@v4
        with:
          path: ~/.jbang
          key: jbang-unit-${{ runner.os }}-${{ hashFiles('RunTests.java') }}
          restore-keys: jbang-unit-${{ runner.os }}-

      - name: Run unit tests
        run: jbang RunTests.java

  gateway-tests:
    # UNGATED. This job spent months behind `vars.ENABLE_PRIVATE_TRACING_CI`
    # because `tracing-skill-observability` was resolved from a private
    # repository that a hosted runner could not clone. **That repository is
    # public as of 2026-08-15**, verified by an anonymous shallow clone and a
    # 200 from the API, and by run 31908719744 in which graphs installed units
    # and two went green — which they cannot do without the gateway venv, since
    # `install` runs `EnsureGateway`.
    #
    # The gate and its variable are removed rather than flipped. A repository
    # variable that suppresses a whole test job and no longer describes anything
    # true is `ENABLE_TEST_GRAPH` again — the exact defect this ticket exists to
    # undo — and a dead switch is worse than no switch, because the next reader
    # has to disprove it. `ENABLE_PRIVATE_TRACING_CI` should now be deleted from
    # the repository's variables; nothing in this file reads it.
    #
    # The `PRIVATE_DEPS_TOKEN` plumbing added earlier in ARTI-12 goes with it,
    # from all three jobs. Its entire justification was this one private
    # dependency. Keeping credential-handling code that no dependency needs is
    # dead weight on the same argument, and `uv sync` now resolves anonymously.
    name: virtual-mcp-gateway pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: virtual-mcp-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (with dev extras)
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run --all-extras pytest -v

  # ---------------------------------------------------------------------------
  # The graph matrix. Re-enabled by ARTI-12 (#113).
  #
  # It was switched off behind `vars.ENABLE_TEST_GRAPH` because "the graph
  # matrix consumes too many hosted-runner resources". That was true. What made
  # it costly was not the mechanism but the size of the list: twelve graphs on
  # every push, several of which reach third-party services. So the gate is
  # gone and the list is bounded instead — the 8-graph core set on push and PR,
  # the 23-graph full set nightly and on demand.
  #
  # BUDGET, measured rather than assumed. Hosted minutes scale with the number
  # of graphs, so `max-parallel` buys wall clock, not budget. Per-graph wall
  # clock for the core set, run individually on an M-series laptop at 5f3eeb0:
  #
  #   smoke 259s | home-sync 312s | ticket-lifecycle 221s | plugin-smoke 98s
  #   home-clone 96s | checkout-home 65s | onboard 62s | project-child-home 60s
  #                                                   = 1173s ≈ 19.5 min serial
  #
  # A 2-core hosted runner is materially slower and adds toolchain setup per
  # cell, so `timeout-minutes: 45` is the per-job ceiling — roughly 8x the
  # slowest observed graph, which is headroom rather than a threshold anything
  # is expected to approach. `max-parallel: 4` puts the eight cells in two
  # waves. Four cold JBang/Maven resolutions at once is the trade for that:
  # caches only save at job end, so parallel cells all miss on a cold key. The
  # previous value of 2 existed for exactly that reason and is the fallback if
  # Maven Central starts rate-limiting the runner.
  # ---------------------------------------------------------------------------
  test-graph:
    needs: graph-set
    name: "test-graph: ${{ matrix.graph }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        graph: ${{ fromJSON(needs.graph-set.outputs.graphs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JBang
        uses: jbangdev/setup-jbang@main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            test_graph/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('test_graph/**/*.gradle*', 'test_graph/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache JBang
        uses: actions/cache@v4
        with:
          path: ~/.jbang
          key: jbang-${{ runner.os }}-${{ hashFiles('**/*.java') }}
          restore-keys: jbang-${{ runner.os }}-

      # Diagnostic: surface JBang/Maven cache state + Maven Central
      # reachability before any jbang invocation runs. Helps tell apart:
      #   1. cache poisoning (.lastUpdated markers on missing JARs say
      #      "tried recently, do not retry"),
      #   2. network / DNS / proxy failures from the runner,
      #   3. genuine 404s on a published artifact.
      # Runs unconditionally — cheap, and "absent in central" failures
      # land in the next step, so we want this evidence captured first.
      - name: Inspect JBang cache + Maven Central reachability
        run: |
          set +e
          echo "--- jbang version ---"
          jbang version 2>&1 || echo "(jbang not on PATH)"

          echo
          echo "--- ~/.jbang layout ---"
          if [ -d "$HOME/.jbang" ]; then
            du -sh "$HOME/.jbang" 2>/dev/null
            find "$HOME/.jbang" -maxdepth 3 -type d 2>/dev/null | head -30
          else
            echo "(no ~/.jbang — fresh cache)"
          fi

          echo
          echo "--- ~/.m2/repository size + dep counts ---"
          if [ -d "$HOME/.m2/repository" ]; then
            du -sh "$HOME/.m2/repository" 2>/dev/null
            jar_count=$(find "$HOME/.m2/repository" -name '*.jar' 2>/dev/null | wc -l)
            pom_count=$(find "$HOME/.m2/repository" -name '*.pom' 2>/dev/null | wc -l)
            echo "jars=$jar_count poms=$pom_count"
          else
            echo "(no ~/.m2/repository)"
          fi

          echo
          echo "--- failed-resolution markers (Maven .lastUpdated) ---"
          # `.lastUpdated` next to a missing artifact is the proximate
          # signal of poisoning. Print up to 30; redact home path.
          marker_count=$(find "$HOME/.m2" "$HOME/.jbang" -name '*.lastUpdated' 2>/dev/null | wc -l)
          echo "marker_count=$marker_count"
          if [ "$marker_count" -gt 0 ]; then
            find "$HOME/.m2" "$HOME/.jbang" -name '*.lastUpdated' 2>/dev/null \
              | head -30 \
              | sed "s|$HOME|~|g"
            echo
            echo "--- sample marker contents (first 3) ---"
            find "$HOME/.m2" "$HOME/.jbang" -name '*.lastUpdated' 2>/dev/null \
              | head -3 \
              | while read f; do
                  echo "::group::$(echo "$f" | sed "s|$HOME|~|g")"
                  cat "$f" 2>/dev/null
                  echo "::endgroup::"
                done
          fi

          echo
          echo "--- direct reachability of Maven Central ---"
          # Probe a Spring Boot artifact that the registry server depends
          # on. A non-200 here is the smoking gun for "Maven Central is
          # genuinely refusing this runner" rather than cache state.
          curl -sS -o /dev/null -w "spring-boot-starter-web 3.3.4 jar HEAD: %{http_code} (%{time_total}s)\n" \
              -I https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-web/3.3.4/spring-boot-starter-web-3.3.4.jar
          curl -sS -o /dev/null -w "spring-boot-starter-web 3.3.4 pom HEAD: %{http_code} (%{time_total}s)\n" \
              -I https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-web/3.3.4/spring-boot-starter-web-3.3.4.pom
          curl -sS -o /dev/null -w "central root GET:                 %{http_code} (%{time_total}s)\n" \
              https://repo1.maven.org/maven2/

          echo
          echo "--- DNS for repo1.maven.org ---"
          getent hosts repo1.maven.org 2>&1 || echo "(getent failed)"

      - name: Pre-pull postgres image
        run: docker pull "$POSTGRES_IMAGE"

      # GatewayRuntime.pythonExecutable() auto-picks virtual-mcp-gateway/.venv/bin/python
      # when it exists; `uv sync` materializes the venv with fastapi/uvicorn/mcp/etc.
      # Without this step `skill-manager gateway up` spawns bare python3 and the
      # gateway subprocess dies with ModuleNotFoundError before binding its port.
      #
      # IT IS NEEDED BY EVERY GRAPH, not only the ones with a gateway node.
      # The obvious refinement — skip this step for the five core graphs that
      # declare none — was tried, and it is wrong: `InstallCommand` runs
      # `EnsureGateway`, which shells out to its own `uv sync`. Measured on run
      # 31900307288, `checkout-home` (no gateway node among its seven) failed in
      # `EnsureGateway`. So the step is unconditional; pre-warming it here means
      # the cost is paid once per job with a visible name, rather than inside a
      # node that has a timeout on it. The selector still reports which graphs
      # declare gateway nodes, as information rather than as a condition.
      #
      # THE DEPENDENCY WALL IS DOWN. This step could not succeed on a hosted
      # runner at all until 2026-08-15: `virtual-mcp-gateway` depends on
      # `tracing-skill-observability @ git+https://github.com/haydenrear/tracing_skill`,
      # which was PRIVATE, so `uv sync` died with "could not read Username for
      # 'https://github.com'" and all eight core graphs failed here before
      # executing a node (run 31899858877). The owner made that repository
      # public; run 31908719744 installed units and took two graphs green, which
      # is only possible once this succeeds. The `PRIVATE_DEPS_TOKEN` plumbing
      # ARTI-12 added for the workaround has been removed with the wall.
      #
      # `continue-on-error` STAYS, and not out of habit. If this step ever
      # breaks again, the graph must still run and go red at a node with a real
      # message, rather than vanishing from the tally as a skipped step — a
      # graph that did not run is worse than a graph that ran and failed, which
      # is the whole subject of #113. The `::error::` annotation below keeps the
      # failure visible in the run's summary rather than silent.
      - name: Install gateway Python deps
        continue-on-error: true
        run: |
          if ! uv sync --all-extras; then
            echo "::error title=gateway venv unavailable::virtual-mcp-gateway's venv could not be built, so every node that runs skill-manager install will fail inside EnsureGateway. This resolved anonymously as of 2026-08-15, so a failure here is a real regression, not the old private-dependency wall. The graph still runs and reports rather than being skipped."
          fi
        working-directory: virtual-mcp-gateway

      # plugin-smoke needs the Claude + Codex harness CLIs on PATH so
      # the RefreshHarnessPlugins effect can drive `claude plugin
      # install` / `codex plugin marketplace add` end-to-end. The CLIs are
      # installed via npm to keep the matrix host-agnostic; if either install
      # fails, plugin-smoke's HelloPluginRegisteredWithHarness node falls
      # back to its "missing-CLI recorded as error" assertion path,
      # which still exercises the contract.
      #
      # onboarding needs them too (#345), measured on run 34791698649 -- the
      # first run in which onboarding got far enough to reach
      # onboarding.claude.mcp.config.readable. Its bootstrap logged "CLI claude
      # not on PATH", so `claude plugin marketplace add` never ran and
      # <proj>/.claude/settings.json never gained extraKnownMarketplaces, which
      # the_claude_marketplace_entry_is_in_the_file_claude_reads asserts. On a
      # laptop that passes because claude is installed; this is the same
      # "the runner is not a developer's machine" gap, provisioned the same way.
      - name: Install Claude + Codex CLIs (plugin-smoke, onboarding)
        if: matrix.graph == 'plugin-smoke' || matrix.graph == 'onboarding'
        run: |
          set -e
          npm install -g @anthropic-ai/claude-code || echo "::warning::claude install failed — ${{ matrix.graph }} will hit the missing-CLI branch"
          npm install -g @openai/codex || echo "::warning::codex install failed — ${{ matrix.graph }} will hit the missing-CLI branch"
          echo "claude → $(command -v claude || echo 'not on PATH')"
          echo "codex  → $(command -v codex || echo 'not on PATH')"

      # PROVISIONING, NOT EXCLUSION (#345). ticket-lifecycle and onboarding
      # drive the worktree scripts (new-change.sh, close-change.sh,
      # bootstrap-home.sh) that ship in the git-issue-workflow skill, a
      # different repository. TicketLifecycleSupport.scripts looks for
      # $TICKET_LIFECYCLE_SCRIPTS first, then an integration.toml above the
      # checkout, then the skill installed in ~/.skill-manager. A runner has
      # none of the three, so both graphs failed at their first node on every
      # nightly -- and on a laptop they passed ONLY through the operator's own
      # root home. The lookup's first, most explicit branch is set here.
      #
      # PINNED BY SHA, so a green run names the scripts it measured and a push
      # to that repository cannot turn this matrix red or green overnight. Bump
      # it deliberately. Public repository: anonymous clone, no token.
      - name: Provision git-issue-workflow scripts (ticket-lifecycle, onboarding)
        if: matrix.graph == 'ticket-lifecycle' || matrix.graph == 'onboarding'
        env:
          GIW_REPO: https://github.com/haydenrear/git-issue-workflow-skill
          GIW_SHA: fae9e9ef8145a612e8ed734e6029ca912e566875
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/git-issue-workflow"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$GIW_REPO" "$GIW_SHA"
          git -C "$dest" checkout -q FETCH_HEAD
          for s in new-change.sh close-change.sh bootstrap-home.sh; do
            test -f "$dest/scripts/$s" || { echo "::error::git-issue-workflow@$GIW_SHA has no scripts/$s"; exit 1; }
          done
          echo "TICKET_LIFECYCLE_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "git-issue-workflow@$(git -C "$dest" rev-parse HEAD) -> $dest/scripts"

      # PROVISIONING, NOT EXCLUSION (#345). home.tripwire.armed snapshots the
      # real homes under $HOME and FAILS when none exist -- correctly: an empty
      # baseline re-read as empty is clean and meaningless. A fresh runner has
      # no agent home, so the guard fired on every nightly. The seed gives it a
      # real-shaped one (a store with a skill + installed record, and each
      # agent's skills/ projection) for any leaking write to land in. The
      # script refuses to run where a home already exists.
      #
      # ticket-lifecycle and onboarding need it too, measured on run
      # 34790343243: once the scripts above were found, both fixture nodes arm
      # the same leak oracle over the real homes
      # (the_leak_oracle_is_armed_over_the_operators_real_homes), and it fails
      # on an empty $HOME for the same correct reason.
      - name: Seed an agent home under $HOME (home-tripwire, ticket-lifecycle, onboarding)
        if: matrix.graph == 'home-tripwire' || matrix.graph == 'ticket-lifecycle' || matrix.graph == 'onboarding'
        run: bash .github/scripts/seed-agent-home.sh

      # PROVISIONING, NOT EXCLUSION (#40). SI-18 stopped vendoring
      # skills/test_graph/ and test_graph/{sdk,build-logic,standard-nodes}:
      # those copies had drifted 381 lines and three whole files ahead of the
      # skill they copy, and nothing could see it. The runner and the SDK now
      # come from the installed test-graph skill, so the graphs exercise the
      # same copy the evals do.
      #
      # On a laptop that is `project resolve` into .skill-manager. A runner has
      # no home, and .skill-manager is gitignored, so the three vendored paths
      # arrive as DANGLING SYMLINKS and every graph would fail on its first
      # jbang //SOURCES. This step is what makes the checkout buildable.
      #
      # NO TOKEN, DELIBERATELY. The tla-spec-dev PLUGIN is private, but
      # test-graph is a constituent of it and its own repository is PUBLIC —
      # and the runner needs only that skill, never the whole bundle. Cloning
      # the constituent keeps this matrix credential-free.
      #
      # PINNED BY SHA, like the git-issue-workflow step above, so a green run
      # names the SDK it measured and a push to that repository cannot turn the
      # matrix red or green overnight. Bump it deliberately.
      - name: Provision the test-graph skill (runner + SDK)
        env:
          TG_REPO: https://github.com/haydenrear/test-graph
          TG_SHA: b0e35fdfdbccffd6ac311e5b564aaba4925ec221
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/test-graph"
          git init -q "$dest"
          if ! git -C "$dest" fetch -q --depth 1 "$TG_REPO" "$TG_SHA"; then
            echo "::error::test-graph@$TG_SHA is not fetchable — bump TG_SHA"; exit 1
          fi
          git -C "$dest" checkout -q FETCH_HEAD
          # F4: every path this step goes on to symlink, not a subset —
          # `ln -s` happily creates a dangling link for a missing target, and
          # the failure would surface much later inside Gradle or jbang.
          for f in scripts/run.py scripts/discover.py \
                   project_sdk_sources/sdk project_sdk_sources/build-logic \
                   project_sdk_sources/standard-nodes; do
            test -e "$dest/$f" || { echo "::error::test-graph@$TG_SHA has no $f"; exit 1; }
          done
          # Replace the vendored symlinks (dangling here) with links into the
          # pinned checkout. Same shape `project resolve --repair-vendored`
          # produces on a laptop, same source skill, different rung.
          for leaf in sdk build-logic standard-nodes; do
            rm -f "test_graph/$leaf"
            ln -s "$dest/project_sdk_sources/$leaf" "test_graph/$leaf"
          done
          echo "TG_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "test-graph@$(git -C "$dest" rev-parse HEAD) -> $dest"

      # PROVISIONING, NOT EXCLUSION (#40). OUN-6 removed skill-manager-skill/
      # too, and three nodes read that skill's own files — env.script.reports
      # in `smoke` (a CORE graph), and two docs nodes in `doc-smoke`. A runner
      # has no home: .skill-manager is gitignored, EnvPrepared's scratch home
      # is empty, and ~/.skill-manager is seeded only for three other graphs.
      # Without this those nodes fail on every runner while passing on any
      # laptop whose operator has the unit installed, which is the asymmetry
      # worth avoiding rather than the failure.
      #
      # The skill's own repository is PUBLIC, so this needs no token either —
      # the plugin that now carries it is private, but the runner needs only
      # the skill.
      - name: Provision the skill-manager skill (smoke, doc-smoke)
        env:
          SMS_REPO: https://github.com/haydenrear/skill-manager-skill
          SMS_SHA: 043a0d333586d0f825ec6ffc9e0cc75aad6a3f57
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/skill-manager-skill"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$SMS_REPO" "$SMS_SHA"
          git -C "$dest" checkout -q FETCH_HEAD
          for f in scripts/env.sh SKILL.md skill-manager.toml references/projects.md; do
            test -e "$dest/$f" || {
              echo "::error::skill-manager-skill@$SMS_SHA has no $f"; exit 1; }
          done
          echo "SKILL_MANAGER_SKILL_DIR=$dest" >> "$GITHUB_ENV"
          echo "skill-manager-skill@$(git -C "$dest" rev-parse HEAD) -> $dest"

      # THE PRIVATE COORD. SI-18 made `skill-manager onboard` install the
      # tla-spec-dev PLUGIN, and that repository is private while the epic
      # finishes. A runner's GITHUB_TOKEN is scoped to THIS repository, so the
      # clone fails with GitCloneAuthException — `onboard exited 9`, measured on
      # run 35712895588, eight of nine core graphs green and this the only red.
      #
      # FAIL HERE, NOT THERE. Exit 9 arrives deep inside a graph, after postgres
      # and the registry are up, and reads as a graph defect. This step names
      # the missing secret before anything starts.
      #
      # The token needs READ access to haydenrear/tla-spec-dev-plugin and
      # nothing else. It is deliberately NOT the homebrew-tap PAT: that one
      # exists to push to a different repository, and widening its blast radius
      # to cover an unrelated private read is how a credential quietly becomes
      # the credential for everything.
      #
      # Delete this step once the plugin is public — `git config insteadOf` is
      # a rewrite rule that outlives its reason very quietly.
      - name: Configure git access to the private plugin coord
        env:
          PLUGIN_TOKEN: ${{ secrets.TLA_SPEC_DEV_PLUGIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_TOKEN:-}" ]; then
            echo "::error title=TLA_SPEC_DEV_PLUGIN_TOKEN is not set::skill-manager onboard installs github:haydenrear/tla-spec-dev-plugin, which is private. A runner's GITHUB_TOKEN cannot read another repository, so the clone fails with exit 9 (GitCloneAuthException) partway through the onboard graph. Add a repo secret TLA_SPEC_DEV_PLUGIN_TOKEN with READ access to that repository, or make it public and delete this step."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${PLUGIN_TOKEN}@github.com/haydenrear/tla-spec-dev-plugin".insteadOf \
            "https://github.com/haydenrear/tla-spec-dev-plugin"
          echo "git access configured for haydenrear/tla-spec-dev-plugin (read)"

      - name: Plan graph
        run: |
          mkdir -p ci-logs
          set -o pipefail
          python "$TG_SCRIPTS/discover.py" "${{ matrix.graph }}" --test-graph-root test_graph \
            2>&1 | tee ci-logs/plan.log

      # CiLoggedIn (and several other nodes) use ProcessBuilder.inheritIO(),
      # so their subprocess stderr only reaches Gradle's stdout. Tee the full
      # stream so the real error is recoverable from the uploaded artifact
      # even after the live log scrolls / the run ages out.
      - name: Run graph
        id: run_graph
        run: |
          mkdir -p ci-logs
          set -o pipefail
          python "$TG_SCRIPTS/run.py" "${{ matrix.graph }}" --test-graph-root test_graph \
            2>&1 | tee ci-logs/run.log

      # `if: always()` is the whole point: a graph that ran and failed must be
      # counted as executed. The tally GOAL-validation-floor reads measures
      # whether the floor runs, which is not the same question as whether it is
      # green, and a counter that only survives success answers neither.
      - name: Record graph outcome
        if: always()
        run: |
          python3 .github/scripts/graph-record.py \
            --graph "${{ matrix.graph }}" \
            --outcome "${{ steps.run_graph.outcome }}" \
            --log ci-logs/run.log \
            --out "graph-records/${{ matrix.graph }}.json"

      - name: Upload graph record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-record-${{ matrix.graph }}
          path: graph-records/
          if-no-files-found: warn
          retention-days: 30

      - name: Collect diagnostics
        if: always()
        run: bash .github/scripts/collect-test-graph-diagnostics.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.graph }}
          path: ci-diagnostics/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The count, as a build artifact.
  #
  # GOAL-validation-floor metric (a) is "graphs executed per CI run". Before
  # this ticket the only way to answer it was to read this file and believe it,
  # and this file said twelve while the runner executed zero. ARTI-16 (#117)
  # reads the artifact instead:
  #
  #   gh run download <run-id> -R haydenrear/skill-manager -n graphs-executed
  #   jq .graphs_executed graphs-executed.json
  #
  # `if: always()` so the count survives a red matrix — see graph-record.py.
  # ---------------------------------------------------------------------------
  graph-count:
    name: graphs executed
    needs: [graph-set, test-graph]
    if: ${{ !cancelled() && needs.graph-set.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download graph records
        uses: actions/download-artifact@v4
        with:
          pattern: graph-record-*
          path: graph-records
          merge-multiple: false

      - name: Aggregate
        id: report
        run: |
          python3 .github/scripts/graph-execution-report.py \
            --records graph-records \
            --scope '${{ needs.graph-set.outputs.scope }}' \
            --registered '${{ needs.graph-set.outputs.registered }}' \
            --selected '${{ needs.graph-set.outputs.count }}' \
            --deferred '${{ needs.graph-set.outputs.deferred }}' \
            --out graphs-executed.json

      - name: Upload graphs-executed
        uses: actions/upload-artifact@v4
        with:
          name: graphs-executed
          path: graphs-executed.json
          if-no-files-found: error
          retention-days: 90

      # The count is a measurement, not a pass/fail judgement of the code — but
      # a run that executed FEWER graphs than it selected has lost cells, and
      # losing cells quietly is the exact failure this ticket exists to end.
      #
      # The first version of this gate only checked `graphs_unaccounted`, and
      # run 31899858877 walked straight through it: all eight cells produced a
      # record, every record said `outcome: skipped` because a setup step had
      # failed, and the job reported success on `graphs_executed: 0`. A gate
      # that green-lights zero executions is the switched-off matrix wearing a
      # different hat. The gate is on `executed < selected`.
      #
      # Redness is NOT gated here — the matrix reports its own reds, and
      # conflating "ran" with "passed" is what makes a suite worth switching
      # off.
      - name: Fail if fewer graphs executed than were selected
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("graphs-executed.json"))
          executed, selected = r["graphs_executed"], r["graphs_selected"]
          if executed < selected:
              names = ", ".join(
                  g["graph"] for g in r["graphs"] if not g.get("executed")
              ) or "(no records)"
              print(
                  f"::error title=validation floor not reached::{executed} of "
                  f"{selected} selected graphs executed. Did not run: {names}."
              )
              sys.exit(1)
          print(f"{executed} of {selected} selected graphs executed.")
          PY

  test-graph-browser:
    # Selenium + chromedriver. Kept off push and pull_request on purpose, and
    # the reason is named rather than implied:
    #
    #   * `refresh-flow` is EXCLUDED outright — see
    #     skill-manager-integration-repository#53. Its access token has a 3s TTL
    #     with CLOCK_SKEW_SECONDS=0 and the helper verifies the login with a
    #     live /auth/me inside that window, after a driver.quit() that stalls
    #     7.6-8.6s against a ~2.0s norm. It flakes ~1 in 4, identically on
    #     pre-epic code, so it is neither an epic regression nor fixable from a
    #     CI ticket. `.github/scripts/select-graph-set.py` carries the same
    #     reason in EXCLUDED and prints it into every run's job summary, so the
    #     quarantine is visible from any run rather than only from this file.
    #   * `browser-auth` and `password-reset` are not flaky, but they boot a
    #     real browser and are the most expensive cells in the suite. Schedule
    #     and explicit dispatch.
    needs: graph-set
    if: ${{ needs.graph-set.outputs.browser == 'true' }}
    name: "test-graph (selenium): ${{ matrix.graph }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graph: [browser-auth, password-reset]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JBang
        uses: jbangdev/setup-jbang@main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            test_graph/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('test_graph/**/*.gradle*', 'test_graph/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # - name: Cache JBang
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.jbang
      #     key: jbang-${{ runner.os }}-${{ hashFiles('**/*.java') }}
      #     restore-keys: jbang-${{ runner.os }}-

      - name: Pre-pull postgres image
        run: docker pull "$POSTGRES_IMAGE"

      # `continue-on-error` for the same reason as the test-graph job above: a
      # browser graph that ran and went red is information, a skipped one is
      # not. The private-dependency wall that used to make this fail is gone.
      - name: Install gateway Python deps
        continue-on-error: true
        run: uv sync --all-extras
        working-directory: virtual-mcp-gateway

      # PROVISIONING, NOT EXCLUSION (#40). SI-18 stopped vendoring
      # skills/test_graph/ and test_graph/{sdk,build-logic,standard-nodes}:
      # those copies had drifted 381 lines and three whole files ahead of the
      # skill they copy, and nothing could see it. The runner and the SDK now
      # come from the installed test-graph skill, so the graphs exercise the
      # same copy the evals do.
      #
      # On a laptop that is `project resolve` into .skill-manager. A runner has
      # no home, and .skill-manager is gitignored, so the three vendored paths
      # arrive as DANGLING SYMLINKS and every graph would fail on its first
      # jbang //SOURCES. This step is what makes the checkout buildable.
      #
      # NO TOKEN, DELIBERATELY. The tla-spec-dev PLUGIN is private, but
      # test-graph is a constituent of it and its own repository is PUBLIC —
      # and the runner needs only that skill, never the whole bundle. Cloning
      # the constituent keeps this matrix credential-free.
      #
      # PINNED BY SHA, like the git-issue-workflow step above, so a green run
      # names the SDK it measured and a push to that repository cannot turn the
      # matrix red or green overnight. Bump it deliberately.
      - name: Provision the test-graph skill (runner + SDK)
        env:
          TG_REPO: https://github.com/haydenrear/test-graph
          TG_SHA: b0e35fdfdbccffd6ac311e5b564aaba4925ec221
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/test-graph"
          git init -q "$dest"
          if ! git -C "$dest" fetch -q --depth 1 "$TG_REPO" "$TG_SHA"; then
            echo "::error::test-graph@$TG_SHA is not fetchable — bump TG_SHA"; exit 1
          fi
          git -C "$dest" checkout -q FETCH_HEAD
          # F4: every path this step goes on to symlink, not a subset —
          # `ln -s` happily creates a dangling link for a missing target, and
          # the failure would surface much later inside Gradle or jbang.
          for f in scripts/run.py scripts/discover.py \
                   project_sdk_sources/sdk project_sdk_sources/build-logic \
                   project_sdk_sources/standard-nodes; do
            test -e "$dest/$f" || { echo "::error::test-graph@$TG_SHA has no $f"; exit 1; }
          done
          # Replace the vendored symlinks (dangling here) with links into the
          # pinned checkout. Same shape `project resolve --repair-vendored`
          # produces on a laptop, same source skill, different rung.
          for leaf in sdk build-logic standard-nodes; do
            rm -f "test_graph/$leaf"
            ln -s "$dest/project_sdk_sources/$leaf" "test_graph/$leaf"
          done
          echo "TG_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "test-graph@$(git -C "$dest" rev-parse HEAD) -> $dest"

      # PROVISIONING, NOT EXCLUSION (#40). OUN-6 removed skill-manager-skill/
      # too, and three nodes read that skill's own files — env.script.reports
      # in `smoke` (a CORE graph), and two docs nodes in `doc-smoke`. A runner
      # has no home: .skill-manager is gitignored, EnvPrepared's scratch home
      # is empty, and ~/.skill-manager is seeded only for three other graphs.
      # Without this those nodes fail on every runner while passing on any
      # laptop whose operator has the unit installed, which is the asymmetry
      # worth avoiding rather than the failure.
      #
      # The skill's own repository is PUBLIC, so this needs no token either —
      # the plugin that now carries it is private, but the runner needs only
      # the skill.
      - name: Provision the skill-manager skill (smoke, doc-smoke)
        env:
          SMS_REPO: https://github.com/haydenrear/skill-manager-skill
          SMS_SHA: 043a0d333586d0f825ec6ffc9e0cc75aad6a3f57
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/skill-manager-skill"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$SMS_REPO" "$SMS_SHA"
          git -C "$dest" checkout -q FETCH_HEAD
          for f in scripts/env.sh SKILL.md skill-manager.toml references/projects.md; do
            test -e "$dest/$f" || {
              echo "::error::skill-manager-skill@$SMS_SHA has no $f"; exit 1; }
          done
          echo "SKILL_MANAGER_SKILL_DIR=$dest" >> "$GITHUB_ENV"
          echo "skill-manager-skill@$(git -C "$dest" rev-parse HEAD) -> $dest"

      # THE PRIVATE COORD. SI-18 made `skill-manager onboard` install the
      # tla-spec-dev PLUGIN, and that repository is private while the epic
      # finishes. A runner's GITHUB_TOKEN is scoped to THIS repository, so the
      # clone fails with GitCloneAuthException — `onboard exited 9`, measured on
      # run 35712895588, eight of nine core graphs green and this the only red.
      #
      # FAIL HERE, NOT THERE. Exit 9 arrives deep inside a graph, after postgres
      # and the registry are up, and reads as a graph defect. This step names
      # the missing secret before anything starts.
      #
      # The token needs READ access to haydenrear/tla-spec-dev-plugin and
      # nothing else. It is deliberately NOT the homebrew-tap PAT: that one
      # exists to push to a different repository, and widening its blast radius
      # to cover an unrelated private read is how a credential quietly becomes
      # the credential for everything.
      #
      # Delete this step once the plugin is public — `git config insteadOf` is
      # a rewrite rule that outlives its reason very quietly.
      - name: Configure git access to the private plugin coord
        env:
          PLUGIN_TOKEN: ${{ secrets.TLA_SPEC_DEV_PLUGIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_TOKEN:-}" ]; then
            echo "::error title=TLA_SPEC_DEV_PLUGIN_TOKEN is not set::skill-manager onboard installs github:haydenrear/tla-spec-dev-plugin, which is private. A runner's GITHUB_TOKEN cannot read another repository, so the clone fails with exit 9 (GitCloneAuthException) partway through the onboard graph. Add a repo secret TLA_SPEC_DEV_PLUGIN_TOKEN with READ access to that repository, or make it public and delete this step."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${PLUGIN_TOKEN}@github.com/haydenrear/tla-spec-dev-plugin".insteadOf \
            "https://github.com/haydenrear/tla-spec-dev-plugin"
          echo "git access configured for haydenrear/tla-spec-dev-plugin (read)"

      - name: Plan graph
        run: |
          mkdir -p ci-logs
          set -o pipefail
          python "$TG_SCRIPTS/discover.py" "${{ matrix.graph }}" --test-graph-root test_graph \
            2>&1 | tee ci-logs/plan.log

      # CiLoggedIn (and several other nodes) use ProcessBuilder.inheritIO(),
      # so their subprocess stderr only reaches Gradle's stdout. Tee the full
      # stream so the real error is recoverable from the uploaded artifact
      # even after the live log scrolls / the run ages out.
      - name: Run graph
        run: |
          mkdir -p ci-logs
          set -o pipefail
          python "$TG_SCRIPTS/run.py" "${{ matrix.graph }}" --test-graph-root test_graph \
            2>&1 | tee ci-logs/run.log

      - name: Collect diagnostics
        if: always()
        run: bash .github/scripts/collect-test-graph-diagnostics.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.graph }}
          path: ci-diagnostics/
          if-no-files-found: ignore
