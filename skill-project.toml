# Skill project manifest for the skill-manager repository.
#
# This repo is not a skill unit. There is no skill-manager.toml at its root: it
# is the CLI's own source tree, and it is itself an integration-repository
# snapshot carrying NO leaf units at all any more — just
# infra/homebrew-skill-manager/. It carried three: skill-publisher-skill/ went
# at SI-18, and skills/test_graph/ and skill-manager-skill/ at #40/OUN-6. Every
# one of them is installed from its own repository now, as contained skills of
# the tla-spec-dev plugin, and test_graph/{sdk,build-logic,standard-nodes} are
# [[vendored]] links into the installed test-graph. So "a repo does not declare its own unit" has
# nothing to bite on here, and what this manifest declares is simply what an
# agent working in this checkout needs.
#
# SI-18 (2026-09-21) removed the third, skill-publisher-skill/. It was a
# vendored snapshot of the skt PLUGIN, and skt is not a plugin any more: it is
# a contained skill of tla-spec-dev, at plugins/tla-spec-dev/skills/skt. Every
# symbol, test and reference page the snapshot carried was verified present
# upstream before it went.
#
# How the home is produced — read this before running `project resolve`
# ---------------------------------------------------------------------
# `project resolve` writes into whatever `SKILL_MANAGER_HOME` names. Run it
# before this checkout has its own home and it mutates the operator's global
# ~/.skill-manager. Create the local home first, point `SKILL_MANAGER_HOME` at
# it, and only then resolve:
#
#   mkdir -p .skill-manager/skills
#   SKILL_MANAGER_CLI=./skill-manager \
#     bash <git-integration-repo>/scripts/bootstrap-home.sh --root "$PWD" --force
#   export SKILL_MANAGER_HOME="$PWD/.skill-manager"
#   ./skill-manager project resolve --project-dir "$PWD" --skip-gateway
#
# `SKILL_MANAGER_HOME` alone does not redirect the agent-home projections;
# export `CLAUDE_CONFIG_DIR`, `CLAUDE_HOME`, `CODEX_HOME` and `GEMINI_HOME` at
# this checkout's own `.claude/`, `.codex/` and `.gemini/` as well.
#
# NOTE for the unit suite specifically: do NOT export CLAUDE_HOME /
# CLAUDE_CONFIG_DIR / GEMINI_HOME when running RunTests.java. AgentHomesTest
# asserts they resolve to null, so "export everything" is unsatisfiable there.
# The suite is sandboxed differently, with BOTH `HOME=<fakehome>` and
# `-Duser.home=<fakehome>`, because on macOS the JVM derives user.home from the
# OS and ignores $HOME.
#
# `--allow-same-home` is NOT needed. This project's home IS its own parent home,
# and `project resolve` used to refuse that layout (#32). The refusal was wrong
# and has been replaced by a warning naming the layout; the flag is still
# accepted and does nothing.
#
# Coords are git-only (no registry is configured) and they name the REPO, not
# the installed unit. The table key is the installed unit name, which is what
# `.skill-manager/skills/<name>` uses.

[project]
name = "skill-manager"
version = "0.19.2"
description = "The Skill Manager CLI: unit resolution and installation, agent-home projection, per-checkout homes, home sync/close-out, project manifests, CLI/MCP tool deps and the virtual MCP gateway."

# --- TLA+ model checking, and the substantive reason this repo wants a home.
#     specs/program_model/run_tlc.sh resolves the model checker as
#
#         tlc2 on PATH
#         ${SKILL_MANAGER_HOME:-$HOME/.skill-manager}/bin/cli/tlc2
#         $TLA2TOOLS_JAR
#
#     and its own error message says "Install spec-double-compiler with
#     skill-manager". Without a local home that middle branch reads the
#     OPERATOR's global home — which is exactly the fallback this epic exists to
#     remove, sitting in this repo's own spec tooling. Declaring the unit here
#     puts tlc2 and tla-spec-dev in THIS checkout's bin/cli.
#
#     It is also cheap: spec-double-compiler declared `skill_references = []`,
#     so nothing arrived transitively behind it ---

# MIGRATED at SI-18, from `[skills.spec-double-compiler]` at
# `github:haydenrear/tla-spec-dev`. Three things changed at once:
#
#   1. IT IS A PLUGIN, NOT A SKILL. spec-double-compiler is the contained skill
#      `spec-double-2` inside the tla-spec-dev plugin now. Declaring it
#      standalone re-materialises a copy of a unit the bundle already ships --
#      the incoherence this epic exists to remove -- and it is what kept this
#      project claiming the unit in the shared root home.
#
#   2. THE COORD IS A DIFFERENT REPOSITORY. `tla-spec-dev-plugin`, not
#      `tla-spec-dev`. The old repository keeps shipping the
#      spec-double-compiler SKILL so existing installs keep syncing; resolving
#      that coord here gets the skill, not the plugin. Two repositories, two
#      surfaces, and the names are one hyphen apart.
#
#   3. IT IS NOT PINNED. The plugin's `main` is the epic's delivery surface and
#      every wave lands there, so there is a branch to track. `skill-manager
#      onboard` points at `main` for the same reason.
#
# This one block is also what brings skt into this project's home. skt has no
# declaration of its own and must not get one: it is contained here, and a
# standalone [plugins.skt] would install the duplicate the migration removed.
# The rest of the bundle -- unit-authoring, test-graph, the git-* workflow
# skills, discovery, plugin-repository, skill-manager -- arrives behind it as
# contained skills, all 11 versioned and synced as ONE unit.
[plugins.tla-spec-dev]
source = "github:haydenrear/tla-spec-dev-plugin"

# --- authoring: this repo carries NO leaf skill units as tracked directories
#     any more. Unit work happens in each unit's own repository, or in the
#     plugin that contains it. The `unit-authoring` skill contained in the
#     tla-spec-dev plugin above is the authority on SKILL.md frontmatter,
#     descriptions, skill-manager.toml, references/ pages and the
#     install/bind/sync round trip.
#
#     Read CLAUDE.md before editing either: they are duplicated leaf
#     constituents and a change must start in the top-level leaf repository and
#     be merged UP into this snapshot, never the other way round ---

# [plugins.skt] WAS HERE, at github:haydenrear/skill-publisher-skill, and it is
# deliberately not replaced. skt is a contained skill of tla-spec-dev now and
# the block above installs it. Declaring it again would put a second,
# separately updatable copy of skt in this home, sourced from a repository that
# no longer publishes it -- the exact state UnitSupersession's `skt` row exists
# to retire. Migration notes: references/migration.md in the plugin.

# --- `skill-manager` is NOT declared here: the tla-spec-dev plugin ships it as
#     a contained skill (plugins/tla-spec-dev/skills/skill-manager), so the
#     `skill-imports` that skt and spec-double-2 declare on it resolve through
#     the plugin above. It had its own [skills.skill-manager] block until the
#     skt migration, and `skt status` reported that block as the one thing to
#     delete; a sync warned "served by the skt plugin now — nothing is
#     installed for it" on every run. SI-18 only changed WHICH plugin carries
#     it: skt and skill-manager are now contained skills of the same bundle,
#     so one declaration serves both.
#
#     The tracked snapshot at skill-manager-skill/ is GONE as of OUN-6 — it
#     had become a second, drifting copy of what the plugin carries (0.1.1 here
#     against 0.1.2 there, with content differences nobody had made
#     deliberately) ---

# --- REVERSED at SI-18/#40. This block used to say "test-graph is deliberately
#     NOT declared", on the grounds that declaring it would "add yet another
#     copy of the same SDK". That reasoning held only while the vendored copies
#     were believed to be the same as the skill's. They were not: measured at
#     the switch, `skills/test_graph/` was 381 lines AND THREE WHOLE FILES
#     ahead of the installed skill (the sweep ledger), and the SDK differed in
#     both directions. Not declaring it did not avoid a second copy — it hid
#     one, and the hidden copy was the one being edited.
#
#     test-graph is not declared HERE either, and that part is unchanged: it
#     arrives as a CONTAINED SKILL of the tla-spec-dev plugin declared above,
#     which is the whole point. One declaration, one copy, and the graphs now
#     exercise the same test-graph the evals install.
#
#     The cost objection was real and is now simply paid: test-graph declares
#     `github:haydenrear/deploy-cdc` as a hard `skill_reference`, so deploy-helm
#     and its ~1.6 GB of venvs land in this home. That is the price of the
#     graphs and the evals measuring one artifact instead of two, and it is
#     paid once per home rather than per run.

# --- [[vendored]]: #40, decided. test_graph/sdk and test_graph/build-logic were
#     REAL DIRECTORIES committed in 56ca0f7 as a band-aid for issue #21, and the
#     comment that used to sit here said declaring them "is precisely the change
#     #40 has to decide deliberately". This is that decision.
#
#     WHY NOW: the copies had drifted, and in both directions. Measured against
#     the installed test-graph at the moment of the switch: 223 lines only in
#     the plugin's copy (trace propagation) and 37 only in this one — including
#     TESTGRAPH_CONTINUE_AFTER_FAILURE, a feature this repo's own
#     build.gradle.kts documents twice as the way to sweep the `onboarding`
#     graph, which the plugin did not have at all. The SDK that runs 26 graphs
#     differed between the repo that owns it and the repo that uses it, and
#     nothing could see that.
#
#     The 37 were reconciled UPSTREAM FIRST, in dependency order, because
#     switching before that would have deleted them silently:
#       test-graph 9c51b62      — ports continueAfterFailure
#       tla-spec-dev f16523ec   — subtree pull of that commit
#     The residue is superseded, not lost: the plugin wraps flush_observability
#     in _flush_observability_before_exit, raises MAX_TRACKED_DESCENDANTS from
#     4_096 to 1_048_576 with its reasoning, and adds traced_environment().
#
#     `from_unit` names the UNIT, not a location. test-graph is a CONTAINED
#     skill of tla-spec-dev, so its bytes are at
#     plugins/tla-spec-dev/skills/test-graph/project_sdk_sources/ — and
#     resolving that rung is what SI-18 taught ProjectVendored to do. Declaring
#     `from_unit = "tla-spec-dev"` with the plugin path baked into
#     `from_subpath` is the half-migrated spelling other projects in this tree
#     still carry; it does not resolve, and `skt status` now says so.
#
#     CONSEQUENCE, STATED PLAINLY: these are tracked symlinks into
#     .skill-manager, which is gitignored. A FRESH CLONE CANNOT RUN GRAPHS UNTIL
#     `project resolve` HAS RUN. That is the point — the graphs now exercise the
#     same test-graph the evals install, so one run covers both — but it is a
#     new precondition and CLAUDE.md states it.
#
#     standard-nodes is declared although this repo never had it: the plugin
#     ships it, and repair materializes it.

[[vendored]]
name = "test-graph-sdk"
paths = ["test_graph/sdk", "test_graph/build-logic", "test_graph/standard-nodes"]
from_unit = "test-graph"
from_subpath = "project_sdk_sources"
on_invalid = "error"
