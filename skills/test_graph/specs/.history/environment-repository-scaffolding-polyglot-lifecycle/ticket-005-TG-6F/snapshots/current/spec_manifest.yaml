      - ReuseBranchEnvironment
      - ResetBranchEnvironment
      - RequestMergedBranchDestroy
      - DestroyMergedBranchEnvironment
      - SkipBranchEnvironmentReset
      - SkipBranchEnvironmentDestroy
    validation:
      unit:
        - pytest --import-mode=importlib specs/current/tests specs/desired_program_model/tests
        - cd project_sdk_sources && ./gradlew --console=plain :build-logic:test
      tlc:
        - cd specs/current && tlc2 -config MC.cfg TestGraph.tla
      graph:
        - ./scripts/run.py environmentRepositoryLocalLifecycle --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryLocalLifecycleDestroy --test-graph-root test_graph
        - TEST_GRAPH_DESTROY_BRANCH_ENVIRONMENT=true ./scripts/run.py environmentRepositoryLocalLifecycleDestroy --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryGithubActionLifecycle --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryGithubActionLifecycleDestroy --test-graph-root test_graph
        - TEST_GRAPH_DESTROY_BRANCH_ENVIRONMENT=true ./scripts/run.py environmentRepositoryGithubActionLifecycleDestroy --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryAwsLifecycle --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryAwsLifecycleDestroy --test-graph-root test_graph
        - TEST_GRAPH_RUN_AWS_LIFECYCLE=true AWS_PROFILE=test ./scripts/run.py environmentRepositoryAwsLifecycle --test-graph-root test_graph
        - TEST_GRAPH_RUN_AWS_LIFECYCLE=true AWS_PROFILE=test TEST_GRAPH_DESTROY_BRANCH_ENVIRONMENT=true ./scripts/run.py environmentRepositoryAwsLifecycleDestroy --test-graph-root test_graph
      evidence:
        - TG-6F adds environmentRepositoryGithubActionLifecycle and environmentRepositoryGithubActionLifecycleDestroy for local-github-action provision, reuse, reset, skip-destroy, and guarded explicit destroy validation.
        - TG-6F adds environmentRepositoryAwsLifecycle and environmentRepositoryAwsLifecycleDestroy with default guarded no-op behavior plus explicit TEST_GRAPH_RUN_AWS_LIFECYCLE/AWS credential paths for provision, reuse, reset, skip-destroy, and destroy.
        - TG-6F lifecycle assertions inspect provisioning markers, environment repository execution command labels, kubeconfig/application marker files, AWS guard decisions, and destroy marker files.
        - ./scripts/run.py environmentRepositoryGithubActionLifecycle --test-graph-root test_graph passed with report test_graph/build/validation-reports/20260628-192248.
        - ./scripts/run.py environmentRepositoryGithubActionLifecycleDestroy --test-graph-root test_graph passed without destroy intent with report test_graph/build/validation-reports/20260628-192312.
        - TEST_GRAPH_DESTROY_BRANCH_ENVIRONMENT=true ./scripts/run.py environmentRepositoryGithubActionLifecycleDestroy --test-graph-root test_graph passed with report test_graph/build/validation-reports/20260628-192334.
        - ./scripts/run.py environmentRepositoryAwsLifecycle --test-graph-root test_graph passed guarded/no-cloud with report test_graph/build/validation-reports/20260628-192356.
        - ./scripts/run.py environmentRepositoryAwsLifecycleDestroy --test-graph-root test_graph passed guarded/no-cloud with report test_graph/build/validation-reports/20260628-192421.
        - TEST_GRAPH_RUN_AWS_LIFECYCLE=true AWS_PROFILE=test ./scripts/run.py environmentRepositoryAwsLifecycle --test-graph-root test_graph passed selected AWS lifecycle against the scaffolded shim with report test_graph/build/validation-reports/20260628-192445.
        - TEST_GRAPH_RUN_AWS_LIFECYCLE=true AWS_PROFILE=test TEST_GRAPH_DESTROY_BRANCH_ENVIRONMENT=true ./scripts/run.py environmentRepositoryAwsLifecycleDestroy --test-graph-root test_graph passed selected AWS destroy against the scaffolded shim with report test_graph/build/validation-reports/20260628-192511.
        - ./scripts/run.py --all --test-graph-root test_graph passed on 2026-06-28; default TG-6F graph reports included test_graph/build/validation-reports/20260628-193301, 20260628-193313, 20260628-193324, and 20260628-193335.
        - cd specs/current && tlc2 -config MC.cfg TestGraph.tla passed with 472400 distinct states on 2026-06-28.
        - cd specs/desired_program_model && tlc2 -config MC.cfg TestGraph.tla passed with 472400 distinct states on 2026-06-28.
        - pytest --import-mode=importlib specs/current/tests specs/desired_program_model/tests passed with 46 tests on 2026-06-28.
        - cd project_sdk_sources && ./gradlew --console=plain :build-logic:test passed on 2026-06-28.
  next:
    - Close TG-6F with spec-double-compiler history after validation evidence is recorded.
    - Promote/close the whole TG-6 workflow only after review of the converged current/desired model.
  accepted_baseline:
    workflow_name: branch_environment_repository_workflow
    initial_ticket: TG-5
    issue: https://github.com/haydenrear/deploy-cdc/issues/6
    carried_forward_state_fields:
      - input_contexts
      - rerunnable_nodes
      - rerun_guidance
      - resumed_nodes
      - single_node_reruns
      - side_effect_runtime_configured
      - provisioning_state_configured
