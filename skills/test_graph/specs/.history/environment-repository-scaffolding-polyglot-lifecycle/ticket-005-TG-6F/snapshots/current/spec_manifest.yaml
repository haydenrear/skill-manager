module: TestGraph
package: current_program_cases

status:
  workflow: ticket
  active_ticket: TG-6F
  active_ticket_title: "Add guarded GitHub Actions and AWS lifecycle validation graphs"
  relation_to_program_model: starts_equivalent_then_advances_as_slices_land
  relation_to_desired_program_model: implemented_prefix_of_desired_ticket_plan
  current_model_rule: whole_program_working_copy_not_ticket_projection
  test_modeling_rule: do_not_model_tests_or_validation_harnesses_as_program_behavior
  updated: "2026-06-28"
  current_slice:
    name: TG-6F
    status: tg6f_guarded_lifecycle_validation_landed
    refines:
      - specs/program_model
    implemented_actions:
      - ScaffoldEnvironmentRepository
      - ScaffoldEnvironmentTemplate
      - ScaffoldLifecycleNodeTemplate
      - VerifyEnvironmentContextRuntime
