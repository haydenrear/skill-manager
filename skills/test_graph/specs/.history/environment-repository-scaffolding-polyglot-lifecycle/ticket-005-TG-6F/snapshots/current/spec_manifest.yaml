source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  program_model_module: ../program_model/TestGraph.tla
  desired_ticket_plan: ../desired_program_model/ticket_plan.yaml

case_codegen:
  style: explicit_transition_cases
  generation_status: planned

state_fields:
  - name: environment_repository_scaffolded
    purpose: Whether a starter environment repository can be generated as a Git-ready OpenTofu contract.
  - name: scaffolded_environment_templates
    purpose: Local, AWS, and GitHub Actions target/backend templates added to an environment repository.
  - name: scaffolded_lifecycle_node_templates
    purpose: Deploy, reset, and delete cluster node templates generated for Python and Java runtimes.
  - name: runtime_environment_context_verified
    purpose: Node runtimes proven to receive environment repository context and projected env vars.
  - name: aws_execution_guarded
    purpose: AWS branch environments whose execution was explicitly selected and credential-gated.
  - name: skipped_reset_environments
    purpose: Environments where reset skipped because the cluster was newly provisioned or already reset.
  - name: skipped_destroy_environments
    purpose: Environments intentionally kept alive for branch reuse instead of being destroyed.
actions:
  - ScaffoldEnvironmentRepository
  - ScaffoldEnvironmentTemplate
  - ScaffoldLifecycleNodeTemplate
  - VerifyEnvironmentContextRuntime
  - GuardAwsBranchEnvironment
  - SkipBranchEnvironmentReset
  - SkipBranchEnvironmentDestroy
ports: {}
adapters: case_adapters.toml
adapter_status:
  - LocalLifecycleGraphAdapter
  - AwsLifecycleGraphAdapter
notes:
  package_from_program_model: testgraph_program_cases
