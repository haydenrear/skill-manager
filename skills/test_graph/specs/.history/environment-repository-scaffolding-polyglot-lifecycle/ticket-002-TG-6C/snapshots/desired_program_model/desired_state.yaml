guardrails:
  git_fixture_policy: Tests must initialize a temporary Git repository during execution; do not check in nested Git repositories or tarball fixtures as the primary contract.
  aws_execution_policy: AWS lifecycle validation must require explicit graph selection plus AWS credentials and explicit destroy intent for deletion.
  exhaustive_graph_policy: Functionality tickets must add or update test graph coverage, and environment repository lifecycle behavior must be represented across local, GitHub Actions, and AWS graphs for deploy-missing, deploy-existing/reuse, reset, explicit destroy, and skip-destroy where safe for the target.
  validation_policy: Every production slice updates specs/current, runs unit/spec validation, then adds or updates behavior-level test graph nodes.
  per_ticket_closeout_policy: Every completed ticket updates specs/current, updates ticket_plan/status/evidence, closes a spec-double-compiler ticket history entry, and commits those changes before moving on.
