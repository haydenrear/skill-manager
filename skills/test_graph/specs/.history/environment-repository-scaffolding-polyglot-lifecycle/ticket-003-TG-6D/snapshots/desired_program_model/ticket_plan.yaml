    current_increment:
      model_state:
        - aws_execution_guarded
      model_actions:
        - GuardAwsBranchEnvironment
      adapters:
        - AwsLifecycleGraphAdapter
      unit_tests:
        - pytest specs/current/tests
      graph_after_unit_pass:
        - environmentRepositoryGithubActionLifecycle
        - environmentRepositoryAwsLifecycle
    acceptance:
      commands:
        - pytest specs/current/tests
        - ./scripts/run.py environmentRepositoryGithubActionLifecycle --test-graph-root test_graph
        - ./scripts/run.py environmentRepositoryAwsLifecycle --test-graph-root test_graph
      assertions:
        - GitHub Actions lifecycle graph is discoverable in normal runs and validates the local-github-action scaffold without requiring cloud infrastructure.
        - GitHub Actions graph covers first deploy, existing deploy reuse, reset, explicit destroy guard behavior, and skip-destroy/keep-alive behavior using CI-safe markers and context projection.
