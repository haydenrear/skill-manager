    title: "Document the environment repository contract and local k3d setup"
    status: done
    depends_on: []
    objective: >
      Make environment repositories a first-class documented skill surface with
      a dedicated reference, expected repository shape, execution contract,
      target/backend semantics, lifecycle behavior, and a local k3d setup path.
    desired_actions: []
    implementation_scope:
      - SKILL.md
      - references/environment-repositories.md
      - references/reference.md
      - references/workflows.md
    current_increment:
      model_state: []
      model_actions: []
      adapters:
        - EnvironmentRepositoryReferenceAdapter
      unit_tests:
        - pytest specs/current/tests
      graph_after_unit_pass:
        - Add an assertion node that proves SKILL.md routes to the env-repos reference.
        - Add an assertion node that proves local k3d contract details are present.
        - Add an assertion node that proves the reference requires local, GitHub Actions, and AWS graph coverage for functionality tickets.
    acceptance:
      commands:
        - pytest specs/current/tests
        - ./scripts/run.py environmentRepositoryDocumentation --test-graph-root test_graph
      assertions:
        - SKILL.md links to references/environment-repositories.md.
        - The reference defines required files, required outputs, supported sources, target/backend selection, branch scoping, reset, destroy, skip-destroy, and local k3d setup.
        - Existing TG-5 contract text in references/reference.md and references/workflows.md points to the dedicated reference instead of becoming stale duplicate source material.
        - The documentation graph fails if functionality tickets can add scripts/scaffolds/lifecycle behavior without test graph coverage.
      evidence:
        - references/environment-repositories.md documents the provider-neutral Git environment repository contract, local k3d setup, and local/GitHub Actions/AWS graph coverage matrix.
        - SKILL.md, references/reference.md, and references/workflows.md route to the dedicated environment repository reference.
        - test_graph/sources/Tg6EnvironmentRepositoryDocumentation.py and environmentRepositoryDocumentation validate the documentation contract.
        - pytest --import-mode=importlib specs/current/tests specs/desired_program_model/tests passed with 27 tests on 2026-06-28.
        - cd specs/current && tlc2 -config MC.cfg TestGraph.tla passed on 2026-06-28.
        - cd specs/desired_program_model && tlc2 -config MC.cfg TestGraph.tla passed on 2026-06-28.
