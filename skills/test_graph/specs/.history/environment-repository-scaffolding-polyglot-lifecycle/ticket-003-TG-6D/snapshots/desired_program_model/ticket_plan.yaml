version: 1
name: environment-repository-scaffolding-polyglot-lifecycle
updated: "2026-06-28"
purpose: >
  Plan the TG-6 workflow for first-class environment repository scaffolding,
  local/AWS/GitHub Actions lifecycle nodes, Java/JBang parity coverage, and
  local/AWS validation graphs.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before broad graph execution.
  graph_rule: Add graph or integration nodes after the corresponding current-model validation passes.
  functionality_graph_rule: Every ticket that adds functionality, scripts, scaffolds, SDK behavior, generated node templates, or deployment lifecycle behavior must add a new test graph or add explicit nodes/assertions to an existing graph in the same ticket.
  exhaustive_environment_graph_rule: Environment repository scaffolding and deployment lifecycle behavior must be covered through test graphs for local, GitHub Actions, and AWS targets/backends, with deployment cases for missing cluster, existing cluster reuse, reset, explicit destroy, and skip-destroy/keep-alive behavior where that target can exercise them safely.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  per_ticket_closeout_rule: After every completed ticket, update specs/current to the landed behavior, update this ticket plan and spec manifests with status/evidence, close the ticket with spec-double-compiler history, and commit that ticket separately.
  promotion_rule: When the final ticket closeout makes specs/current equal specs/desired_program_model, promote the converged model to specs/program_model and close the workflow history as part of that final ticket's closeout.

per_ticket_closeout:
  required_after_each_ticket:
    - Update specs/current as a whole-program working copy of the landed behavior.
    - Update specs/desired_program_model/ticket_plan.yaml with ticket status, evidence, and next active ticket.
    - Update specs/current/spec_manifest.yaml and specs/desired_program_model/spec_manifest.yaml with implemented actions, validations, and evidence.
    - Run the ticket's unit/spec validation and its targeted test graph.
    - Close the ticket with the spec-double-compiler close-ticket workflow and attach evidence.
    - Commit the implementation, spec updates, graph updates, and close record as one ticket-scoped commit.
  final_ticket_extra:
    - After the last implementation ticket is closed and specs/current equals specs/desired_program_model, run the whole-workflow close/promote command instead of creating a separate closeout ticket.

status:
  workflow: ticket
  active_ticket: TG-6E
  active_ticket_title: "Add local lifecycle validation graph"
  desired_module: TestGraph
  phase: implementation
  baseline_evidence:
    - "./scripts/run.py --all --test-graph-root test_graph passed on 2026-06-27."
    - "Current env-repo lifecycle graph coverage is uv/Python only; no Java/JBang env-repo context propagation graph exists yet."
    - "SKILL.md lacks a direct environment-repositories routing entry."
    - "references/reference.md contains TG-5 contract details, but there is no dedicated references/environment-repositories.md."
    - "scripts/scaffold-tf-env.py and scripts/scaffold-env.py do not exist yet."

service_catalog:
  existing_boundaries:
    - EnvironmentRepository metadata in Python and Java SDK NodeSpec.
    - OpenTofu-backed branch environment runtime in build-logic.
    - Provisioning marker state for provision, reuse, reset, destroy, deployed, and destroy-requested markers.
    - Downstream env:[KEY] and env:[*] context projection.
  desired_boundaries:
    - Dedicated environment repository reference documentation and SKILL.md routing.
    - Environment repository scaffolding CLI for a new Git repository with starter OpenTofu templates.
    - Environment template scaffolding CLI for adding local, AWS, and GitHub Actions environments to an existing environment repo.
    - Shared lifecycle node template library for Python and Java deploy/reset/delete cluster nodes.
    - Java/JBang env-repo context propagation graph parity with uv.
    - Local lifecycle graph covering first deploy, existing deploy reuse, reset, explicit destroy, and skip-destroy.
    - GitHub Actions lifecycle graph covering scaffolded local-github-action environment behavior and CI-safe keep-alive/destroy guard semantics.
    - AWS lifecycle graph covering first deploy, existing deploy reuse, reset, explicit destroy, and skip-destroy with explicit selection and credential guards.
  adapter_boundaries:
    - EnvironmentRepositoryScaffoldAdapter
    - EnvironmentTemplateScaffoldAdapter
    - ClusterLifecycleNodeTemplateAdapter
    - JBangEnvironmentContextProjectionAdapter
    - LocalLifecycleGraphAdapter
    - AwsLifecycleGraphAdapter
  known_gaps:
    - No dedicated env-repos reference file.
    - No local k3d setup guide tied to the env repo contract.
    - No scaffold-tf-env.py or scaffold-env.py scripts.
    - No generated deploy_cluster/reset_node/delete_cluster node templates.
    - No Java/JBang env-repo lifecycle or context projection validation node.
    - No GitHub Actions target/backend lifecycle graph.
    - AWS validation is currently only a fail-fast metadata guard, not a lifecycle graph.

tickets:
