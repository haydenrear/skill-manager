  comparison_to_issue_3:
    already_present:
      - Node SDKs accept inline context and file references through --context.
      - PlanExecutor writes an exact input Context[] snapshot for every node under build/validation-reports/<runId>/context.
      - Documentation explains manual direct-node rerun from context/<node-id>.input.json.
      - Every attempted node gets a canonical envelope under envelope/<node-id>.json.
      - Java and Python NodeSpec describe output includes rerun metadata, default true.
      - scripts/run.py exposes graph resume from an existing build directory and node id.
      - Resume loads context/<node-id>.input.json, skips already-passed dependency steps, and continues downstream graph execution.
      - scripts/run.py exposes run-only execution from an existing build directory and node id.
      - Run-only loads context/<node-id>.input.json, runs exactly the selected node, and does not continue downstream.
    gaps:
      - Failed-node rerun guidance is not emitted from the executor/report path.
      - Current adapters are documented boundaries, not executable refinement adapters.
