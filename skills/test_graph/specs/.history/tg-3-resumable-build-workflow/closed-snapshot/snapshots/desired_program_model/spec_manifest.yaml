module: TestGraph
package: testgraph_program_cases

status:
  workflow: closed
  initial_ticket: TG-3
  initial_ticket_title: "Resumption from any Build in Build Directory"
  ticket_plan: ticket_plan.yaml
  relation_to_program_model: accepted_program_model
  relation_to_current: converged_and_promoted
  updated: "2026-06-12"
  summary:
    desired_model_scaffolded: true
    ticket_plan_scaffolded: true
    current_model_scaffolded: true
    generated_cases: pending
    adapters: documented_boundaries_only
  done:
    - Desired TLA+ model extended for saved input context, resume, single-node rerun, and rerun guidance semantics.
    - TG-3A implemented in specs/current and production code: every node attempt writes an input context snapshot.
    - TG-3B implemented in specs/current and production code: NodeSpec.rerun(boolean) metadata defaults true and propagates through describe output.
    - TG-3C implemented in specs/current and production code: graph execution can resume from a saved build directory and node id.
    - TG-3D implemented in specs/current and production code: one node can run from a saved build directory without continuing downstream graph nodes.
    - TG-3E implemented in specs/current and production code: failed rerunnable nodes emit resume/run-only guidance.
    - Converged desired/current model promoted back into specs/program_model.
  pending:
    - Add executable adapter mappings for the run/resume boundaries in a future workflow.

source_model:
  program_model_manifest: ../program_model/spec_manifest.yaml
  program_model_module: ../program_model/TestGraph.tla
  baseline_package: testgraph_program_cases
  issue_source: https://github.com/haydenrear/test_graph_skill/issues/3

case_codegen:
  style: explicit_transition_cases
  generation_status: planned
  note: Generate transition cases after the current model advances and adapters are executable.

finite_model:
  note: >
    The desired workflow uses a smaller two-node TLC bound than the accepted
    three-node baseline because resume/run-only histories expand the state
    space. This is a workflow practicality bound, not a semantic restriction.
  Graphs:
    values:
      - GraphA
  Nodes:
    values:
      - NodeA
      - NodeB
  SourceNodes:
    values:
      - NodeA
      - NodeB

state:
  TestGraphState:
    added_fields:
      input_contexts:
        type: dict[GraphId, frozenset[NodeId]]
        tla: input_contexts
        purpose: Nodes whose input context snapshot exists in the build directory.
      rerunnable_nodes:
        type: frozenset[NodeId]
        tla: rerunnable_nodes
        purpose: Source nodes whose described metadata allows resume/run-only guidance; defaults to all source nodes.
      rerun_guidance:
        type: dict[GraphId, frozenset[NodeId]]
        tla: rerun_guidance
        purpose: Failed nodes for which the executor/report should print a concrete rerun command.
      resumed_nodes:
        type: dict[GraphId, frozenset[NodeId]]
        tla: resumed_nodes
        purpose: Nodes used as entrypoints for continuing a graph from an existing build directory.
      single_node_reruns:
        type: dict[GraphId, frozenset[NodeId]]
        tla: single_node_reruns
        purpose: Nodes executed in isolation from saved build-directory input context.

commands:
  SetNodeRerunDisabled:
    action: SetNodeRerunDisabled
    result: WorkflowResult
    fields:
      node_id:
        type: NodeId
        tla: n
  ResumeRunFromBuild:
    action: ResumeRunFromBuild
    result: WorkflowResult
    fields:
      graph_id:
        type: GraphId
        tla: g
      node_id:
        type: NodeId
        tla: n
  RunOnlyNodeFromBuild:
    action: RunOnlyNodeFromBuild
    result: NodeRunResult
    fields:
      graph_id:
        type: GraphId
        tla: g
      node_id:
        type: NodeId
        tla: n

ports:
  TestGraphProgramPort:
    new_methods:
      set_node_rerun_disabled:
        command: SetNodeRerunDisabled
        result: WorkflowResult
      resume_run_from_build:
        command: ResumeRunFromBuild
        result: WorkflowResult
      run_only_node_from_build:
        command: RunOnlyNodeFromBuild
        result: NodeRunResult

invariants:
  inherited:
    - TypeInvariant
    - ExplicitNodesAreAvailable
    - ScriptSpecsAreSourceOfTruth
    - DependencyConstantsAreIndexed
    - DslOverlaysOnlyAddDependencies
    - PlannedGraphsAreDependencyClosed
    - PlannedGraphsAreAcyclic
    - RunsRespectDependencies
    - ContextContainsOnlyPassedPublishedData
    - EveryAttemptGetsOneEnvelope
    - ReportsHaveEnvelopeEvidence
    - PackageCatalogIsCompleteAfterScaffold
  added:
    - EveryAttemptHasSavedInputContext
    - RerunGuidanceOnlyForRerunnableFailures
    - ResumptionsUseSavedInputContext
    - BuildRerunsRespectDependencies

program_context:
  issue_3_target: >
    Every node attempt writes its input context into the build directory.
    A graph can resume from a saved build directory at a specific node by
    loading that node's saved context, and a user can run only that node
    against the same saved context. Failed-node rerun instructions are emitted
    only when the node's metadata allows rerun; rerun defaults to true.
  semantic_boundaries:
    - name: input_context_snapshots
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/Context.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
      notes: Persist the exact Context[] payload for every node before execution, including small/root contexts.
    - name: rerun_metadata
      files:
        - project_sdk_sources/sdk/java/src/main/java/com/hayden/testgraphsdk/sdk/NodeSpec.java
        - project_sdk_sources/sdk/python/src/testgraphsdk/node_spec.py
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/ValidationNodeSpec.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/NodeDescribeLoader.kt
      notes: Add rerun(true|false) metadata, default true, distinct from timeout retries.
    - name: build_resume_surface
      files:
        - scripts/run.py
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/RunTestGraphTask.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
      notes: Add graph resume and run-only-node surfaces that consume saved input context from an existing build directory.
    - name: rerun_guidance
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/RunReportWriter.kt
        - references/workflows.md
        - references/reference.md
      notes: Print a concrete rerun command for rerunnable failed nodes and document rerun(false).

adapter_plan:
  desired_adapters:
    - InputContextSnapshotAdapter
    - ResumeRunFromBuildAdapter
    - RunOnlyNodeFromBuildAdapter
    - RerunGuidanceAdapter
  current_status: documented_boundaries_only

