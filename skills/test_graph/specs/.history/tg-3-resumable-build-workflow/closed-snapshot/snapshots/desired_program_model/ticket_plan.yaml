version: 1
name: tg-3-resumable-build-workflow
updated: "2026-06-12"
purpose: >
  Complete GitHub issue 3 by moving from the accepted baseline to a model where
  every node attempt has a saved input context in the build directory, graph
  execution can resume from a saved node context, a single node can be rerun
  from that saved context, and rerun guidance is controlled by node metadata.

planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.

status:
  workflow: ticket
  active_ticket: TG-3
  active_ticket_title: "Resumption from any Build in Build Directory"
  desired_module: TestGraph
  phase: closing
  source_issue:
    url: https://github.com/haydenrear/test_graph_skill/issues/3
    created_at: "2026-06-01T20:56:19Z"

service_catalog:
  existing_boundaries:
    - name: context_arg_wire_format
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/Context.kt
        - project_sdk_sources/sdk/java/src/main/java/com/hayden/testgraphsdk/sdk/ContextSerde.java
        - project_sdk_sources/sdk/python/src/testgraphsdk/context_item.py
      current: Supports inline JSON and @file references for --context.
    - name: canonical_envelopes
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
      current: Every attempted node gets envelope/<node-id>.json.
    - name: manual_debug_rerun_docs
      files:
        - SKILL.md
        - references/workflows.md
        - references/reference.md
      current: Documents direct node rerun, but only reliably when context was already spilled.
  desired_boundaries:
    - name: input_context_snapshots
      target: Persist a deterministic context/<node-id>.input.json or equivalent for every node before each attempt.
    - name: resume_from_build
      target: Continue a graph from a saved build directory and node id by loading that node's saved input context.
    - name: run_only_node_from_build
      target: Execute only the selected node from a saved build directory without replaying upstream nodes.
    - name: rerun_metadata_and_guidance
      target: Add rerun(true|false), default true, and emit failed-node rerun commands only for rerunnable nodes.
  adapter_boundaries:
    - InputContextSnapshotAdapter
    - ResumeRunFromBuildAdapter
    - RunOnlyNodeFromBuildAdapter
    - RerunGuidanceAdapter
  known_gaps:
    - Existing context/step-NNN.json files are optional and size-driven, not guaranteed per-node input snapshots.
    - Existing timeout retries are not the same concept as user-directed build-directory rerun permission.
    - specs/program_model adapters intentionally document boundaries but return can_run=false.

