finite_model:
  Graphs:
    values:
      - GraphA
  Nodes:
    values:
      - NodeA
      - NodeB
      - NodeC
  Packages:
    values:
      - SkillEntrypoint
      - SkillScripts
      - NodeTemplates
      - WorkflowReferences
      - GradlePlugin
      - JavaSdk
      - PythonSdk
      - ExampleNodes
      - SkillManifest
  SourceNodes:
    values:
      - NodeA
      - NodeB
      - NodeC
  dependency_shape:
    values: explored_by_AddScriptDependency_and_ApplyDslOverlay

program_context:
  summary: >
    test-graph is a polyglot validation DAG scaffold. Node scripts
    self-describe NodeSpec metadata, Gradle DSL overlays add constraints,
    the plugin resolves transitive dependencies from sourcesDir, executes
    nodes in dependency order, forwards only published context, and emits
    one canonical envelope per attempted node plus run reports.
  first_onboarding_rule: specs/program_model is the accepted baseline; do not
    create specs/current or specs/desired_program_model until a ticketed
    behavior change starts.
  semantic_boundaries:
    - name: scaffold_project
      files:
        - scripts/scaffold.py
        - project_sdk_sources/
      notes: Creates the consumer test_graph project; sdk and build-logic are symlinked by default.
    - name: graph_definition
      files:
        - project_sdk_sources/build.gradle.kts
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/ValidationGraphExtension.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/TestGraphSpec.kt
      notes: testGraph(name) registers a Gradle task; node(path) attaches additive overlays.
    - name: node_describe
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/NodeDescribeLoader.kt
        - project_sdk_sources/sdk/java/src/main/java/com/hayden/testgraphsdk/sdk/NodeSpec.java
        - project_sdk_sources/sdk/python/src/testgraphsdk/node_spec.py
      notes: Scripts emit metadata through --describe-out without running the node body.
    - name: graph_assembly
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/GraphAssembler.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/GraphModel.kt
      notes: Explicit nodes plus transitive dependencies form a dependency-closed acyclic plan.
    - name: run_execution
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/RunTestGraphTask.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
      notes: Node attempts produce canonical envelopes; only passed node published maps become downstream context.
    - name: reports
      files:
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/RunReportWriter.kt
        - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/ValidationReportTask.kt
      notes: Successful graph runs write summary.json and report.md inline; validationReport can rebuild from envelopes.

package_metadata:
  skill_entrypoint:
    path: SKILL.md
    purpose: Agent-facing routing, mental model, and operating rules.
  skill_scripts:
    path: scripts/
    purpose: Scaffold, discover, run, clean, create nodes, and generate GitHub Actions.
    primary_files:
      - scripts/scaffold.py
      - scripts/discover.py
      - scripts/run.py
      - scripts/clean.py
      - scripts/new-jbang-node.py
      - scripts/new-uv-node.py
      - scripts/github-action.py
  node_templates:
    path: templates/
    purpose: JBang and uv node templates used by node generators.
  workflow_references:
    path: references/
    purpose: Durable docs for workflows, DSL/API reference, CI, and environment debugging.
    primary_files:
      - references/workflows.md
      - references/reference.md
      - references/github-actions.md
      - references/debug-python-uv-env.md
  gradle_plugin:
    path: project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/
    purpose: Gradle DSL, graph assembly, task registration, toolchain resolution, execution, and reports.
  java_sdk:
    path: project_sdk_sources/sdk/java/src/main/java/com/hayden/testgraphsdk/sdk/
    purpose: Java/JBang NodeSpec, NodeResult, NodeContext, process helpers, and JSON wire types.
  python_sdk:
    path: project_sdk_sources/sdk/python/src/testgraphsdk/
    purpose: Python/uv NodeSpec, NodeResult, NodeContext, runner decorator, and process helpers.
  example_nodes:
    path: project_sdk_sources/sources/
    purpose: Example smoke graph nodes showing testbed, fixture, evidence, assertion, and context flow.
  skill_manifest:
    path: skill-manager.toml
    purpose: Installable skill metadata; runtime tool requirements are intentionally documented, not bundled.

agent_retrieval:
  start_here:
    - specs/program_model/TestGraph.tla
    - specs/program_model/spec_manifest.yaml
    - SKILL.md
  then_open_by_task:
    scaffold: scripts/scaffold.py
    discover_or_plan:
      - scripts/discover.py
      - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/GraphAssembler.kt
      - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/GraphModel.kt
    run_or_report:
      - scripts/run.py
      - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
      - project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/tasks/RunReportWriter.kt
    node_authoring:
      - references/workflows.md
      - references/reference.md
      - templates/jbang-node.java.template
      - templates/uv-node.py.template

