SPECIFICATION ReplaySpec

CONSTANTS
  Graphs = {GraphA}
  Nodes = {NodeA, NodeB, NodeC}
  Packages = {SkillManifest}
  SourceNodes = {NodeA, NodeB, NodeC}
  Branches = {FeatureA}
  EnvironmentTargets = {LocalPreview}
  EnvironmentBackends = {Local}
  ContextKeys = {KUBECONFIG}
  RequiredEnvironmentContext = {KUBECONFIG}
  NodeRuntimes = {UvRuntime}
  RequiredEnvironmentRuntimes = {UvRuntime}
  LifecycleCommands = {DeployClusterCommand}
  AwsTargets = {}
  AwsBackends = {}
  RunAttempts = {AttemptA, AttemptB}
  PlanLength = 3
  PlanFirstNode = NodeA
  PlanSecondNode = NodeB
  PlanThirdNode = NodeC
  TraceIds = {TraceA}
  TraceCarriers = {CarrierA}
  NoAttempt = NoAttempt
  NoGraph = NoGraph
  NoNode = NoNode
  NoTrace = NoTrace
  NoCarrier = NoCarrier
  NoReason = NoReason

INVARIANTS
  TypeInvariant
  EveryAttemptGetsOneEnvelope
  EveryAttemptHasSavedInputContext
  ResumptionsUseSavedInputContext
  BuildRerunsRespectDependencies
  AttemptIdentityIsGraphScoped
  ReplayScopeMatchesMode
  ReplaySourceAttemptsAreClosed
  ReplayTraceCarrierContinuity
  CarrierIdentifiesOneTrace
  FullAttemptsMintIndependentTraceCarriers
  AttemptEvidenceIsScoped
  AttemptContextIsAttemptLocal
  AttemptClosuresBindExactEvidence
  TamperedUnacquiredSourcesFailValidation
  AcquiredReplaySnapshotsAreClosureBound
  AttemptEnvelopeTraceContinuity
  AttemptReportsAreTruthful
  IncompleteAttemptReportsNeverPass

PROPERTIES
  ClosedEvidenceBindingsAndAcquiredSnapshotsAreImmutable
