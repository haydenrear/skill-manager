notes:
  package_from_program_model: testgraph_program_cases
  finite_model_scope: >
    The desired MC.cfg uses a single aws-preview target for TLC tractability
    and to exercise explicit AWS guard semantics. Local and GitHub Actions
    targets remain part of the implementation contract and graph acceptance
    criteria.
  replay_finite_model_scope: >
    Replay.cfg uses one graph with an ordered three-node plan, two bounded
    attempt identities, and one carrier/trace lineage. It focuses replay on
    the middle node so both resume-tail and run-only scopes remain reachable,
    restricts replay sources to full attempts, while allowing either report
    writer to emit a diagnostic ERRORED view before closure. PASS and complete
    remain closure-gated. It models ordered
    contextual-gold item fingerprints, closure-v2 exact evidence maps,
    successful one-time acquisition, pre-acquisition tamper rejection, and
    post-acquisition snapshot stability without multiplying the legacy
    environment lifecycle state space.
  replay_source_integrity_scope: >
    ClosedEvidenceBindingsAndAcquiredSnapshotsAreImmutable covers the closure
    fingerprint and captured context/carrier values. External raw evidence
    mutation is representable and prevents a new acquisition, while an already
    acquired snapshot remains stable. Closure authenticity against an owner
    capable of rewriting the closure itself requires an external trust anchor.
  deployment_targets:
    local: Local k3d-compatible OpenTofu template and local execution.
    github_action: GitHub Actions oriented local-preview template and workflow credentials/context projection.
    aws: AWS-preview template guarded by explicit selection and credentials.
