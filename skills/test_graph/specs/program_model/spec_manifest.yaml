state_fields:
  - name: environment_repository_scaffolded
    purpose: Whether a starter environment repository can be generated as a Git-ready OpenTofu contract.
  - name: scaffolded_environment_templates
    purpose: Local, AWS, and GitHub Actions target/backend templates added to an environment repository.
  - name: scaffolded_lifecycle_node_templates
    purpose: Deploy, reset, and delete cluster node templates generated for Python and Java runtimes.
  - name: runtime_environment_context_verified
    purpose: Node runtimes proven to receive environment repository context and projected env vars.
  - name: aws_execution_guarded
    purpose: AWS branch environments whose execution was explicitly selected and credential-gated.
  - name: skipped_reset_environments
    purpose: Environments where reset skipped because the cluster was newly provisioned or already reset.
  - name: skipped_destroy_environments
    purpose: Environments intentionally kept alive for branch reuse instead of being destroyed.
  - name: allocated_attempts
    purpose: Bounded run-attempt identities allocated independently of graph identity.
  - name: attempt_source
    purpose: Immutable source-attempt relation for replay provenance; full attempts use NoAttempt.
  - name: attempt_mode
    purpose: Full, selected-tail resume, or selected-singleton run-only execution mode.
  - name: attempt_plan
    purpose: Immutable expected execution sequence for one attempt.
  - name: attempt_input_context
    purpose: Per-attempt, per-node saved input context represented as an exact ordered sequence of contextual-gold item fingerprints, with replay seeded from one acquired source snapshot.
  - name: attempt_envelopes
    purpose: Canonical evidence emitted only inside one attempt's execution scope.
  - name: attempt_trace
    purpose: Attempt trace identity; replay attempts continue their source trace and carrier.
  - name: attempt_report_complete
    purpose: Truthful completeness derived from expected scope, envelopes, and saved contexts.
  - name: attempt_closure_fingerprint
    purpose: Closure-v2 fingerprint binding exact scope, carrier, and present context/envelope evidence maps for a closed attempt.
  - name: attempt_evidence_tampered
    purpose: Abstract external content/add/remove mutation after closure, used to prove acquisition fails when the current evidence no longer matches the closure.
  - name: acquired_replay_context
    purpose: Immutable exact ordered contextual-gold value captured once after successful closure validation and used without later source-path reads.

