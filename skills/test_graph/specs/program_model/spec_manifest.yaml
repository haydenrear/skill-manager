    - The fresh-replay production adapter and node-runtime launchers use macOS/Linux process groups plus bounded ProcessHandle observation to reap surviving descendants on timeout, interruption, or nominal launcher exit. Reaped-orphan exit 125 is typed closable ERRORED evidence; exit 124 or inventory overflow withholds closure. Perl core POSIX and Time::HiRes are required.
