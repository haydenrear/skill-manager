refinement_evidence:
  report_context_completeness:
    status: implementation_complete_full_validation_passed
    model_contract: >
      A complete attempt report has exactly one saved input-context snapshot
      for every expected node envelope. This is contextual-gold evidence, not
      optional report decoration.
    production_refinement: >
      RunReportWriter closure v2 binds the raw execution scope, raw trace
      carrier, and exact sorted present context/<nodeId>.input.json and
      envelope/<nodeId>.json path-to-SHA-256 maps.
      Envelope bytes must also satisfy the closed canonical v1 schema through
      one shared validator at executor publication, closure publication/source
      acquisition, and report regeneration. Unknown extensions, wrong nested
      types or pointers, and passed envelopes with failed assertions fail
      closed instead of becoming replay or green-report evidence.
      Every regenerated report revalidates closure v2 against current scope,
      carrier, context, and envelope evidence; a missing or mismatched closure
      is diagnostic ERRORED. Replay acquisition accepts only full non-replay
      sources whose complete ordered plan matches the current plan and whose
      selected context is the exact ordered current-plan prefix.
      Replay acquisition performs bounded no-follow reads once, rejects digest
      or exact-file-set mismatches, retains only the selected ordered context
      and carrier, and threads that immutable value through observability,
      execution, and reporting. Target execution scope v3 records the source
      closure and selected-context digests so manual report regeneration never
      reopens the source. This integrity claim assumes the application-owned
      closure is trusted; an adversarial filesystem owner who can rewrite both
      evidence and closure is outside the boundary absent an external anchor.
      Closed-evidence acquisition is streaming and retains only the selected
      replay context plus digest inventories. Report retention is capped at 16
      MiB each for aggregate envelope/context bytes and 500,000 aggregate JSON
      structural tokens.
    runtime_requirements:
      platforms: [macOS, Linux]
      commands: [perl]
      perl_core_modules: [POSIX, "Time::HiRes"]
    planned_runtime_test_selectors:
      - com.hayden.testgraphsdk.exec.ContextSerdeTest
      - com.hayden.testgraphsdk.exec.PlanExecutorResultIntegrityTest
      - com.hayden.testgraphsdk.exec.PlanExecutorResumeHarnessTest
      - com.hayden.testgraphsdk.exec.GraphObservabilityTest
      - com.hayden.testgraphsdk.exec.ExecutorsProcessTreeTest
      - com.hayden.testgraphsdk.tasks.RunReportWriterTraceTest
    focused_runtime_validation: >
      Fresh 2026-07-22 bounded full Gradle run passed 124/124 tests with one
      worker, -Xmx768m, and 384 MiB metaspace. This includes the six listed
      selectors plus supervisor-status, report pair-publication, replay-root,
      and JVM-option-file regressions. Machine-readable evidence:
      project_sdk_sources/build-logic/build/test-results/test/.
    focused_python_validation: >
      Fresh full locked-environment pytest run passed 54 tests and 44 subtests
      covering replay model structure, production adapter cleanup, replay
      harness process ownership, resumable workflow, and CLI common helpers.
    focused_model_validation: >
      MC.cfg and Replay.cfg completed breadth-first TLC exploration with one
      worker and a 768 MiB heap. MC.cfg generated 6,653,769 states / 472,400
      distinct at depth 36; Replay.cfg generated 12,700 / 3,748 at depth 19.
      Both finished with zero states left and no errors.
    test_graph_contract:
      node_ids:
        - self.rerun.graph.jbang
        - self.rerun.graph.uv
        - self.run.only.jbang
        - self.run.only.uv
      lifecycle_tests: passed fresh post-hardening execution
      authorized_canary:
        rerunGraphJbang: 20260722-121446
        rerunGraphUv: 20260722-121552
        runOnlyJbang: 20260722-121714
        runOnlyUv: 20260722-121815

