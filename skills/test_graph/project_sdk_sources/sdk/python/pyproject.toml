[project]
name = "testgraphsdk"
version = "0.1.1"
description = "Tiny SDK for Python validation-graph nodes (uv runtime)."
requires-python = ">=3.10"
dependencies = [
    "tracing-skill-observability @ git+https://github.com/haydenrear/tracing_skill.git@618d33169d9aa3e168c60ab9100fb7efb24a13e6#subdirectory=sources/python",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testgraphsdk"]

[tool.hatch.metadata]
allow-direct-references = true
